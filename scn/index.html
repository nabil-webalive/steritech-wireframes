const CHARGE_FORMS = ['fresh_domestic', 'fresh_export'];

const ReceivingFormScreen = ({ navigate, appData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet = palletOf(appData, order);
  const req    = SAMPLE_REQUEST;
  // Rev3, FDB-303: a pallet whose receiving was blocked on a product line comes
  // back with everything the operator had captured, and opens on the step that
  // blocked it.
  const draft = draftFor(pallet);
  const [step, setStep] = React.useState(draft ? 3 : 1);
  const TOTAL = 3;

  // Corrections to what the customer submitted, keyed by field label. Held on
  // the side rather than written over the order, so the row can show both the
  // corrected value and what the customer originally sent.
  const [corrections, setCorrections] = React.useState(draft ? draft.corrections : {});
  // Step 1 is read only. The workbook's arrival form does not include
  // correcting the customer's order-level fields, so the toggle that used to
  // turn these rows into inputs is gone and this stays false.
  const editing = false;
  const correct = (label, v) => setCorrections(c => ({ ...c, [label]: v }));
  const correctedCount = Object.keys(corrections)
    .filter(k => corrections[k] !== undefined).length;

  // Receiving happens ONE PALLET AT A TIME. The operator scanned a specific
  // pallet, so this form reviews that pallet - not every pallet on the order.
  // Identity and the product lines come from the scanned pallet; the extra
  // customer-submitted detail (spaces, cheps, cartons, grower, pulp temps)
  // comes from the request template so the layout stays representative.
  const allPallets = orderPallets(order);
  const palletNo   = Math.max(1, allPallets.findIndex(p => p.id === pallet.id) + 1);
  // Pallets already past the Received step, i.e. genuinely checked in. This is
  // real progress, unlike the pallet's ordinal position in the order.
  const receivedCount = allPallets.filter(p => STEP_OF(p) > 1).length;
  const tmpl       = req.pallets[(palletNo - 1) % req.pallets.length];
  const viewPallets = [{
    id:          pallet.id,
    noOfSpaces:  tmpl.noOfSpaces,
    storageTemp: tmpl.storageTemp,
    cheps:       tmpl.cheps,
    cartons:     tmpl.cartons,
    commodities: pallet.items.map((it, i) => {
      const c = tmpl.commodities[i % tmpl.commodities.length];
      return {
        commodity: it.name, code: it.code, cartons: it.qty,
        grower: c.grower, cheps: c.cheps,
        pulpMin: c.pulpMin, pulpMax: c.pulpMax, address: c.address,
      };
    }),
  }];

  // ── Product lines: match to BC, or raise a new reference for QA ───────────
  // The first line starts unmatched on purpose. That is the normal fresh-produce
  // case: the customer described the goods, but not to Steritech's detail, so
  // somebody has to decide which reference it really is.
  const catalogue = bcProductsFor(order.customer);
  const [lines, setLines] = React.useState(() => draft ? draft.lines : pallet.items.map((it, i) => {
    const hit = catalogue.find(p => p.code === it.code);
    return {
      key:       `${pallet.id}-${i}`,
      submitted: it.name,
      cartons:   String(it.qty),
      // status: 'unmatched' | 'matched' | 'pending_qa'
      status:    i === 0 ? 'unmatched' : (hit ? 'matched' : 'unmatched'),
      match:     i === 0 ? null : (hit || null),
    };
  }));
  const [pickerFor, setPickerFor] = React.useState(null);

  const setLine = (key, patch) => setLines(ls => ls.map(l => (l.key === key ? { ...l, ...patch } : l)));
  const matchLine   = (key, product) => { setLine(key, { status: 'matched', match: product }); setPickerFor(null); };
  const createNew   = (key) => { setLine(key, { status: 'pending_qa', match: null }); setPickerFor(null); };
  const resetLine   = (key) => setLine(key, { status: 'unmatched', match: null });

  const unmatched = lines.filter(l => l.status === 'unmatched').length;
  const pendingQA = lines.filter(l => l.status === 'pending_qa').length;
  // "Cannot proceed until all Create New products have been added by QA."
  // Receiving is blocked by both an unmatched line and a line waiting on QA.
  const blocked = unmatched > 0 || pendingQA > 0;

  // ── Damage capture ────────────────────────────────────────────────────────

  // On-arrival capture. Only what the workbook asks for: the two pictures in
  // column E. There is no operator notes field and no general file upload here -
  // neither appears anywhere in the sheet or in Ben's email. The customer's
  // Comments are column D and stay read only.
  const [arrival,    setArrival]    = React.useState(draft ? draft.arrival : {});
  const setAF = (k, v) => setArrival(s => ({ ...s, [k]: v }));
  // Charges are switches, one per charge, all off until the operator turns one on
  // (FDB-304), and they belong to this pallet.
  const [charges, setCharges] = React.useState(draft ? draft.charges : {});
  const setCharge = (k, v) => setCharges(c => ({ ...c, [k]: v }));
  // Order-level fields live in ORDER_ARRIVAL so the next pallet on the lot finds
  // them already filled. "Data capture should have order level details first or
  // copied through each pallet dialogue windows to ensure its consistent."
  const [orderLevel, setOrderLevelState] = React.useState(() => ({ ...(ORDER_ARRIVAL[order.id] || {}) }));
  const carriedOver = React.useRef(Object.values(ORDER_ARRIVAL[order.id] || {}).some(v => !!v));
  const setOL = (k, v) => {
    ORDER_ARRIVAL[order.id] = { ...(ORDER_ARRIVAL[order.id] || {}), [k]: v };
    setOrderLevelState(ORDER_ARRIVAL[order.id]);
  };
  // Fields that are not highlighted blue already exist on the order, so they
  // come back from the submission rather than starting empty.
  const prefillFor = f => f.prefill === 'grower'      ? (tmpl.commodities[0] || {}).grower || ''
                        : f.prefill === 'storageTemp' ? tmpl.storageTemp || ''
                        : '';

  // Step 1 used to be fully locked because the workbook puts the customer columns
  // in VIEW mode. Ben overrode that on 2026-08-25: Steritech has to be able to
  // correct the customer's information where it is wrong. So step 1 is now
  // read-only by DEFAULT with an explicit Correct toggle, rather than a form that
  // invites edits - the customer's submission is still the record until someone
  // deliberately changes it, and a change is labelled as a correction.
  //
  // Quantities are not corrected here. Cartons are counted per product line at
  // step 2, which already has an editable carton field, so a second place to
  // change the same number would be two sources of truth.

  const next = () => {
    if (step < TOTAL) { setStep(step + 1); return; }
    // BOOKING IN is what marks the pallet Received - not printing the label.
    // Ben, 2026-08-25: "as it's received, it should mark it ... I think it's the
    // opposite way. It prints a label once we've received it", and "when we
    // receive the pallet, we book it in, it prints the labels." Submitting this
    // form IS the book-in, so the state moves here and the labels follow.
    advancePallet(pallet, 'RECEIVED', '');
    // Received, so there is no draft left to come back to.
    delete ARRIVAL_DRAFTS[pallet.id];
    navigate('print_labels', {
      selectedOrder: { ...order, stream: order.stream || 'irradiation' },
      selectedPallet: pallet,
      palletId: pallet.id,
      stream: order.stream || 'irradiation',
      palletState: 'RECEIVED',
      productLines: lines,
      // Corrections travel with the pallet. A PO the operator fixed at arrival is
      // the PO on the label, not the one the customer typed.
      corrections,
    });
  };
  // Rev3, FDB-303: "Is there a way to return to the next product/order without
  // losing the progress here?" Receiving stays blocked, which is right for the
  // label logic, but what was captured is kept against the pallet and the operator
  // is sent back to the Arrival list to start the next pallet. The pallet stays
  // Arrived; it is the draft that remembers the work.
  const saveDraft = () => {
    ARRIVAL_DRAFTS[pallet.id] = { lines, arrival, charges, corrections };
    navigate('task_queue', { taskStep: 'arrival', queueBack: false });
  };
  const back = () => {
    if (step > 1) setStep(step - 1);
    else navigate(appData.queueBack ? 'task_queue' : 'pallet_detail');
  };

  // Rev3, FDB-303: "Instead of the current flow, the steps should be flipped
  // around. 1. First the arrival details are captured. 2. Then product
  // information is selected. This way the arrival details are captured and stored
  // earlier and then workflow is paused at a logical step." The customer's order
  // is still checked first; what changed is that Arrival checks now come BEFORE
  // Product lines, so a blocked product line can no longer lose them.
  const STEP_TITLES = ['Order details', 'Arrival checks', 'Product lines'];
  const arrivalFields = ARRIVAL_FIELDS[order.subStream] || [];
  const orderFields   = arrivalFields.filter(f => f.level === 'order');
  const palletFields  = arrivalFields.filter(f => f.level !== 'order');
  const showCharges   = CHARGE_FORMS.indexOf(order.subStream) >= 0;
  // Transport comes through from the portal submission and is not shown at
  // arrival (FDB-304).
  const orderViewFields = viewFields(order).filter(f => f.label !== 'Transport');

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg, position: 'relative' }}>
      <StatusBar />
      <NavBar title={`Arrival · ${order.id}`} onBack={back} showLogo={false} />
      <StepDots step={step} total={TOTAL} />

      <div style={{ flex: 1, overflow: 'auto', padding: '14px 16px 8px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
          <div>
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: 0.5, textTransform: 'uppercase' }}>
              Step {step} of {TOTAL}
            </div>
            <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 20, fontWeight: 700, color: C.text, marginTop: 2 }}>
              {STEP_TITLES[step - 1]}
            </div>
          </div>
          <PalletChip id={appData.palletId || DEFAULT_PALLET_ID} />
        </div>

        {/* ── STEP 1: column D, the order-selected view ─────────────────────
            Exactly the rows the workbook lists and nothing else. Contact name,
            mobile, email, ETA, order id, lot number, pallet spaces and form name
            were all being shown here with no basis in the sheet, and the
            per-pallet grid of CHEPs, spaces, storage temp, grower, pulp range and
            address came off the old PDF form rather than this flow. */}
        {step === 1 && (
          <>
            <SectionTitle title="Order" />
            <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
              {/* Correctable: these are the customer's words and can be wrong. */}
              <EditRow label="Customer Name" value={order.customer}
                corrected={corrections['Customer Name']} editing={editing}
                onChange={v => correct('Customer Name', v)}/>
              <EditRow label="Customer PO" value={order.po} mono
                corrected={corrections['Customer PO']} editing={editing}
                onChange={v => correct('Customer PO', v)}/>
              {/* NOT correctable: both are counted from the pallets in front of
                  the operator, and cartons are already editable per line at
                  step 2. A second input for the same number is a second truth. */}
              <ReadGrid items={[
                { label: 'Number of Pallets', value: allPallets.length },
                { label: 'Number of Cartons', value: orderCartons(order) },
              ]}/>
              <EditRow label="Request Storage and Handling Conditions"
                value={(order.storageHandling || []).join(' · ')}
                corrected={corrections['Request Storage and Handling Conditions']} editing={editing}
                onChange={v => correct('Request Storage and Handling Conditions', v)}/>
              <EditRow label="Comments" value={req.notes}
                corrected={corrections['Comments']} editing={editing}
                onChange={v => correct('Comments', v)}/>
            </Card>

            {orderViewFields.length > 0 && (
              <>
                <SectionTitle title={subStreamLabel(order)} />
                <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
                  {orderViewFields.map(f => (
                    <EditRow key={f.label} label={f.label} value={f.value}
                      corrected={corrections[f.label]} editing={editing}
                      onChange={v => correct(f.label, v)}/>
                  ))}
                </Card>
              </>
            )}

            {/* The workbook only says "Products (line items)" here, with no
                sub-fields. What it must NOT show is a Steritech product code:
                Ben's whole point is that the customer's submission has no
                internal reference yet. The code is assigned at step 2, when the
                operator matches the line. Printing PRD-2201 at this step would
                make the bottleneck look already solved. */}
            <SectionTitle title="Products (line items)" />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {pallet.items.map((it, i) => (
                <Card key={i} style={{ padding: '12px 14px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 500, color: C.text }}>{it.name}</div>
                      <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 3 }}>
                        No Business Central reference yet
                      </div>
                    </div>
                    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.orange, marginLeft: 12 }}>
                      {it.qty} cartons
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          </>
        )}

        {/* ── STEP 2: arrival checks ─────────────────────────────────────────
            Rev3, FDB-303: this used to be step 3. The arrival checks now come
            BEFORE the product lines, so a product line QA still has to create can
            no longer take what the operator captured down with it. */}
        {step === 2 && (
          <>
            <div style={{
              display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14,
            }}>
              <div style={{ flex: 1, height: 1, background: C.border }}/>
              <div style={{
                fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.orange,
                textTransform: 'uppercase', letterSpacing: 0.8,
                background: '#FFF7ED', border: `1px solid #FED7AA`, borderRadius: 999,
                padding: '4px 10px',
              }}>Your turn · on-arrival capture</div>
              <div style={{ flex: 1, height: 1, background: C.border }}/>
            </div>

            {/* Column E, ALL forms: "Damaged Pallet/Carton (picture)". It sits
                outside the per-form list below because every form has it, including
                Biosecurity and Medical, which have no other arrival fields. Optional:
                a photo is only taken when something arrived damaged. */}
            <SectionTitle title="Damage check" />
            <Card style={{ padding: 16, marginBottom: 14 }}>
              <label style={{
                display: 'block', fontFamily: 'DM Sans,sans-serif', fontSize: 11,
                fontWeight: 700, color: C.muted, marginBottom: 5,
                textTransform: 'uppercase', letterSpacing: '0.6px',
              }}>Damaged Pallet/Carton (picture)</label>
              <div onClick={() => setAF('Damaged Pallet/Carton (picture)', arrival['Damaged Pallet/Carton (picture)'] ? '' : 'DAMAGE-001.jpg')} style={{
                borderRadius: 10, cursor: 'pointer', padding: '14px 12px',
                border: `1.5px dashed ${arrival['Damaged Pallet/Carton (picture)'] ? '#86EFAC' : '#93C5FD'}`,
                background: arrival['Damaged Pallet/Carton (picture)'] ? '#F0FDF4' : '#F8FAFC',
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
              }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={arrival['Damaged Pallet/Carton (picture)'] ? '#15803D' : C.brand} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                  <circle cx="12" cy="13" r="4"/>
                </svg>
                <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13.5, fontWeight: 700, color: arrival['Damaged Pallet/Carton (picture)'] ? '#15803D' : C.brand }}>
                  {arrival['Damaged Pallet/Carton (picture)'] || 'Take photo'}
                </span>
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, color: C.muted, marginTop: 6 }}>
                Only if the pallet or its cartons arrived damaged.
              </div>
            </Card>

            {/* Column E of the workbook, for this order's form only. Blue cells
                are tagged NEW FIELD; the rest already exist on the order and so
                arrive pre-filled for the operator to confirm. Rev3 splits them by
                who the data belongs to: the lot's, entered once, then the pallet's. */}
            {arrivalFields.length ? (
              <>
                {orderFields.length > 0 && (
                  <>
                    <SectionTitle title="Order level" />
                    <Card style={{ padding: 16, marginBottom: 14 }}>
                      {orderFields.map(f => (
                        <div key={f.label}>
                          <label style={{
                            display: 'block', fontFamily: 'DM Sans,sans-serif', fontSize: 11,
                            fontWeight: 700, color: C.muted, marginBottom: 5,
                            textTransform: 'uppercase', letterSpacing: '0.6px',
                          }}>{f.label}</label>
                          <input value={orderLevel[f.label] || ''}
                            onChange={e => setOL(f.label, e.target.value)}
                            placeholder="Capture on arrival"
                            style={{
                              width: '100%', height: 44, borderRadius: 10, padding: '0 12px',
                              border: `1.5px solid #93C5FD`, background: '#fff',
                              fontFamily: 'DM Sans,sans-serif', fontSize: 15, color: C.text,
                              outline: 'none', boxSizing: 'border-box',
                            }}/>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, color: C.muted, marginTop: 4 }}>
                            {carriedOver.current
                              ? 'Carried over from the first pallet on this lot. Change it here if it is wrong.'
                              : 'The same for every pallet on this lot, so you only enter it once.'}
                          </div>
                        </div>
                      ))}
                    </Card>
                  </>
                )}
                <SectionTitle title="Pallet checks" />
                <Card style={{ padding: 16, marginBottom: 14 }}>
                    {palletFields.map(f => (
                      <div key={f.label} style={{ marginBottom: 14 }}>
                        <label style={{
                          display: 'block', fontFamily: 'DM Sans,sans-serif', fontSize: 11,
                          fontWeight: 700, color: C.muted, marginBottom: 5,
                          textTransform: 'uppercase', letterSpacing: '0.6px',
                        }}>
                          {f.label}
                        </label>
                        {f.photo ? (
                          <div onClick={() => setAF(f.label, arrival[f.label] ? '' : 'CARTON-LABEL-001.jpg')} style={{
                            borderRadius: 10, cursor: 'pointer', padding: '14px 12px',
                            border: `1.5px dashed ${arrival[f.label] ? '#86EFAC' : '#93C5FD'}`,
                            background: arrival[f.label] ? '#F0FDF4' : '#F8FAFC',
                            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
                          }}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={arrival[f.label] ? '#15803D' : C.brand} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                              <circle cx="12" cy="13" r="4"/>
                            </svg>
                            <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13.5, fontWeight: 700, color: arrival[f.label] ? '#15803D' : C.brand }}>
                              {arrival[f.label] || 'Take photo'}
                            </span>
                          </div>
                        ) : (
                          <input
                            value={arrival[f.label] !== undefined ? arrival[f.label] : prefillFor(f)}
                            onChange={e => setAF(f.label, e.target.value)}
                            placeholder={f.isNew ? 'Capture on arrival' : ''}
                            style={{
                              width: '100%', height: 44, borderRadius: 10, padding: '0 12px',
                              border: `1.5px solid ${f.isNew ? '#93C5FD' : '#D1CEC9'}`,
                              background: '#fff', fontFamily: 'DM Sans,sans-serif', fontSize: 15,
                              color: C.text, outline: 'none', boxSizing: 'border-box',
                            }}/>
                        )}
                        {!f.isNew && (
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, color: C.muted, marginTop: 4 }}>
                            Submitted by the customer. Confirm or correct it.
                          </div>
                        )}
                      </div>
                    ))}
                </Card>

                {/* Rev3, FDB-304: one switch per charge, default off, on the pallet. */}
                {showCharges && (
                  <>
                    <SectionTitle title="Charges" />
                    <Card style={{ padding: '2px 16px', marginBottom: 14 }}>
                      {ARRIVAL_CHARGES.map((c, i) => (
                        <div key={c.key} style={{
                          display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 0',
                          borderBottom: i < ARRIVAL_CHARGES.length - 1 ? `1px solid ${C.border}` : 'none',
                        }}>
                          <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 600, color: C.text }}>{c.label}</span>
                          <button role="switch" aria-checked={!!charges[c.key]} aria-label={c.label}
                            onClick={() => setCharge(c.key, !charges[c.key])} style={{
                              width: 48, height: 28, borderRadius: 14, border: 'none', cursor: 'pointer', flexShrink: 0,
                              background: charges[c.key] ? C.green : '#CBD5E1', position: 'relative', transition: 'background 150ms',
                            }}>
                            <span style={{
                              position: 'absolute', top: 3, left: charges[c.key] ? 23 : 3, width: 22, height: 22,
                              borderRadius: 11, background: '#fff', transition: 'left 150ms', boxShadow: '0 1px 2px rgba(0,0,0,0.25)',
                            }}/>
                          </button>
                        </div>
                      ))}
                    </Card>
                  </>
                )}
              </>
            ) : order.subStream === 'beehives' ? (
              <Alert type="warning"
                message="Steritech has not defined the Beehives arrival fields yet. The row exists in their workbook but is empty." />
            ) : (
              <Alert type="info"
                message={`${subStreamLabel(order) || 'This form'} has no extra arrival fields. Only the damage photo and the product lines are captured here.`} />
            )}
          </>
        )}

        {/* ── STEP 3: product lines ──────────────────────────────────────────
            Rev3, FDB-303: was step 2. Last on purpose, so that where receiving is
            blocked it is blocked here, with the arrival checks already captured. */}
        {step === 3 && (
          <>
            {/* The step header already says Product lines, so this is just the
                counter. */}
            <div style={{
              fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, fontWeight: 600,
              color: C.muted, marginBottom: 10,
            }}>
              {lines.filter(l => l.status === 'matched').length} of {lines.length} matched
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 16 }}>
              {lines.map(l => {
                const tone = l.status === 'matched'
                  ? { bg: '#F0FDF4', border: '#86EFAC', color: '#15803D', txt: 'Matched' }
                  : l.status === 'pending_qa'
                  ? { bg: '#FEF3C7', border: '#FDE68A', color: '#92400E', txt: 'New - waiting on QA' }
                  : { bg: '#FEF2F2', border: '#FECACA', color: '#B91C1C', txt: 'Not matched' };
                return (
                  <Card key={l.key} style={{ padding: 0, overflow: 'hidden' }}>
                    <div style={{
                      background: tone.bg, borderBottom: `1px solid ${tone.border}`,
                      padding: '8px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                    }}>
                      <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: tone.color, textTransform: 'uppercase', letterSpacing: 0.6 }}>
                        {tone.txt}
                      </span>
                      {l.status !== 'unmatched' && (
                        <button onClick={() => resetLine(l.key)} style={{
                          background: 'none', border: 'none', cursor: 'pointer', padding: 0,
                          fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, fontWeight: 700, color: tone.color,
                        }}>Change</button>
                      )}
                    </div>

                    <div style={{ padding: '12px 14px' }}>
                      <ReadRow label="Customer submitted" value={l.submitted} />

                      {l.status === 'matched' ? (
                        <div style={{ background: '#F8FAFC', border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 12px', marginBottom: 12 }}>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 10.5, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 3 }}>
                            Business Central reference
                          </div>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.text }}>{l.match.name}</div>
                          <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12, color: C.brand, marginTop: 2 }}>
                            {l.match.code} · {l.match.dose}
                          </div>
                        </div>
                      ) : l.status === 'pending_qa' ? (
                        <div style={{ background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 10, padding: '10px 12px', marginBottom: 12 }}>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: '#92400E' }}>
                            New reference requested
                          </div>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: '#92400E', marginTop: 3, lineHeight: 1.45 }}>
                            QA has to create this product in Business Central before this pallet
                            can be received.
                          </div>
                        </div>
                      ) : (
                        <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                          <button onClick={() => setPickerFor(l.key)} style={{
                            flex: 1, padding: '11px', borderRadius: 10, cursor: 'pointer',
                            background: C.brand, border: 'none', color: '#fff',
                            fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700,
                          }}>Select product</button>
                          <button onClick={() => createNew(l.key)} style={{
                            flex: 1, padding: '11px', borderRadius: 10, cursor: 'pointer',
                            background: '#fff', border: `1.5px solid ${C.border}`, color: C.text,
                            fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700,
                          }}>Create new</button>
                        </div>
                      )}

                      <label style={{ display: 'block', fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 5, textTransform: 'uppercase', letterSpacing: '0.6px' }}>
                        Cartons on this pallet
                      </label>
                      <input type="number" value={l.cartons}
                        onChange={e => setLine(l.key, { cartons: e.target.value })}
                        style={{
                          width: '100%', height: 44, borderRadius: 10, padding: '0 12px',
                          border: `1.5px solid #D1CEC9`, background: '#fff',
                          fontFamily: 'DM Sans,sans-serif', fontSize: 15, color: C.text,
                          outline: 'none', boxSizing: 'border-box',
                        }}/>
                    </div>
                  </Card>
                );
              })}
            </div>
          </>
        )}

      </div>

      <div style={{ background: '#fff', borderTop: `1px solid ${C.border}`, padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {/* Rev3, FDB-303: while receiving is blocked the operator is not stuck on
            this pallet. Everything captured is kept, and the next pallet can be
            started from the Arrival list. */}
        {step === TOTAL && blocked && (
          <button onClick={saveDraft} style={{
            width: '100%', padding: '13px', borderRadius: 12, cursor: 'pointer',
            background: '#FFFBEB', border: '1.5px solid #FDE68A', color: '#92400E',
            fontFamily: 'DM Sans,sans-serif', fontSize: 15, fontWeight: 700,
          }}>Save draft and go to next pallet</button>
        )}
        <div style={{ display: 'flex', gap: 10 }}>
          <button onClick={back} style={{
            flex: '0 0 38%', padding: '14px', borderRadius: 12,
            background: '#fff', border: `1.5px solid ${C.border}`, color: C.text,
            fontFamily: 'DM Sans,sans-serif', fontSize: 15, fontWeight: 600, cursor: 'pointer',
          }}>{step === 1 ? 'Back' : '← Previous'}</button>
          <button onClick={next} disabled={step === TOTAL && blocked} style={{
            flex: 1, padding: '14px', borderRadius: 12,
            background: step === TOTAL ? (blocked ? '#D1D5DB' : C.orange) : C.brand,
            border: 'none', color: step === TOTAL && blocked ? '#9CA3AF' : '#fff',
            fontFamily: 'DM Sans,sans-serif', fontSize: 15, fontWeight: 700,
            cursor: step === TOTAL && blocked ? 'not-allowed' : 'pointer',
          }}>{step === TOTAL ? 'Confirm Arrival' : 'Continue →'}</button>
        </div>
      </div>

      {/* ── Product picker: the BC references available for this customer ──── */}
      {pickerFor && (
        <div onClick={() => setPickerFor(null)} style={{
          position: 'absolute', inset: 0, background: 'rgba(15,22,35,0.55)',
          display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', zIndex: 110,
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background: '#fff', borderTopLeftRadius: 22, borderTopRightRadius: 22,
            padding: '14px 18px 20px', maxHeight: '80%', overflowY: 'auto',
            animation: 'slideIn 0.22s cubic-bezier(0.4,0,0.2,1) both',
          }}>
            <div style={{ width: 38, height: 4, borderRadius: 2, background: C.border, margin: '0 auto 16px' }}/>
            <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 19, fontWeight: 700, color: C.text }}>
              Business Central products
            </div>
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.muted, marginTop: 3, marginBottom: 14 }}>
              Filtered to {order.customer}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 14 }}>
              {catalogue.map(p => (
                <button key={p.code} onClick={() => matchLine(pickerFor, p)} style={{
                  textAlign: 'left', padding: '12px 14px', borderRadius: 12, cursor: 'pointer',
                  background: '#fff', border: `1.5px solid ${C.border}`,
                }}>
                  <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.text }}>{p.name}</div>
                  <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12, color: C.brand, marginTop: 2 }}>
                    {p.code} · {p.dose}
                  </div>
                </button>
              ))}
            </div>
            <button onClick={() => createNew(pickerFor)} style={{
              width: '100%', padding: '13px', borderRadius: 12, cursor: 'pointer',
              background: '#FFFBEB', border: '1.5px solid #FDE68A', color: '#92400E',
              fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700,
            }}>None of these - create new for QA</button>
          </div>
        </div>
      )}


    </div>
  );
};

// ═════════════════════════════════════════════════════════════════════════════
// PALLET LABEL - printed BY the book-in, not the thing that causes it
// ═════════════════════════════════════════════════════════════════════════════
// This screen used to hold a Print button and set the pallet to Received when it
// was pressed. Ben corrected both halves on 2026-08-25.
//
// The direction: "as it's received, it should mark it ... I think it's the
// opposite way. It prints a label once we've received it." Receiving is the
// action; the print is its consequence. So the arrival form sets Received and
// this screen opens with the label already printed.
//
// The unit: "We'll only ever have one pallet per one label per pallet" and "each
// pallet has to be one label unique". ONE label per pallet, never one per product
// line and never one per commodity - a pallet carrying oranges and apples still
// gets one label, with the mixed commodities listed on it as a parent line.
//
// It still sits between the arrival form and the bin scan for a physical reason,
// and Ben described that order too: "we book it in, it prints the labels. And
// then we have to scan it into a position ... then we stick it on the pallets."
const PrintLabelsScreen = ({ navigate, appData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet = palletOf(appData, order);
  const lines  = appData.productLines || pallet.items.map(it => ({ submitted: it.name, match: { code: it.code, name: it.name }, cartons: String(it.qty) }));
  // Anything corrected at arrival prints as corrected. Falls back to the
  // customer's value when the operator changed nothing.
  const fixed  = appData.corrections || {};
  const field  = (label, fallback) => (fixed[label] !== undefined ? fixed[label] : fallback);

  return (
    <PageWrapper title="Pallet Label" onBack={() => navigate('receiving_form')}
      bottomBar={
        /* No Print button. Booking the pallet in printed it, and the pallet is
           already Received by the time this screen opens. The only thing left
           for the operator is to attach it and go and scan the bin.

           Rev3, FDB-305, adds a second way out. "Can this step include a second
           option, Continue to next receival ... printers are on the edge of the
           warehouse so walking from the floor to the edge for each pallet (say 20
           times), will waste a lot of extra time." The label has printed either
           way; this just lets the operator leave it at the printer and carry on. */
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <Btn label="Label Attached - Scan Bin →"
            onClick={() => { LABELS_WAITING.delete(pallet.id); navigate('scan_bin', { binPhase: 'pre_treatment' }); }}
            color="orange" large />
          <Btn label="Continue to next receival" color="blue" outline
            onClick={() => { LABELS_WAITING.add(pallet.id); navigate('task_queue', { taskStep: 'arrival', queueBack: false }); }} />
        </div>
      }>
      <div style={{ padding: '20px 16px' }}>
        <SectionTitle title="Pallet label" />

        {/* The label preview carries exactly the fields Steritech listed. */}
        <div style={{
          background: '#fff', border: `2px solid ${C.text}`, borderRadius: 8,
          padding: '14px 16px', marginBottom: 14,
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
            <div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 10, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.8 }}>
                {LOT_LABEL}
              </div>
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 19, fontWeight: 700, color: C.text }}>{lotText(order)}</div>
            </div>
            <img src="assets/steritech_logo.png" alt="Steritech" style={{ width: 54, height: 'auto', opacity: 0.85 }}/>
          </div>

          {/* Unique barcode per pallet - the thing every later scan resolves. */}
          <div style={{
            background: '#F8FAFC', border: `1px dashed ${C.border}`, borderRadius: 6,
            padding: '10px 12px', marginBottom: 12, textAlign: 'center',
          }}>
            <div style={{ display: 'flex', gap: 1.5, justifyContent: 'center', height: 40, alignItems: 'stretch', marginBottom: 6 }}>
              {[...Array(42)].map((_, i) => (
                <div key={i} style={{ width: (i % 4 === 0 ? 3 : i % 3 === 0 ? 2 : 1), background: C.text }}/>
              ))}
            </div>
            <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 13, fontWeight: 700, color: C.text, letterSpacing: 1 }}>
              {pallet.id}
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px 14px', marginBottom: 10 }}>
            {/* Column F lists six fields and no more. "Pallet 1 of 3" was extra:
                Total Pallet Quantity belongs to the scan-label view in column B,
                not to the printed label. */}
            {[
              { l: 'Customer Name', v: field('Customer Name', order.customer) },
              { l: 'Customer PO', v: field('Customer PO', order.po) || '-' },
              { l: 'Carton Quantity', v: lines.reduce((s, l) => s + (parseInt(l.cartons, 10) || 0), 0) },
            ].map(x => (
              <div key={x.l}>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 9.5, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.6 }}>{x.l}</div>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 600, color: C.text }}>{x.v}</div>
              </div>
            ))}
          </div>

          <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 8 }}>
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 9.5, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 4 }}>
              Product code & title
            </div>
            {lines.map((l, i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 2 }}>
                <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.text }}>
                  {(l.match && l.match.code) || 'NEW'} · {(l.match && l.match.name) || l.submitted}
                </span>
                <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, fontWeight: 700, color: C.text }}>{l.cartons}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Rev3, FDB-399: "Include the printer name or reference in the green
            card on this screen." */}
        <Alert type="teal" message={`Printed on ${printerFor(order)}. Attach it, then scan the bin.`} />
        {/* The helper the notes ask for: receival can carry on, the label is
            already out. */}
        <Alert type="info" message="Label printed. You can continue receiving." />
      </div>
    </PageWrapper>
  );
};

Object.assign(window, {
  SAMPLE_ORDERS, ALL_PALLETS, DEFAULT_PALLET, DEFAULT_PALLET_ID, DEFAULT_PALLET_ORDER,
  STEP_OF, orderPallets, orderWeight, orderItemCount, orderStep, orderState,
  palletsPastQA, palletsByState, stateLabel, palletProductLabel, treatmentSpec,
  binForState, binLabel, stamp,
  STERITECH_STATUS, CUSTOMER_STATUS, steritechStatus, customerStatus,
  STATE_DETAIL, stateDetail,
  BC_STEPS, SUB_STREAMS, VIEW_FIELDS, SCAN_LABEL_FIELDS,
  viewFields, scanLabelFields, submittedValue, subStreamLabel,
  LOT_LABEL, LOT_PENDING, lotOf, lotText,
  orderCartons, palletCartons, lineDose,
  PRIORITY_DEFAULT, PRIORITY_LOWEST_IS_HIGHEST,
  priorityOf, priorityLabel, byPriority,
  orderSteritechStatus, orderCustomerStatus, palletsAtOrPast, lotGate,
  lotAllProcessedIn, lotAllProcessedOut, processBinSplit, processBinNote,
  palletOf, palletAction,
  orderOfPallet,
  PalletRowCard, PalletGroupSection, PriorityChip, BCStepsNote,
  // The 10 Sep rebuild. WORK_STEPS is the task list the home flow is built from,
  // and the ageing helpers are read by the process screens in the next block too.
  WORK_STEPS, stepByKey, stepQueue, stepOfPallet, stepOpens, stepOverdue, stepHolds,
  SITES, SERVICE_LABEL, SERVICE_SHORT, SERVICE_COLOUR,
  siteOf, siteByCode, siteLabel,
  ordersAtSite, palletsAtSite, SiteSelectScreen, SiteRow,
  PRIORITY_VISIBLE_AT, priorityVisibleAt,
  DEMO_TODAY, AGE_WATCH, AGE_WARN, orderDate, ageDays, ageTone, AgeChip,
  SidePanel, SearchBar, palletMatches, orderMatches, QueueOrderCard, StepIcon,
  StreamFilter, PickTabs, SinglePickNext, SingleSchedule,
  ACCOUNT_SITE, SERVICE_STREAM, STREAM_LABEL, STREAM_SHORT, STREAM_ORDER, streamsAtSite,
  streamMatches, palletsInScope, ordersInScope, StreamSelectScreen,
  setPalletHold, isHeld, holdLabel, canRaiseIncident,
  pickOrders, scheduleOrders, zoneOf, zonesFor, pickStatus,
  ARRIVAL_DRAFTS, ORDER_ARRIVAL, LABELS_WAITING, draftFor, draftsFor, labelsWaiting, printerFor,
  SplashScreen, ScanEmployeeScreen, DashboardScreen, TaskQueueScreen, AllOrdersScreen,
  OrderDetailScreen, PalletDetailScreen,
  TIMELINE_STEPS, STATUS_ORDER, statusIndex, STATE_TO_STEP, KPI,
  ScanPalletScreen,
  ScanBinScreen, SummaryScreen, ReceivingFormScreen, PrintLabelsScreen,
  BC_PRODUCTS, BC_PRODUCTS_FALLBACK, bcProductsFor, ARRIVAL_FIELDS,
  ARRIVAL_CHARGES, CHARGE_FORMS, IncidentScreen, HOLD_REASONS,
  ReadRow, ReadGrid, EditRow,
});

</script>

<script type="text/babel">
// SteriScan - Screens B: Staging, Treatment, Process-Out
// ────────────────────────────────────────────────────────

// ═════════════════════════════════════════════════════════════════════════════
// PROCESS IN - columns I and J of the 19 Aug workbook
// ═════════════════════════════════════════════════════════════════════════════
// Column I is the VIEW half: lot number, customer name, how many pallets of the
// lot have been picked, and a priority listing that may hold several lots at the
// same level. Column J is the EDIT half, and it is a single field - move the
// pallet to the process bin by scanning the process barcode.
//
// There are no per-stream rows in either column, which is why this is one screen
// and not three. The old build had a Staging form per stream carrying Carrier
// Pallet ID, target dose range, Conveyor Run ID, Chamber ID, cycle type and pack
// type. None of those is in the sheet, and the action is "Process in per the
// SCHEDULE" - the schedule is set in Business Central at column H, so the
// operator is not choosing a chamber or a dose here. They are moving a pallet
// into a bin.
//
// Ben confirmed this screen on 2026-08-25 - "for the scope of the scanning app,
// that's fine where it is" - and described what the scan physically is: "you scan
// the pallet into a physical conveyor location. That's generally all of our
// processes. That conveyor location is detached from the process out."
//
// Several lots can share a priority level and the workbook does not cap it, so
// the queue is previewed rather than printed in full. Ben's version of the same
// rule: show "the top three or something ... multiple lot numbers, if they have
// the same priority level. But it should be clear what is currently in action and
// what's next."
const SAME_PRIORITY_PREVIEW = 3;

const ProcessInScreen = ({ navigate, appData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet = palletOf(appData, order);
  const [scanned, setScanned] = React.useState(false);
  // Step 5, not 4. The scan on this screen moves a pallet from STAGED (4) into
  // the process bin (5), so the count is of pallets that have BEEN processed in.
  // Counting step 4 counted the pallet in the operator's hands before they had
  // scanned it, and a two-pallet lot opened this screen already reading 2 of 2.
  const gate = lotGate(order, 5);

  // "May view multiple Lot Number's if granted same priority level." Other lots
  // sharing this priority are listed so the operator can see the whole queue at
  // their level, not just the one lot they came in on.
  // Scoped to the operator's own site: another site's schedule is not their
  // queue and they cannot walk to it.
  const samePriority = ordersAtSite(appData.site)
    .filter(o => o.id !== order.id && priorityOf(o) === priorityOf(order)
      && lotGate(o, 5).done < lotGate(o, 5).total)
    .sort(byPriority);

  return (
    <PageWrapper title="Process In" onBack={() => navigate(appData.queueBack ? 'task_queue' : 'pallet_detail')}
      bottomBar={
        /* Rev3, FDB-301: back to the single-pick card, which now shows this
           lot one pallet further on, or the next order once this one is fully
           scanned. Reached any other way (a Tweaks deep link, the pallet screen)
           it still lands on the pallet. */
        <Btn label={scanned ? 'Continue →' : 'Scan the process bin to continue'}
          onClick={() => navigate(appData.queueBack ? 'task_queue' : 'pallet_detail')}
          color="orange" disabled={!scanned} />
      }>
      <div style={{ padding: '20px 16px 8px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <SectionTitle title="Process In" />
          <StreamBadge stream={order.stream} />
        </div>

        {/* Column I in one card. The lot progress banner used to sit above this
            and repeated the lot number and the pallet counter, so the priority
            chip, the progress strip and the rule moved in here instead. */}
        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
            <span style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 13, fontWeight: 700, color: C.text }}>
              {lotOf(order)}
            </span>
            {/* The lot's schedule number is no longer printed here. Ben,
                2026-09-10: "the priority will only be shown during the
                scheduling step." The 19 Aug workbook does put a same-priority
                listing on the process screens, so the QUEUE below is untouched -
                only the number is gone. PRIORITY_VISIBLE_AT puts it back. */}
            {/* Rev3: the schedule number is back here, and only here. The
                Scheduling card is gone (FDB-306) and Process In is where the
                schedule is read, so PRIORITY_VISIBLE_AT now names this step. */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              {priorityVisibleAt('process_in') && <PriorityChip order={order} current />}
              <AgeChip order={order} />
            </div>
          </div>
          <InfoRow label="Customer Name" value={order.customer} />
          {/* The workbook's own label, used on column I and column K alike. */}
          <InfoRow label="Qty of Pallets Picked"
            value={`${gate.done} of ${gate.total}`} />
          {/* One bar filled by proportion, not one segment per pallet. A lot can
              carry 20 pallets and 20 slivers reads as noise. */}
          <div style={{ height: 5, borderRadius: 3, background: C.border, overflow: 'hidden', marginTop: 10 }}>
            <div style={{
              width: `${(gate.done / Math.max(1, gate.total)) * 100}%`,
              height: '100%', borderRadius: 3, transition: 'width 220ms',
              background: gate.complete ? C.green : C.orange,
            }}/>
          </div>
        </Card>

        {/* Column J: one field, written by a scan. */}
        <SectionTitle title="Process bin" />
        <PalletChip id={pallet.id} />
        <div style={{ height: 12 }}/>
        {scanned ? (
          <>
            <Alert type="teal" message={gate.complete
              ? 'Pallet moved to the process bin. Every pallet on this lot is now in.'
              : `Pallet moved to the process bin. ${gate.total - gate.done} still to go on this lot.`} />
            <Card style={{ padding: '14px 16px' }}>
              <InfoRow label="Bin" value={binForState('IN_TREATMENT', 1)} bold />
            </Card>
          </>
        ) : (
          <div style={{ display: 'flex', justifyContent: 'center' }}>
            <ScanView onSimulate={() => {
              advancePallet(pallet, 'IN_TREATMENT', binForState('IN_TREATMENT', 1));
              setScanned(true);
            }} label="Scan Process Bin" />
          </div>
        )}

        {samePriority.length > 0 && (
          <>
            <div style={{ height: 18 }}/>
            {/* Same list, same order - it is still sorted by the schedule
                number underneath. Only the heading stopped quoting it. */}
            <SectionTitle title="Also in this schedule run" />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {samePriority.slice(0, SAME_PRIORITY_PREVIEW).map(o => {
                const g = lotGate(o, 5);
                return (
                  <Card key={o.id} style={{ padding: '11px 14px', cursor: 'pointer' }}
                    onClick={() => navigate('order_detail', { selectedOrder: o })}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <div>
                        <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12.5, fontWeight: 700, color: C.text }}>{lotOf(o)}</div>
                        <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 2 }}>{o.customer}</div>
                      </div>
                      <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>
                        {g.done} of {g.total} in
                      </span>
                    </div>
                  </Card>
                );
              })}
            </div>
            {samePriority.length > SAME_PRIORITY_PREVIEW && (
              <div style={{
                fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted,
                marginTop: 8, textAlign: 'center',
              }}>
                and {samePriority.length - SAME_PRIORITY_PREVIEW} more in this run
              </div>
            )}
          </>
        )}
      </div>
    </PageWrapper>
  );
};

// ════════════════════════════════════════════════════════════════════════════
// PROCESS OUT - columns K and L of the 19 Aug workbook
// ════════════════════════════════════════════════════════════════════════════
// Column K is the VIEW half and carries exactly three rows plus one note: Lot
// Number, Customer Name, Qty of Pallets Picked, and "May view multiple Lot
// Number's if granted same priority level." Column L is the EDIT half and is one
// field: Bin, via a scan of the bin barcode, the site processed warehouse.
//
// K4 and L4 are merged into a single action, so this is one screen, and like
// process in there are no per-stream rows, so it is one screen for all three
// streams. The old build had three: Irradiation scanned the pallet and showed a
// process-out timestamp, EtO carried cycle duration, aeration time, temperature
// and residue reading, Packing carried final packed quantity and damaged units.
// None of those fields is in the sheet. The action is "Process out per the
// SCHEDULE", and the only thing written is the bin.
//
// Two things changed after the 2026-08-25 call:
//   ROLE   This is the OPERATOR's scan. It used to be gated to QA, which was
//          wrong - QA never touches the scanner for it, and the app no longer has
//          a QA role at all.
//   GATE   The scan is held until the WHOLE lot is processed in. Ben: "keep it
//          full order. We have to receive it all for it to be collectively ready
//          ... So all or nothing for the moment."
const ProcessOutScreen = ({ navigate, appData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet = palletOf(appData, order);
  const [scanned, setScanned] = React.useState(false);
  const gate = lotGate(order, 6);
  const inGate = lotGate(order, 5);
  const bin  = binForState('IN_STORAGE_PROCESSED', parseInt(String(pallet.id).slice(-2), 10) || 1);

  // Same rule as process in: the queue is worked by priority and several lots can
  // sit at one level, so the rest of the level is listed.
  const samePriority = ordersAtSite(appData.site)
    .filter(o => o.id !== order.id && priorityOf(o) === priorityOf(order)
      && lotGate(o, 6).done < lotGate(o, 6).total)
    .sort(byPriority);

  return (
    <PageWrapper title="Process Out" onBack={() => navigate(appData.queueBack ? 'task_queue' : 'pallet_detail')}
      bottomBar={
        <Btn label={!lotAllProcessedIn(order)
              ? 'Waiting on the rest of the lot'
              : scanned ? 'Continue →' : 'Scan the warehouse bin to continue'}
          onClick={() => navigate('pallet_detail')}
          color="green" disabled={!scanned} />
      }>
      <div style={{ padding: '20px 16px 8px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <SectionTitle title="Process Out" />
          <StreamBadge stream={order.stream} />
        </div>

        {/* Column K in one card. */}
        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
            <span style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 13, fontWeight: 700, color: C.text }}>
              {lotOf(order)}
            </span>
            {/* The lot's schedule number is no longer printed here. Ben,
                2026-09-10: "the priority will only be shown during the
                scheduling step." The 19 Aug workbook does put a same-priority
                listing on the process screens, so the QUEUE below is untouched -
                only the number is gone. PRIORITY_VISIBLE_AT puts it back. */}
            <AgeChip order={order} />
          </div>
          <InfoRow label="Customer Name" value={order.customer} />
          <InfoRow label="Qty of Pallets Picked" value={`${gate.done} of ${gate.total}`} />
          <div style={{ height: 5, borderRadius: 3, background: C.border, overflow: 'hidden', marginTop: 10 }}>
            <div style={{
              width: `${(gate.done / Math.max(1, gate.total)) * 100}%`,
              height: '100%', borderRadius: 3, transition: 'width 220ms',
              background: gate.complete ? C.green : C.orange,
            }}/>
          </div>
          {/* Where the rest of the lot sits. The counter alone reads as if the
              missing pallets had gone somewhere unexplained. */}
          {!gate.complete && processBinNote(order) && (
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 8 }}>
              {processBinNote(order)}
            </div>
          )}
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 6, lineHeight: 1.45 }}>
            {gate.complete
              ? 'Every pallet on this lot is out of the process bin. QA can now review the whole order in Business Central.'
              : 'QA does not start until every pallet on this lot has been picked out of the process bin.'}
          </div>
        </Card>

        {/* Column L: one field, written by a scan - but only once the whole lot
            is in. "All or nothing for the moment." */}
        <SectionTitle title="Processed warehouse bin"
          subtitle={lotAllProcessedIn(order)
            ? 'Scan the bin barcode to move the pallet'
            : 'Held until every pallet on this lot is processed in'} />
        <PalletChip id={pallet.id} />
        <div style={{ height: 12 }}/>
        {!lotAllProcessedIn(order) ? (
          <div style={{
            background: '#FEF3C7', border: '1px solid #FDE68A', borderRadius: 12,
            padding: '14px 16px',
          }}>
            <div style={{ display: 'flex', gap: 11, alignItems: 'flex-start' }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#92400E" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <div>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13.5, fontWeight: 700, color: '#92400E' }}>
                  Process out is held
                </div>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.text, marginTop: 3, lineHeight: 1.5 }}>
                  A lot is processed out as a full order, so nothing goes out until every
                  pallet on it is in. {inGate.done} of {inGate.total} pallets on this lot
                  are processed in.
                </div>
              </div>
            </div>
          </div>
        ) : scanned ? (
          <>
            <Alert type="teal" message={gate.complete
              ? 'Pallet stored. Every pallet on this lot is out, so QA can review the order in Business Central.'
              : `Pallet picked out of the process bin and stored. ${gate.total - gate.done} still in on this lot.`} />
            <Card style={{ padding: '14px 16px' }}>
              <InfoRow label="Bin" value={bin} bold />
            </Card>
          </>
        ) : (
          <div style={{ display: 'flex', justifyContent: 'center' }}>
            <ScanView onSimulate={() => {
              advancePallet(pallet, 'PROCESS_OUT', bin);
              setScanned(true);
            }} label="Scan Bin Barcode" />
          </div>
        )}

        {samePriority.length > 0 && (
          <>
            <div style={{ height: 18 }}/>
            <SectionTitle title="Also in this schedule run" />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {samePriority.slice(0, SAME_PRIORITY_PREVIEW).map(o => {
                const g = lotGate(o, 6);
                return (
                  <Card key={o.id} style={{ padding: '11px 14px', cursor: 'pointer' }}
                    onClick={() => navigate('order_detail', { selectedOrder: o })}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <div>
                        <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12.5, fontWeight: 700, color: C.text }}>{lotOf(o)}</div>
                        <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 2 }}>{o.customer}</div>
                      </div>
                      <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>
                        {g.done} of {g.total} out
                      </span>
                    </div>
                  </Card>
                );
              })}
            </div>
            {samePriority.length > SAME_PRIORITY_PREVIEW && (
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 8, textAlign: 'center' }}>
                and {samePriority.length - SAME_PRIORITY_PREVIEW} more in this run
              </div>
            )}
          </>
        )}
      </div>
    </PageWrapper>
  );
};

Object.assign(window, {
  ProcessInScreen, ProcessOutScreen,
});

</script>

<script type="text/babel">
// SteriScan - Screens C: Post-Treatment, Errors, Override, Success, Fail
// ────────────────────────────────────────────────────────────────────────

// ── In Storage - Processed ────────────────────
// One pallet being stored does not put the order into QA. Ben, 2026-08-25: "Once
// that whole order is out of the process, QA step initiates." So the screen only
// claims QA has started once the last pallet on the lot is out.
const InStorageProcessedScreen = ({ navigate, appData }) => {
  const order = appData.selectedOrder || SAMPLE_ORDERS[0];
  const gate  = lotGate(order, 6);

  return (
    <PageWrapper title="Stored - Processed" onBack={() => navigate('dashboard')}
      bottomBar={
        <Btn label="Back to Dashboard" onClick={() => navigate('dashboard')} color="blue" large />
      }>

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <SectionTitle title="Treated Pallet Stored"
            subtitle={gate.complete ? 'Whole order out - QA review initiated' : 'Waiting on the rest of the lot'} />
          <PalletChip id={appData.palletId || DEFAULT_PALLET_ID} />
        </div>

        <Alert type="info" message={gate.complete
          ? 'Every pallet on this order is out of the process. QA reviews the order in Business Central.'
          : `Pallet is treated and stored. ${gate.done} of ${gate.total} pallets on this order are out - QA starts once the last one is.`} />

        <Card style={{ padding: '14px 16px' }}>
          <InfoRow label="Steritech Status" valueEl={<Badge state="IN_STORAGE_PROCESSED" />} />
