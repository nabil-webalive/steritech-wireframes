          }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={oState === 'QA_HOLD' ? C.red : C.green} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
              <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
            </svg>
            <div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: oState === 'QA_HOLD' ? '#B91C1C' : '#15803D' }}>
                Returned to you by QA
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.text, marginTop: 2, lineHeight: 1.5 }}>
                {oState === 'QA_HOLD'
                  ? `QA raised a hold (PDR) on ${pallets.filter(p => p.state === 'QA_HOLD').length} of ${pallets.length} pallet(s). Action the hold before those pallets can proceed.`
                  : 'QA cleared every pallet on this order. Continue to packing and dispatch.'}
              </div>
            </div>
          </div>
        )}

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
          {/* No commodity heading. An order can carry dozens of different
              commodities; they belong on the pallets, listed below. */}
          <div>
            <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 18, fontWeight: 700, color: C.text }}>{order.customer}</div>
            {/* The NavBar title above already carries the identifier, so this
                line names what it IS rather than repeating the value. */}
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 3 }}>
              {LOT_LABEL}
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
            <StreamBadge stream={order.stream} />
            <PriorityChip order={order} />
          </div>
        </div>


        {/* Order-level roll-up. Deliberately NO step timeline and no pallet state
            name: a timeline belongs to a pallet, and naming a pallet step here
            would contradict the order-workflow badge above it. Progress is the
            one thing that is true at order level. */}
        <Card style={{ padding: '16px', marginBottom: 14, background: isShipped ? '#DCFCE7' : '#EEF2FF', border: `1px solid ${isShipped ? '#86EFAC' : '#C7D2FE'}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <div style={{ width: 48, height: 48, borderRadius: 24, background: isShipped ? C.green : C.brand, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {isShipped
                  ? <path d="M20 6L9 17l-5-5"/>
                  : <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>}
              </svg>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700, color: isShipped ? '#15803D' : '#3730A3', textTransform: 'uppercase', letterSpacing: 0.5 }}>
                Order progress
              </div>
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 18, fontWeight: 700, color: C.text, marginTop: 2 }}>
                {released} of {pallets.length} pallet{pallets.length !== 1 ? 's' : ''} released
              </div>
            </div>
          </div>
        </Card>

        {/* Roll-ups only. Anything true of a single pallet belongs on Pallet
            Detail, and the stream is already a badge at the top of this screen. */}
        <SectionTitle title="Order details" />
        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          {/* Lot and order are the same value, and the name Steritech will
              standardise on is still open, so the label says both. */}
          <InfoRow label={LOT_LABEL} value={lotText(order)} bold={!!lotOf(order)} />
          {/* The workbook's scanner field list carries Steritech Status and
              nothing else. Customer Status is its legend row, describing what the
              portal shows - not something this app is meant to display. */}
          <InfoRow label="Steritech Status" value={orderSteritechStatus(order)} />
          <InfoRow label="Customer PO" value={order.po || '-'} />
          {subStreamLabel(order) && <InfoRow label="Form" value={subStreamLabel(order)} />}
          <InfoRow label="Pallets" value={`${pallets.length}`} />
          <InfoRow label="Product Lines" value={`${orderItemCount(order)}`} />
          <InfoRow label="Total Weight" value={`${orderWeight(order)} kg`} />
          <InfoRow label="Received" value={order.date + ', 2026'} />
        </Card>

        <BCStepsNote />

        {/* The heart of the fix: the pallets are listed individually, each with
            its own state, because each one is a separate workflow instance. */}
        <SectionTitle title={`Pallets (${pallets.length})`} subtitle="Each pallet runs its own workflow - tap to open" />
        <div style={{ marginBottom: 6 }}>
          {palletsByState(order).map(g => (
            <PalletGroupSection key={g.state} group={g} onOpen={openPallet} />
          ))}
        </div>
      </div>

      {/* No order-level "next step" button any more - actions belong to a
          pallet, so the order screen only routes you into scanning one. */}
      <div style={{ background: '#fff', borderTop: `1px solid ${C.border}`, padding: '12px 16px' }}>
        <Btn label="Scan Pallet →" onClick={() => navigate('scan_pallet', { selectedOrder: order, selectedPallet: null })} color="orange" large />
      </div>
    </div>
  );
};

// ═════════════════════════════════════════════════════════════════════════════
// PALLET DETAIL - one pallet = one workflow instance
// ═════════════════════════════════════════════════════════════════════════════
// The step timeline lives HERE, not on the order. Two pallets on the same order
// can sit on different steps at the same time, so an order-level timeline would
// be a lie. The action button is driven by pallet.state alone.
const PalletDetailScreen = ({ navigate, appData }) => {
  const order     = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet    = palletOf(appData, order);
  const step      = STEP_OF(pallet);
  const isShipped = pallet.state === 'SHIPPED';
  const action    = palletAction(pallet, order);
  // A pallet sitting in a warehouse can be relocated whenever, but one inside a
  // chamber or already off site cannot.
  // G3 allows a bin move in the unprocessed warehouse, K3 in the processed one.
  // Those are the only two places the workbook mentions, so the button appears
  // only while the pallet is actually sitting in a warehouse bay. Not before a
  // bin exists, not once it is in the process bin or a chamber, not off site.
  const canMoveBin = ['IN_STORAGE_UNPROCESSED', 'PROCESS_OUT', 'IN_STORAGE_PROCESSED',
                      'QA_HOLD', 'QA_RELEASED'].includes(pallet.state);
  // No label printed yet, so there is nothing to scan and nothing binned.
  const preLabel = pallet.state === 'ARRIVED';

  // ── The rest of the lot ────────────────────────────────────────────────────
  // A lot is trucked in, staged and run as a unit, so when this pallet lands on
  // a step the operator cannot advance - process-in done, waiting on QA - they
  // are still standing in front of its siblings with the scanner in hand.
  // Sending them back through Order Detail to find the next one is a detour they
  // take twenty times a lot.
  // Only siblings there is actually work on are listed. That is a short working
  // queue, not the flat dump of every pallet on the order - Order Detail already
  // shows that, grouped by state.
  // Listing them is the whole job. Jumping straight into one pallet's scan
  // screen from here was a second way to start work that skipped the pallet's
  // own view, so the rows open the pallet and its own action button takes it
  // from there - one route into a scan, not two.
  // "View QA Review" and "View QA Hold Details" are not work, they are a
  // read-only look at what Business Central decided. A pallet whose only button
  // is one of those is finished as far as the scanner is concerned.
  const isWork = a => !!a && !['qa_status', 'qa_hold'].includes(a.screen);
  const lotPending = orderPallets(order)
    .filter(p => p.id !== pallet.id && isWork(palletAction(p, order)));
  // So the rest of the lot is the real next move, and the list belongs on screen
  // whenever this pallet has nothing left to do on it. Only a button
  // that actually advances a pallet earns the screen to itself.
  const actionIsWork = isWork(action);

  // Read-only footers. Each is a state where there is nothing to scan, so
  // the screen has to say WHY there is no button rather than just show none.
  const notice =
    // The pallet is treated and ready, but the lot is not. Naming how many are
    // still out is the difference between a rule and a dead button.
    (pallet.state === 'IN_TREATMENT' && !lotAllProcessedIn(order))
      ? { bg: '#FEF3C7', bd: '#FDE68A', fg: '#92400E', stroke: '#92400E',
          text: `Process out is held until the whole lot is processed in - ${lotGate(order, 5).done} of ${lotGate(order, 5).total} pallets are in.`,
          icon: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></> } :
    null;

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
      <StatusBar />
      <NavBar title={pallet.id} onBack={() => navigate('order_detail', { selectedOrder: order })} showLogo={false} />
      <div style={{ flex: 1, overflow: 'auto', padding: '16px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
          <div>
            {/* No derived product heading. A pallet can carry several product
                lines, so "first one + 1 more" is a half-truth, and the workbook
                has no such field. The pallet id is the screen title and the lines
                are listed in full further down. */}
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, fontWeight: 600 }}>
              {lotText(order)}
            </div>
            <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 18, fontWeight: 700, color: C.text, marginTop: 2 }}>{order.customer}</div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
            <Badge state={pallet.state} />
            <StreamBadge stream={order.stream} />
          </div>
        </div>

        <Card style={{ padding: '16px', marginBottom: 14, background: isShipped ? '#DCFCE7' : '#EEF2FF', border: `1px solid ${isShipped ? '#86EFAC' : '#C7D2FE'}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <div style={{ width: 48, height: 48, borderRadius: 24, background: isShipped ? C.green : C.brand, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {isShipped
                  ? <path d="M20 6L9 17l-5-5"/>
                  : <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>}
              </svg>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700, color: isShipped ? '#15803D' : '#3730A3', textTransform: 'uppercase', letterSpacing: 0.5 }}>
                {isShipped ? 'Dispatched' : 'Current Step'}
              </div>
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 18, fontWeight: 700, color: C.text, marginTop: 2 }}>
                {steritechStatus(pallet.state)}
              </div>
              {/* Without this line two pallets of one order both read
                  "Processing" and offer different buttons for no visible reason. */}
              {stateDetail(pallet.state) && (
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: isShipped ? '#15803D' : '#4338CA', marginTop: 3 }}>
                  {stateDetail(pallet.state)}
                </div>
              )}
            </div>
          </div>
        </Card>

        <SectionTitle title="Progress" subtitle="Steritech status, this pallet only" />
        <Card style={{ padding: '16px' }}>
          <div style={{ display: 'flex', flexDirection: 'column' }}>
            {TIMELINE_STEPS.map((tStep, i) => {
              const sIdx = statusIndex(pallet.state);
              const done = i < sIdx - 1;
              const current = i === sIdx - 1;
              return (
                <div key={tStep.key} style={{ display: 'flex', gap: 12, position: 'relative' }}>
                  {i < TIMELINE_STEPS.length - 1 && (
                    <div style={{ position: 'absolute', left: 11, top: 22, bottom: -10, width: 2, background: i < step - 1 ? C.green : C.border }}/>
                  )}
                  <div style={{
                    width: 24, height: 24, borderRadius: 12, flexShrink: 0,
                    background: done ? C.green : current ? C.brand : '#fff',
                    border: done || current ? 'none' : `2px solid ${C.border}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    boxShadow: current ? `0 0 0 4px rgba(79,106,245,0.18)` : 'none', zIndex: 1,
                  }}>
                    {done && (
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M20 6L9 17l-5-5"/>
                      </svg>
                    )}
                    {current && <div style={{ width: 8, height: 8, borderRadius: 4, background: '#fff' }}/>}
                  </div>
                  <div style={{ paddingBottom: i === TIMELINE_STEPS.length - 1 ? 0 : 14, flex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: current ? 700 : done ? 600 : 500, color: current ? C.brand : done ? C.text : C.muted }}>
                        {tStep.label}
                      </span>
                      {/* Half of these six are not scans at all: Created happens
                          in the portal, Released is a Business Central QA review,
                          and Dispatch is still TBC. Saying so on the row stops the
                          timeline from implying the app drives all six. */}
                      {tStep.owner && (
                        <span style={{
                          background: tStep.owner === 'TBC' ? '#FEF3C7' : '#F1F5F9',
                          color: tStep.owner === 'TBC' ? '#92400E' : '#475569',
                          borderRadius: 5, padding: '1px 6px',
                          fontFamily: 'DM Sans,sans-serif', fontSize: 9.5, fontWeight: 700, letterSpacing: 0.5,
                        }}>{tStep.owner}</span>
                      )}
                    </div>
                    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 2 }}>{tStep.desc}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>

        <div style={{ height: 14 }}/>
        {/* Identity, where it belongs, where it is, and what it weighs. The
            arrival date and treatment spec are order facts and live on the order. */}
        <SectionTitle title={preLabel ? 'Pallet' : 'Scan label'}
          subtitle={preLabel
            ? 'No label yet, so this pallet cannot be scanned'
            : 'Shown at any point in the flow'} />
        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          {/* Column B of the workbook, exactly. Nine rows are listed there for
              every stream; seven of them are order or pallet level and sit here,
              and the other two - Product Code & Title and Product Dose Range -
              are per product line and sit in the list below.
              Pallet ID, Order, Weight and Stream were all being shown here and
              none of them is in column B. The pallet id is the screen title and
              the order and stream are in the header, so nothing is lost. */}
          {/* The lot number does NOT wait for the label. It is the order number
              and Business Central issues it when the portal request arrives, so a
              pallet still sitting on the dock already carries it. Only the bin is
              written later, at column G. */}
          <InfoRow label={LOT_LABEL} value={lotText(order)} bold={!!lotOf(order)} />
          <InfoRow label="Customer Name" value={order.customer} />
          <InfoRow label="Customer PO" value={order.po || '-'} />
          <InfoRow label="Steritech Status" value={steritechStatus(pallet.state)} />
          <InfoRow label="Bin" value={preLabel ? 'Assigned at check in' : binLabel(pallet)} />
          <InfoRow label="Carton Quantity" value={palletCartons(pallet)} />
          <InfoRow label="Total Pallet Quantity" value={orderPallets(order).length} />

          {/* Column B is ONE list. The workbook groups its rows by stream, but a
              pallet only ever belongs to one, so ALL plus that stream's rows is a
              single view - not two. The divider says which form added the extra
              rows without splitting the card in half. */}
          {scanLabelFields(order).length > 0 && (
            <>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 8,
                marginTop: 12, marginBottom: 10,
              }}>
                <span style={{
                  fontFamily: 'DM Sans,sans-serif', fontSize: 10, fontWeight: 700,
                  color: C.muted, textTransform: 'uppercase', letterSpacing: 0.7,
                  whiteSpace: 'nowrap',
                }}>{subStreamLabel(order)}</span>
                <span style={{ flex: 1, height: 1, background: C.border }}/>
              </div>
              {scanLabelFields(order).map(f => <InfoRow key={f.label} label={f.label} value={f.value} />)}
            </>
          )}
        </Card>

        {/* A bin move is allowed at any point while the pallet is in a
            warehouse, independent of the workflow step - Steritech calls it
            "optional additional movement of bin at any time". */}
        {canMoveBin && (
          <button onClick={() => navigate('scan_bin', {
            selectedOrder: order, selectedPallet: pallet, palletId: pallet.id,
            binPhase: STEP_OF(pallet) >= 6 ? 'post_treatment' : 'pre_treatment', binMoveOnly: true,
          })} style={{
            width: '100%', marginBottom: 14, padding: '12px', borderRadius: 12,
            background: '#fff', border: `1.5px solid ${C.border}`, cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.brand,
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 9l-3 3 3 3"/><path d="M2 12h13"/><path d="M19 15l3-3-3-3"/><path d="M22 12H9"/>
            </svg>
            Move Bin
          </button>
        )}

        <BCStepsNote />

        {/* Item-level data capture hangs off these, not off the pallet. */}
        <SectionTitle title={`Product lines on this pallet (${pallet.items.length})`} />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 14 }}>
          {pallet.items.map((item, i) => (
            <Card key={i} style={{ padding: '12px 14px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 500, color: C.text }}>{item.name}</div>
                  <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 2 }}>
                    {item.code} · {lineDose(item, order)}
                  </div>
                </div>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.orange, marginLeft: 12 }}>
                  {item.qty} cartons
                </div>
              </div>
            </Card>
          ))}
        </div>

        {/* The same grouped list Order Detail shows, narrowed to this lot and to
            the pallets there is still work on, and only once this screen is a
            dead end. Same component, so the rows, the state headings and the
            badges read identically in both places.
            This used to start at TWO siblings, on the reasoning that with one left
            "the footer button says it all". That reasoning does not survive the
            condition above it: this list only appears when the pallet in hand has
            NO work, so there is no footer button pointing anywhere. A blocked
            pallet with exactly one workable sibling showed the operator a dead end
            and hid the one thing they could go and do. One sibling is enough. */}
        {!actionIsWork && lotPending.length > 0 && (
          <>
            <SectionTitle title={`Rest of this lot (${lotPending.length})`}
              subtitle={`${lotOf(order)} - still waiting on you, tap to open`} />
            <div style={{ marginBottom: 6 }}>
              {groupByState(lotPending).map(g => (
                <PalletGroupSection key={g.state} group={g} onOpen={p => navigate('pallet_detail', {
                  selectedOrder: order, selectedPallet: p, palletId: p.id,
                })} />
              ))}
            </div>
          </>
        )}
      </div>

      {/* The action button when there is one; when there is not, why not, and a
          way off the screen. Before this, a dead-end pallet left the operator
          with a banner and nothing but the back chevron. */}
      <div style={{
        background: '#fff', borderTop: `1px solid ${C.border}`, padding: '12px 16px',
        display: 'flex', flexDirection: 'column', gap: 10,
      }}>
        {action ? (
          <Btn label={action.label} color="orange" large
            onClick={() => navigate(action.screen, {
              selectedOrder: order, selectedPallet: pallet, palletId: pallet.id,
              // Carrying selectedPallet means the scan screen knows which pallet
              // it is expecting, so a wrong scan gets caught.
              stream: order.stream, ...(action.extras || {}),
            })} />
        ) : (
          <>
            {notice && (
              <div style={{
                display: 'flex', alignItems: 'center', gap: 10,
                background: notice.bg, border: `1px solid ${notice.bd}`,
                borderRadius: 12, padding: '10px 12px',
              }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={notice.stroke} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                  {notice.icon}
                </svg>
                <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: notice.fg, fontWeight: 600, lineHeight: 1.4 }}>
                  {notice.text}
                </span>
              </div>
            )}
            <button onClick={() => navigate('dashboard')} style={{
              width: '100%', height: 42, borderRadius: 12, cursor: 'pointer',
              background: '#fff', border: `1.5px solid ${C.border}`,
              fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.brand,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              Back to Dashboard
            </button>
          </>
        )}
      </div>
    </div>
  );
};

// ═════════════════════════════════════════════════════════════════════════════
// SCAN PALLET - the only way a pallet changes state
// ═════════════════════════════════════════════════════════════════════════════
// Tapping a pallet in a list means "show me this record". Scanning its barcode
// means "this physical pallet is in front of me right now". In a GMP/TGA plant
// only the second one may advance a state, so the scan is never redundant even
// when the operator already picked the pallet off a list.
//
// One behaviour, matching the workbook: a label scan produces the column B view.
// Where the operator goes next is their choice, from the action button on that
// view. There is no separate "identify" and "work" scan - that split was ours and
// it meant one of the two never showed the view a scan is meant to produce.
//
// If the operator selected pallet A and then scans pallet B, that mismatch is
// caught here rather than silently accepted. This is the concrete case of Ben's
// "step may require special considerations before allowing next scan", and maps
// to a workflow pre-check in Exsited.
const ScanPalletScreen = ({ navigate, appData }) => {
  const order = appData.selectedOrder;
  // How much the operator has already committed to determines what a scan is
  // allowed to be. Three levels:
  //   came from one pallet -> it must be THAT pallet
  //   came from an order   -> it must be a pallet ON that order
  //   came from Scan tab   -> anything; this is discovery, not confirmation
  const expected      = appData.selectedPallet || null;
  const expectedOrder = expected ? null : (order || null);
  const [mismatch, setMismatch] = React.useState(null);

  // Scan tab with no order context: land on a pallet there is work on. The run
  // starts at the dock, so an arriving pallet is the useful default.
  const firstFor = state => orderPallets(order).find(p => p.state === state)
    || ALL_PALLETS.find(p => p.state === state);
  const target = expected
    || firstFor('ARRIVED')
    || orderPallets(order)[0]
    || DEFAULT_PALLET;

  // A pallet the operator could plausibly grab by mistake. Which mistake is
  // possible depends on what was expected: the wrong pallet on the right order,
  // or a pallet off a different order entirely.
  const decoy = expected
    ? (orderPallets(order).find(p => p.id !== expected.id)
       || ALL_PALLETS.find(p => p.id !== expected.id) || DEFAULT_PALLET)
    : (ALL_PALLETS.find(p => !expectedOrder || p.order.id !== expectedOrder.id) || DEFAULT_PALLET);

  // The workbook has ONE scan behaviour: a label scan produces the column B
  // view. So every scan lands on Pallet Detail, wherever it was started from,
  // and the action button there is what moves the pallet on. This app used to
  // have two modes - identify and work - which was our invention, and the work
  // mode skipped straight past the very view a scan is supposed to produce.
  const proceed = (pallet) => {
    const parent = orderOfPallet(pallet.id) || order || DEFAULT_PALLET_ORDER;
    navigate('pallet_detail', {
      selectedOrder: parent,
      selectedPallet: pallet,
      palletId: pallet.id,
      stream: parent.stream,
    });
  };

  const handleScan = (pallet) => {
    const got = pallet || target;
    if (expected) {
      if (got.id !== expected.id) { setMismatch(got); return; }
    } else if (expectedOrder) {
      const parent = orderOfPallet(got.id);
      if (parent && parent.id !== expectedOrder.id) { setMismatch(got); return; }
    }
    proceed(got);
  };

  // ── Mismatch: block, explain, and make the operator choose ──
  if (mismatch) {
    const scannedOrder = orderOfPallet(mismatch.id);
    // Two ways to be wrong: the wrong pallet, or the right pallet on the wrong order.
    const byPallet  = !!expected;
    const sameOrder = byPallet && scannedOrder === orderOfPallet(expected.id);
    return (
      <PageWrapper title="Wrong Pallet" onBack={() => setMismatch(null)}
        bottomBar={
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <Btn label={`Continue with ${mismatch.id}`} onClick={() => proceed(mismatch)} color="orange" large />
            <button onClick={() => setMismatch(null)} style={{
              width: '100%', background: 'none', border: 'none', color: C.muted,
              fontFamily: 'DM Sans,sans-serif', fontSize: 13, cursor: 'pointer', padding: '6px 0',
            }}>
              Cancel and rescan
            </button>
          </div>
        }>
        <div style={{ padding: '24px 16px 0' }}>
          <div style={{
            display: 'flex', alignItems: 'flex-start', gap: 11, marginBottom: 16,
            background: '#FEE2E2', border: '1px solid #FECACA', borderRadius: 12, padding: '14px 16px',
          }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.red} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
              <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <div>

// BUSINESS CENTRAL PRODUCT REFERENCES
// ═════════════════════════════════════════════════════════════════════════════
// Ben Heard, 2026-08-19: "The biggest challenge here is how the customer
// submission from the portal connects to an internal reference in our system.
// Some industries/customers may be able to have explicit references from the
// portal but we've learnt from the fresh produce markets that they can't define
// their products at the submission step to our level of detail."
//
// So the arrival step has to reconcile two different things:
//   what the CUSTOMER typed  ->  a PRODUCT REFERENCE that exists in BC
// and where no reference exists, raise a new one for QA to create.
//
// The list is filtered to the customer on the order, which is the "at least
// filtered to a specific customer" option in Ben's email. Whether that filter
// can ever become a fully automatic match is the open question, so this screen
// deliberately makes the operator confirm rather than pre-selecting for them.
const BC_PRODUCTS = {

    { code: 'PRD-2201', name: 'Mangoes - Kensington Pride', dose: '0.4 - 1.0 kGy' },
    { code: 'PRD-2208', name: 'Lychees',                    dose: '0.4 - 1.0 kGy' },

    { code: 'PRD-2236', name: 'Table Grapes - Menindee', dose: '0.4 - 1.0 kGy' },

};
// Anything the customer has no catalogue for still needs something to match
// against, so a small shared set stands in for the rest of BC.
const BC_PRODUCTS_FALLBACK = [
  { code: 'PRD-1042', name: 'Surgical Instruments - Class II', dose: '25 - 45 kGy' },

];
const bcProductsFor = customer => BC_PRODUCTS[customer] || BC_PRODUCTS_FALLBACK;

// Column E of the workbook, cell for cell. Two things this encodes that a plain
// field list cannot:
//
//   isNew   The cell is highlighted blue, which the sheet defines as "new data
//           field to be added into order information". Nine fields are blue and
//           every one of them is in this column. It no longer prints a NEW FIELD
//           tag on screen - it only decides whether the field starts empty with
//           a blue border, or pre-filled from the submission.
//   prefill The cell is NOT blue, so the field already exists on the order. The
//           customer submitted it and the operator is confirming it, which is
//           why it arrives pre-filled instead of blank.
//
// Biosecurity and Medical have no rows in column E at all. Their RPI, Dose
// Range, Biosecurity Direction and Container Number live in column D, as things
// the scanner shows. An earlier pass had them as editable arrival fields, which
// was simply the wrong column.
const ARRIVAL_FIELDS = {
  fresh_domestic: [
    { label: 'Truck Temperature',                             isNew: true },
    { label: 'Pulp Temperature',                              isNew: true },
    { label: 'Product Line - Photo of Carton Label',          isNew: true, photo: true },
    { label: 'Charges (overheight re-stack, labels, transport)', isNew: true },
    { label: 'ICA-55 Date Code',                              isNew: true },
    { label: 'Grower Details',                                prefill: 'grower' },
    { label: 'Storage Temperature',                           prefill: 'storageTemp' },
  ],
  fresh_export: [
    { label: 'Truck Temperature',                             isNew: true },
    { label: 'Pulp Temperature',                              isNew: true },
    { label: 'Product Line - Photo of Carton Label',          isNew: true, photo: true },
    { label: 'Charges (overheight re-stack, labels, transport)', isNew: true },
    { label: 'Storage Temperature',                           prefill: 'storageTemp' },
    { label: 'Grower Details',                                prefill: 'grower' },
  ],
  biosecurity: [],
  medical:     [],
  beehives:    [],
};

const ReceivingFormScreen = ({ navigate, appData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet = palletOf(appData, order);
  const req    = SAMPLE_REQUEST;
  const [step, setStep] = React.useState(1);
  const TOTAL = 3;

  // Corrections to what the customer submitted, keyed by field label. Held on
  // the side rather than written over the order, so the row can show both the
  // corrected value and what the customer originally sent.
  const [corrections, setCorrections] = React.useState({});
  const [editing, setEditing]         = React.useState(false);
  const correct = (label, v) => setCorrections(c => ({ ...c, [label]: v }));
  const correctedCount = Object.keys(corrections)
    .filter(k => corrections[k] !== undefined).length;

  // Receiving happens ONE PALLET AT A TIME. The operator scanned a specific
  // pallet, so this form reviews that pallet - not every pallet on the order.
  // Identity and the product lines come from the scanned pallet; the extra
  // customer-submitted detail (spaces, cheps, cartons, grower, pulp temps)
  // comes from the request template so the layout stays representative.
  const allPallets = orderPallets(order);
  const palletNo   = Math.max(1, allPallets.findIndex(p => p.id === pallet.id) + 1);
  // Pallets already past the Received step, i.e. genuinely checked in. This is
  // real progress, unlike the pallet's ordinal position in the order.
  const receivedCount = allPallets.filter(p => STEP_OF(p) > 1).length;
  const tmpl       = req.pallets[(palletNo - 1) % req.pallets.length];
  const viewPallets = [{
    id:          pallet.id,
    noOfSpaces:  tmpl.noOfSpaces,
    storageTemp: tmpl.storageTemp,
    cheps:       tmpl.cheps,
    cartons:     tmpl.cartons,
    commodities: pallet.items.map((it, i) => {
      const c = tmpl.commodities[i % tmpl.commodities.length];
      return {
        commodity: it.name, code: it.code, cartons: it.qty,
        grower: c.grower, cheps: c.cheps,
        pulpMin: c.pulpMin, pulpMax: c.pulpMax, address: c.address,
      };
    }),
  }];

  // ── Product lines: match to BC, or raise a new reference for QA ───────────
  // The first line starts unmatched on purpose. That is the normal fresh-produce
  // case: the customer described the goods, but not to Steritech's detail, so
  // somebody has to decide which reference it really is.
  const catalogue = bcProductsFor(order.customer);
  const [lines, setLines] = React.useState(() => pallet.items.map((it, i) => {
    const hit = catalogue.find(p => p.code === it.code);
    return {
      key:       `${pallet.id}-${i}`,
      submitted: it.name,
      cartons:   String(it.qty),
      // status: 'unmatched' | 'matched' | 'pending_qa'
      status:    i === 0 ? 'unmatched' : (hit ? 'matched' : 'unmatched'),
      match:     i === 0 ? null : (hit || null),
    };
  }));
  const [pickerFor, setPickerFor] = React.useState(null);

  const setLine = (key, patch) => setLines(ls => ls.map(l => (l.key === key ? { ...l, ...patch } : l)));
  const matchLine   = (key, product) => { setLine(key, { status: 'matched', match: product }); setPickerFor(null); };
  const createNew   = (key) => { setLine(key, { status: 'pending_qa', match: null }); setPickerFor(null); };
  const resetLine   = (key) => setLine(key, { status: 'unmatched', match: null });

  const unmatched = lines.filter(l => l.status === 'unmatched').length;
  const pendingQA = lines.filter(l => l.status === 'pending_qa').length;
  // "Cannot proceed until all Create New products have been added by QA."
  // Receiving is blocked by both an unmatched line and a line waiting on QA.
  const blocked = unmatched > 0 || pendingQA > 0;

  // ── Damage capture ────────────────────────────────────────────────────────
  const [damage, setDamage] = React.useState([]);
  const addDamage = () => setDamage(d => [...d, { id: Date.now() + Math.random(), name: `DMG-${String(d.length + 1).padStart(3, '0')}.jpg`, size: '1.4 MB' }]);
  const removeDamage = id => setDamage(d => d.filter(x => x.id !== id));

  // On-arrival capture. Only what the workbook asks for: the two pictures in
  // column E. There is no operator notes field and no general file upload here -
  // neither appears anywhere in the sheet or in Ben's email. The customer's
  // Comments are column D and stay read only.
  const [arrival,    setArrival]    = React.useState({});
  const setAF = (k, v) => setArrival(s => ({ ...s, [k]: v }));
  // Fields that are not highlighted blue already exist on the order, so they
  // come back from the submission rather than starting empty.
  const prefillFor = f => f.prefill === 'grower'      ? (tmpl.commodities[0] || {}).grower || ''
                        : f.prefill === 'storageTemp' ? tmpl.storageTemp || ''
                        : '';

  // Step 1 used to be fully locked because the workbook puts the customer columns
  // in VIEW mode. Ben overrode that on 2026-08-25: Steritech has to be able to
  // correct the customer's information where it is wrong. So step 1 is now
  // read-only by DEFAULT with an explicit Correct toggle, rather than a form that
  // invites edits - the customer's submission is still the record until someone
  // deliberately changes it, and a change is labelled as a correction.
  //
  // Quantities are not corrected here. Cartons are counted per product line at
  // step 2, which already has an editable carton field, so a second place to
  // change the same number would be two sources of truth.

  const next = () => {
    if (step < TOTAL) { setStep(step + 1); return; }
    // BOOKING IN is what marks the pallet Received - not printing the label.
    // Ben, 2026-08-25: "as it's received, it should mark it ... I think it's the
    // opposite way. It prints a label once we've received it", and "when we
    // receive the pallet, we book it in, it prints the labels." Submitting this
    // form IS the book-in, so the state moves here and the labels follow.
    advancePallet(pallet, 'RECEIVED', '');
    navigate('print_labels', {
      selectedOrder: { ...order, stream: order.stream || 'irradiation' },
      selectedPallet: pallet,
      palletId: pallet.id,
      stream: order.stream || 'irradiation',
      palletState: 'RECEIVED',
      productLines: lines,
      // Corrections travel with the pallet. A PO the operator fixed at arrival is
      // the PO on the label, not the one the customer typed.
      corrections,
    });
  };
  const back = () => {
    if (step > 1) setStep(step - 1);
    else navigate('pallet_detail');
  };

  const STEP_TITLES = ['Order details', 'Product lines', 'Arrival checks'];
  // The read-only banner belongs to the customer-submitted steps. Steps 3 and 4
  // are the operator's own work, so it would contradict them.
  const readOnlyStep = step === 1;
  const arrivalFields = ARRIVAL_FIELDS[order.subStream] || [];

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg, position: 'relative' }}>
      <StatusBar />
      <NavBar title={`Arrival · ${order.id}`} onBack={back} showLogo={false} />
      <StepDots step={step} total={TOTAL} />

      <div style={{ flex: 1, overflow: 'auto', padding: '14px 16px 8px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
          <div>
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: 0.5, textTransform: 'uppercase' }}>
              Step {step} of {TOTAL}
            </div>
            <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 20, fontWeight: 700, color: C.text, marginTop: 2 }}>
              {STEP_TITLES[step - 1]}
            </div>
          </div>
          <PalletChip id={appData.palletId || DEFAULT_PALLET_ID} />
        </div>

        {/* Read-only banner - applies to customer-submitted sections */}
        {readOnlyStep && (
        <div style={{
          background: '#EEF2FF', border: `1px solid #C7D2FE`, borderRadius: 12,
          padding: 12, marginBottom: 14,
        }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
            <div style={{
              width: 28, height: 28, borderRadius: 8, flexShrink: 0,
              background: '#fff', border: `1px solid #C7D2FE`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.brand} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
              </svg>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: '#312E81', marginBottom: 2 }}>
                Submitted by customer
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: '#4F46E5', lineHeight: 1.4 }}>
                {editing
                  ? 'Correct anything that does not match what arrived. The original stays on record.'
                  : 'Verify against what arrived. Correct any field that is wrong, then continue.'}
              </div>
              {correctedCount > 0 && (
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: '#312E81', marginTop: 5, fontWeight: 600 }}>
                  {correctedCount} field{correctedCount === 1 ? '' : 's'} corrected by Steritech
                </div>
              )}
            </div>
            {/* One toggle, not a pencil per row. The submission is the record
                until someone deliberately decides to change it. */}
            <button onClick={() => setEditing(e => !e)} style={{
              flexShrink: 0, background: editing ? C.brand : '#fff',
              color: editing ? '#fff' : C.brand, border: `1px solid ${C.brand}`,
              borderRadius: 8, padding: '6px 12px', cursor: 'pointer',
              fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700,
            }}>{editing ? 'Done' : 'Correct'}</button>
          </div>

        </div>
        )}


        {/* ── STEP 1: column D, the order-selected view ─────────────────────
            Exactly the rows the workbook lists and nothing else. Contact name,
            mobile, email, ETA, order id, lot number, pallet spaces and form name
            were all being shown here with no basis in the sheet, and the
            per-pallet grid of CHEPs, spaces, storage temp, grower, pulp range and
            address came off the old PDF form rather than this flow. */}
        {step === 1 && (
          <>
            <SectionTitle title="Order" subtitle="Selected on the scanner" />
            <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
              {/* Correctable: these are the customer's words and can be wrong. */}
              <EditRow label="Customer Name" value={order.customer}
                corrected={corrections['Customer Name']} editing={editing}
                onChange={v => correct('Customer Name', v)}/>
              <EditRow label="Customer PO" value={order.po} mono
                corrected={corrections['Customer PO']} editing={editing}
                onChange={v => correct('Customer PO', v)}/>
              {/* NOT correctable: both are counted from the pallets in front of
                  the operator, and cartons are already editable per line at
                  step 2. A second input for the same number is a second truth. */}
              <ReadGrid items={[
                { label: 'Number of Pallets', value: allPallets.length },
                { label: 'Number of Cartons', value: orderCartons(order) },
              ]}/>
              <EditRow label="Request Storage and Handling Conditions"
                value={(order.storageHandling || []).join(' · ')}
                corrected={corrections['Request Storage and Handling Conditions']} editing={editing}
                onChange={v => correct('Request Storage and Handling Conditions', v)}/>
              <EditRow label="Comments" value={req.notes}
                corrected={corrections['Comments']} editing={editing}
                onChange={v => correct('Comments', v)}/>
            </Card>

            {viewFields(order).length > 0 && (
              <>
                <SectionTitle title={subStreamLabel(order)} />
                <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
                  {viewFields(order).map(f => (
                    <EditRow key={f.label} label={f.label} value={f.value}
                      corrected={corrections[f.label]} editing={editing}
                      onChange={v => correct(f.label, v)}/>
                  ))}
                </Card>
              </>
            )}

            {/* The workbook only says "Products (line items)" here, with no
                sub-fields. What it must NOT show is a Steritech product code:
                Ben's whole point is that the customer's submission has no
                internal reference yet. The code is assigned at step 2, when the
                operator matches the line. Printing PRD-2201 at this step would
                make the bottleneck look already solved. */}
            <SectionTitle title="Products (line items)"
              subtitle={`As submitted, on ${pallet.id}, pallet ${palletNo} of ${allPallets.length}`} />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {pallet.items.map((it, i) => (
                <Card key={i} style={{ padding: '12px 14px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 500, color: C.text }}>{it.name}</div>
                      <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 3 }}>
                        No Business Central reference yet
                      </div>
                    </div>
                    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.orange, marginLeft: 12 }}>
                      {it.qty} cartons
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          </>
        )}

        {/* ── STEP 2: column E, product line matching ───────────────────── */}
        {step === 2 && (
          <>
            {/* The step header already says Product lines, so this is just the
                counter. */}
            <div style={{
              fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, fontWeight: 600,
              color: C.muted, marginBottom: 10,
            }}>
              {lines.filter(l => l.status === 'matched').length} of {lines.length} matched
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 16 }}>
              {lines.map(l => {
                const tone = l.status === 'matched'
                  ? { bg: '#F0FDF4', border: '#86EFAC', color: '#15803D', txt: 'Matched' }
                  : l.status === 'pending_qa'
                  ? { bg: '#FEF3C7', border: '#FDE68A', color: '#92400E', txt: 'New - waiting on QA' }
                  : { bg: '#FEF2F2', border: '#FECACA', color: '#B91C1C', txt: 'Not matched' };
                return (
                  <Card key={l.key} style={{ padding: 0, overflow: 'hidden' }}>
                    <div style={{
                      background: tone.bg, borderBottom: `1px solid ${tone.border}`,
                      padding: '8px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                    }}>
                      <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: tone.color, textTransform: 'uppercase', letterSpacing: 0.6 }}>
                        {tone.txt}
                      </span>
                      {l.status !== 'unmatched' && (
                        <button onClick={() => resetLine(l.key)} style={{
                          background: 'none', border: 'none', cursor: 'pointer', padding: 0,
                          fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, fontWeight: 700, color: tone.color,
                        }}>Change</button>
                      )}
                    </div>

                    <div style={{ padding: '12px 14px' }}>
                      <ReadRow label="Customer submitted" value={l.submitted} />

                      {l.status === 'matched' ? (
                        <div style={{ background: '#F8FAFC', border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 12px', marginBottom: 12 }}>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 10.5, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 3 }}>
                            Business Central reference
                          </div>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.text }}>{l.match.name}</div>
                          <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12, color: C.brand, marginTop: 2 }}>
                            {l.match.code} · {l.match.dose}
                          </div>
                        </div>
                      ) : l.status === 'pending_qa' ? (
                        <div style={{ background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 10, padding: '10px 12px', marginBottom: 12 }}>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: '#92400E' }}>
                            New reference requested
                          </div>
                          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: '#92400E', marginTop: 3, lineHeight: 1.45 }}>
                            QA has to create this product in Business Central before this pallet
                            can be received.
                          </div>
                        </div>
                      ) : (
                        <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                          <button onClick={() => setPickerFor(l.key)} style={{
                            flex: 1, padding: '11px', borderRadius: 10, cursor: 'pointer',
                            background: C.brand, border: 'none', color: '#fff',
                            fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700,
                          }}>Select product</button>
                          <button onClick={() => createNew(l.key)} style={{
                            flex: 1, padding: '11px', borderRadius: 10, cursor: 'pointer',
                            background: '#fff', border: `1.5px solid ${C.border}`, color: C.text,
                            fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700,
                          }}>Create new</button>
                        </div>
                      )}

                      {l.status === 'unmatched' && (
                        <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, lineHeight: 1.45, marginTop: -6, marginBottom: 12 }}>
                          {/* The workbook's own words: Create New is "to be completed on
                              BC by QA". This app records the request and nothing else -
                              it never creates a product reference itself. */}
                          Create new does not create anything here. It records the request; QA
                          creates the product in Business Central.
                        </div>
                      )}

                      <label style={{ display: 'block', fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 5, textTransform: 'uppercase', letterSpacing: '0.6px' }}>
                        Cartons on this pallet
                      </label>
                      <input type="number" value={l.cartons}
                        onChange={e => setLine(l.key, { cartons: e.target.value })}
                        style={{
                          width: '100%', height: 44, borderRadius: 10, padding: '0 12px',
                          border: `1.5px solid #D1CEC9`, background: '#fff',
                          fontFamily: 'DM Sans,sans-serif', fontSize: 15, color: C.text,
                          outline: 'none', boxSizing: 'border-box',
                        }}/>
                    </div>
                  </Card>
                );
              })}
            </div>

            <SectionTitle title="Damaged pallet or cartons" subtitle="Photograph anything that arrived damaged" />
            <div onClick={addDamage} style={{
              borderRadius: 12, cursor: 'pointer', marginBottom: 10,
              border: `1.5px dashed #CBD5E1`, background: '#F8FAFC',
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 8,
              padding: '24px 16px', textAlign: 'center',
            }}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14 }}>
                <span style={{ color: C.brand, fontWeight: 700 }}>Take photo</span>
                <span style={{ color: C.muted }}> of damage</span>
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, color: C.muted }}>Optional - leave empty if nothing is damaged</div>
            </div>

            {damage.length > 0 && (
              <Card style={{ padding: 0, marginBottom: 14, overflow: 'hidden' }}>
                {damage.map((f, i) => (
                  <div key={f.id} style={{
                    display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px',
                    borderBottom: i < damage.length - 1 ? `1px solid ${C.border}` : 'none',
                  }}>
                    <div style={{ width: 32, height: 32, borderRadius: 8, flexShrink: 0, background: '#FEE2E2', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.red} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                      </svg>
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 600, color: C.text }}>{f.name}</div>
                      <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, color: C.muted }}>{f.size}</div>
                    </div>
                    <button onClick={() => removeDamage(f.id)} style={{
                      background: 'none', border: 'none', cursor: 'pointer', padding: 6, color: C.muted,
                      display: 'flex', alignItems: 'center',
                    }} aria-label="Remove">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                      </svg>
                    </button>
                  </div>
                ))}
              </Card>
            )}
          </>
        )}

        {/* ── STEP 3: column E, operator capture ─────────────────────────── */}
        {step === 3 && (
          <>
            {/* The blocking rule, stated where it bites. */}
            {blocked && (
              <div style={{
                display: 'flex', alignItems: 'flex-start', gap: 11, marginBottom: 14,
                background: '#FEF2F2', border: '1px solid #FECACA', borderRadius: 12, padding: '12px 14px',
              }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.red} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
                  <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <div>
                  <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: '#B91C1C' }}>
                    Receiving is blocked
                  </div>
                  <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.text, marginTop: 3, lineHeight: 1.5 }}>
                    {unmatched > 0 && `${unmatched} product line${unmatched !== 1 ? 's' : ''} still unmatched. `}
                    {pendingQA > 0 && `${pendingQA} new product${pendingQA !== 1 ? 's' : ''} waiting on QA to create ${pendingQA !== 1 ? 'them' : 'it'} in Business Central. `}
Go back to step 3, Product lines.
                  </div>
                </div>
              </div>
            )}
            <div style={{
              display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14,
            }}>
              <div style={{ flex: 1, height: 1, background: C.border }}/>
              <div style={{
                fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.orange,
                textTransform: 'uppercase', letterSpacing: 0.8,
                background: '#FFF7ED', border: `1px solid #FED7AA`, borderRadius: 999,
                padding: '4px 10px',
              }}>Your turn · on-arrival capture</div>
              <div style={{ flex: 1, height: 1, background: C.border }}/>
            </div>

            {/* Column E of the workbook, for this order's form only. Blue cells
                are tagged NEW FIELD; the rest already exist on the order and so
                arrive pre-filled for the operator to confirm. */}
            <SectionTitle title={subStreamLabel(order) ? `${subStreamLabel(order)} fields` : 'Stream fields'}
              subtitle={arrivalFields.length ? 'Captured at arrival' : undefined} />
            {arrivalFields.length ? (
              <Card style={{ padding: 16, marginBottom: 14 }}>
                {arrivalFields.map(f => (
                  <div key={f.label} style={{ marginBottom: 14 }}>
                    <label style={{
                      display: 'block', fontFamily: 'DM Sans,sans-serif', fontSize: 11,
                      fontWeight: 700, color: C.muted, marginBottom: 5,
                      textTransform: 'uppercase', letterSpacing: '0.6px',
                    }}>
                      {f.label}
                    </label>
                    {f.photo ? (
                      <div onClick={() => setAF(f.label, arrival[f.label] ? '' : 'CARTON-LABEL-001.jpg')} style={{
                        borderRadius: 10, cursor: 'pointer', padding: '14px 12px',
                        border: `1.5px dashed ${arrival[f.label] ? '#86EFAC' : '#93C5FD'}`,
                        background: arrival[f.label] ? '#F0FDF4' : '#F8FAFC',
                        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
                      }}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={arrival[f.label] ? '#15803D' : C.brand} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                          <circle cx="12" cy="13" r="4"/>
                        </svg>
                        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13.5, fontWeight: 700, color: arrival[f.label] ? '#15803D' : C.brand }}>
                          {arrival[f.label] || 'Take photo'}
                        </span>
                      </div>
                    ) : (
                      <input
                        value={arrival[f.label] !== undefined ? arrival[f.label] : prefillFor(f)}
                        onChange={e => setAF(f.label, e.target.value)}
                        placeholder={f.isNew ? 'Capture on arrival' : ''}
                        style={{
                          width: '100%', height: 44, borderRadius: 10, padding: '0 12px',
                          border: `1.5px solid ${f.isNew ? '#93C5FD' : '#D1CEC9'}`,
                          background: '#fff', fontFamily: 'DM Sans,sans-serif', fontSize: 15,
                          color: C.text, outline: 'none', boxSizing: 'border-box',
                        }}/>
                    )}
                    {!f.isNew && (
                      <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, color: C.muted, marginTop: 4 }}>
                        Submitted by the customer. Confirm or correct it.
                      </div>
                    )}
                  </div>
                ))}
              </Card>
            ) : order.subStream === 'beehives' ? (
              <Alert type="warning"
                message="Steritech has not defined the Beehives arrival fields yet. The row exists in their workbook but is empty." />
            ) : (
              <Alert type="info"
                message={`${subStreamLabel(order) || 'This form'} has no extra arrival fields. Only the damage photo and the product lines are captured here.`} />
            )}

          </>
        )}

      </div>

      <div style={{ background: '#fff', borderTop: `1px solid ${C.border}`, padding: '12px 16px', display: 'flex', gap: 10 }}>
        <button onClick={back} style={{
          flex: '0 0 38%', padding: '14px', borderRadius: 12,
          background: '#fff', border: `1.5px solid ${C.border}`, color: C.text,
          fontFamily: 'DM Sans,sans-serif', fontSize: 15, fontWeight: 600, cursor: 'pointer',
        }}>{step === 1 ? 'Back' : '← Previous'}</button>
        <button onClick={next} disabled={step === TOTAL && blocked} style={{
          flex: 1, padding: '14px', borderRadius: 12,
          background: step === TOTAL ? (blocked ? '#D1D5DB' : C.orange) : C.brand,
          border: 'none', color: step === TOTAL && blocked ? '#9CA3AF' : '#fff',
          fontFamily: 'DM Sans,sans-serif', fontSize: 15, fontWeight: 700,
          cursor: step === TOTAL && blocked ? 'not-allowed' : 'pointer',
        }}>{step === TOTAL ? (blocked ? 'Blocked - resolve product lines' : 'Confirm Arrival') : 'Continue →'}</button>
      </div>

      {/* ── Product picker: the BC references available for this customer ──── */}
      {pickerFor && (
        <div onClick={() => setPickerFor(null)} style={{
          position: 'absolute', inset: 0, background: 'rgba(15,22,35,0.55)',
          display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', zIndex: 110,
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background: '#fff', borderTopLeftRadius: 22, borderTopRightRadius: 22,
            padding: '14px 18px 20px', maxHeight: '80%', overflowY: 'auto',
            animation: 'slideIn 0.22s cubic-bezier(0.4,0,0.2,1) both',
          }}>
            <div style={{ width: 38, height: 4, borderRadius: 2, background: C.border, margin: '0 auto 16px' }}/>
            <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 19, fontWeight: 700, color: C.text }}>
              Business Central products
            </div>
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.muted, marginTop: 3, marginBottom: 14 }}>
              Filtered to {order.customer}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 14 }}>
              {catalogue.map(p => (
                <button key={p.code} onClick={() => matchLine(pickerFor, p)} style={{
                  textAlign: 'left', padding: '12px 14px', borderRadius: 12, cursor: 'pointer',
                  background: '#fff', border: `1.5px solid ${C.border}`,
                }}>
                  <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.text }}>{p.name}</div>
                  <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12, color: C.brand, marginTop: 2 }}>
                    {p.code} · {p.dose}
                  </div>
                </button>
              ))}
            </div>
            <button onClick={() => createNew(pickerFor)} style={{
              width: '100%', padding: '13px', borderRadius: 12, cursor: 'pointer',
              background: '#FFFBEB', border: '1.5px solid #FDE68A', color: '#92400E',
              fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700,
            }}>None of these - create new for QA</button>
          </div>
        </div>
      )}


    </div>
  );
};

// ═════════════════════════════════════════════════════════════════════════════
// PALLET LABEL - printed BY the book-in, not the thing that causes it
// ═════════════════════════════════════════════════════════════════════════════
// This screen used to hold a Print button and set the pallet to Received when it
// was pressed. Ben corrected both halves on 2026-08-25.
//
// The direction: "as it's received, it should mark it ... I think it's the
// opposite way. It prints a label once we've received it." Receiving is the
// action; the print is its consequence. So the arrival form sets Received and
// this screen opens with the label already printed.
//
// The unit: "We'll only ever have one pallet per one label per pallet" and "each
// pallet has to be one label unique". ONE label per pallet, never one per product
// line and never one per commodity - a pallet carrying oranges and apples still
// gets one label, with the mixed commodities listed on it as a parent line.
//
// It still sits between the arrival form and the bin scan for a physical reason,
// and Ben described that order too: "we book it in, it prints the labels. And
// then we have to scan it into a position ... then we stick it on the pallets."
const PrintLabelsScreen = ({ navigate, appData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet = palletOf(appData, order);
  const lines  = appData.productLines || pallet.items.map(it => ({ submitted: it.name, match: { code: it.code, name: it.name }, cartons: String(it.qty) }));
  // Anything corrected at arrival prints as corrected. Falls back to the
  // customer's value when the operator changed nothing.
  const fixed  = appData.corrections || {};
  const field  = (label, fallback) => (fixed[label] !== undefined ? fixed[label] : fallback);

  return (
    <PageWrapper title="Pallet Label" onBack={() => navigate('receiving_form')}
      bottomBar={
        /* No Print button. Booking the pallet in printed it, and the pallet is
           already Received by the time this screen opens. The only thing left
           for the operator is to attach it and go and scan the bin. */
        <Btn label="Label Attached - Scan Bin →"
          onClick={() => navigate('scan_bin', { binPhase: 'pre_treatment' })}
          color="orange" large />
      }>
      <div style={{ padding: '20px 16px' }}>
        <SectionTitle title="Pallet label"
          subtitle="One label for this pallet, listing every product line on it" />

        {/* The label preview carries exactly the fields Steritech listed. */}
        <div style={{
          background: '#fff', border: `2px solid ${C.text}`, borderRadius: 8,
          padding: '14px 16px', marginBottom: 14,
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
            <div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 10, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.8 }}>
                {LOT_LABEL}
              </div>
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 19, fontWeight: 700, color: C.text }}>{lotText(order)}</div>
            </div>
            <img src="assets/steritech_logo.png" alt="Steritech" style={{ width: 54, height: 'auto', opacity: 0.85 }}/>
          </div>

          {/* Unique barcode per pallet - the thing every later scan resolves. */}
          <div style={{
            background: '#F8FAFC', border: `1px dashed ${C.border}`, borderRadius: 6,
            padding: '10px 12px', marginBottom: 12, textAlign: 'center',
          }}>
            <div style={{ display: 'flex', gap: 1.5, justifyContent: 'center', height: 40, alignItems: 'stretch', marginBottom: 6 }}>
              {[...Array(42)].map((_, i) => (
                <div key={i} style={{ width: (i % 4 === 0 ? 3 : i % 3 === 0 ? 2 : 1), background: C.text }}/>
              ))}
            </div>
            <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 13, fontWeight: 700, color: C.text, letterSpacing: 1 }}>
              {pallet.id}
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px 14px', marginBottom: 10 }}>
            {/* Column F lists six fields and no more. "Pallet 1 of 3" was extra:
                Total Pallet Quantity belongs to the scan-label view in column B,
                not to the printed label. */}
            {[
              { l: 'Customer Name', v: field('Customer Name', order.customer) },
              { l: 'Customer PO', v: field('Customer PO', order.po) || '-' },
              { l: 'Carton Quantity', v: lines.reduce((s, l) => s + (parseInt(l.cartons, 10) || 0), 0) },
            ].map(x => (
              <div key={x.l}>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 9.5, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.6 }}>{x.l}</div>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 600, color: C.text }}>{x.v}</div>
              </div>
            ))}
          </div>

          <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 8 }}>
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 9.5, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 4 }}>
              Product code & title
            </div>
            {lines.map((l, i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 2 }}>
                <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.text }}>
                  {(l.match && l.match.code) || 'NEW'} · {(l.match && l.match.name) || l.submitted}
                </span>
                <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, fontWeight: 700, color: C.text }}>{l.cartons}</span>
              </div>
            ))}
          </div>
        </div>

        <Alert type="teal" message="Printed when you booked this pallet in. Attach it, then scan the bin it goes into." />
      </div>
    </PageWrapper>
  );
};

Object.assign(window, {
  SAMPLE_ORDERS, ALL_PALLETS, DEFAULT_PALLET, DEFAULT_PALLET_ID, DEFAULT_PALLET_ORDER,
