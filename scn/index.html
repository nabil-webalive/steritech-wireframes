// ── Home Screen: the process flow ────────────────────────────────────────────
// Top to bottom: search, the shift pin if one is set, the steps in process order,
// then All Orders as the last tile - "Maybe keep the option for all orders view
// as a final icon on the screen."
//
// The flow is drawn as a rail rather than an icon grid on purpose. Ben's
// reference shot was a 3x4 grid of icons and he called it "not a shining
// example"; what he asked for was "laid out in a process flow to help guide the
// user". A grid shows twelve equal choices, a rail shows an order of work, and
// the order of work is the thing he wants the screen to teach.
const DashboardScreen = ({ navigate, appData }) => {
  const [menu, setMenu] = React.useState(false);
  const site = appData.site;
  // Rev3: the stream chosen at sign-in scopes every count on this screen. With
  // none chosen (a Tweaks deep link) it falls back to the whole site.
  const stream = appData.workStream || null;
  const sitePallets = palletsAtSite(site);
  const siteOrders  = ordersAtSite(site);
  // Scheduling is Business Central's and no longer a card (FDB-306).
  const homeSteps   = WORK_STEPS.filter(s => !s.hidden);

  const openStep = key => navigate('task_queue', { taskStep: key });

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg, position: 'relative' }}>
      <StatusBar />
      <NavBar title={`Hello ${(appData.operator || 'Operator').split(' ')[0]}`}
        onMenu={() => setMenu(true)} showLogo={true} />
      <SidePanel open={menu} onClose={() => setMenu(false)} navigate={navigate} appData={appData} />
      {/* Which yard these numbers are. Without it every count on this screen is
          ambiguous, and an operator who moves site mid-shift has no way to tell
          they are still looking at the site they left.
          Drawn as part of the header rather than as a white bar under it: it is
          header information, and as its own strip it belonged to neither the
          header above nor the page below. */}
      {/* Rev3: the site is a label here and not a button, so there is no "Change
          Site" on the working screens. The pill beside it names the stream and
          reopens the one page where site and stream are chosen. */}
      <div style={{
        flexShrink: 0, background: C.navBg,
        padding: '0 16px 13px', display: 'flex', alignItems: 'center', gap: 8,
      }}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="rgba(255,255,255,0.55)" stroke="none" style={{ flexShrink: 0 }}>
          <path d="M12 2a7 7 0 0 0-7 7c0 5.1 6.1 12.2 6.36 12.5a.85.85 0 0 0 1.28 0C12.9 21.2 19 14.1 19 9a7 7 0 0 0-7-7zm0 9.6A2.6 2.6 0 1 1 14.6 9 2.6 2.6 0 0 1 12 11.6z"/>
        </svg>
        <span style={{ flex: 1, minWidth: 0, fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, fontWeight: 600, color: 'rgba(255,255,255,0.86)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {siteLabel(site)}
        </span>
        {stream && (
          <button onClick={() => navigate('stream_select')} style={{
            fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, cursor: 'pointer',
            color: 'rgba(255,255,255,0.92)', flexShrink: 0, border: 'none',
            background: 'rgba(255,255,255,0.12)', borderRadius: 7, padding: '4px 10px',
          }}>{STREAM_LABEL[stream] || stream} ▾</button>
        )}
      </div>
      <div style={{ flex: 1, overflow: 'auto', padding: '16px 16px 20px' }}>
        {/* No search bar here any more. It lives inside each step queue,
            where it narrows the work the operator is actually doing rather
            than the whole yard, and inside All Orders and All Pallets for a
            yard-wide lookup. The Scan tab below still identifies any pallet
            from anywhere. See flag F15. */}

          {/* ── Section head ──────────────────────────────────────────────── */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 13 }}>
            <div>
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 17, fontWeight: 700, color: C.text, letterSpacing: '-0.2px' }}>
                Work by step
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 2 }}>
                In process order
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
              <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 17, fontWeight: 700, color: C.text }}>{sitePallets.length}</span>
              <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>on site</span>
            </div>
          </div>

          {/* ── The step grid ──────────────────────────────────────────────
              Ben's reference was the Warehouse Insight icon menu, and this is
              still that shape, but the icon is no longer the subject of the
              card. The COUNT is. An icon grid tells an operator what the app
              can do; they already know. What they are standing there asking is
              "where is the work", so the number is the largest thing on the
              card, the icon is a quiet identifier beside it, and the badge that
              used to shout the count from a corner is gone.

              No borders either: white cards on a cool ground with one soft
              shadow. A hairline box around every tile is what made nine equal
              rectangles read as a menu from a decade ago. */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
            {homeSteps.map((step, i) => {
              // Seven steps in a three-wide grid leaves the last one alone in a
              // row with two holes beside it. The last card takes the whole row
              // instead, laid out along it. Derived from the count, so an eighth
              // step added to WORK_STEPS closes the row and this goes back to
              // being an ordinary card with no code change. With Scheduling off
              // the home there are six cards, a clean 3 x 2, so no card is wide.
              const lastRow = homeSteps.length % 3 || 3;
              const wide = (i === homeSteps.length - 1) && lastRow === 1;
              const queue   = stepQueue(step, site, stream);
              const overdue = stepOverdue(step, site, stream);
              const holds   = stepHolds(step, site, stream);
              const empty   = queue.length === 0;
              const flagged = overdue > 0 || holds > 0;
              const flagText = holds ? `${holds} on hold` : overdue ? `${overdue} over ${AGE_WARN}d` : '';
              const tone    = empty ? C.muted : step.colour;
              return (
                <button key={step.key} onClick={() => openStep(step.key)} style={{
                  position: 'relative', cursor: 'pointer',
                  gridColumn: wide ? 'span 3' : 'auto',
                  height: wide ? 76 : 134,
                  background: '#fff', border: 'none', borderRadius: 18,
                  boxShadow: '0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.04)',
                  padding: wide ? '0 16px' : '11px 12px 11px 13px',
                  display: 'flex',
                  flexDirection: wide ? 'row' : 'column',
                  alignItems: wide ? 'center' : 'flex-start',
                  gap: wide ? 14 : 0,
                  opacity: empty ? 0.55 : 1,
                }}>
                  {/* Position in the process. Quiet, because it is a reference
                      mark rather than something to act on.
                      No "BC" marker here any more. Whether Business Central owns
                      a step is not something an operator needs while choosing
                      what to work on, and two small grey marks in two corners of
                      every card was more chrome than information. The queue
                      screen still says it, in full, where it actually changes
                      what the operator can do. */}
                  {!wide && (
                    <div style={{ width: '100%', height: 12, textAlign: 'left' }}>
                      <span style={{
                        fontFamily: 'DM Sans,sans-serif', fontSize: 10.5, fontWeight: 700,
                        color: '#A8B2C1', letterSpacing: 0.2,
                      }}>{i + 1}</span>
                    </div>
                  )}

                  {/* The glyph itself, no tinted chip behind it. The chip was
                      squeezing the icon down to a coloured smudge; at 23px with
                      air around it the drawing is legible again. */}
                  <div style={{ marginTop: wide ? 0 : 8, flexShrink: 0 }}>
                    <StepIcon step={step} size={23} colour={tone} />
                  </div>

                  {wide ? (
                    <>
                      <div style={{ display: 'flex', alignItems: 'baseline', gap: 9, flex: 1, minWidth: 0 }}>
                        <span style={{
                          fontFamily: 'Outfit,sans-serif', fontSize: 25, fontWeight: 700,
                          color: empty ? C.muted : C.text, lineHeight: 1, letterSpacing: '-0.5px',
                        }}>{queue.length}</span>
                        <span style={{
                          fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, fontWeight: 600,
                          color: empty ? C.muted : '#475569',
                        }}>{step.label}</span>
                        {flagText && (
                          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                            <span style={{ width: 5, height: 5, borderRadius: 3, background: C.red }}/>
                            <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 10.5, fontWeight: 700, color: C.red }}>{flagText}</span>
                          </span>
                        )}
                      </div>
                      <span style={{
                        fontFamily: 'DM Sans,sans-serif', fontSize: 10.5, fontWeight: 700,
                        color: '#A8B2C1', letterSpacing: 0.2, flexShrink: 0,
                      }}>{i + 1}</span>
                    </>
                  ) : (
                    <>
                      {/* The number is the card. */}
                      <div style={{
                        fontFamily: 'Outfit,sans-serif', fontSize: 25, fontWeight: 700,
                        color: empty ? C.muted : C.text, lineHeight: 1, marginTop: 10,
                        letterSpacing: '-0.5px',
                      }}>{queue.length}</div>
                      <div style={{
                        fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 600,
                        color: empty ? C.muted : '#475569', marginTop: 3, textAlign: 'left', lineHeight: 1.2,
                      }}>{step.label}</div>
                      {/* Pinned to the bottom so a card with a warning is the
                          same height as one without. */}
                      {flagText && (
                        <div style={{
                          position: 'absolute', left: 13, bottom: 10,
                          display: 'flex', alignItems: 'center', gap: 4,
                        }}>
                          <span style={{ width: 5, height: 5, borderRadius: 3, background: C.red, flexShrink: 0 }}/>
                          <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 10, fontWeight: 700, color: C.red }}>
                            {flagText}
                          </span>
                        </div>
                      )}
                    </>
                  )}
                </button>
              );
            })}
          </div>

          {/* ── Browse ─────────────────────────────────────────────────────
              Split off from the steps rather than sitting as two more cells in
              the same grid. They are not steps, they do not carry a position in
              the process, and dashing their borders to say so was a hack. A
              section of their own says it properly. */}
          <div style={{
            fontFamily: 'DM Sans,sans-serif', fontSize: 10.5, fontWeight: 700,
            color: '#A8B2C1', textTransform: 'uppercase', letterSpacing: 0.9,
            margin: '22px 0 9px',
          }}>
            Browse
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            {[
              { key: 'orders',  label: 'All Orders',  view: 'orders',  count: siteOrders.length,
                icon: <><path d="M2.4 4h4.2v4.2H2.4zM2.4 9.9h4.2v4.2H2.4zM2.4 15.8h4.2v4.2H2.4z"/><path d="M8.4 5.1h13.2v2H8.4zM8.4 11h13.2v2H8.4zM8.4 16.9h13.2v2H8.4z" opacity=".55"/></> },
              { key: 'pallets', label: 'All Pallets', view: 'pallets', count: sitePallets.length,
                icon: <><path d="M2.8 2.8h8.1v8.1H2.8zM13.1 2.8h8.1v8.1h-8.1zM2.8 13.1h8.1v8.1H2.8zM13.1 13.1h8.1v8.1h-8.1z"/></> },
            ].map(b => (
              <button key={b.key}
                onClick={() => navigate('all_orders', { allOrdersQuery: '', allOrdersView: b.view })}
                style={{
                  cursor: 'pointer', background: '#fff', border: 'none', borderRadius: 16,
                  boxShadow: '0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.04)',
                  padding: '12px 13px', display: 'flex', alignItems: 'center', gap: 11,
                }}>
                <div style={{
                  width: 32, height: 32, borderRadius: 10, flexShrink: 0, background: '#F1F5F9',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="#64748B" stroke="none" aria-hidden="true">
                    {b.icon}
                  </svg>
                </div>
                <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                  <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 17, fontWeight: 700, color: C.text, lineHeight: 1 }}>
                    {b.count}
                  </div>
                  <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, fontWeight: 600, color: '#475569', marginTop: 3 }}>
                    {b.label}
                  </div>
                </div>
              </button>
            ))}
          </div>

          {/* Scan. Column B of the workbook, "Scan Label / VIEW (scan at any
              point)": it is not a step and it advances nothing, it answers
              "what is this pallet and where is it up to". The one dark surface
              on the screen, because it is the one thing an operator reaches for
              from anywhere. */}
          <button onClick={() => navigate('scan_pallet', { selectedOrder: null, selectedPallet: null, scanIntent: null })}
            style={{
              width: '100%', marginTop: 12, cursor: 'pointer',
              background: C.navBg, border: 'none', borderRadius: 16,
              padding: '15px 16px', display: 'flex', alignItems: 'center', gap: 13,
            }}>
            <div style={{
              width: 38, height: 38, borderRadius: 12, flexShrink: 0, background: 'rgba(255,255,255,0.12)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                <line x1="7" y1="12" x2="17" y2="12"/>
              </svg>
            </div>
            <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
              {/* Rev3, FDB-399: "Scan a pallet" became "Pallet/Order Search"
                  with the subtext "Scan or search any active order." The
                  screen behind it now does both. */}
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 15, fontWeight: 700, color: '#fff' }}>
                Pallet/Order Search
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: 'rgba(255,255,255,0.66)', marginTop: 2 }}>
                Scan or search any active order.
              </div>
            </div>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>

          {/* Rev3, FDB-307: a quick action reachable from home. "From the home
              screen it should request that the label is scanned and then starts
              the Incident/On hold process/form for the scanned pallet(s)." The
              scan screen reads scanIntent and hands the pallet to the form. */}
          <button onClick={() => navigate('scan_pallet', { selectedOrder: null, selectedPallet: null, scanIntent: 'incident' })}
            style={{
              width: '100%', marginTop: 10, cursor: 'pointer',
              background: '#fff', border: '1.5px solid #FDE68A', borderRadius: 16,
              padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 12,
            }}>
            <div style={{
              width: 34, height: 34, borderRadius: 11, flexShrink: 0, background: '#FEF3C7',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92400E" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </div>
            <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 14.5, fontWeight: 700, color: C.text }}>
                On Hold
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 2 }}>
                Scan a label to report a problem
              </div>
            </div>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
      </div>
    </div>
  );
};

// One order inside a step queue.
//
// Rev3, FDB-302: "We operate at the order level for all tasks. The toggle view
// with pallet breakdown per order should be removed from the initial list view of
// the steps ... Orders should just be a clickable card that opens the detail view."
//
// So a queue is a list of ORDER cards and nothing more. The card says how much of
// the order is still pending at this step and how much is complete, and a tap opens
// the order's whole-lot view (Order Detail), which is where the pallets live. The
// expandable pallet rows, "Show all N pallets" and "Open the whole lot" that used to
// hang off this card are gone, and so are the constants that sized them.
//
// A search that hits a pallet still has to explain why the card is in the list, so
// the matching pallet ids are named on the card instead of the card being expanded.
const MATCH_PREVIEW = 2;
const QueueOrderCard = ({ group, step, showPriority, query, onOpenOrder }) => {
  const here  = group.pallets.length;
  const total = orderPallets(group.order).length;
  // How much of the order is already past this step. At process in and process out
  // the whole lot has to clear before the status moves, so "6 of 20 complete" is the
  // number the operator is actually working towards.
  // "Complete" means past this step. It used to be everything not sitting here,
  // which counted a pallet still on the dock as done at Check In; with the word
  // "complete" (FDB-399) that would be plainly wrong.
  const stepNo = Math.max(...step.states.map(s => STATE_TO_STEP[s]));
  const done  = orderPallets(group.order).filter(p => STEP_OF(p) > stepNo).length;
  const held  = group.pallets.filter(isHeld).length;
  // Arrival drafts and printed-but-unattached labels belong to the two steps that
  // create them, so they only show there.
  const drafts = step && step.key === 'arrival'  ? draftsFor(group.order)    : 0;
  const labels = step && step.key === 'putaway'  ? labelsWaiting(group.order) : 0;
  const hits   = query ? group.pallets.filter(p => p.id.toLowerCase().indexOf(query) >= 0) : [];
  const Flag = ({ tone, children }) => (
    <span style={{
      background: tone === 'red' ? '#FEE2E2' : '#FEF3C7', color: tone === 'red' ? '#991B1B' : '#92400E',
      borderRadius: 6, padding: '2px 7px', fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
    }}>{children}</span>
  );

  return (
    <Card style={{ padding: 0, overflow: 'hidden', cursor: 'pointer' }} onClick={() => onOpenOrder(group.order)}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px' }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 15, fontWeight: 700, color: C.text }}>
              {lotText(group.order)}
            </span>
            {/* Which service this lot is for. The three streams take different
                forms at arrival and run in different chambers, so an operator
                working a mixed queue needs to know before they open it. */}
            <StreamBadge stream={group.order.stream} />
            {showPriority && <PriorityChip order={group.order} />}
          </div>
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
            {group.order.customer}
            {/* Irradiation is not one form. Which of the five it is decides what
                the arrival screen asks for, so it is named next to the customer. */}
            {subStreamLabel(group.order) ? ` · ${subStreamLabel(group.order)}` : ''}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 7, flexWrap: 'wrap' }}>
            {/* Rev3 wording, FDB-399: "x pallets here" is now "x pallets pending"
                and "x of y done" is now "x of y complete". */}
            <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, fontWeight: 700, color: C.text }}>
              {here} pallet{here !== 1 ? 's' : ''} pending
            </span>
            {/* Only worth saying when part of the lot has already moved on. */}
            {done > 0 && (
              <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>
                {done} of {total} complete
              </span>
            )}
          </div>
          {/* A lot the size of a truckload needs its progress visible without
              counting cards. One bar, filled by proportion. */}
          {total > 1 && (
            <div style={{ height: 4, borderRadius: 2, background: C.border, overflow: 'hidden', marginTop: 7 }}>
              <div style={{ width: `${(done / total) * 100}%`, height: '100%', borderRadius: 2, background: step ? step.colour : C.brand }}/>
            </div>
          )}
          {(held > 0 || drafts > 0 || labels > 0) && (
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 8 }}>
              {held > 0   && <Flag tone="red">{held} on hold</Flag>}
              {drafts > 0 && <Flag tone="amber">{drafts} draft{drafts !== 1 ? 's' : ''} saved</Flag>}
              {labels > 0 && <Flag tone="amber">{labels} label{labels !== 1 ? 's' : ''} to attach</Flag>}
            </div>
          )}
          {hits.length > 0 && (
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.brand, fontWeight: 600, marginTop: 7 }}>
              Matches {hits.slice(0, MATCH_PREVIEW).map(p => p.id).join(', ')}
              {hits.length > MATCH_PREVIEW ? ` and ${hits.length - MATCH_PREVIEW} more` : ''}
            </div>
          )}
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 8, flexShrink: 0 }}>
          <AgeChip order={group.order} />
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </div>
    </Card>
  );
};

// ── Stream filter and tabs (rev3, FDB-308 / FDB-301) ─────────────────────────
// "Add stream filtering for the process in/scheduled step in the view." Chips, one
// per stream the site runs. The picker opens on the stream chosen at sign-in, and a
// single-stream site has nothing to filter, so it draws nothing. The single-pick
// steps cannot offer "All": each stream has its own next order, so mixing them
// would put two "in action" orders on one screen.
const StreamFilter = ({ streams, value, onChange, allowAll }) => {
  if (streams.length < 2) return null;
  const opts = allowAll ? ['all', ...streams] : streams;
  return (
    <div style={{ display: 'flex', gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
      {opts.map(k => {
        const on = value === k;
        return (
          <button key={k} onClick={() => onChange(k)} style={{
            cursor: 'pointer', borderRadius: 999, padding: '7px 14px',
            fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, fontWeight: 700,
            background: on ? C.brand : '#fff', color: on ? '#fff' : C.text,
            border: on ? `1.5px solid ${C.brand}` : `1.5px solid ${C.border}`,
          }}>{k === 'all' ? 'All streams' : STREAM_LABEL[k]}</button>
        );
      })}
    </div>
  );
};

const PickTabs = ({ tabs, value, onChange }) => (
  <div style={{ display: 'flex', background: '#E7EBF1', borderRadius: 12, padding: 3, marginBottom: 12 }}>
    {tabs.map((t, i) => (
      <button key={t} onClick={() => onChange(i)} style={{
        flex: 1, cursor: 'pointer', border: 'none', borderRadius: 10, padding: '9px 6px',
        fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700,
        background: value === i ? '#fff' : 'transparent', color: value === i ? C.text : C.muted,
        boxShadow: value === i ? '0 1px 2px rgba(16,24,40,0.10)' : 'none',
      }}>{t}</button>
    ))}
  </div>
);

// ── Single-pick: the one order the schedule says is next ─────────────────────
// Rev3, FDB-301 / FDB-302. "An operator should be able to open this step and see
// the clear instruction to go to rack B or room B and grab the pallets. This full
// view display should be the standard for these single pick types." And what the
// card shows: "how many pallets, what status each pallet is, and where each pallet
// is in the warehouse."
//
// Any pallet inside the order can be picked at the operator's discretion, so every
// ready pallet is a row they can open; the order is not walked pallet by pallet.
// Once the order is fully scanned it leaves this step by itself (its pallets are no
// longer in pickStates) and the next order takes the card, which is step 5 of the
// notes: "the scanner now shows the operator the next order to pick".
const PICK_ROWS = 8;
const SinglePickNext = ({ step, order, stream, navigate }) => {
  const cfg = step.pick;
  const [showAll, setShowAll] = React.useState(false);
  if (!order) {
    return (
      <div style={{ textAlign: 'center', padding: '34px 16px', color: C.muted, fontFamily: 'DM Sans,sans-serif', fontSize: 13, lineHeight: 1.5 }}>
        {step.key === 'process_in'
          ? `Nothing is scheduled to process in${stream ? ` for ${STREAM_LABEL[stream]}` : ''} right now. Orders still waiting on the Business Central schedule are under Full schedule.`
          : `Nothing is released and waiting for dispatch${stream ? ` for ${STREAM_LABEL[stream]}` : ''} right now.`}
      </div>
    );
  }
  const all     = orderPallets(order);
  const rows    = all.map(p => ({ p, s: pickStatus(p, step) }))
                     .sort((a, b) => (b.s.work - a.s.work) || a.p.id.localeCompare(b.p.id));
  const ready   = rows.filter(r => r.s.work).map(r => r.p);
  const shown   = showAll ? rows : rows.slice(0, PICK_ROWS);
  const gate    = lotGate(order, cfg.doneStep);
  const zones   = zonesFor(ready);
  const verbing = cfg.instruction === 'load' ? 'load' : 'pick';
  const tone = {
    green: { bg: '#DCFCE7', fg: '#15803D' }, red: { bg: '#FEE2E2', fg: '#991B1B' },
    done:  { bg: '#E0E7FF', fg: '#3730A3' }, muted: { bg: '#E2E8F0', fg: '#475569' },
  };
  const openPallet = p => {
    const s = pickStatus(p, step);
    const go = s.work ? stepOpens(step, p, order) : { screen: 'pallet_detail' };
    navigate(go.screen, {
      selectedOrder: order, selectedPallet: p, palletId: p.id,
      palletBack: 'task_queue', orderBack: 'task_queue', queueBack: true,
      binPhase: 'pre_treatment', binMoveOnly: false,
      ...(go.extras || {}),
    });
  };

  return (
    <>
      <Card style={{ padding: 0, overflow: 'hidden', border: `1.5px solid ${step.colour}` }}>
        <div style={{ background: `${step.colour}14`, padding: '8px 14px', display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ width: 8, height: 8, borderRadius: 4, background: step.colour }}/>
          <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: step.colour, textTransform: 'uppercase', letterSpacing: 0.7 }}>
            Next up · in action
          </span>
        </div>

        <div style={{ padding: '14px 14px 4px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 17, fontWeight: 700, color: C.text }}>{lotText(order)}</span>
            <StreamBadge stream={order.stream} />
            {priorityVisibleAt(step.key) && <PriorityChip order={order} current />}
          </div>
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.muted, marginTop: 3 }}>
            {order.customer}{subStreamLabel(order) ? ` · ${subStreamLabel(order)}` : ''}
          </div>

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginTop: 12 }}>
            <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, color: C.muted }}>{cfg.doneLabel}</span>
            <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 700, color: C.text }}>{gate.done} of {gate.total}</span>
          </div>
          <div style={{ height: 5, borderRadius: 3, background: C.border, overflow: 'hidden', marginTop: 6 }}>
            <div style={{ width: `${(gate.done / Math.max(1, gate.total)) * 100}%`, height: '100%', borderRadius: 3, background: gate.complete ? C.green : step.colour }}/>
          </div>
        </div>

        {/* The instruction. This is the line the card exists to carry. */}
        <div style={{
          margin: '12px 14px 4px', background: '#FFFBEB', border: '1px solid #FDE68A',
          borderRadius: 12, padding: '11px 13px', display: 'flex', gap: 10, alignItems: 'flex-start',
        }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92400E" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
            <path d="M12 2a7 7 0 0 0-7 7c0 5.1 7 13 7 13s7-7.9 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/>
          </svg>
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, color: '#78350F', lineHeight: 1.5 }}>
            {ready.length === 0
              ? <>No pallet on this order is {step.key === 'dispatch' ? 'ready to load' : 'ready to pick'} at the moment.</>
              : <>
                  <strong>{zones.length ? `Go to ${zones.join(' and ')}` : 'Find the pallets'}</strong>
                  {` and ${verbing} the ${ready.length} pallet${ready.length !== 1 ? 's' : ''} marked ${step.key === 'dispatch' ? 'Ready to load' : 'Ready to pick'}. Any pallet on this order can go first.`}
                </>}
          </div>
        </div>

        <div style={{ padding: '10px 12px 4px' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {shown.map(({ p, s }) => (
              <div key={p.id} onClick={() => openPallet(p)} style={{
                background: s.work ? '#fff' : '#F8FAFC', border: `1px solid ${s.work ? C.border : '#EEF1F5'}`,
                borderRadius: 12, padding: '10px 12px', cursor: 'pointer', opacity: s.work ? 1 : 0.85,
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 14, fontWeight: 700, color: C.text }}>{p.id}</span>
                  <span style={{
                    background: tone[s.tone].bg, color: tone[s.tone].fg, borderRadius: 6, padding: '3px 8px',
                    fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, letterSpacing: 0.3, whiteSpace: 'nowrap',
                  }}>{s.text}</span>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 5, fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>
                  <span>{binLabel(p)}</span>
                  <span>{p.weight} kg · {palletCartons(p)} cartons</span>
                </div>
              </div>
            ))}
          </div>
          {rows.length > PICK_ROWS && (
            <button onClick={() => setShowAll(!showAll)} style={{
              width: '100%', marginTop: 8, padding: '8px 0', borderRadius: 10,
              border: `1px solid ${C.border}`, background: '#fff', cursor: 'pointer',
              fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700, color: C.brand,
            }}>{showAll ? 'Show fewer' : `Show all ${rows.length} pallets →`}</button>
          )}
        </div>

        <button onClick={() => navigate('order_detail', { selectedOrder: order, orderBack: 'task_queue' })} style={{
          width: '100%', padding: '11px 0 13px', border: 'none', background: 'transparent', cursor: 'pointer',
          fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700, color: C.muted,
        }}>Open the whole lot →</button>
      </Card>
    </>
  );
};

// ── Single-pick: the full schedule, read only ────────────────────────────────
// "Having an option to see the full schedule (as in see all orders and their
// priorities in this step) is also helpful but secondary to the main task ...
// However, no actions for scanning in this view." So a row opens the order to look
// at it and never a scan.
const SingleSchedule = ({ step, orders, current, navigate }) => {
  const cfg = step.pick;
  return (
    <>
      {!orders.length && (
        <div style={{ textAlign: 'center', padding: '28px 16px', color: C.muted, fontFamily: 'DM Sans,sans-serif', fontSize: 13 }}>
          Nothing on the schedule.
        </div>
      )}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {orders.map(o => {
          const ps        = orderPallets(o);
          const scheduled = ps.some(p => cfg.pickStates.indexOf(p.state) >= 0);
          const gate      = lotGate(o, cfg.doneStep);
          const isCurrent = current && current.id === o.id;
          const status    = isCurrent ? { t: 'In action', bg: '#FEE2E2', fg: '#991B1B' }
                          : scheduled ? { t: step.key === 'dispatch' ? 'Ready' : 'Scheduled', bg: '#DCFCE7', fg: '#15803D' }
                          : null;
          return (
            <Card key={o.id} style={{ padding: '12px 14px', cursor: 'pointer' }}
              onClick={() => navigate('order_detail', { selectedOrder: o, orderBack: 'task_queue' })}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
                {priorityVisibleAt(step.key) && (scheduled || isCurrent) && <PriorityChip order={o} current={isCurrent} />}
                <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 15, fontWeight: 700, color: C.text }}>{lotText(o)}</span>
                <StreamBadge stream={o.stream} />
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 3 }}>{o.customer}</div>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, marginTop: 8 }}>
                {status ? <span style={{ background: status.bg, color: status.fg, borderRadius: 6, padding: '3px 8px', fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700 }}>{status.t}</span> : <span/>}
                <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>
                  {gate.done} of {gate.total} {step.key === 'dispatch' ? 'dispatched' : 'processed in'}
                </span>
              </div>
            </Card>
          );
        })}
      </div>
    </>
  );
};

// ── Task Queue: one step, only the pallets waiting on it ─────────────────────
// This is the screen the home rail exists to open. It holds nothing but the work
// of one step, which is the whole point of the 10 Sep note: "employees will
// struggle to focus on a specific task".
//
// Two kinds of step (rev3, FDB-301). A pick-any step (Arrival, Check In, Process
// Out, QA Review) is a list of order cards; any of them can be opened. A single-pick
// step (Process In, Dispatch) opens on the one order the schedule says is next, with
// the whole schedule one tab away.
//
// Rows are grouped by ORDER, never listed per pallet: a lot is trucked in, staged
// and run as a unit, and one lot on this demo carries 20 pallets.
const TaskQueueScreen = ({ navigate, appData }) => {
  const step   = stepByKey(appData.taskStep);
  const isBC   = step.owner === 'bc';
  const single = !!step.pick;
  const showPriority = step.showPriority && priorityVisibleAt(step.key);
  const streams = streamsAtSite(appData.site);
  // The stream is the one chosen at sign-in (FDB-308). No filter on the queue;
  // changing stream goes back through Change Site / Stream.
  const stream = appData.workStream || (single ? streams[0] : null);
  const [tab, setTab] = React.useState(0);
  const [query, setQuery] = React.useState('');
  const q = query.trim().toLowerCase();

  const all   = stepQueue(step, appData.site, stream);
  const queue = q ? all.filter(p => palletMatches(p, q)) : all;
  // Group to lots, then order the GROUPS - sorting pallets and grouping after
  // would scatter one lot down the list.
  const groups = [];
  queue.forEach(p => {
    let g = groups.find(x => x.order.id === p.order.id);
    if (!g) { g = { order: p.order, pallets: [] }; groups.push(g); }
    g.pallets.push(p);
  });
  // Everything is oldest first so a pallet booked in weeks ago cannot sink under
  // this morning's arrivals. The schedule order lives on the single-pick steps.
  groups.sort((a, b) => ageDays(b.order) - ageDays(a.order) || a.order.id.localeCompare(b.order.id));

  const next      = single ? pickOrders(step, appData.site, stream) : [];
  const scheduled = single ? scheduleOrders(step, appData.site, stream) : [];
  const schedShown = q ? scheduled.filter(o => orderMatches(o, q)) : scheduled;

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
      <StatusBar />
      <NavBar title={step.label} onBack={() => navigate('dashboard')} showLogo={false} />
      <div style={{ flex: 1, overflow: 'auto', padding: '16px 16px 20px' }}>
        {/* Header: what this step is, how much of it there is.
            The count is the whole step, not the filtered view: it is what the
            tile on home said, and a search should not appear to change how much
            work exists. */}
        <Card style={{ padding: '14px 16px', marginBottom: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 42, height: 42, borderRadius: 12, background: `${step.colour}14`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <StepIcon step={step} size={23} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 17, fontWeight: 700, color: C.text }}>{step.label}</div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 1 }}>{step.hint}</div>
            </div>
            <div style={{ textAlign: 'right', flexShrink: 0 }}>
              <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 22, fontWeight: 700, color: C.text }}>{all.length}</div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 10.5, fontWeight: 600, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.4 }}>pallets</div>
            </div>
          </div>
        </Card>

        {/* A BC step has no scan behind it. Saying so here stops the queue from
            reading as a to-do list the operator is failing to clear. */}
        {isBC && (
          <div style={{
            background: '#F8FAFC', border: `1px dashed ${C.border}`, borderRadius: 12,
            padding: '10px 12px', marginBottom: 12,
            fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, lineHeight: 1.45,
          }}>
            <strong style={{ color: C.text }}>Business Central owns this step.</strong> Nothing here is a
            scan - the app is waiting for Business Central to move these pallets on.
          </div>
        )}

        {single && <PickTabs tabs={step.pick.tabs} value={tab} onChange={setTab} />}

        {single && tab === 0 && (
          <SinglePickNext step={step} order={next[0] || null} stream={stream} navigate={navigate} />
        )}

        {single && tab === 1 && (
          <>
            <SearchBar query={query} setQuery={setQuery} navigate={navigate}
              placeholder={`Search ${step.label.toLowerCase()}: lot, pallet or product…`} />
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 10 }}>
              {schedShown.length} order{schedShown.length !== 1 ? 's' : ''}
              {q && scheduled.length !== schedShown.length ? ` of ${scheduled.length}` : ''}
            </div>
            <SingleSchedule step={step} orders={schedShown} current={next[0] || null} navigate={navigate} />
          </>
        )}

        {!single && (
          <>
            {/* Narrows this step, not the yard. The placeholder says so, because a
                search box that silently searched only part of the data would be a
                trap. */}
            <SearchBar query={query} setQuery={setQuery} navigate={navigate}
              placeholder={`Search ${step.label.toLowerCase()}: lot, pallet or product…`} />

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: C.text }}>
                {groups.length} order{groups.length !== 1 ? 's' : ''} · {queue.length} pallet{queue.length !== 1 ? 's' : ''}
                {q && all.length !== queue.length ? ` of ${all.length}` : ''}
              </div>
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>Longest waiting first</div>
            </div>

            {!groups.length && (
              <div style={{ textAlign: 'center', padding: '34px 16px', color: C.muted, fontFamily: 'DM Sans,sans-serif', fontSize: 13 }}>
                {q
                  ? `Nothing on ${step.label} matches "${query.trim()}".`
                  : `Nothing is waiting on ${step.label.toLowerCase()} right now.`}
              </div>
            )}

            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {groups.map(g => (
                <QueueOrderCard key={g.order.id} group={g} step={step} showPriority={showPriority} query={q}
                  onOpenOrder={o => navigate('order_detail', { selectedOrder: o, orderBack: 'task_queue' })} />
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// ── All Orders: the old home screen, kept as the last tile ───────────────────
// Ben, 2026-09-10: "Maybe keep the option for all orders view as a final icon on
// the screen." This is that view, unchanged in what it can do - orders or
// pallets, the status filters, the search - and moved one tap off home so it is
// a thing you go and get rather than the thing you are handed.
//
// One deletion: the priority number is gone from the order card, and so is
// sorting by it. "The priority will only be shown during the scheduling step."
const AllOrdersScreen = ({ navigate, appData }) => {
  const [sort, setSort] = React.useState('date');
  const [filter, setFilter] = React.useState('all');
  const [query, setQuery] = React.useState(appData.allOrdersQuery || '');
  // Which of the two levels this is. "Orders" = customer requests (ORD-…);
  // "Pallets" = the physical units the workflow actually runs on (PLT-…).
  // Fixed by the tile that opened the screen, not switchable here: an in-screen
  // toggle made one screen pretend to be two, and home already asked the
  // question. One screen, two entrances.
  const view = appData.allOrdersView === 'pallets' ? 'pallets' : 'orders';
  const isPallets = view === 'pallets';

  // Filters are Steritech's own statuses, plus Hold. The workbook has no hold
  // status, but a held pallet is exactly the thing an operator goes looking for,
  // so it stays as its own chip.
  const filters = [
    { id: 'all',         label: 'All' },
    { id: 'Created',     label: 'Created' },
    { id: 'Received',    label: 'Received' },
    { id: 'Processing',  label: 'Processing' },
    { id: 'QA Review',   label: 'QA Review' },
    { id: 'Released',    label: 'Released' },
    { id: 'Dispatched',  label: 'Dispatched' },
    { id: 'hold',        label: 'Hold' },
  ];
  // Everything on this screen is one site's yard, the site chosen at sign-in.
  const sitePallets = palletsAtSite(appData.site);
  const siteOrders  = ordersAtSite(appData.site);
  // Counted by status, so a KPI and a chip can never disagree.
  const countStatus = st => sitePallets.filter(p => steritechStatus(p.state) === st).length;
  const q = query.trim().toLowerCase();

  // One predicate, applied to a pallet state - shared by both views so the
  // filter chips mean exactly the same thing whichever list you are looking at.
  const stateMatches = (state) => {
    const status = steritechStatus(state);
    if (filter === 'all') return true;
    if (filter === 'hold') return state === 'QA_HOLD';
    return status === filter;
  };

  // ── Orders view: filter/search at order level, state derived from pallets ──
  const filteredOrders = siteOrders.filter(o => {
    // An order matches a filter when ANY of its pallets does. Matching on the
    // order's rolled-up state would hide an order with 8 pallets awaiting QA
    // just because one pallet is still at Received.
    if (!orderPallets(o).some(p => stateMatches(p.state))) return false;
    if (!q) return true;
    // Searching a pallet barcode, a product, a PO or a lot should all surface the
    // order. Lot needs no clause of its own any more - it is the order id.
    return orderMatches(o, q);
  });
  const sortedOrders = [...filteredOrders].sort((a, b) => {
    if (sort === 'status') return orderStep(a) - orderStep(b);
    // Longest waiting first, because the 10 Sep note is about lots that sit for
    // weeks. Newest-first buried exactly those.
    if (sort === 'oldest') return ageDays(b) - ageDays(a);
    return b.id.localeCompare(a.id);
  });

  // ── Pallets view: every physical pallet, each judged on its own state ──
  const filteredPallets = sitePallets.filter(p => {
    if (!stateMatches(p.state)) return false;
    if (!q) return true;
    return palletMatches(p, q);
  });
  const sortedPallets = [...filteredPallets].sort((a, b) => {
    if (sort === 'status') return STEP_OF(a) - STEP_OF(b);
    if (sort === 'oldest') return ageDays(b.order) - ageDays(a.order);
    return b.id.localeCompare(a.id);
  });

  // Under a filter, count only the pallets that actually match it. Counting every
  // pallet of a matching order made this header disagree with the KPI above it:
  // "Released" would read "28 pallets" when only 13 pallets were released.
  const palletsInView = isPallets
    ? sortedPallets.length
    : sortedOrders.reduce((s, o) => s + orderPallets(o).filter(p => stateMatches(p.state)).length, 0);
  // Name what is being counted, so the number cannot be mistaken for a total.
  // Hold reads as a suffix - "2 pallets on hold", not "2 on hold pallets".
  const filterPre  = filter === 'all' || filter === 'hold' ? '' : filter.toLowerCase() + ' ';
  const filterPost = filter === 'hold' ? ' on hold' : '';
  const countLine  = (n, noun) => `${n} ${filterPre}${noun}${n !== 1 ? 's' : ''}${filterPost}`;

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
      <StatusBar />
      <NavBar title={isPallets ? 'All Pallets' : 'All Orders'} onBack={() => navigate('dashboard')} showLogo={false} />
      <div style={{ flex: 1, overflow: 'auto', padding: '16px 16px 8px' }}>
        <SearchBar query={query} setQuery={setQuery} navigate={navigate} />

        <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
          {/* Counts are PALLETS, not orders - the pallet is the unit of work. */}
          <KPI label="Received" value={countStatus('Received')} color={C.brand} />
          <KPI label="Processing" value={countStatus('Processing')} color={C.amber} />
          <KPI label="QA Review" value={countStatus('QA Review')} color={C.teal || '#0F766E'} />
        </div>

        <div style={{ display: 'flex', gap: 6, marginBottom: 12, overflowX: 'auto', paddingBottom: 4 }}>
          {filters.map(f => (
            <button key={f.id} onClick={() => setFilter(f.id)} style={{
              padding: '7px 13px', borderRadius: 999,
              border: filter === f.id ? `1.5px solid ${C.brand}` : `1px solid ${C.border}`,
              background: filter === f.id ? '#EEF2FF' : '#fff',
              fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 600,
              color: filter === f.id ? C.brand : C.muted, cursor: 'pointer', whiteSpace: 'nowrap',
            }}>{f.label}</button>
          ))}
        </div>

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: C.text }}>
            {isPallets
              ? countLine(sortedPallets.length, 'pallet')
              : `${sortedOrders.length} order${sortedOrders.length !== 1 ? 's' : ''} · ${countLine(palletsInView, 'pallet')}`}
          </div>
          <select value={sort} onChange={e => setSort(e.target.value)} style={{
            padding: '6px 10px', borderRadius: 8, border: `1px solid ${C.border}`,
            fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.text, background: '#fff', cursor: 'pointer',
          }}>
            <option value="date">Sort: Newest</option>
            <option value="oldest">Sort: Longest waiting</option>
            <option value="status">Sort: Status</option>
            {/* No "Sort: Priority". Sorting by a number the screen is not allowed
                to show would be a hidden ordering nobody can check. */}
          </select>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, paddingBottom: 16 }}>
          {/* ── ORDERS VIEW: one card per customer request ────────────────── */}
          {!isPallets && sortedOrders.map(order => {
            const oState   = orderState(order);
            const pallets  = orderPallets(order);
            const released = palletsPastQA(order);
            return (
              <Card key={order.id} style={{ padding: '14px 16px', cursor: 'pointer' }}
                onClick={() => navigate('order_detail', { selectedOrder: order, orderBack: 'all_orders' })}>
                {/* Commodity is deliberately NOT shown here. An order can carry dozens
                    of different commodities, so any order-level summary is either noise
                    or a half-truth. Commodity belongs on the pallet, which is where the
                    operator actually handles it. */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                  <div>
                    {/* One identifier, not two. The heading IS the lot number -
                        they are the same value - so a separate lot line under it
                        printed the same string twice. */}
                    <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 16, fontWeight: 700, color: C.text }}>{lotText(order)}</div>
                    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 2 }}>{order.customer}</div>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                    <StreamBadge stream={order.stream} />
                    {/* Priority chip removed - scheduling step only, 10 Sep note.
                        How long the lot has been sitting replaces it, which is the
                        thing the covering email actually asked to be visible. */}
                    <AgeChip order={order} />
                  </div>
                </div>
                {(oState === 'QA_RELEASED' || oState === 'QA_HOLD') && (
                  <div style={{
                    display: 'inline-flex', alignItems: 'center', gap: 5, marginBottom: 10,
                    padding: '3px 9px', borderRadius: 999,
                    background: oState === 'QA_HOLD' ? '#FEF2F2' : '#ECFDF5',
                    color: oState === 'QA_HOLD' ? '#B91C1C' : '#15803D',
                    fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
                  }}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
                    </svg>
                    Returned by QA
                  </div>
                )}
                {/* Deliberately minimal. The badge already says where the order is
                    stuck, and the per-state pallet breakdown lives on the order
                    detail where there is room to group it. Repeating either here
                    just makes the list harder to scan. */}
                <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 8, display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>
                    {pallets.length} pallet{pallets.length !== 1 ? 's' : ''}
                    {` · ${orderSteritechStatus(order)}`}
                    {released > 0 && ` · ${released} released`}
                  </span>
                  <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.text, fontWeight: 600 }}>
                    {order.date}
                  </span>
                </div>
              </Card>
            );
          })}

          {/* ── PALLETS VIEW: one card per physical pallet = one workflow run ── */}
          {isPallets && sortedPallets.map(p => {
            const order = p.order;
            return (
              <Card key={p.id} style={{ padding: '14px 16px', cursor: 'pointer' }}
                onClick={() => navigate('pallet_detail', { selectedOrder: order, selectedPallet: p, palletId: p.id, palletBack: 'all_orders', queueBack: false })}>
                {/* No commodity here either. Every pallet on an order usually carries
                    the same thing, so the name just repeats down the list, and a
                    multi-commodity pallet only gets a "+N more" half-truth. A pallet
                    is found by its id, bin or order - the contents are one tap away
                    on Pallet Detail. */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                  <div>
                    <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 16, fontWeight: 700, color: C.text }}>{p.id}</div>
                    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 2 }}>
                      {order.id} · {order.customer}
                    </div>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                    <Badge state={p.state} />
                    <StreamBadge stream={order.stream} />
                  </div>
                </div>
                <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 8, display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>
                    {binLabel(p)} · {p.weight} kg
                  </span>
                  <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.text, fontWeight: 600 }}>
                    {order.date}
                  </span>
                </div>
              </Card>
            );
          })}

          {((!isPallets && !sortedOrders.length) || (isPallets && !sortedPallets.length)) && (
            <div style={{
              textAlign: 'center', padding: '32px 16px', color: C.muted,
              fontFamily: 'DM Sans,sans-serif', fontSize: 13,
            }}>
              Nothing matches this filter.
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ── Order Detail (employee) ───────────────────
// Row 2 of the 19 Aug workbook, in order, with the action the sheet pairs with
// each one. These six are Steritech's own statuses. An earlier version of this
// timeline used eight step names of our own invention (In Storage, Staged, In
// Treatment, Processed, Packed), which read plausibly but matched nothing the
// client had written down.
//
// The internal pallet states are finer grained than this on purpose: the app has
// to tell a staged pallet from one already in a chamber to know which screen to
// open. Those states stay, and STERITECH_STATUS is what folds them onto these
// six for display.
const TIMELINE_STEPS = [
  { key: 'created',    label: 'Created',    desc: 'Customer submitted the request in the portal', owner: 'Portal' },
  { key: 'received',   label: 'Received',   desc: 'Booked in on arrival; the label prints, then the pallet is stored' },
  { key: 'processing', label: 'Processing', desc: 'Processed in per the schedule' },
  { key: 'qa_review',  label: 'QA Review',  desc: 'Whole order processed out, waiting on QA in Business Central' },
  { key: 'released',   label: 'Released',   desc: 'QA review complete', owner: 'BC' },
  { key: 'dispatched', label: 'Dispatched', desc: 'Pallet loaded and dispatched from site' },
];
// Where a pallet sits on those six. Driven by the status map, so the timeline can
// never drift out of step with the status shown beside it.
const STATUS_ORDER = TIMELINE_STEPS.map(t => t.label);
const statusIndex  = state => Math.max(1, STATUS_ORDER.indexOf(steritechStatus(state)) + 1);

// ── Pallet list building blocks (shared by Order Detail) ─────────────────────
// One row = one pallet = one workflow instance.
const PalletRowCard = ({ pallet, onOpen }) => {
  const pStep = STEP_OF(pallet);
  return (
    <Card style={{ padding: '12px 14px', cursor: 'pointer' }} onClick={() => onOpen(pallet)}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.brand} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/>
          </svg>
          <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 14.5, fontWeight: 700, color: C.text }}>{pallet.id}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
          {/* Flags that belong to the pallet and not to its state: a hold or
              damage report from the floor (FDB-307), an arrival draft waiting on
              QA to create a product (FDB-303), a label printed but not attached
              yet (FDB-305). */}
          {isHeld(pallet) && <Badge state="QA_HOLD" label={holdLabel(pallet)} />}
          {draftFor(pallet) && pallet.state === 'ARRIVED' && (
            <span style={{ background: '#FEF3C7', color: '#92400E', borderRadius: 6, padding: '3px 8px', fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, letterSpacing: 0.4 }}>DRAFT</span>
          )}
          {LABELS_WAITING.has(pallet.id) && pallet.state === 'RECEIVED' && (
            <span style={{ background: '#FEF3C7', color: '#92400E', borderRadius: 6, padding: '3px 8px', fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, letterSpacing: 0.4 }}>LABEL TO ATTACH</span>
          )}
          <Badge state={pallet.state} />
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 3, marginBottom: 8 }}>
        {TIMELINE_STEPS.map((t, i) => (
          <div key={t.key} style={{ flex: 1, height: 3, borderRadius: 2, background: i < statusIndex(pallet.state) ? C.brand : C.border }}/>
        ))}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>
        {/* The badge above already carries the status, so this line is location
            and contents only. */}
        <span>{binLabel(pallet)}</span>
        <span>{pallet.weight} kg · {palletCartons(pallet)} cartons</span>
      </div>
    </Card>
  );
};

// Pallets sharing a state, collapsed to a preview so a 20-pallet order does not
// turn into an endless scroll. Each group opens on demand.
const PALLET_PREVIEW = 4;
const PalletGroupSection = ({ group, onOpen }) => {
  const [open, setOpen] = React.useState(false);
  const overflow = group.pallets.length - PALLET_PREVIEW;
  const shown = open ? group.pallets : group.pallets.slice(0, PALLET_PREVIEW);
  const b = BADGE_MAP[group.state] || { bg: '#E2E8F0', color: '#475569' };
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
        <span style={{ width: 7, height: 7, borderRadius: 4, background: b.color }}/>
        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700, color: C.text, letterSpacing: 0.3 }}>
          {group.label || stateLabel(group.state)}
        </span>
        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>
          {group.pallets.length} pallet{group.pallets.length !== 1 ? 's' : ''}
        </span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {shown.map(p => <PalletRowCard key={p.id} pallet={p} onOpen={onOpen} />)}
      </div>
      {overflow > 0 && (
        <button onClick={() => setOpen(!open)} style={{
          width: '100%', marginTop: 8, padding: '8px 0', borderRadius: 10,
          border: `1px solid ${C.border}`, background: '#fff', cursor: 'pointer',
          fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700, color: C.brand,
        }}>
          {open ? 'Show less' : `Show all ${group.pallets.length} →`}
        </button>
      )}
    </div>
  );
};


// Next action for a single PALLET. The workflow instance lives on the pallet, so
// this is keyed off pallet.state - never off the order. The order is still passed
// in because ONE rule is lot-wide: process out waits for the whole lot to be in.
//
// There is no role argument. The scanner belongs to the operator: QA reviews in
// Business Central on a desktop and has no scan anywhere in this run.
const palletAction = (pallet, order) => {
  // Column M is "QA review (BC operation)" with Scanner Data Fields = N/A, so
  // nothing is captured there. The operator gets a read-only view of the outcome.
  //
  // Two labels, because there are two things to look at. Once the lot is out,
  // there is a QA outcome to read. Before that QA has not started, and calling it
  // "View QA Review" promised a review that did not exist yet. The screen behind
  // is the same either way; only the promise changes.
  const qaLabel = lotAllProcessedOut(order) ? 'View QA Review →' : 'Waiting on the Lot →';
  // A pallet the floor has put on hold or flagged as damaged goes nowhere until
  // the flag is cleared (rev3, FDB-307). The pallet screen says why.
  if (isHeld(pallet)) return null;
  switch (pallet.state) {
    case 'ARRIVED':                return { label: 'Start Arrival →',      screen: 'receiving_form' };
    case 'RECEIVED':               return { label: 'Check In and Store →', screen: 'scan_bin' };
    // Scheduling is Business Central's and does not gate the scan: a stored pallet
    // can go to Process In without waiting on it.
    case 'IN_STORAGE_UNPROCESSED': return { label: 'Process In →',         screen: 'process_in' };
    case 'STAGED':                 return { label: 'Process In →',         screen: 'process_in' };
    // Held until every pallet on the lot is in - see lotAllProcessedIn.
    case 'IN_TREATMENT':           return lotAllProcessedIn(order)
                                     ? { label: 'Process Out →',       screen: 'process_out' } : null;
    case 'PROCESS_OUT':            return { label: qaLabel,                      screen: 'qa_status' };
    case 'IN_STORAGE_PROCESSED':   return { label: qaLabel,                      screen: 'qa_status' };
    // Straight to column N. Packing is not a step on this sheet.
    case 'QA_RELEASED':            return { label: 'Dispatch →',            screen: 'dispatch' };
    case 'QA_HOLD':                return { label: 'View QA Hold Details →',     screen: 'qa_hold', extras: { pdrReference: 'PDR-2026-007' } };
    default:                       return null;
  }
};
