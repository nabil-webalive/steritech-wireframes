<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SteriScan - Steritech Warehouse App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0F1623; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; }
  input, select, button, textarea { font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #4F6AF5; outline-offset: 1px; }
  ::-webkit-scrollbar { width: 0; }

  #phone-shell {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 2px #2A2F45, 0 0 0 8px #1A1F30, 0 30px 80px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  #app-root { width: 100%; height: 100%; overflow: hidden; }

  .screen-enter {
    animation: slideIn 0.22s cubic-bezier(0.4,0,0.2,1) both;
  }
  @keyframes slideIn {
    from { transform: translateX(32px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }

  #tweaks-panel {
    position: fixed; bottom: 20px; right: 20px;
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18); width: 220px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    display: none; z-index: 9999;
  }
  #tweaks-panel h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: #1C1917; }
  #tweaks-panel label { font-size: 11px; font-weight: 700; color: #78716C; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
  #tweaks-panel select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1.5px solid #E7E5E4; margin-bottom: 10px; font-family: inherit; font-size: 13px; }
  #tweaks-panel .close-btn { width: 100%; padding: 7px; border-radius: 8px; background: #F5F7FA; border: 1px solid #E7E5E4; cursor: pointer; font-size: 12px; color: #78716C; }
</style>
</head>
<body>
<div id="phone-shell">
  <div id="app-root"></div>
</div>

<div id="tweaks-panel">
  <h3>Tweaks</h3>
  <label>Jump to Screen</label>
  <select id="tweak-screen">
    <option value="">- choose -</option>
    <option value="splash">Splash</option>
    <option value="dashboard">Dashboard</option>
    <option value="order_detail">Order Detail (ORD - pallet list)</option>
    <option value="pallet_detail">Pallet Detail (PLT - workflow)</option>
    <option value="scan_pallet">Scan Pallet (after Dashboard)</option>
    <option value="scan_bin">Scan Bin Location</option>
    <option value="summary">Summary</option>
    <option value="receiving_form">Arrival Form (product-line matching)</option>
    <option value="print_labels">Print Pallet Labels</option>
    <option value="process_in">Process In</option>
    <option value="process_out">Process Out</option>
    <option value="in_storage_processed">In Storage - Processed</option>
    <option value="qa_status">QA Status</option>
    <option value="packing">Packing</option>
    <option value="qa_hold">QA Hold</option>
    <option value="dispatch">Dispatch</option>
    <option value="success">Success Screen</option>
    <option value="fail">Fail / Error Screen</option>
    <option value="stream_error">Stream Error</option>
    <option value="supervisor_pin">Supervisor PIN</option>
    <option value="override_confirm">Override Confirm</option>
  </select>
  <label>Service Stream</label>
  <select id="tweak-stream">
    <option value="irradiation">Irradiation</option>
    <option value="eto">EtO</option>
    <option value="packing">Packing</option>
  </select>
  <button class="close-btn" id="tweaks-close">Close</button>
</div>

// ─────────────────────────────────

        <path d="M20 3.5v4a2 2 0 0 0 0-4z" fill="white" opacity=".4"/>
      </svg>

// ── Badge ─────────────────────────────────────
// One badge per internal state, but every LABEL is one of Steritech's six
// statuses from the 19 Aug workbook. Two internal states can share a label on
// purpose: IN_STORAGE_UNPROCESSED and STAGED are both Received as far as the
// client's status model is concerned, and the app tells them apart internally to
// know which screen to open. Processing starts at the process-in scan, so a
// staged pallet has not reached it yet.
//
// QA_HOLD is the one addition. The workbook has no hold status, but a held pallet
// has to be findable in a list, so it reads QA Review with the hold called out.
const BADGE_MAP = {
  ARRIVED:                { bg: '#F1F5F9', color: '#64748B', label: 'CREATED' },
  RECEIVED:               { bg: '#E2E8F0', color: '#475569', label: 'RECEIVED' },
  IN_STORAGE_UNPROCESSED: { bg: '#E2E8F0', color: '#475569', label: 'RECEIVED' },
  STAGED:                 { bg: '#E2E8F0', color: '#475569', label: 'RECEIVED' },
  IN_TREATMENT:           { bg: '#FEF3C7', color: '#92400E', label: 'PROCESSING' },
  PROCESS_OUT:            { bg: '#FEF3C7', color: '#92400E', label: 'QA REVIEW' },
  IN_STORAGE_PROCESSED:   { bg: '#FEF3C7', color: '#92400E', label: 'QA REVIEW' },
  QA_HOLD:                { bg: '#FEE2E2', color: '#991B1B', label: 'QA REVIEW - HOLD' },
  QA_RELEASED:            { bg: '#CCFBF1', color: '#0F766E', label: 'RELEASED' },
  SHIPPED:                { bg: '#DCFCE7', color: '#15803D', label: 'DISPATCHED' },
};

const Badge = ({ state, label }) => {
  const s = BADGE_MAP[state] || { bg: '#E2E8F0', color: '#555' };
  const text = label || s.label || state.replace(/_/g, ' ');
  return (
    <span style={{
      background: s.bg, color: s.color,
      borderRadius: 6, padding: '3px 8px',
      fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
      letterSpacing: '0.7px', display: 'inline-block',
    }}>{text}</span>
  );
};

const StreamBadge = ({ stream }) => {
  const map = {
    irradiation: { bg: '#EEF2FF', color: '#4338CA', label: 'IRRADIATION' },
    eto:         { bg: '#FFF7ED', color: '#C2410C', label: 'EtO' },
    packing:     { bg: '#F0FDF4', color: '#15803D', label: 'PACKING' },
  };
  const s = map[stream] || { bg: '#E2E8F0', color: '#555', label: stream };
  return (
    <span style={{
      background: s.bg, color: s.color,
      borderRadius: 6, padding: '3px 8px',
      fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
      letterSpacing: '0.7px', display: 'inline-block',
    }}>{s.label}</span>
  );
};

// ── Scan Viewfinder ───────────────────────────
const ScanView = ({ onSimulate, label = 'Tap to Scan', onManual, manualLabel }) => {
  const [scanning, setScanning] = React.useState(false);
  const [lineY, setLineY] = React.useState(20);
  const dirRef = React.useRef(1);
  const rafRef = React.useRef(null);

  const animate = React.useCallback(() => {
    setLineY(y => {
      const next = y + dirRef.current * 2.5;
      if (next >= 155) dirRef.current = -1;
      if (next <= 10) dirRef.current = 1;
      return next;
    });
    rafRef.current = requestAnimationFrame(animate);
  }, []);

  const startScan = () => {
    if (scanning) return;
    setScanning(true);
    rafRef.current = requestAnimationFrame(animate);
    setTimeout(() => {
      cancelAnimationFrame(rafRef.current);
      setScanning(false);
      onSimulate && onSimulate();
    }, 1800);
  };

  React.useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, width: '100%' }}>
      <div onClick={startScan} style={{
        width: '100%', height: 260, borderRadius: 18,
        background: '#151A2D', position: 'relative', overflow: 'hidden', cursor: 'pointer',
        border: `2px solid ${scanning ? C.accent : '#2C3350'}`,
        transition: 'border-color 0.3s',
      }}>
        {/* Corner brackets */}
        {[[8,8,null,null],[8,null,null,8],[null,8,8,null],[null,null,8,8]].map(([t,l,b,r], i) => (
          <svg key={i} width="22" height="22" viewBox="0 0 22 22" fill="none"
            style={{ position:'absolute', top:t, left:l, bottom:b, right:r }}>
            {i===0 && <><path d="M4 18V4h14" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===1 && <><path d="M18 18V4H4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===2 && <><path d="M4 4v14h14" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===3 && <><path d="M18 4v14H4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
          </svg>
        ))}
        {scanning ? (
          <div style={{
            position:'absolute', left:16, right:16,
            top: lineY, height: 2,
            background: 'rgba(79,106,245,0.95)',
            boxShadow: '0 0 10px 2px rgba(79,106,245,0.6)',
            borderRadius: 1,
          }}/>
        ) : (
          <div style={{
            position:'absolute', inset:0, display:'flex',
            flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10,
          }}>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="1.5">
              <rect x="3" y="3" width="5" height="5" rx="1"/>
              <rect x="16" y="3" width="5" height="5" rx="1"/>
              <rect x="3" y="16" width="5" height="5" rx="1"/>

// SteriScan - Screens A: Auth, Dashboard, Scan, Summary, Receiving, InStorage
// ─────────────────────────────────────────────────────────────────────────────

// ═════════════════════════════════════════════════════════════════════════════
// DATA MODEL - three distinct levels. Do not conflate them.
// ═════════════════════════════════════════════════════════════════════════════
//   ORDER   ORD-2026-041      One customer request submitted from the portal.
//                             Has NO state of its own - it is derived from its
//                             pallets (see orderState below).
//   PALLET  PLT-2026-041-02   One physical pallet. Barcoded, scanned, binned.
//                             *** THE WORKFLOW RUNS HERE. *** Each pallet holds
//                             its own state and advances independently, so one
//                             order can have pallet 01 still RECEIVED while
//                             pallet 02 is already IN_TREATMENT.
//   ITEM    PRD-2201          One PRODUCT LINE on a pallet: a product reference
//                             plus its carton quantity. Steritech calls these
//                             "Product Lines" - pallet labels are printed per
//                             product line, and item-level capture hangs off them.
// ═════════════════════════════════════════════════════════════════════════════
// From Steritech's 2026-08-19 "Scan App Workflow" (IRR sheet), corrected by the
// client call on 2026-08-25:
//
//   LOT NUMBER   The SAME value as the order number. Ben: "lot numbers are order
//                numbers ... identical". Only the wording differs, and the other
//                sites already say "lot number", so Steritech took their word
//                rather than imposing its own. Which of the two names the app
//                should standardise on is still open and follows whatever
//                Business Central calls it, so the label reads "Lot / Order
//                Number" until that is settled.
//                Business Central issues it when the portal request reaches it,
//                so it exists before the pallet arrives and before any label is
//                printed. It groups the pallets of one order and they inherit it.
//   PRIORITY     A NUMBER in Steritech's schedule, not a High/Normal/Low band.
//                Steritech assigns it at the SCHEDULING step, never the customer,
//                and the customer must never see it. Released to the schedule at
//                a default of 50 so a job can be moved either way, then
//                re-ordered by hand as urgent work lands. Lower number is worked
//                first today, but Ben said that could be inverted, so the
//                direction is flagged rather than assumed. Ties are normal -
//                everything starts on 50 - and that is what "same priority
//                level" means.
//   SUB-STREAM   Irradiation is not one form. Fresh Produce Domestic, Fresh
//                Produce Export, Biosecurity/General and Medical each capture
//                different fields at arrival. Beehives is listed by Steritech
//                but still blank, so the app says so instead of inventing fields.
// ═════════════════════════════════════════════════════════════════════════════

// Steritech runs two status vocabularies side by side. The customer never sees
// Processing / QA Review / Released - all three read as "Received" to them, and
// only a QA release turns it into "Processed".
const STERITECH_STATUS = {
  ARRIVED:                'Created',
  RECEIVED:               'Received',
  IN_STORAGE_UNPROCESSED: 'Received',
  // Staged is still Received. The pallet has been put where the schedule wants
  // it, but nothing has been done to it and Process In is still the next scan.
  // Ben drew the line at the scan: "you scan one in, it moves into a processing
  // state." CUSTOMER_STATUS has always said Received here too.
  STAGED:                 'Received',
  IN_TREATMENT:           'Processing',
  PROCESS_OUT:            'QA Review',
  IN_STORAGE_PROCESSED:   'QA Review',
  QA_HOLD:                'QA Review',
  QA_RELEASED:            'Released',
  SHIPPED:                'Dispatched',
};
// The portal's vocabulary, kept here because the mapping is real and the API
// work needs it. It is deliberately NOT rendered anywhere in this app: the
// workbook lists Customer Status as a legend row explaining what the customer
// sees per column, while the scanner's own field list carries Steritech Status
// alone. This app is used by Steritech staff, so that is the only status shown.
const CUSTOMER_STATUS = {
  ARRIVED:                'Created',
  RECEIVED:               'Received',
  IN_STORAGE_UNPROCESSED: 'Received',
  STAGED:                 'Received',
  IN_TREATMENT:           'Received',
  PROCESS_OUT:            'Received',
  IN_STORAGE_PROCESSED:   'Received',
  QA_HOLD:                'Received',
  QA_RELEASED:            'Processed',
  SHIPPED:                'Dispatched',
};
const steritechStatus = state => STERITECH_STATUS[state] || 'Created';
const customerStatus  = state => CUSTOMER_STATUS[state]  || 'Created';

// Steritech's six statuses are deliberately coarse, and two internal states can
// fold onto one word: IN_STORAGE_UNPROCESSED and STAGED both read "Received",
// and PROCESS_OUT and IN_STORAGE_PROCESSED both read "QA Review". That is their
// vocabulary and it stays.
//
// The problem it causes on screen: two pallets of the SAME order can both say
// "Processing" and still offer completely different actions, because one is
// staged waiting to go in and the other is already in the chamber. Same word,
// different button, and nothing on the screen explains it. So the status is
// followed by a plain line saying where the pallet actually is.
const STATE_DETAIL = {
  ARRIVED:                'On the dock, not booked in yet',
  RECEIVED:               'Booked in, waiting to be put away',
  IN_STORAGE_UNPROCESSED: 'In the unprocessed warehouse',
  STAGED:                 'Staged, waiting to be processed in',
  IN_TREATMENT:           'In the process bin',
  PROCESS_OUT:            'Picked out of the process bin',
  IN_STORAGE_PROCESSED:   'In the processed warehouse',
  QA_HOLD:                'Held by QA',
  QA_RELEASED:            'Released by QA',
  SHIPPED:                'Off site',
};
const stateDetail = state => STATE_DETAIL[state] || '';

// Steps Business Central owns, not the scanner. Naming them keeps the app from
// implying it can do work that is not its job.
const BC_STEPS = [
  { label: 'Scheduling', when: 'After check-in, before process-in' },
  { label: 'QA Review',  when: 'After process-out, before release' },
];

// Column B of the workbook is the odd one out: every other column is a moment in
// time, but column B is headed "Scan Label / VIEW (scan at any point)". It is the
// lookup view - scan a pallet label whenever you like and this is what comes
// back. It never advances anything.
//
// Its per-stream rows are NOT the same as column D's. Column B carries Storage
// Temperature and drops Number of Spaces, Consignee, Transport, RFP and Dose
// Range. Using one list for both was wrong.
const SCAN_LABEL_FIELDS = {
  fresh_domestic: ['Storage Temperature', 'Market & Dose', 'Consignor'],
  fresh_export:   ['Storage Temperature', 'Market & Dose', 'Freight Forwarder'],
  biosecurity:    ['Biosecurity Direction', 'Container Number', 'Product - RPI'],
  medical:        ['Product - RPI'],
  beehives:       [],
};

// Column D of the workbook: extra rows the scanner SHOWS when an order is
// selected. These are customer-submitted, so they are read only here. Getting
// this wrong is easy: Freight Forwarder, RFP, Biosecurity Direction, Container
// Number, RPI and Dose Range all sit in column D, not in the arrival form.
const VIEW_FIELDS = {
  fresh_domestic: ['Number of Spaces', 'Market & Dose', 'Consignee', 'Consignor', 'Transport'],
  fresh_export:   ['Number of Spaces', 'Market & Dose', 'Request for Permit (RFP)', 'Freight Forwarder'],
  biosecurity:    ['Biosecurity Direction', 'Container Number', 'RPI', 'Dose Range'],
  medical:        ['RPI', 'Dose Range'],
  beehives:       [],
};
// The sheet writes the same value two ways - "RPI" in column D, "Product - RPI"
// in column B - so a lookup tries the label as written and then without the
// prefix rather than storing the value twice.
const submittedValue = (order, label) => {
  const sub = (order && order.submitted) || {};
  return sub[label] !== undefined ? sub[label] : sub[label.replace(/^Product - /, '')];
};
const fieldsFrom = (map, order) => (map[order && order.subStream] || [])
  .map(l => ({ label: l, value: submittedValue(order, l) }))
  .filter(x => x.value !== undefined);
const viewFields      = order => fieldsFrom(VIEW_FIELDS, order);
const scanLabelFields = order => fieldsFrom(SCAN_LABEL_FIELDS, order);

// Sub-stream labels. Beehives is deliberately listed and deliberately empty.
const SUB_STREAMS = {
  fresh_domestic: 'Fresh Produce - Domestic',
  fresh_export:   'Fresh Produce - Export',
  biosecurity:    'Biosecurity / General',
  medical:        'Medical',
  beehives:       'Beehives',
};

// Where a pallet physically sits, given the step it is on. A pallet in treatment
// is inside a chamber, not in a storage bay - so the bin has to follow the state,
// otherwise the data contradicts itself.
const binForState = (state, n) => {
  const nn = String(n).padStart(2, '0');
  switch (state) {
    // Nothing is binned before column G, so these two carry no bin at all.
    case 'ARRIVED':                return '';
    case 'RECEIVED':               return '';
    case 'IN_STORAGE_UNPROCESSED': return `Zone B - Bay ${nn}`;
    case 'STAGED':                 return `Zone B - Stage ${nn}`;
    case 'IN_TREATMENT':           return `Zone D - Cell ${((n - 1) % 3) + 1}`;
    case 'PROCESS_OUT':            return `Zone C - Bay ${nn}`;
    case 'IN_STORAGE_PROCESSED':   return `Zone C - Bay ${nn}`;
    case 'QA_HOLD':                return `Zone Q - Hold ${nn}`;
    case 'QA_RELEASED':            return `Zone C - Bay ${nn}`;
    // No PACKED case. Dispatch is TBC, so there is no agreed pallet state after
    // QA release and nothing should pretend otherwise.
    // A dispatched pallet has left the site, so it has no bin at all.
    case 'SHIPPED':                return '';
    default:                       return `Zone A - Inbound ${nn}`;
  }
};

// Builds a large pallet set from a list of states. Real orders are not always
// 1-3 pallets - a single request can land as 20+, so the UI has to hold up.
// Each pallet carries product LINES (reference + carton quantity). The lot
// number is not repeated here, and there is no lotNumber field on the order
// either: it IS the order number, so it is read from the order id.
const bulkPallets = (prefix, product, code, states) => states.map((state, i) => {
  const nn = String(i + 1).padStart(2, '0');
  return {
    id: `${prefix}-${nn}`,
    state,
    weight: 46 + (i % 5),
    // Bay numbers start at 21 so this order never lands in a bay another order
    // is already occupying. Treatment cells are shared on purpose - a cell holds
    // several pallets at once, a storage bay holds one.
    bin: binForState(state, i + 21),
    items: [{ name: product, code, qty: 500 }],
  };

// ── Step progress mapping ─────────────────────
// Internal scan states, ordered. Finer grained than Steritech's six statuses on
// purpose: the app needs to tell STAGED from IN_TREATMENT to know which screen to
// open, and the lot gates count pallets at a specific one of these. Display folds
// them onto the six via STERITECH_STATUS.
const STATE_TO_STEP = {
  // ARRIVED is the gap the first build missed: a pallet on the dock that has not
  // been booked in yet. The 2026-08-25 call corrected WHEN it becomes Received.
  // The workbook reads as though printing the label at column F is what does it.
  // Ben said the opposite: "I think it's the opposite way. It prints a label once
  // we've received it." Booking the pallet in is the action and the print is a
  // consequence of it, so RECEIVED is set when the arrival form is submitted.
  // The lot number is not waiting on the label either - Business Central issues
  // it with the request. Only the bin arrives later, at column G.
  ARRIVED: 1, RECEIVED: 2, IN_STORAGE_UNPROCESSED: 3, STAGED: 4, IN_TREATMENT: 5,
  PROCESS_OUT: 6, IN_STORAGE_PROCESSED: 7, QA_HOLD: 7, QA_RELEASED: 8, SHIPPED: 9,
};

// ── Order/pallet helpers ──────────────────────────────────────────────────────
// An order has no state of its own. Everything shown at order level is DERIVED
// from the pallets underneath it, because the workflow instance lives on the
// pallet - not on the order and not on the commodity.
const STEP_OF         = p => STATE_TO_STEP[p.state] || 1;
const orderPallets    = o => (o && o.pallets) || [];
const orderWeight     = o => orderPallets(o).reduce((s, p) => s + p.weight, 0);
const orderItemCount  = o => orderPallets(o).reduce((s, p) => s + p.items.length, 0);
// "Number of Cartons" and "Total Pallet Quantity" from the workbook. Both are
// sums of what is actually on the pallets, so neither is stored.
const orderCartons    = o => orderPallets(o).reduce((s, p) => s + p.items.reduce((t, i) => t + i.qty, 0), 0);
const palletCartons   = p => ((p && p.items) || []).reduce((t, i) => t + i.qty, 0);
// The order sits at its SLOWEST pallet - it isn't finished until every pallet is.
const orderStep       = o => orderPallets(o).reduce((m, p) => Math.min(m, STEP_OF(p)), 99) || 1;
const orderState      = o => {
  const ps = orderPallets(o);
  if (!ps.length) return 'RECEIVED';
  // A hold anywhere in the order is the headline - it blocks the whole request.
  const held = ps.find(p => p.state === 'QA_HOLD');
  if (held) return 'QA_HOLD';
  return ps.reduce((lo, p) => (STEP_OF(p) < STEP_OF(lo) ? p : lo), ps[0]).state;
};
const palletsPastQA   = o => orderPallets(o).filter(p => STEP_OF(p) >= 8).length;
// ── Order workflow: intentionally NOT shown in this mockup ───────────────────
// Exsited already runs an "Orders" workflow on the Steritech Order Number
// component (Created, Accepted, On Hold, Late Arrival, Cancelled, Scheduled for
// Processing, In Process, Ready For Invoicing, Completed). It is a separate axis
// from the pallet states this app drives.
//
// We had derived an order badge from pallet progress, but how pallet scanning
// should move an order through those states is NOT agreed with Steritech yet -
// it is open questions 12 and 13 on the client question list. Rather than show a
// guess, the order badge is left out until they confirm the mapping.
//
// To restore: derive from the pallets (all Received -> Scheduled for Processing,
// any moving -> In Process, all Dispatched -> Ready For Invoicing), letting any
// explicit order-level state win. Full background: docs/STERISCAN-DATA-PLACEMENT.md
// Group an order's pallets by state, earliest workflow step first. Per-pallet
// chips stop working past ~6 pallets; a grouped count scales to 20 or 200.
// Grouped by STATUS, so the headings read in Steritech's own words. Grouping by
// internal state would print Received twice, once for IN_STORAGE_UNPROCESSED and
// once for STAGED, which tells the operator nothing.
const groupByState = pallets => {
  const groups = new Map();
  pallets.forEach(p => {
    const key = p.state === 'QA_HOLD' ? 'QA_HOLD' : steritechStatus(p.state);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  return [...groups.entries()]
    .map(([key, pallets]) => ({ state: pallets[0].state, label: key === 'QA_HOLD' ? 'QA Review - Hold' : key, pallets }))
    .sort((a, b) => statusIndex(a.state) - statusIndex(b.state));
};
// Order Detail groups the whole order; Pallet Detail groups the rest of the lot.
// Same grouping, same rows, same wording - one of them reading differently from
// the other is the bug, so there is only one implementation.
const palletsByState = o => groupByState(orderPallets(o));
const stateLabel = state =>
  (BADGE_MAP[state] && BADGE_MAP[state].label) || state.replace(/_/g, ' ');

// An order has no product of its own - what it contains is whatever its pallets
// carry. Deriving the label keeps it honest: a stored order-level product name
// silently lies as soon as the order carries more than one thing.
const uniqueNames = items => [...new Set(items.map(i => i.name))];
const summarise = names =>
  !names.length ? '' : names.length === 1 ? names[0] : `${names[0]} + ${names.length - 1} more`;
const palletProductLabel = p => summarise(uniqueNames((p && p.items) || []));
// A dispatched pallet has no bin. Say where it is, not what happened to it.
const binLabel = p => (p && p.bin) || (p && p.state === 'SHIPPED' ? 'Off site' : 'Not yet binned');
// Demo timestamps are anchored to the order's own arrival date. Hardcoding a
// date meant a pallet could show a treatment that started before it arrived.
const stamp = (order, time) => `${(order && order.date) || 'Apr 28'}, 2026 - ${time}`;
// Flat list of every physical pallet in the yard, each carrying its parent order.
const ALL_PALLETS     = SAMPLE_ORDERS.flatMap(o => o.pallets.map(p => ({ ...p, order: o })));
const DEFAULT_PALLET_ORDER = SAMPLE_ORDERS[0];
const DEFAULT_PALLET  = SAMPLE_ORDERS[0].pallets[0];
const DEFAULT_PALLET_ID = DEFAULT_PALLET.id;
// Resolve a pallet id back to the order that owns it.
const orderOfPallet = palletId => {
  const hit = ALL_PALLETS.find(p => p.id === palletId);
  return hit ? hit.order : null;
};
// There is no backend here, so a scan has to move the pallet itself. Every id
// appears twice - once inside its order and once as a flattened copy in
// ALL_PALLETS - so both are updated or the dashboard counts drift away from the
// pallet's own screen.
const advancePallet = (pallet, state, bin) => {
  if (!pallet) return;
  const parent = orderOfPallet(pallet.id);
  [...orderPallets(parent), ...ALL_PALLETS, pallet]
    .filter(p => p && p.id === pallet.id)
    .forEach(p => { p.state = state; if (bin !== undefined) p.bin = bin; });
};

// Resolve the pallet a screen is acting on, falling back safely for deep-links
// from the Tweaks "Jump to Screen" menu.
// ALL_PALLETS holds flattened *copies*, so a pallet arriving from the Pallets
// list is not the same object as the one inside its order. Always resolve back
// to the canonical instance, otherwise indexOf/identity checks silently fail.
const palletOf = (appData, order) => {
  const sel = appData.selectedPallet;
  if (sel) {
    const parent = orderOfPallet(sel.id) || order || appData.selectedOrder;
    return orderPallets(parent).find(p => p.id === sel.id) || sel;
  }
  return orderPallets(order || appData.selectedOrder)[0] || DEFAULT_PALLET;
};
// Each stream is specified differently. Packing has neither a dose nor a cycle,
// so labelling its pack type "Target Dose / Cycle" was simply wrong.
const treatmentSpec = stream =>
  stream === 'eto'     ? { label: 'Cycle',       value: 'Standard 12hr' } :
  stream === 'packing' ? { label: 'Pack Type',   value: 'Blister Pack'  } :
                         { label: 'Target Dose', value: '25 - 45 kGy'   };

// "Product - Dose Range" from the scan-label view. The dose belongs to the
// product reference, so it is read off the Business Central catalogue rather
// than stored a second time on every pallet.
const lineDose = (item, order) => {
  const hit = bcProductsFor((order && order.customer) || '').find(p => p.code === item.code);
  return (hit && hit.dose) || treatmentSpec(order && order.stream).value;
};

// ── Lot number, priority and the dual status ────────────────────────────────
// Lot number and order number are the SAME value - client, 2026-08-25: "lot
// numbers, order numbers, identical" - so there is one field here and not two.
// It is the order id, issued by Business Central when the portal request lands.
// LOT_LABEL carries the wording because which of the two names Steritech
// standardises on is still open and follows Business Central.
const LOT_LABEL = 'Lot / Order Number';
// Business Central does not always hand the number back straight away: the live
// portal shows a dash against orders that are not linked yet. That is a real
// state, so it is named rather than left reading as "this lot has no number".
const LOT_PENDING = 'Waiting on Business Central';
const lotOf   = order => (order && order.id) || '';
const lotText = order => lotOf(order) || LOT_PENDING;
const subStreamLabel = order =>
  (order && order.subStream && SUB_STREAMS[order.subStream]) || null;

// Priority is a position in Steritech's schedule, set by them at the scheduling
// step. Not three bands - a number, released at a default of 50 so it can be
// moved either way, and re-ordered by hand when urgent work lands. Ties are
// normal because everything starts on 50, so this is an ordering key and not a
// unique rank.
const PRIORITY_DEFAULT = 50;
// Ben, 2026-08-25: "currently ours is lowest number is highest priority ... you
// could invert it, whatever it is". Left as he described it, so if Steritech
// inverts it there is exactly one line to change.
const PRIORITY_LOWEST_IS_HIGHEST = true;
const priorityOf    = order => (order && order.priority) || PRIORITY_DEFAULT;
const priorityLabel = order => `Priority ${priorityOf(order)}`;
// One comparator, so the direction is decided in one place and nowhere else.
const byPriority = (a, b) =>
  (PRIORITY_LOWEST_IS_HIGHEST ? 1 : -1) * (priorityOf(a) - priorityOf(b));

// Steritech status is the internal one and is what this app shows. Customer
// status is shown alongside it so an operator can see what the customer sees -
// the two genuinely differ for most of the run.
const orderSteritechStatus = order => steritechStatus(orderState(order));
const orderCustomerStatus  = order => customerStatus(orderState(order));

// "Cannot change status until all pallets have been picked out of the process
// bin for the Lot number." Both process-in and process-out are gated on this,
// so the count lives in one place.
const palletsAtOrPast = (order, step) =>
  orderPallets(order).filter(p => STEP_OF(p) >= step).length;
const lotGate = (order, step) => {
  const total = orderPallets(order).length;
  const done  = palletsAtOrPast(order, step);
  return { done, total, complete: total > 0 && done >= total };
};

// The workbook gates the STATUS on all pallets being out of the process bin
// (cell K3) and says nothing about gating the process-out SCAN. The 2026-08-25
// call settled that. Asked whether one pallet can be processed out while the
// rest of the lot is still not in, Ben said "for simplicity, keep it full order.
// We have to receive it all for it to be collectively ready ... So all or
// nothing for the moment." So the scan is held until the whole lot is in.
//
// He was explicit that this is interim - he and Simon had not worked through the
// risks - and he named the case that will force a rethink: "we're receiving one
// pallet 2 hours before the next one. How do we run it?" It is one helper so
// that lifting the rule later is a one-line change.
const lotAllProcessedIn = order => lotGate(order, 5).complete;
// The other end of the same idea, and the one QA waits on. Not a block: QA review
// is not an action in this app, so there is nothing to refuse. It decides what the
// pallet's button promises and what the QA screen reports.
const lotAllProcessedOut = order => lotGate(order, 6).complete;
// Where the rest of the lot sits. The counter alone reads as if the missing
// pallets had gone somewhere unexplained.
const processBinSplit = order => {
  const total = orderPallets(order).length;
  const out   = palletsAtOrPast(order, 6);
  const inBin = palletsAtOrPast(order, 5) - out;
  return { total, out, inBin, notIn: total - out - inBin };
};
const processBinNote = order => {
  const s = processBinSplit(order);
  const parts = [];
  if (s.inBin) parts.push(`${s.inBin} still in the process bin`);
  if (s.notIn) parts.push(`${s.notIn} not processed in yet`);
  return parts.join(', ');
};

// Priority is worked from, not just displayed - process-in and process-out both
// order their lists by it, so it gets a chip of its own. One neutral style: a
// schedule number has no band to colour, and the only distinction Ben asked for
// was between the job in action and what is next, which the queue lists carry.
const PriorityChip = ({ order, current = false }) => (
  <span style={{
    background: current ? '#FEE2E2' : '#E2E8F0',
    color:      current ? '#991B1B' : '#475569',
    borderRadius: 6, padding: '3px 8px',
    fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
    letterSpacing: '0.5px', display: 'inline-block', whiteSpace: 'nowrap',
  }}>{priorityLabel(order)}</span>
);

// Steps the scanner does not own. Saying so on the pallet is better than leaving
// a gap the operator has to explain to themselves.
const BCStepsNote = () => (
  <div style={{
    background: '#F8FAFC', border: `1px dashed ${C.border}`, borderRadius: 12,
    padding: '12px 14px', marginBottom: 14,
  }}>
    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 8 }}>
      Handled in Business Central
    </div>
    {BC_STEPS.map(b => (
      <div key={b.label} style={{ display: 'flex', gap: 8, alignItems: 'baseline', marginBottom: 4 }}>
        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: C.text }}>{b.label}</span>
        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>{b.when}</span>
      </div>
    ))}
    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 6, lineHeight: 1.45 }}>
      Neither step is a scan. The app waits for Business Central to move the lot on.
    </div>
  </div>
);

const KPI = ({ label, value, color }) => (
  <div style={{ flex: 1, background: '#fff', borderRadius: 12, padding: '10px 12px', border: `1px solid ${C.border}` }}>
    <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 22, fontWeight: 700, color }}>{value}</div>
    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 600, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.4 }}>{label}</div>
  </div>

// ── Dashboard Screen (Orders list, customer-style layout) ─
const DashboardScreen = ({ navigate, appData }) => {
  const [sort, setSort] = React.useState('date');
  const [filter, setFilter] = React.useState('all');
  const [query, setQuery] = React.useState('');
  // Two ways to look at the same yard. "Orders" = customer requests (ORD-…);
  // "Pallets" = the physical units the workflow actually runs on (PLT-…).
  const [view, setView] = React.useState('orders');

  // Filters are Steritech's own statuses, plus Hold. The workbook has no hold
  // status, but a held pallet is exactly the thing an operator goes looking for,
  // so it stays as its own chip.
  const filters = [
    { id: 'all',         label: 'All' },
    { id: 'Created',     label: 'Created' },
    { id: 'Received',    label: 'Received' },
    { id: 'Processing',  label: 'Processing' },
    { id: 'QA Review',   label: 'QA Review' },
    { id: 'Released',    label: 'Released' },
    { id: 'Dispatched',  label: 'Dispatched' },
    { id: 'hold',        label: 'Hold' },
  ];
  // Counted by status, so a KPI and a chip can never disagree.
  const countStatus = st => ALL_PALLETS.filter(p => steritechStatus(p.state) === st).length;
  const q = query.trim().toLowerCase();

  // One predicate, applied to a pallet state - shared by both views so the
  // filter chips mean exactly the same thing whichever list you are looking at.
  const stateMatches = (state) => {
    const status = steritechStatus(state);
    if (filter === 'all') return true;
    if (filter === 'hold') return state === 'QA_HOLD';
    return status === filter;
  };

  // ── Orders view: filter/search at order level, state derived from pallets ──
  const filteredOrders = SAMPLE_ORDERS.filter(o => {
    // An order matches a filter when ANY of its pallets does. Matching on the
    // order's rolled-up state would hide an order with 8 pallets awaiting QA
    // just because one pallet is still at Received.
    if (!orderPallets(o).some(p => stateMatches(p.state))) return false;
    if (!q) return true;
    // Searching a pallet barcode, a product, a PO or a lot should all surface the
    // order. Lot needs no clause of its own any more - it is the order id.
    return o.id.toLowerCase().includes(q)
      || o.customer.toLowerCase().includes(q)
      || (o.po || '').toLowerCase().includes(q)
      || orderPallets(o).some(p => p.id.toLowerCase().includes(q)
        || p.items.some(it => it.name.toLowerCase().includes(q) || it.code.toLowerCase().includes(q)));
  });
  const sortedOrders = [...filteredOrders].sort((a, b) => {
    if (sort === 'status')   return orderStep(a) - orderStep(b);
    // Process-in and process-out are worked in priority order, so the list can
    // be put in the same order the floor actually works it. byPriority owns the
    // direction, because Steritech may still invert the numbering.
    if (sort === 'priority') return byPriority(a, b) || orderStep(a) - orderStep(b);
    return b.id.localeCompare(a.id);
  });

  // ── Pallets view: every physical pallet, each judged on its own state ──
  const filteredPallets = ALL_PALLETS.filter(p => {
    if (!stateMatches(p.state)) return false;
    if (!q) return true;
    return p.id.toLowerCase().includes(q)
      || p.order.id.toLowerCase().includes(q)
      || p.order.customer.toLowerCase().includes(q)
      || p.items.some(it => it.name.toLowerCase().includes(q) || it.code.toLowerCase().includes(q));
  });
  const sortedPallets = [...filteredPallets].sort((a, b) => {
    if (sort === 'status')   return STEP_OF(a) - STEP_OF(b);
    if (sort === 'priority') return byPriority(a.order, b.order) || STEP_OF(a) - STEP_OF(b);
    return b.id.localeCompare(a.id);
  });

  // Under a filter, count only the pallets that actually match it. Counting every
  // pallet of a matching order made this header disagree with the KPI above it:
  // "Released" would read "28 pallets" when only 13 pallets were released.
  const palletsInView = view === 'orders'
    ? sortedOrders.reduce((s, o) => s + orderPallets(o).filter(p => stateMatches(p.state)).length, 0)
    : sortedPallets.length;
  // Name what is being counted, so the number cannot be mistaken for a total.
  const filterNoun = filter === 'all' ? ''
    : filter === 'hold' ? 'on hold '
    : filter.toLowerCase() + ' ';

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
      <StatusBar />
      <NavBar title={`Hello ${(appData.operator || 'Operator').split(' ')[0]}`} showLogo={true} />
      <div style={{ flex: 1, overflow: 'auto', padding: '16px 16px 8px' }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 8,
          background: '#fff', border: `1px solid ${C.border}`, borderRadius: 12,
          padding: '0 10px 0 12px', height: 44, marginBottom: 12,
        }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          <input
            type="text"
            value={query}

};

// ── Order Detail (employee) ───────────────────
// Row 2 of the 19 Aug workbook, in order, with the action the sheet pairs with
// each one. These six are Steritech's own statuses. An earlier version of this
// timeline used eight step names of our own invention (In Storage, Staged, In
// Treatment, Processed, Packed), which read plausibly but matched nothing the
// client had written down.
//
// The internal pallet states are finer grained than this on purpose: the app has
// to tell a staged pallet from one already in a chamber to know which screen to
// open. Those states stay, and STERITECH_STATUS is what folds them onto these
// six for display.
const TIMELINE_STEPS = [
  { key: 'created',    label: 'Created',    desc: 'Customer submitted the request in the portal', owner: 'Portal' },
  { key: 'received',   label: 'Received',   desc: 'Booked in on arrival; the label prints, then the pallet is stored' },
  { key: 'processing', label: 'Processing', desc: 'Processed in per the schedule' },
  { key: 'qa_review',  label: 'QA Review',  desc: 'Whole order processed out, waiting on QA in Business Central' },
  { key: 'released',   label: 'Released',   desc: 'QA review complete', owner: 'BC' },
  { key: 'dispatched', label: 'Dispatched', desc: 'Dispatch steps not confirmed yet', owner: 'TBC' },
];
// Where a pallet sits on those six. Driven by the status map, so the timeline can
// never drift out of step with the status shown beside it.
const STATUS_ORDER = TIMELINE_STEPS.map(t => t.label);
const statusIndex  = state => Math.max(1, STATUS_ORDER.indexOf(steritechStatus(state)) + 1);

// ── Pallet list building blocks (shared by Order Detail) ─────────────────────
// One row = one pallet = one workflow instance.
const PalletRowCard = ({ pallet, onOpen }) => {
  const pStep = STEP_OF(pallet);
  return (
    <Card style={{ padding: '12px 14px', cursor: 'pointer' }} onClick={() => onOpen(pallet)}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.brand} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/>
          </svg>
          <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 14.5, fontWeight: 700, color: C.text }}>{pallet.id}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <Badge state={pallet.state} />
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 3, marginBottom: 8 }}>
        {TIMELINE_STEPS.map((t, i) => (
          <div key={t.key} style={{ flex: 1, height: 3, borderRadius: 2, background: i < statusIndex(pallet.state) ? C.brand : C.border }}/>
        ))}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>
        {/* The badge above already carries the status, so this line is location
            and contents only. */}
        <span>{binLabel(pallet)}</span>
        <span>{pallet.weight} kg · {palletCartons(pallet)} cartons</span>
      </div>
    </Card>
  );
};

// Pallets sharing a state, collapsed to a preview so a 20-pallet order does not
// turn into an endless scroll. Each group opens on demand.
const PALLET_PREVIEW = 4;
const PalletGroupSection = ({ group, onOpen }) => {
  const [open, setOpen] = React.useState(false);
  const overflow = group.pallets.length - PALLET_PREVIEW;
  const shown = open ? group.pallets : group.pallets.slice(0, PALLET_PREVIEW);
  const b = BADGE_MAP[group.state] || { bg: '#E2E8F0', color: '#475569' };
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
        <span style={{ width: 7, height: 7, borderRadius: 4, background: b.color }}/>
        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700, color: C.text, letterSpacing: 0.3 }}>
          {group.label || stateLabel(group.state)}
        </span>
        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>
          {group.pallets.length} pallet{group.pallets.length !== 1 ? 's' : ''}
        </span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {shown.map(p => <PalletRowCard key={p.id} pallet={p} onOpen={onOpen} />)}
      </div>
      {overflow > 0 && (
        <button onClick={() => setOpen(!open)} style={{
          width: '100%', marginTop: 8, padding: '8px 0', borderRadius: 10,
          border: `1px solid ${C.border}`, background: '#fff', cursor: 'pointer',
          fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 700, color: C.brand,
        }}>
          {open ? 'Show less' : `Show all ${group.pallets.length} →`}
        </button>
      )}
    </div>
  );
};


// Next action for a single PALLET. The workflow instance lives on the pallet, so
// this is keyed off pallet.state - never off the order. The order is still passed
// in because ONE rule is lot-wide: process out waits for the whole lot to be in.
//
// There is no role argument. The scanner belongs to the operator: QA reviews in
// Business Central on a desktop and has no scan anywhere in this run.
const palletAction = (pallet, order) => {
  // Column M is "QA review (BC operation)" with Scanner Data Fields = N/A, so
  // nothing is captured there. The operator gets a read-only view of the outcome.
  //
  // Two labels, because there are two things to look at. Once the lot is out,
  // there is a QA outcome to read. Before that QA has not started, and calling it
  // "View QA Review" promised a review that did not exist yet. The screen behind
  // is the same either way; only the promise changes.
  const qaLabel = lotAllProcessedOut(order) ? 'View QA Review →' : 'Waiting on the Lot →';
  switch (pallet.state) {
    case 'ARRIVED':                return { label: 'Start Arrival →',      screen: 'receiving_form' };
    case 'RECEIVED':               return { label: 'Check In and Store →', screen: 'scan_bin' };
    case 'IN_STORAGE_UNPROCESSED': return { label: 'Process In →',         screen: 'process_in' };
    case 'STAGED':                 return { label: 'Process In →',         screen: 'process_in' };
    // Held until every pallet on the lot is in - see lotAllProcessedIn.
    case 'IN_TREATMENT':           return lotAllProcessedIn(order)
                                     ? { label: 'Process Out →',       screen: 'process_out' } : null;
    case 'PROCESS_OUT':            return { label: qaLabel,                      screen: 'qa_status' };
    case 'IN_STORAGE_PROCESSED':   return { label: qaLabel,                      screen: 'qa_status' };
    case 'QA_RELEASED':            return { label: 'Continue to Packing →', screen: 'packing' };
    case 'QA_HOLD':                return { label: 'View QA Hold Details →',     screen: 'qa_hold', extras: { pdrReference: 'PDR-2026-007' } };
    default:                       return null;
  }
};


const OrderDetailScreen = ({ navigate, appData }) => {
  const order     = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallets   = orderPallets(order);
  const oState    = orderState(order);       // derived - the order has no state of its own
  const released  = palletsPastQA(order);
  const isShipped = oState === 'SHIPPED';

  const openPallet = p => navigate('pallet_detail', { selectedOrder: order, selectedPallet: p, palletId: p.id });

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
      <StatusBar />
      <NavBar title={order.id} onBack={() => navigate('dashboard')} showLogo={false} />
      <div style={{ flex: 1, overflow: 'auto', padding: '16px' }}>
        {/* Hand-back from QA. These are order-wide signals: "released" only
            once every pallet cleared, "hold" as soon as any one pallet is held. */}
        {(oState === 'QA_RELEASED' || oState === 'QA_HOLD') && (
          <div style={{
            display: 'flex', alignItems: 'flex-start', gap: 11, marginBottom: 14,
            background: oState === 'QA_HOLD' ? '#FEF2F2' : '#ECFDF5',
