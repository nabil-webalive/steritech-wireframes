  palletsPastQA, palletsByState, stateLabel, palletProductLabel, treatmentSpec,
  binForState, binLabel, stamp,
  STERITECH_STATUS, CUSTOMER_STATUS, steritechStatus, customerStatus,
  STATE_DETAIL, stateDetail,
  BC_STEPS, SUB_STREAMS, VIEW_FIELDS, SCAN_LABEL_FIELDS,
  viewFields, scanLabelFields, submittedValue, subStreamLabel,
  LOT_LABEL, LOT_PENDING, lotOf, lotText,
  orderCartons, palletCartons, lineDose,
  PRIORITY_DEFAULT, PRIORITY_LOWEST_IS_HIGHEST,
  priorityOf, priorityLabel, byPriority,
  orderSteritechStatus, orderCustomerStatus, palletsAtOrPast, lotGate,
  lotAllProcessedIn, lotAllProcessedOut, processBinSplit, processBinNote,
  palletOf, palletAction,
  orderOfPallet,
  PalletRowCard, PalletGroupSection, PriorityChip, BCStepsNote,
  SplashScreen, ScanEmployeeScreen, DashboardScreen, OrderDetailScreen, PalletDetailScreen,
  TIMELINE_STEPS, STATUS_ORDER, statusIndex, STATE_TO_STEP, KPI,
  ScanPalletScreen,
  ScanBinScreen, SummaryScreen, ReceivingFormScreen, PrintLabelsScreen,
  BC_PRODUCTS, BC_PRODUCTS_FALLBACK, bcProductsFor, ARRIVAL_FIELDS,
  ReadRow, ReadGrid, EditRow,
});

</script>

<script type="text/babel">
// SteriScan - Screens B: Staging, Treatment, Process-Out
// ────────────────────────────────────────────────────────

// ═════════════════════════════════════════════════════════════════════════════
// PROCESS IN - columns I and J of the 19 Aug workbook
// ═════════════════════════════════════════════════════════════════════════════
// Column I is the VIEW half: lot number, customer name, how many pallets of the
// lot have been picked, and a priority listing that may hold several lots at the
// same level. Column J is the EDIT half, and it is a single field - move the
// pallet to the process bin by scanning the process barcode.
//
// There are no per-stream rows in either column, which is why this is one screen
// and not three. The old build had a Staging form per stream carrying Carrier
// Pallet ID, target dose range, Conveyor Run ID, Chamber ID, cycle type and pack
// type. None of those is in the sheet, and the action is "Process in per the
// SCHEDULE" - the schedule is set in Business Central at column H, so the
// operator is not choosing a chamber or a dose here. They are moving a pallet
// into a bin.
//
// Ben confirmed this screen on 2026-08-25 - "for the scope of the scanning app,
// that's fine where it is" - and described what the scan physically is: "you scan
// the pallet into a physical conveyor location. That's generally all of our
// processes. That conveyor location is detached from the process out."
//
// Several lots can share a priority level and the workbook does not cap it, so
// the queue is previewed rather than printed in full. Ben's version of the same
// rule: show "the top three or something ... multiple lot numbers, if they have
// the same priority level. But it should be clear what is currently in action and
// what's next."
const SAME_PRIORITY_PREVIEW = 3;

const ProcessInScreen = ({ navigate, appData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet = palletOf(appData, order);
  const [scanned, setScanned] = React.useState(false);
  // Step 5, not 4. The scan on this screen moves a pallet from STAGED (4) into
  // the process bin (5), so the count is of pallets that have BEEN processed in.
  // Counting step 4 counted the pallet in the operator's hands before they had
  // scanned it, and a two-pallet lot opened this screen already reading 2 of 2.
  const gate = lotGate(order, 5);

  // "May view multiple Lot Number's if granted same priority level." Other lots
  // sharing this priority are listed so the operator can see the whole queue at
  // their level, not just the one lot they came in on.
  const samePriority = SAMPLE_ORDERS
    .filter(o => o.id !== order.id && priorityOf(o) === priorityOf(order)
      && lotGate(o, 5).done < lotGate(o, 5).total)
    .sort(byPriority);

  return (
    <PageWrapper title="Process In" onBack={() => navigate('pallet_detail')}
      bottomBar={
        <Btn label={scanned ? 'Continue →' : 'Scan the process bin to continue'}
          onClick={() => navigate('pallet_detail')}
          color="orange" disabled={!scanned} />
      }>
      <div style={{ padding: '20px 16px 8px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <SectionTitle title="Process In" subtitle="Per the schedule" />
          <StreamBadge stream={order.stream} />
        </div>

        {/* Column I in one card. The lot progress banner used to sit above this
            and repeated the lot number and the pallet counter, so the priority
            chip, the progress strip and the rule moved in here instead. */}
        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
            <span style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 13, fontWeight: 700, color: C.text }}>
              {lotOf(order)}
            </span>
            <PriorityChip order={order} />
          </div>
          <InfoRow label="Customer Name" value={order.customer} />
          <InfoRow label="Qty of Pallets Processed In"
            value={`${gate.done} of ${gate.total}`} />
          {/* One bar filled by proportion, not one segment per pallet. A lot can
              carry 20 pallets and 20 slivers reads as noise. */}
          <div style={{ height: 5, borderRadius: 3, background: C.border, overflow: 'hidden', marginTop: 10 }}>
            <div style={{
              width: `${(gate.done / Math.max(1, gate.total)) * 100}%`,
              height: '100%', borderRadius: 3, transition: 'width 220ms',
              background: gate.complete ? C.green : C.orange,
            }}/>
          </div>
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 8, lineHeight: 1.45 }}>
            {gate.complete
              ? 'Every pallet on this lot is in the process bin. The lot status can move on.'
              : 'The lot status does not close until every pallet on it has been processed in.'}
          </div>
        </Card>

        {/* Column J: one field, written by a scan. */}
        <SectionTitle title="Process bin" subtitle="Scan the process barcode to move the pallet" />
        <PalletChip id={pallet.id} />
        <div style={{ height: 12 }}/>
        {scanned ? (
          <>
            <Alert type="teal" message={gate.complete
              ? 'Pallet moved to the process bin. Every pallet on this lot is now in.'
              : `Pallet moved to the process bin. ${gate.total - gate.done} still to go on this lot.`} />
            <Card style={{ padding: '14px 16px' }}>
              <InfoRow label="Bin" value={binForState('IN_TREATMENT', 1)} bold />
            </Card>
          </>
        ) : (
          <div style={{ display: 'flex', justifyContent: 'center' }}>
            <ScanView onSimulate={() => {
              advancePallet(pallet, 'IN_TREATMENT', binForState('IN_TREATMENT', 1));
              setScanned(true);
            }} label="Scan Process Bin" />
          </div>
        )}

        {samePriority.length > 0 && (
          <>
            <div style={{ height: 18 }}/>
            <SectionTitle title={`Also at ${priorityLabel(order)}`}
              subtitle="Same priority level, waiting to be processed in. This lot is the one in action." />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {samePriority.slice(0, SAME_PRIORITY_PREVIEW).map(o => {
                const g = lotGate(o, 5);
                return (
                  <Card key={o.id} style={{ padding: '11px 14px', cursor: 'pointer' }}
                    onClick={() => navigate('order_detail', { selectedOrder: o })}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <div>
                        <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12.5, fontWeight: 700, color: C.text }}>{lotOf(o)}</div>
                        <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 2 }}>{o.customer}</div>
                      </div>
                      <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>
                        {g.done} of {g.total} in
                      </span>
                    </div>
                  </Card>
                );
              })}
            </div>
            {samePriority.length > SAME_PRIORITY_PREVIEW && (
              <div style={{
                fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted,
                marginTop: 8, textAlign: 'center',
              }}>
                and {samePriority.length - SAME_PRIORITY_PREVIEW} more at this priority
              </div>
            )}
          </>
        )}
      </div>
    </PageWrapper>
  );
};

// ════════════════════════════════════════════════════════════════════════════
// PROCESS OUT - columns K and L of the 19 Aug workbook
// ════════════════════════════════════════════════════════════════════════════
// Column K is the VIEW half and carries exactly three rows plus one note: Lot
// Number, Customer Name, Qty of Pallets Picked, and "May view multiple Lot
// Number's if granted same priority level." Column L is the EDIT half and is one
// field: Bin, via a scan of the bin barcode, the site processed warehouse.
//
// K4 and L4 are merged into a single action, so this is one screen, and like
// process in there are no per-stream rows, so it is one screen for all three
// streams. The old build had three: Irradiation scanned the pallet and showed a
// process-out timestamp, EtO carried cycle duration, aeration time, temperature
// and residue reading, Packing carried final packed quantity and damaged units.
// None of those fields is in the sheet. The action is "Process out per the
// SCHEDULE", and the only thing written is the bin.
//
// Two things changed after the 2026-08-25 call:
//   ROLE   This is the OPERATOR's scan. It used to be gated to QA, which was
//          wrong - QA never touches the scanner for it, and the app no longer has
//          a QA role at all.
//   GATE   The scan is held until the WHOLE lot is processed in. Ben: "keep it
//          full order. We have to receive it all for it to be collectively ready
//          ... So all or nothing for the moment."
const ProcessOutScreen = ({ navigate, appData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const pallet = palletOf(appData, order);
  const [scanned, setScanned] = React.useState(false);
  const gate = lotGate(order, 6);
  const inGate = lotGate(order, 5);
  const bin  = binForState('IN_STORAGE_PROCESSED', parseInt(String(pallet.id).slice(-2), 10) || 1);

  // Same rule as process in: the queue is worked by priority and several lots can
  // sit at one level, so the rest of the level is listed.
  const samePriority = SAMPLE_ORDERS
    .filter(o => o.id !== order.id && priorityOf(o) === priorityOf(order)
      && lotGate(o, 6).done < lotGate(o, 6).total)
    .sort(byPriority);

  return (
    <PageWrapper title="Process Out" onBack={() => navigate('pallet_detail')}
      bottomBar={
        <Btn label={!lotAllProcessedIn(order)
              ? 'Waiting on the rest of the lot'
              : scanned ? 'Continue →' : 'Scan the warehouse bin to continue'}
          onClick={() => navigate('pallet_detail')}
          color="green" disabled={!scanned} />
      }>
      <div style={{ padding: '20px 16px 8px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <SectionTitle title="Process Out" subtitle="Per the schedule" />
          <StreamBadge stream={order.stream} />
        </div>

        {/* Column K in one card. */}
        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
            <span style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 13, fontWeight: 700, color: C.text }}>
              {lotOf(order)}
            </span>
            <PriorityChip order={order} />
          </div>
          <InfoRow label="Customer Name" value={order.customer} />
          <InfoRow label="Qty of Pallets Picked" value={`${gate.done} of ${gate.total}`} />
          <div style={{ height: 5, borderRadius: 3, background: C.border, overflow: 'hidden', marginTop: 10 }}>
            <div style={{
              width: `${(gate.done / Math.max(1, gate.total)) * 100}%`,
              height: '100%', borderRadius: 3, transition: 'width 220ms',
              background: gate.complete ? C.green : C.orange,
            }}/>
          </div>
          {/* Where the rest of the lot sits. The counter alone reads as if the
              missing pallets had gone somewhere unexplained. */}
          {!gate.complete && processBinNote(order) && (
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 8 }}>
              {processBinNote(order)}
            </div>
          )}
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 6, lineHeight: 1.45 }}>
            {gate.complete
              ? 'Every pallet on this lot is out of the process bin. QA can now review the whole order in Business Central.'
              : 'QA does not start until every pallet on this lot has been picked out of the process bin.'}
          </div>
        </Card>

        {/* Column L: one field, written by a scan - but only once the whole lot
            is in. "All or nothing for the moment." */}
        <SectionTitle title="Processed warehouse bin"
          subtitle={lotAllProcessedIn(order)
            ? 'Scan the bin barcode to move the pallet'
            : 'Held until every pallet on this lot is processed in'} />
        <PalletChip id={pallet.id} />
        <div style={{ height: 12 }}/>
        {!lotAllProcessedIn(order) ? (
          <div style={{
            background: '#FEF3C7', border: '1px solid #FDE68A', borderRadius: 12,
            padding: '14px 16px',
          }}>
            <div style={{ display: 'flex', gap: 11, alignItems: 'flex-start' }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#92400E" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <div>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13.5, fontWeight: 700, color: '#92400E' }}>
                  Process out is held
                </div>
                <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12.5, color: C.text, marginTop: 3, lineHeight: 1.5 }}>
                  A lot is processed out as a full order, so nothing goes out until every
                  pallet on it is in. {inGate.done} of {inGate.total} pallets on this lot
                  are processed in.
                </div>
              </div>
            </div>
          </div>
        ) : scanned ? (
          <>
            <Alert type="teal" message={gate.complete
              ? 'Pallet stored. Every pallet on this lot is out, so QA can review the order in Business Central.'
              : `Pallet picked out of the process bin and stored. ${gate.total - gate.done} still in on this lot.`} />
            <Card style={{ padding: '14px 16px' }}>
              <InfoRow label="Bin" value={bin} bold />
            </Card>
          </>
        ) : (
          <div style={{ display: 'flex', justifyContent: 'center' }}>
            <ScanView onSimulate={() => {
              advancePallet(pallet, 'PROCESS_OUT', bin);
              setScanned(true);
            }} label="Scan Bin Barcode" />
          </div>
        )}

        {samePriority.length > 0 && (
          <>
            <div style={{ height: 18 }}/>
            <SectionTitle title={`Also at ${priorityLabel(order)}`}
              subtitle="Same priority level, waiting to be processed out. This lot is the one in action." />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {samePriority.slice(0, SAME_PRIORITY_PREVIEW).map(o => {
                const g = lotGate(o, 6);
                return (
                  <Card key={o.id} style={{ padding: '11px 14px', cursor: 'pointer' }}
                    onClick={() => navigate('order_detail', { selectedOrder: o })}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <div>
                        <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12.5, fontWeight: 700, color: C.text }}>{lotOf(o)}</div>
                        <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 2 }}>{o.customer}</div>
                      </div>
                      <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>
                        {g.done} of {g.total} out
                      </span>
                    </div>
                  </Card>
                );
              })}
            </div>
            {samePriority.length > SAME_PRIORITY_PREVIEW && (
              <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 8, textAlign: 'center' }}>
                and {samePriority.length - SAME_PRIORITY_PREVIEW} more at this priority
              </div>
            )}
          </>
        )}
      </div>
    </PageWrapper>
  );
};

Object.assign(window, {
  ProcessInScreen, ProcessOutScreen,
});

</script>

<script type="text/babel">
// SteriScan - Screens C: Post-Treatment, Errors, Override, Success, Fail
// ────────────────────────────────────────────────────────────────────────

// ── In Storage - Processed ────────────────────
// One pallet being stored does not put the order into QA. Ben, 2026-08-25: "Once
// that whole order is out of the process, QA step initiates." So the screen only
// claims QA has started once the last pallet on the lot is out.
const InStorageProcessedScreen = ({ navigate, appData }) => {
  const order = appData.selectedOrder || SAMPLE_ORDERS[0];
  const gate  = lotGate(order, 6);

  return (
    <PageWrapper title="Stored - Processed" onBack={() => navigate('dashboard')}
      bottomBar={
        <Btn label="Back to Dashboard" onClick={() => navigate('dashboard')} color="blue" large />
      }>
      <div style={{ padding: '20px 16px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <SectionTitle title="Treated Pallet Stored"
            subtitle={gate.complete ? 'Whole order out - QA review initiated' : 'Waiting on the rest of the lot'} />
          <PalletChip id={appData.palletId || DEFAULT_PALLET_ID} />
        </div>

        <Alert type="info" message={gate.complete
          ? 'Every pallet on this order is out of the process. QA reviews the order in Business Central.'
          : `Pallet is treated and stored. ${gate.done} of ${gate.total} pallets on this order are out - QA starts once the last one is.`} />

        <Card style={{ padding: '14px 16px' }}>
          <InfoRow label="Steritech Status" valueEl={<Badge state="IN_STORAGE_PROCESSED" />} />
          <InfoRow label="Bin" value={appData.binLocation || binLabel(palletOf(appData, order))} />
          <InfoRow label="Customer" value={order.customer} />
          <InfoRow label="Product" value={palletProductLabel(palletOf(appData, order))} />
          <InfoRow label="Stream" valueEl={<StreamBadge stream={appData.stream || order.stream || 'irradiation'} />} />
          <InfoRow label="Process-Out" value={stamp(order, '14:32')} />
        </Card>
      </div>
    </PageWrapper>
  );
};

// ── QA Status ─────────────────────────────
// View-only - QA action happens off-scanner, not in this app. Confirmed on
// 2026-08-25: "QA review is generally a BC operation. That'll be a desktop
// action. They pull the batch records", and it is "done on a computer for QA".
// When it is done "the order doesn't move, but it gets a state update, which just
// lets it be dispatched".
//
// QA reviews a CONSIGNMENT, not a pallet, and it is the WHOLE ORDER at once -
// never pallet by pallet. "Once that whole order is out of the process, QA step
// initiates, which says this order needs to be reviewed by QA personnel." Ben's
// own summary of the shape: "Process is like a black box. You don't know what
// happens inside of it. It comes out, someone reviews that black box, and then
// they ticket, yep, good to go."
//
// The dose certificate and the release-for-supply are issued against the lot
// number, so the workbook gates the status: "cannot change status until all
// pallets have been picked out of the process bin for the Lot number" (cell K3).
//
// This screen used to open on "QA Review Pending - QA is reviewing this pallet"
// the moment ONE pallet was processed out. On a 20-pallet lot with 19 still in
// the chamber that claimed a review which had not started, and offered a
// Released state that cannot legally exist. The gate is now the first thing the
// screen answers: is the lot even out of the process bin yet?
const QAStatusScreen = ({ navigate, appData, setAppData }) => {
  const order  = appData.selectedOrder || SAMPLE_ORDERS[0];
  const gate   = lotGate(order, 6);
  // Which pallets are holding the lot up. Sorted so the ones furthest behind
  // come first - those are the ones that decide when QA can start.
  const waitingOn = orderPallets(order)
    .filter(p => STEP_OF(p) < 6)
    .sort((a, b) => STEP_OF(a) - STEP_OF(b));
  // The QA outcome is a FACT about the lot, read from its pallets. It used to be
  // React state initialised to 'pending' for everything, so an already released
  // lot opened on "QA Review Pending" and a held one did too - the screen simply
  // ignored what the pallets said. Business Central owns the decision and the
  // pallets carry it, so this reads it rather than holding its own copy.
  const qaState = (() => {
    const ps = orderPallets(order);
    if (ps.some(p => p.state === 'QA_HOLD')) return 'hold';
    if (ps.length && ps.every(p => STEP_OF(p) >= 8)) return 'released';
    return 'pending';
  })();
  // The gate still wins. A lot half in the chamber has no QA outcome to report.
  //
  // In practice this screen is reached from a pallet at PROCESS_OUT or
  // IN_STORAGE_PROCESSED, so the lot has not been ruled on and this lands on
  // waiting or pending. A decided lot goes elsewhere: released sends the operator
  // to packing, held opens the QA Hold screen with its PDR reference. The other
  // two views stay anyway, because the outcome is read from the pallets and the
  // screen has to be able to report a decided lot rather than fall over on one.
  const shown  = gate.complete ? qaState : 'waiting';
  const done   = shown === 'released' || shown === 'hold';

  const stateConfig = {
    waiting: {
      bg: '#F1F5F9', stroke: C.muted,
      icon: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
      title: 'Waiting on the rest of the lot',
      sub: `QA reviews ${lotOf(order)} as one consignment. ${gate.done} of ${gate.total} pallets are out of the process bin - the review starts once the last one is.`,
      badge: { state: 'RECEIVED', label: 'NOT STARTED' },
    },
    pending: {
      bg: '#FEF3C7', stroke: '#D97706',
      icon: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
      title: 'QA Review Pending',
      sub: `Every pallet on ${lotOf(order)} is out of the process bin. QA is reviewing the lot in Business Central; the outcome shows up here once it is recorded.`,
      badge: { state: 'PROCESS_OUT', label: 'QA REVIEW' },
    },
    released: {
      bg: '#DCFCE7', stroke: C.green,
      icon: <path d="M20 6L9 17l-5-5"/>,
      title: 'QA Released',
      sub: `QA cleared ${lotOf(order)} in Business Central. The whole lot is released and ready for dispatch.`,
      badge: { state: 'QA_RELEASED', label: 'RELEASED' },
    },
    hold: {
      bg: '#FEE2E2', stroke: C.red,
      icon: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
      title: 'QA Hold Raised',
      sub: `A PDR was raised in Business Central. Nothing on ${lotOf(order)} can proceed until the hold is cleared.`,
      badge: { state: 'QA_HOLD', label: 'QA REVIEW - HOLD' },
    },
  };
  const cfg = stateConfig[shown];

  // No Release and no Raise Hold button. The workbook marks column M red and
  // sets its Scanner Data Fields cell to N/A, which means the scanner captures
  // nothing at this step. QA release and PDRs are raised in Business Central;
  // the app only reports what came back.
  let bottom;
  if (shown === 'released') {
    bottom = <Btn label="Continue to Dispatch →" onClick={() => navigate('packing')} color="green" large />;
  } else if (shown === 'hold') {
    bottom = <Btn label="View QA Hold Details" onClick={() => navigate('qa_hold', { pdrReference: 'PDR-2026-007' })} color="darkRed" large />;
  } else {
    bottom = <Btn label="Back to Dashboard" onClick={() => navigate('dashboard')} color="blue" large />;
  }

  return (
    <PageWrapper title="QA Status" onBack={() => navigate('dashboard')}
      bottomBar={bottom}>
      <div style={{ padding: '20px 16px' }}>
        {/* QA review itself is a Business Central operation - the app shows the
            outcome and lets QA record it, but the review is not a scan. */}
        <div style={{
          background: '#F8FAFC', border: `1px dashed ${C.border}`, borderRadius: 10,
          padding: '9px 12px', marginBottom: 14,
        }}>
          <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, lineHeight: 1.45 }}>
            QA review is a desktop operation in Business Central, carried out on the whole
            order once every pallet is out of the process. The scanner captures no fields at
            this step, so this screen is read only - it reports the outcome, it does not set it.
          </span>
        </div>

        {/* The same lot card Process Out shows, for the same reason: this screen
            is about the lot, and the pallet in hand is one row of it. */}
        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
            <span style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 13, fontWeight: 700, color: C.text }}>
              {lotOf(order)}
            </span>
            <PriorityChip order={order} />
          </div>
          <InfoRow label="Customer Name" value={order.customer} />
          <InfoRow label="Qty of Pallets Picked" value={`${gate.done} of ${gate.total}`} />
          <div style={{ height: 5, borderRadius: 3, background: C.border, overflow: 'hidden', marginTop: 10 }}>
            <div style={{
              width: `${(gate.done / Math.max(1, gate.total)) * 100}%`,
              height: '100%', borderRadius: 3, transition: 'width 220ms',
              background: gate.complete ? C.green : C.orange,
            }}/>
          </div>
          {!gate.complete && processBinNote(order) && (
            <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 8 }}>
              {processBinNote(order)}
            </div>
          )}
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted, marginTop: 6, lineHeight: 1.45 }}>
            {gate.complete
              ? 'Every pallet on this lot is out of the process bin, so QA can review the consignment.'
              : 'QA cannot review or release the lot until every pallet on it has been picked out of the process bin.'}
          </div>
        </Card>

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
          <SectionTitle title="QA Review" subtitle="Lot level - one outcome for the whole consignment" />
          <Badge state={cfg.badge.state} label={cfg.badge.label} />
        </div>
        <PalletChip id={appData.palletId || DEFAULT_PALLET_ID} />

        {/* Status card */}
        <Card style={{ padding: '20px 16px', marginBottom: 14, textAlign: 'center' }}>
          <div style={{
            width: 72, height: 72, borderRadius: 36, margin: '0 auto 14px',
            background: cfg.bg, display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke={cfg.stroke} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              {cfg.icon}
            </svg>
          </div>
          <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 18, fontWeight: 700, color: C.text, marginBottom: 4 }}>
            {cfg.title}
          </div>
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, color: C.muted, lineHeight: 1.5 }}>
            {cfg.sub}
          </div>
        </Card>

        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          <InfoRow label={LOT_LABEL} value={lotText(order)} bold={!!lotOf(order)} />
          <InfoRow label="Pallet ID" value={appData.palletId || DEFAULT_PALLET_ID} />
          <InfoRow label="Customer" value={order.customer} />
          <InfoRow label="Stream" valueEl={<StreamBadge stream={appData.stream || order.stream || 'irradiation'} />} />
          <InfoRow label="Process-Out" value={stamp(order, '14:32')} />
          {done && <InfoRow label="QA Reviewer" value="Sarah Mitchell" />}
          {done && <InfoRow label="Reviewed At" value={stamp(order, '16:08')} />}
          {done && <InfoRow label="Returned to" value={`${order.assignee || 'Operator'} (operator)`} />}
        </Card>

        {/* Explicit hand-back confirmation - QA's part ends here */}
        {done && (
          <div style={{
            display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 14,
            background: '#EEF2FF', border: '1px solid #C7D2FE', borderRadius: 12, padding: '12px 14px',
          }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.brand} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
              <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
            </svg>
            <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, color: '#3730A3', lineHeight: 1.5 }}>
              QA recorded the outcome in Business Central. <strong>{lotOf(order)}</strong> is back with <strong>{order.assignee || 'the operator'}</strong> to {shown === 'hold' ? 'action the hold' : 'continue to dispatch'}.
            </span>
          </div>
        )}

        {/* While the gate is open, QA is waiting on the warehouse and there is
            nothing on this screen for them to press. Naming the pallets that are
            still in beats a counter: it is the answer to "what are we waiting
            on", and QA can chase those pallet ids. Read only - moving them is an
            operator scan. */}
        {!gate.complete && (
          <>
            <SectionTitle title={`Still in the process bin (${waitingOn.length})`}
              subtitle="Operators scan these out one at a time. QA starts once the last one is out." />
            <Card style={{ padding: '6px 0', marginBottom: 14 }}>
              {waitingOn.map(p => (
                <div key={p.id} style={{
                  display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                  padding: '9px 16px',
                }}>
                  <span style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12.5, fontWeight: 700, color: C.text }}>
                    {p.id}
                  </span>
                  <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11.5, color: C.muted }}>
                    {stateDetail(p.state)}
                  </span>
                </div>
              ))}
            </Card>
          </>
        )}
      </div>
    </PageWrapper>
  );
};

// ── Supervisor PIN Entry ──────────────────────
const SupervisorPINScreen = ({ navigate, appData }) => {
  const [pin, setPin] = React.useState('');
  const [reason, setReason] = React.useState('zone_mismatch');
  const [notes, setNotes] = React.useState('');
  const [error, setError] = React.useState(false);

  const CORRECT_PIN = '123456';

  const handleDigit = d => {
    if (pin.length < 6) setPin(p => p + d);
  };
  const handleBack = () => setPin(p => p.slice(0, -1));
  const handleConfirm = () => {
    if (pin === CORRECT_PIN) {
      navigate('override_confirm', { supervisorName: 'Sarah Mitchell', overrideReason: reason, overrideNotes: notes });
    } else {
      setError(true);
      setPin('');
      setTimeout(() => setError(false), 2000);
    }
  };

  const REASONS = [
    { value: 'zone_mismatch',      label: 'Zone mismatch' },
    { value: 'state_mismatch',     label: 'State mismatch' },
    { value: 'emergency_movement', label: 'Emergency movement' },
    { value: 'other',              label: 'Other' },
  ];

  return (
    <PageWrapper title="Supervisor PIN" onBack={() => navigate('scan_bin')} showLogo>
      <div style={{ padding: '20px 16px 8px' }}>
        <SectionTitle title="Supervisor Override" subtitle="A 6-digit supervisor PIN is required to proceed" />

        {appData.overrideReason && (
          <Alert type="warning" message={`Override triggered: ${appData.overrideReason}`} />
        )}

        {/* PIN dots */}
        <div style={{
          display: 'flex', justifyContent: 'center', gap: 12, margin: '20px 0',
        }}>
          {[0,1,2,3,4,5].map(i => (
            <div key={i} style={{
              width: 44, height: 44, borderRadius: 22,
              border: `2px solid ${error ? C.red : pin.length > i ? C.brand : C.border}`,
              background: pin.length > i ? (error ? C.red : C.brand) : C.white,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              transition: 'all 0.15s',
            }}>
              {pin.length > i && <div style={{ width: 10, height: 10, borderRadius: 5, background: '#fff' }}/>}
            </div>
          ))}
        </div>
        {error && <p style={{ textAlign: 'center', color: C.red, fontFamily: 'DM Sans,sans-serif', fontSize: 13, margin: '-8px 0 16px', fontWeight: 600 }}>Incorrect PIN - try again</p>}

        {/* Numpad */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginBottom: 20 }}>
          {['1','2','3','4','5','6','7','8','9','','0','⌫'].map((d, i) => (
            <button key={i} onClick={() => d === '⌫' ? handleBack() : d ? handleDigit(d) : null}
              disabled={!d}
              style={{
                height: 56, borderRadius: 14,
                background: d === '⌫' ? '#FEE2E2' : d ? C.white : 'transparent',
                border: d ? `1.5px solid ${C.border}` : 'none',
                fontFamily: 'DM Sans,sans-serif', fontSize: d === '⌫' ? 18 : 22, fontWeight: 600,
                color: d === '⌫' ? C.red : C.text, cursor: d ? 'pointer' : 'default',
                boxShadow: d ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
              }}>{d}</button>
          ))}
        </div>

        <Select label="Reason Code" value={reason} onChange={e => setReason(e.target.value)} options={REASONS} />
        <Field label="Mandatory Notes" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Describe the reason for override..." />
        <div style={{ height: 2 }}/>
        <Btn label="Confirm Override" onClick={handleConfirm} color="blue" disabled={pin.length < 6 || !notes} />
        <div style={{ height: 8 }}/>
        <Btn label="Cancel" onClick={() => navigate('scan_bin')} color="red" outline />
        <div style={{ height: 8, fontFamily: 'DM Sans,sans-serif', fontSize: 11, color: C.muted, textAlign: 'center', marginTop: 8 }}>
          Demo PIN: 123456
        </div>
      </div>
    </PageWrapper>
  );
};

// ── Override Confirm ──────────────────────────
const OverrideConfirmScreen = ({ navigate, appData }) => {

  return (

      </div>
    </PageWrapper>

};

            fontFamily: 'Outfit,sans-serif', fontSize: 26, fontWeight: 700,

          <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 18, fontWeight: 700, color: C.text, marginBottom: 4 }}>
            {operatorName}
          </div>
          <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>
            EMP-0042
          </div>
        </Card>

        {/* Account details */}
        <Card style={{ padding: '4px 16px', marginBottom: 14 }}>
          <InfoRow
            label="Account Type"
            valueEl={
              <span style={{
                display: 'inline-block', padding: '3px 10px', borderRadius: 999,
                background: '#EEF2FF', color: C.brand,
                fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
                textTransform: 'uppercase', letterSpacing: 0.5,
              }}>Warehouse Operator</span>
            }
          />
          <InfoRow label="Facility"     value="Steritech Wetherill Park" />
          <InfoRow label="Email"        value="pan.xiao@steritech.com.au" />
          <InfoRow label="App version"  value="1.0.0" />
        </Card>

        <Btn label="Sign Out" onClick={() => navigate('splash', { operator: '' })} color="red" outline />
      </div>
    </PageWrapper>
  );
};

Object.assign(window, {
  InStorageProcessedScreen, QAStatusScreen, PackingScreen, QAHoldScreen, DispatchScreen,
  SuccessScreen, FailScreen, StreamErrorScreen,
  SupervisorPINScreen, OverrideConfirmScreen, ProfileScreen,
});

</script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "defaultStream": "irradiation"
}/*EDITMODE-END*/;

const SCREEN_MAP = {
  splash:                   SplashScreen,
  scan_employee:            ScanEmployeeScreen,
  dashboard:                DashboardScreen,
  order_detail:             OrderDetailScreen,
  pallet_detail:            PalletDetailScreen,
  scan_pallet:              ScanPalletScreen,
  scan_bin:                 ScanBinScreen,
  summary:                  SummaryScreen,
  receiving_form:           ReceivingFormScreen,
  print_labels:             PrintLabelsScreen,
  process_in:               ProcessInScreen,
  process_out:              ProcessOutScreen,
  in_storage_processed:     InStorageProcessedScreen,
  qa_status:                QAStatusScreen,
  packing:                  PackingScreen,
  qa_hold:                  QAHoldScreen,
  dispatch:                 DispatchScreen,
  success:                  SuccessScreen,
  fail:                     FailScreen,
  stream_error:             StreamErrorScreen,
  supervisor_pin:           SupervisorPINScreen,
  override_confirm:         OverrideConfirmScreen,
  profile:                  ProfileScreen,
};

function App() {
  const [screen, setScreen] = React.useState('splash');
  const [appData, setAppData] = React.useState({
    operator: '',
    selectedOrder: SAMPLE_ORDERS[0],
    selectedPallet: DEFAULT_PALLET,
    palletId: DEFAULT_PALLET_ID,
    stream: 'irradiation',
    palletState: null,
    treatmentType: null,
    successMessage: '',
    successTitle: 'SUCCESS!!',
    failMessage: '',
    retryScreen: 'scan_bin',
    prevScreen: null,
    overrideReason: '',
    supervisorName: '',
    overrideNotes: '',
    pdrReference: null,
    binLocation: DEFAULT_PALLET.bin,
  });

  const navigate = React.useCallback((s, updates = {}) => {
    setAppData(prev => ({ ...prev, ...updates }));
    setScreen(s);
  }, []);

  React.useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    const screenSel = document.getElementById('tweak-screen');
    const streamSel = document.getElementById('tweak-stream');
    const closeBtn = document.getElementById('tweaks-close');

    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') panel.style.display = 'block';
      if (e.data?.type === '__deactivate_edit_mode') panel.style.display = 'none';
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    screenSel.addEventListener('change', () => {
      if (screenSel.value) { navigate(screenSel.value); screenSel.value = ''; }
    });
    streamSel.addEventListener('change', () => {
      setAppData(prev => ({ ...prev, stream: streamSel.value, selectedOrder: { ...(prev.selectedOrder || SAMPLE_ORDERS[0]), stream: streamSel.value } }));
    });
    closeBtn.addEventListener('click', () => {
      panel.style.display = 'none';
      window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
    });

    return () => window.removeEventListener('message', handler);
  }, [navigate]);

  const ScreenComponent = SCREEN_MAP[screen] || DashboardScreen;

  return (
    <div key={screen} className="screen-enter" style={{ width: '100%', height: '100%' }}>
      <ScreenComponent navigate={navigate} appData={appData} setAppData={setAppData} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
