<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SteriScan - Steritech Warehouse App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0F1623; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; }
  input, select, button, textarea { font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #4F6AF5; outline-offset: 1px; }
  ::-webkit-scrollbar { width: 0; }

  #phone-shell {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 2px #2A2F45, 0 0 0 8px #1A1F30, 0 30px 80px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  #app-root { width: 100%; height: 100%; overflow: hidden; }

  .screen-enter {
    animation: slideIn 0.22s cubic-bezier(0.4,0,0.2,1) both;
  }
  @keyframes slideIn {
    from { transform: translateX(32px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }

  #tweaks-panel {
    position: fixed; bottom: 20px; right: 20px;
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18); width: 220px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    display: none; z-index: 9999;
  }
  #tweaks-panel h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: #1C1917; }
  #tweaks-panel label { font-size: 11px; font-weight: 700; color: #78716C; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
  #tweaks-panel select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1.5px solid #E7E5E4; margin-bottom: 10px; font-family: inherit; font-size: 13px; }
  #tweaks-panel .close-btn { width: 100%; padding: 7px; border-radius: 8px; background: #F5F7FA; border: 1px solid #E7E5E4; cursor: pointer; font-size: 12px; color: #78716C; }
</style>
</head>
<body>
<div id="phone-shell">
  <div id="app-root"></div>
</div>

<div id="tweaks-panel">
  <h3>Tweaks</h3>
  <label>Jump to Screen</label>
  <select id="tweak-screen">
    <option value="">- choose -</option>
    <option value="splash">Splash</option>
    <option value="dashboard">Dashboard</option>
    <option value="order_detail">Order Detail</option>
    <option value="scan_pallet">Scan Pallet (after Dashboard)</option>
    <option value="pallet_items">Pallet Items</option>
    <option value="scan_bin">Scan Bin Location</option>
    <option value="summary">Summary</option>
    <option value="receiving_form">Receiving Form</option>
    <option value="in_storage_unprocessed">In Storage - Unprocessed</option>
    <option value="scan_bin_staging">Scan Pallet for Staging</option>
    <option value="staging_irradiation">Staging - Irradiation</option>
    <option value="staging_eto">Staging - EtO</option>
    <option value="staging_packing">Staging - Packing</option>
    <option value="treatment_active">Treatment Active</option>
    <option value="process_out_irradiation">Process-Out - Irradiation</option>
    <option value="process_out_eto">Process-Out - EtO</option>
    <option value="process_out_packing">Process-Out - Packing</option>
    <option value="in_storage_processed">In Storage - Processed</option>
    <option value="qa_status">QA Status</option>
    <option value="packing">Packing</option>
    <option value="qa_hold">QA Hold</option>
    <option value="dispatch">Dispatch</option>
    <option value="success">Success Screen</option>
    <option value="fail">Fail / Error Screen</option>
    <option value="stream_error">Stream Error</option>
    <option value="supervisor_pin">Supervisor PIN</option>
    <option value="override_confirm">Override Confirm</option>
  </select>
  <label>Service Stream</label>
  <select id="tweak-stream">
    <option value="irradiation">Irradiation</option>
    <option value="eto">EtO</option>
    <option value="packing">Packing</option>
  </select>
  <label>Role (wireframe demo only)</label>
  <select id="tweak-role">
    <option value="operator">Warehouse Operator</option>
    <option value="qa">QA Reviewer</option>
  </select>
  <button class="close-btn" id="tweaks-close">Close</button>
</div>

        <path d="M20 3.5v4a2 2 0 0 0 0-4z" fill="white" opacity=".4"/>
      </svg>
    </div>

// ── Badge ─────────────────────────────────────
const BADGE_MAP = {
  RECEIVED:               { bg: '#E2E8F0', color: '#475569' },
  STAGED:                 { bg: '#FEF3C7', color: '#92400E' },
  IN_TREATMENT:           { bg: '#FEF3C7', color: '#92400E' },
  PROCESS_OUT:            { bg: '#FEF3C7', color: '#92400E', label: 'AWAITING QA' },
  QA_RELEASED:            { bg: '#CCFBF1', color: '#0F766E' },
  QA_HOLD:                { bg: '#FEE2E2', color: '#991B1B' },
  SHIPPED:                { bg: '#DCFCE7', color: '#15803D' },
  IN_STORAGE_UNPROCESSED: { bg: '#E2E8F0', color: '#475569' },
  IN_STORAGE_PROCESSED:   { bg: '#FEF3C7', color: '#92400E', label: 'AWAITING QA' },
};

const Badge = ({ state, label }) => {
  const s = BADGE_MAP[state] || { bg: '#E2E8F0', color: '#555' };
  const text = label || s.label || state.replace(/_/g, ' ');
  return (
    <span style={{
      background: s.bg, color: s.color,
      borderRadius: 6, padding: '3px 8px',
      fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
      letterSpacing: '0.7px', display: 'inline-block',
    }}>{text}</span>
  );
};

const StreamBadge = ({ stream }) => {
  const map = {
    irradiation: { bg: '#EEF2FF', color: '#4338CA', label: 'IRRADIATION' },
    eto:         { bg: '#FFF7ED', color: '#C2410C', label: 'EtO' },
    packing:     { bg: '#F0FDF4', color: '#15803D', label: 'PACKING' },
  };
  const s = map[stream] || { bg: '#E2E8F0', color: '#555', label: stream };
  return (
    <span style={{
      background: s.bg, color: s.color,
      borderRadius: 6, padding: '3px 8px',
      fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
      letterSpacing: '0.7px', display: 'inline-block',
    }}>{s.label}</span>
  );
};

// ── Button ────────────────────────────────────
const Btn = ({ label, onClick, color = 'orange', disabled = false, outline = false, small = false, large = false }) => {
  const bg = { orange: C.orange, green: C.green, red: C.red, blue: C.brand, teal: C.teal, darkRed: C.darkRed }[color] || C.orange;
  return (
    <button onClick={onClick} disabled={disabled} style={{
      width: '100%', height: large ? 64 : small ? 40 : 48, borderRadius: 16,
      background: disabled ? '#D1D5DB' : (outline ? 'transparent' : bg),
      color: disabled ? '#9CA3AF' : (outline ? bg : '#fff'),
      border: outline ? `2px solid ${bg}` : 'none',
      fontFamily: 'DM Sans,sans-serif', fontSize: large ? 18 : small ? 14 : 16, fontWeight: large ? 600 : 500,
      cursor: disabled ? 'not-allowed' : 'pointer',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      transition: 'filter 0.15s',
    }} onMouseDown={e => e.currentTarget.style.filter='brightness(0.9)'}
       onMouseUp={e => e.currentTarget.style.filter=''}
       onTouchStart={e => e.currentTarget.style.filter='brightness(0.9)'}
       onTouchEnd={e => e.currentTarget.style.filter=''}>{label}</button>
  );
};

// ── Scan Viewfinder ───────────────────────────
const ScanView = ({ onSimulate, label = 'Tap to Scan', onManual, manualLabel }) => {
  const [scanning, setScanning] = React.useState(false);
  const [lineY, setLineY] = React.useState(20);
  const dirRef = React.useRef(1);
  const rafRef = React.useRef(null);

  const animate = React.useCallback(() => {
    setLineY(y => {
      const next = y + dirRef.current * 2.5;
      if (next >= 155) dirRef.current = -1;
      if (next <= 10) dirRef.current = 1;
      return next;
    });
    rafRef.current = requestAnimationFrame(animate);
  }, []);

  const startScan = () => {
    if (scanning) return;
    setScanning(true);
    rafRef.current = requestAnimationFrame(animate);
    setTimeout(() => {
      cancelAnimationFrame(rafRef.current);
      setScanning(false);
      onSimulate && onSimulate();
    }, 1800);
  };

  React.useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, width: '100%' }}>
      <div onClick={startScan} style={{
        width: '100%', height: 260, borderRadius: 18,
        background: '#151A2D', position: 'relative', overflow: 'hidden', cursor: 'pointer',
        border: `2px solid ${scanning ? C.accent : '#2C3350'}`,
        transition: 'border-color 0.3s',
      }}>
        {/* Corner brackets */}
        {[[8,8,null,null],[8,null,null,8],[null,8,8,null],[null,null,8,8]].map(([t,l,b,r], i) => (
          <svg key={i} width="22" height="22" viewBox="0 0 22 22" fill="none"
            style={{ position:'absolute', top:t, left:l, bottom:b, right:r }}>
            {i===0 && <><path d="M4 18V4h14" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===1 && <><path d="M18 18V4H4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===2 && <><path d="M4 4v14h14" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===3 && <><path d="M18 4v14H4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
          </svg>
        ))}
        {scanning ? (
          <div style={{
            position:'absolute', left:16, right:16,
            top: lineY, height: 2,
            background: 'rgba(79,106,245,0.95)',
            boxShadow: '0 0 10px 2px rgba(79,106,245,0.6)',
            borderRadius: 1,
          }}/>
        ) : (
          <div style={{
            position:'absolute', inset:0, display:'flex',
            flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10,
          }}>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="1.5">
              <rect x="3" y="3" width="5" height="5" rx="1"/>
              <rect x="16" y="3" width="5" height="5" rx="1"/>
              <rect x="3" y="16" width="5" height="5" rx="1"/>
              <line x1="10" y1="5.5" x2="14" y2="5.5"/>
              <line x1="10" y1="18.5" x2="14" y2="18.5"/>
              <line x1="5.5" y1="10" x2="5.5" y2="14"/>
              <line x1="18.5" y1="10" x2="18.5" y2="14"/>
              <rect x="16" y="16" width="5" height="5" rx="1"/>
              <line x1="12" y1="10" x2="12" y2="14"/>
              <line x1="10" y1="12" x2="14" y2="12"/>
            </svg>
            <span style={{ color:'rgba(255,255,255,0.45)', fontFamily:'DM Sans,sans-serif', fontSize:12 }}>Tap to activate camera</span>
          </div>
        )}
        {scanning && (
          <div style={{

                        <Field label="Cartons" type="number" value={ev(`p${pi}c${ci}_cartons`, String(c.cartons))} onChange={e => setEV(`p${pi}c${ci}_cartons`, e.target.value)} />
                        <Field label="CHEPs" type="number" value={ev(`p${pi}c${ci}_cheps`, String(c.cheps))} onChange={e => setEV(`p${pi}c${ci}_cheps`, e.target.value)} />
                        <Field label="Pulp min" value={ev(`p${pi}c${ci}_pmin`, c.pulpMin)} onChange={e => setEV(`p${pi}c${ci}_pmin`, e.target.value)} />
                        <Field label="Pulp max" value={ev(`p${pi}c${ci}_pmax`, c.pulpMax)} onChange={e => setEV(`p${pi}c${ci}_pmax`, e.target.value)} />
                        <Field label="Address" value={ev(`p${pi}c${ci}_addr`, c.address)} onChange={e => setEV(`p${pi}c${ci}_addr`, e.target.value)} />

                      <button key={o.v} onClick={() => setEV('collection', o.v)} style={{

                        fontFamily: 'DM Sans,sans-serif', fontSize: 14, fontWeight: 600, color: sel ? C.brand : C.text,

                  <>
                    <Field label="Delivery address" value={ev('deliveryAddress', req.deliveryAddress)} onChange={e => setEV('deliveryAddress', e.target.value)} />
                    <Field label="Expected delivery date" type="date" value={ev('expectedDelivery', '2026-04-14')} onChange={e => setEV('expectedDelivery', e.target.value)} />
                    <Field label="Charge" value={ev('charge', 'STERITECH')} onChange={e => setEV('charge', e.target.value)} />
                  </>
                ) : (
                  <>
                    <Field label="Address" value={ev('deliveryAddress', req.deliveryAddress)} onChange={e => setEV('deliveryAddress', e.target.value)} />
                    <Field label="Expected dispatch date" type="date" value={ev('expectedDispatch', '')} onChange={e => setEV('expectedDispatch', e.target.value)} />
                    <Field label="Third party truck company name" value={ev('thirdPartyTruck', '')} onChange={e => setEV('thirdPartyTruck', e.target.value)} placeholder="Company name" />
                  </>
                )}
              </>
            )}

            {step === 4 && (
              <>
                <label style={{ display: 'block', fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.6px' }}>Customer notes</label>
                <textarea value={ev('notes', req.notes)} onChange={e => setEV('notes', e.target.value)} style={{
                  width: '100%', minHeight: 92, borderRadius: 10, padding: '12px 14px', marginBottom: 14,
                  border: `1.5px solid #D1CEC9`, background: '#fff', resize: 'vertical',
                  fontFamily: 'DM Sans,sans-serif', fontSize: 14, color: C.text, outline: 'none', boxSizing: 'border-box', lineHeight: 1.45,
                }}/>
              </>
            )}

            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={() => setShowEdit(false)} style={{
                flex: '0 0 38%', padding: '13px', borderRadius: 12,
                background: '#fff', border: `1.5px solid ${C.border}`, color: C.text,
                fontFamily: 'DM Sans,sans-serif', fontSize: 15, fontWeight: 600, cursor: 'pointer',

          </div>
        </div>

};

// ── In Storage - Unprocessed (cleanup) ───────
const InStorageUnprocessedScreen = ({ navigate, appData }) => {
  const order = appData.selectedOrder || SAMPLE_ORDERS[0];
  const stream = appData.stream || order.stream || 'irradiation';

  return (
    <PageWrapper title="In Storage" onBack={() => navigate('dashboard')}
      bottomBar={
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <Btn label="Continue to Staging" onClick={() => navigate('scan_bin_staging')} color="blue" />
          <Btn label="Relocate Pallet" onClick={() => navigate('scan_bin')} color="blue" outline />
        </div>
      }>
      <div style={{ padding: '20px 16px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <SectionTitle title="Pallet In Storage" />
          <PalletChip id={appData.palletId || 'PLT-A04-001'} />
        </div>

        <Card style={{ padding: '14px 16px', marginBottom: 14 }}>
          <InfoRow label="Status" valueEl={<Badge state="RECEIVED" label="IN STORAGE - UNPROCESSED" />} />
          <InfoRow label="Zone" value="Zone A - Bay 04" />
          <InfoRow label="Customer" value={order.customer} />
          <InfoRow label="Product" value={order.product} />
          <InfoRow label="Stream" valueEl={<StreamBadge stream={stream} />} />
          <InfoRow label="Received" value={order.date} />
        </Card>

        <Alert type="info" message="Pallet is awaiting staging. Tap 'Continue to Staging' to begin the treatment workflow." />
      </div>
    </PageWrapper>
  );
};

// ── Scan for Staging (intermediate step) ──────
const ScanBinStagingScreen = ({ navigate, appData }) => {
  const stream = appData.stream || (appData.selectedOrder && appData.selectedOrder.stream) || 'irradiation';

  const proceed = () => {

// ── Supervisor PIN Entry ──────────────────────
const SupervisorPINScreen = ({ navigate, appData }) => {
  const [pin, setPin] = React.useState('');
  const [reason, setReason] = React.useState('zone_mismatch');
  const [notes, setNotes] = React.useState('');
  const [error, setError] = React.useState(false);

  const CORRECT_PIN = '123456';

  const handleDigit = d => {
    if (pin.length < 6) setPin(p => p + d);
  };
  const handleBack = () => setPin(p => p.slice(0, -1));
  const handleConfirm = () => {
    if (pin === CORRECT_PIN) {
      navigate('override_confirm', { supervisorName: 'Sarah Mitchell', overrideReason: reason, overrideNotes: notes });
    } else {
      setError(true);
      setPin('');
      setTimeout(() => setError(false), 2000);
    }
  };

  const REASONS = [
    { value: 'zone_mismatch',      label: 'Zone mismatch' },
    { value: 'state_mismatch',     label: 'State mismatch' },
    { value: 'emergency_movement', label: 'Emergency movement' },
    { value: 'other',              label: 'Other' },
  ];

  return (
    <PageWrapper title="Supervisor PIN" onBack={() => navigate('scan_bin')} showLogo>
      <div style={{ padding: '20px 16px 8px' }}>
        <SectionTitle title="Supervisor Override" subtitle="A 6-digit supervisor PIN is required to proceed" />

        {appData.overrideReason && (
          <Alert type="warning" message={`Override triggered: ${appData.overrideReason}`} />
        )}

        {/* PIN dots */}
        <div style={{
          display: 'flex', justifyContent: 'center', gap: 12, margin: '20px 0',
        }}>
          {[0,1,2,3,4,5].map(i => (
            <div key={i} style={{
              width: 44, height: 44, borderRadius: 22,
              border: `2px solid ${error ? C.red : pin.length > i ? C.brand : C.border}`,
              background: pin.length > i ? (error ? C.red : C.brand) : C.white,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              transition: 'all 0.15s',
            }}>
              {pin.length > i && <div style={{ width: 10, height: 10, borderRadius: 5, background: '#fff' }}/>}
            </div>
          ))}
        </div>
        {error && <p style={{ textAlign: 'center', color: C.red, fontFamily: 'DM Sans,sans-serif', fontSize: 13, margin: '-8px 0 16px', fontWeight: 600 }}>Incorrect PIN - try again</p>}

        {/* Numpad */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginBottom: 20 }}>
          {['1','2','3','4','5','6','7','8','9','','0','⌫'].map((d, i) => (
            <button key={i} onClick={() => d === '⌫' ? handleBack() : d ? handleDigit(d) : null}
              disabled={!d}
              style={{
                height: 56, borderRadius: 14,
                background: d === '⌫' ? '#FEE2E2' : d ? C.white : 'transparent',
                border: d ? `1.5px solid ${C.border}` : 'none',
                fontFamily: 'DM Sans,sans-serif', fontSize: d === '⌫' ? 18 : 22, fontWeight: 600,
                color: d === '⌫' ? C.red : C.text, cursor: d ? 'pointer' : 'default',
                boxShadow: d ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
              }}>{d}</button>
          ))}
        </div>

        <Select label="Reason Code" value={reason} onChange={e => setReason(e.target.value)} options={REASONS} />
        <Field label="Mandatory Notes" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Describe the reason for override..." />
        <div style={{ height: 2 }}/>
        <Btn label="Confirm Override" onClick={handleConfirm} color="blue" disabled={pin.length < 6 || !notes} />
        <div style={{ height: 8 }}/>
        <Btn label="Cancel" onClick={() => navigate('scan_bin')} color="red" outline />
        <div style={{ height: 8, fontFamily: 'DM Sans,sans-serif', fontSize: 11, color: C.muted, textAlign: 'center', marginTop: 8 }}>
          Demo PIN: 123456
        </div>
      </div>
    </PageWrapper>
  );
};

  InStorageProcessedScreen, QAStatusScreen, PackingScreen, QAHoldScreen, DispatchScreen,
  SuccessScreen, FailScreen, StreamErrorScreen,

});

</script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "defaultStream": "irradiation"
}/*EDITMODE-END*/;

const SCREEN_MAP = {
  splash:                   SplashScreen,
  scan_employee:            ScanEmployeeScreen,
  dashboard:                DashboardScreen,
  order_detail:             OrderDetailScreen,
  scan_pallet:              ScanPalletScreen,
  pallet_items:             PalletItemsScreen,
  scan_bin:                 ScanBinScreen,
  scan_bin_staging:         ScanBinStagingScreen,
  summary:                  SummaryScreen,
  receiving_form:           ReceivingFormScreen,
  in_storage_unprocessed:   InStorageUnprocessedScreen,
  staging_irradiation:      StagingIrradiationScreen,
  staging_eto:              StagingEtOScreen,
  staging_packing:          StagingPackingScreen,
  treatment_active:         TreatmentActiveScreen,
  process_out_irradiation:  ProcessOutIrradiationScreen,
  process_out_eto:          ProcessOutEtOScreen,
  process_out_packing:      ProcessOutPackingScreen,
  in_storage_processed:     InStorageProcessedScreen,
  qa_status:                QAStatusScreen,
  packing:                  PackingScreen,
  qa_hold:                  QAHoldScreen,
  dispatch:                 DispatchScreen,
  success:                  SuccessScreen,
  fail:                     FailScreen,
  stream_error:             StreamErrorScreen,
  supervisor_pin:           SupervisorPINScreen,
  override_confirm:         OverrideConfirmScreen,
  profile:                  ProfileScreen,
};

function App() {
  const [screen, setScreen] = React.useState('splash');
  const [appData, setAppData] = React.useState({
    operator: '',
    role: 'operator',
    selectedOrder: SAMPLE_ORDERS[0],
    palletId: 'PLT-A04-001',
    stream: 'irradiation',
    palletState: null,
    treatmentType: null,
    successMessage: '',
    successTitle: 'SUCCESS!!',
    failMessage: '',
    retryScreen: 'scan_bin',
    prevScreen: null,
    overrideReason: '',
    supervisorName: '',
    overrideNotes: '',
    pdrReference: null,
    binLocation: 'Zone A - Bay 04',
  });

  const navigate = React.useCallback((s, updates = {}) => {
    setAppData(prev => ({ ...prev, ...updates }));
    setScreen(s);
  }, []);

  React.useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    const screenSel = document.getElementById('tweak-screen');
    const streamSel = document.getElementById('tweak-stream');
    const roleSel = document.getElementById('tweak-role');
    const closeBtn = document.getElementById('tweaks-close');

    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') panel.style.display = 'block';
      if (e.data?.type === '__deactivate_edit_mode') panel.style.display = 'none';
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    screenSel.addEventListener('change', () => {
      if (screenSel.value) { navigate(screenSel.value); screenSel.value = ''; }
    });
    streamSel.addEventListener('change', () => {
      setAppData(prev => ({ ...prev, stream: streamSel.value, selectedOrder: { ...(prev.selectedOrder || SAMPLE_ORDERS[0]), stream: streamSel.value } }));
    });
    roleSel.addEventListener('change', () => {
      setAppData(prev => ({ ...prev, role: roleSel.value }));
    });
    closeBtn.addEventListener('click', () => {
      panel.style.display = 'none';
      window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
    });

    return () => window.removeEventListener('message', handler);
  }, [navigate]);

  const ScreenComponent = SCREEN_MAP[screen] || DashboardScreen;

  return (
    <div key={screen} className="screen-enter" style={{ width: '100%', height: '100%' }}>
      <ScreenComponent navigate={navigate} appData={appData} setAppData={setAppData} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
