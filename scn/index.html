<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SteriScan - Steritech Warehouse App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0F1623; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; }
  input, select, button, textarea { font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #4F6AF5; outline-offset: 1px; }
  ::-webkit-scrollbar { width: 0; }

  #phone-shell {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 2px #2A2F45, 0 0 0 8px #1A1F30, 0 30px 80px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  #app-root { width: 100%; height: 100%; overflow: hidden; }

  .screen-enter {
    animation: slideIn 0.22s cubic-bezier(0.4,0,0.2,1) both;
  }
  @keyframes slideIn {
    from { transform: translateX(32px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }

  #tweaks-panel {
    position: fixed; bottom: 20px; right: 20px;
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18); width: 220px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    display: none; z-index: 9999;
  }
  #tweaks-panel h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: #1C1917; }
  #tweaks-panel label { font-size: 11px; font-weight: 700; color: #78716C; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
  #tweaks-panel select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1.5px solid #E7E5E4; margin-bottom: 10px; font-family: inherit; font-size: 13px; }
  #tweaks-panel .close-btn { width: 100%; padding: 7px; border-radius: 8px; background: #F5F7FA; border: 1px solid #E7E5E4; cursor: pointer; font-size: 12px; color: #78716C; }
</style>
</head>
<body>
<div id="phone-shell">
  <div id="app-root"></div>
</div>

<div id="tweaks-panel">
  <h3>Tweaks</h3>
  <label>Jump to Screen</label>
  <select id="tweak-screen">
    <option value="">- choose -</option>
    <option value="splash">Splash</option>
    <option value="site_select">Site Select (IT / admin only)</option>
    <option value="stream_select">Stream Select (after badge scan)</option>
    <option value="dashboard">Home (process flow)</option>
    <option value="task_queue">Task Queue (one step)</option>
    <option value="all_orders">All Orders (full list)</option>
    <option value="order_detail">Order Detail (ORD - pallet list)</option>
    <option value="pallet_detail">Pallet Detail (PLT - workflow)</option>
    <option value="scan_pallet">Pallet/Order Search (scan or search)</option>
    <option value="incident">On Hold (form)</option>
    <option value="scan_bin">Scan Bin Location</option>
    <option value="summary">Pallet Summary (demo only - no route)</option>
    <option value="receiving_form">Arrival Form (product-line matching)</option>
    <option value="print_labels">Print Pallet Labels</option>
    <option value="process_in">Process In</option>
    <option value="process_out">Process Out</option>
    <option value="in_storage_processed">Stored - Processed (demo only - no route)</option>
    <option value="qa_status">QA Status</option>
    <option value="packing">Packing (not on the workbook - TBC)</option>
    <option value="qa_hold">QA Hold</option>
    <option value="dispatch">Dispatch</option>
    <option value="success">Success Screen</option>
    <option value="fail">Fail / Error Screen</option>
    <option value="stream_error">Stream Error (demo only - no route)</option>
    <option value="supervisor_pin">Supervisor PIN</option>
    <option value="override_confirm">Override Confirm</option>
  </select>
  <label>Service Stream</label>
  <select id="tweak-stream">
    <option value="irradiation">Irradiation</option>
    <option value="eto">EtO</option>
    <option value="packing">Packing</option>
  </select>
  <button class="close-btn" id="tweaks-close">Close</button>
</div>

<script type="text/babel">
// SteriScan - Shared UI Components
// ─────────────────────────────────

  green:   '#008D02',
  teal:    '#10B981',
  red:     '#C20C0F',
  darkRed: '#8D0000',
  amber:   '#D97706',
  text:    '#1C1917',

        <path d="M20 3.5v4a2 2 0 0 0 0-4z" fill="white" opacity=".4"/>
      </svg>
    </div>
  </div>

// ── Badge ─────────────────────────────────────
// One badge per internal state, but every LABEL is one of Steritech's six
// statuses from the 19 Aug workbook. Two internal states can share a label on
// purpose: IN_STORAGE_UNPROCESSED and STAGED are both Received as far as the
// client's status model is concerned, and the app tells them apart internally to
// know which screen to open. Processing starts at the process-in scan, so a
// staged pallet has not reached it yet.
//
// QA_HOLD is the one addition. The workbook has no hold status, but a held pallet
// has to be findable in a list, so it reads QA Review with the hold called out.
const BADGE_MAP = {
  ARRIVED:                { bg: '#F1F5F9', color: '#64748B', label: 'CREATED' },
  RECEIVED:               { bg: '#E2E8F0', color: '#475569', label: 'RECEIVED' },
  IN_STORAGE_UNPROCESSED: { bg: '#E2E8F0', color: '#475569', label: 'RECEIVED' },
  STAGED:                 { bg: '#E2E8F0', color: '#475569', label: 'RECEIVED' },
  IN_TREATMENT:           { bg: '#FEF3C7', color: '#92400E', label: 'PROCESSING' },
  PROCESS_OUT:            { bg: '#FEF3C7', color: '#92400E', label: 'QA REVIEW' },
  IN_STORAGE_PROCESSED:   { bg: '#FEF3C7', color: '#92400E', label: 'QA REVIEW' },
  QA_HOLD:                { bg: '#FEE2E2', color: '#991B1B', label: 'QA REVIEW - HOLD' },
  QA_RELEASED:            { bg: '#CCFBF1', color: '#0F766E', label: 'RELEASED' },
  SHIPPED:                { bg: '#DCFCE7', color: '#15803D', label: 'DISPATCHED' },
};

const Badge = ({ state, label }) => {
  const s = BADGE_MAP[state] || { bg: '#E2E8F0', color: '#555' };
  const text = label || s.label || state.replace(/_/g, ' ');
  return (
    <span style={{
      background: s.bg, color: s.color,
      borderRadius: 6, padding: '3px 8px',
      fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
      letterSpacing: '0.7px', display: 'inline-block',
    }}>{text}</span>
  );
};

const StreamBadge = ({ stream }) => {
  const map = {
    irradiation: { bg: '#EEF2FF', color: '#4338CA', label: 'IRRADIATION' },
    eto:         { bg: '#FFF7ED', color: '#C2410C', label: 'EtO' },
    packing:     { bg: '#F0FDF4', color: '#15803D', label: 'PACKING' },
  };
  const s = map[stream] || { bg: '#E2E8F0', color: '#555', label: stream };
  return (
    <span style={{
      background: s.bg, color: s.color,
      borderRadius: 6, padding: '3px 8px',
      fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
      letterSpacing: '0.7px', display: 'inline-block',
    }}>{s.label}</span>
  );
};

// ── Scan Viewfinder ───────────────────────────
const ScanView = ({ onSimulate, label = 'Tap to Scan', onManual, manualLabel }) => {
  const [scanning, setScanning] = React.useState(false);
  const [lineY, setLineY] = React.useState(20);
  const dirRef = React.useRef(1);
  const rafRef = React.useRef(null);

  const animate = React.useCallback(() => {
    setLineY(y => {
      const next = y + dirRef.current * 2.5;
      if (next >= 155) dirRef.current = -1;
      if (next <= 10) dirRef.current = 1;
      return next;
    });
    rafRef.current = requestAnimationFrame(animate);
  }, []);

  const startScan = () => {
    if (scanning) return;
    setScanning(true);
    rafRef.current = requestAnimationFrame(animate);
    setTimeout(() => {
      cancelAnimationFrame(rafRef.current);
      setScanning(false);
      onSimulate && onSimulate();
    }, 1800);
  };

  React.useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, width: '100%' }}>
      <div onClick={startScan} style={{
        width: '100%', height: 260, borderRadius: 18,
        background: '#151A2D', position: 'relative', overflow: 'hidden', cursor: 'pointer',
        border: `2px solid ${scanning ? C.accent : '#2C3350'}`,
        transition: 'border-color 0.3s',
      }}>
        {/* Corner brackets */}
        {[[8,8,null,null],[8,null,null,8],[null,8,8,null],[null,null,8,8]].map(([t,l,b,r], i) => (
          <svg key={i} width="22" height="22" viewBox="0 0 22 22" fill="none"
            style={{ position:'absolute', top:t, left:l, bottom:b, right:r }}>
            {i===0 && <><path d="M4 18V4h14" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===1 && <><path d="M18 18V4H4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===2 && <><path d="M4 4v14h14" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
            {i===3 && <><path d="M18 4v14H4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></>}
          </svg>
        ))}
        {scanning ? (
          <div style={{
            position:'absolute', left:16, right:16,
            top: lineY, height: 2,
            background: 'rgba(79,106,245,0.95)',
            boxShadow: '0 0 10px 2px rgba(79,106,245,0.6)',
            borderRadius: 1,
          }}/>
        ) : (
          <div style={{
            position:'absolute', inset:0, display:'flex',
            flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10,
          }}>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="1.5">
              <rect x="3" y="3" width="5" height="5" rx="1"/>
              <rect x="16" y="3" width="5" height="5" rx="1"/>
              <rect x="3" y="16" width="5" height="5" rx="1"/>

// ═════════════════════════════════════════════════════════════════════════════

  // it, but nothing has been done to it and Process In is still the next scan.
  // Ben drew the line at the scan: "you scan one in, it moves into a processing
  // state." CUSTOMER_STATUS has always said Received here too.
  STAGED:                 'Received',
  IN_TREATMENT:           'Processing',
  PROCESS_OUT:            'QA Review',
  IN_STORAGE_PROCESSED:   'QA Review',
  QA_HOLD:                'QA Review',
  QA_RELEASED:            'Released',
  SHIPPED:                'Dispatched',
};
// The portal's vocabulary, kept here because the mapping is real and the API
// work needs it. It is deliberately NOT rendered anywhere in this app: the
// workbook lists Customer Status as a legend row explaining what the customer
// sees per column, while the scanner's own field list carries Steritech Status
// alone. This app is used by Steritech staff, so that is the only status shown.
const CUSTOMER_STATUS = {
  ARRIVED:                'Created',
  RECEIVED:               'Received',
  IN_STORAGE_UNPROCESSED: 'Received',
  STAGED:                 'Received',
  IN_TREATMENT:           'Received',
  PROCESS_OUT:            'Received',
  IN_STORAGE_PROCESSED:   'Received',
  QA_HOLD:                'Received',
  QA_RELEASED:            'Processed',

};

// fold onto one word: IN_STORAGE_UNPROCESSED and STAGED both read "Received",

  fresh_export:   ['Number of Spaces', 'Market & Dose', 'Request for Permit (RFP)', 'Freight Forwarder'],

const submittedValue = (order, label) => {
  const sub = (order && order.submitted) || {};

const binForState = (state, n) => {
  const nn = String(n).padStart(2, '0');
  switch (state) {
    // Nothing is binned before column G, so these two carry no bin at all.
    case 'ARRIVED':                return '';

    case 'IN_STORAGE_UNPROCESSED': return `Zone B - Bay ${nn}`;
    case 'STAGED':                 return `Zone B - Stage ${nn}`;
    case 'IN_TREATMENT':           return `Zone D - Cell ${((n - 1) % 3) + 1}`;
    case 'PROCESS_OUT':            return `Zone C - Bay ${nn}`;
    case 'IN_STORAGE_PROCESSED':   return `Zone C - Bay ${nn}`;

    case 'SHIPPED':                return '';

// ── Merrifield at working scale ──────────────────────────────────────────────
// Ben's objection was that the old home screen "won't scale well", and a seed of
// a dozen orders cannot show whether the new one does. Merrifield carries forty
// orders here. They are generated rather than written out one at a time, because
// what has to be true of them is volume and an even spread across the seven
// steps, not the detail of any single lot.
//
// Two rules the generator keeps:
//   Nothing but irradiation starts at Arrival. The arrival form is only
//   specified for irradiation on the 19 Aug sheet, so an EtO or packing lot on
//   the dock would open a step 3 with nothing on it.
//   The stream of every order is one the site can actually run. Merrifield is
//   Gamma and GMP, so irradiation and packing, never EtO.
const BULK_NAMES = [
  'Alpine Fresh Produce',       'Barwon Medical Supply',     'Coburg Clinical',
  'Deakin Surgical',            'Echuca Orchards',           'Footscray Diagnostics',
  'Geelong Sterile Products',   'Hume Valley Growers',       'Ivanhoe BioTech',
  'Jindabyne Fruit Co',         'Kyneton Health',            'Lilydale Produce',
  'Macedon Medical',            'Nagambie Nurseries',        'Oakleigh Devices',
  'Preston Pharma Packing',     'Queenscliff Seafoods',      'Rochester Citrus',
  'Seymour Surgical',           'Torquay Medical Group',     'Upwey Organics',
  'Violet Town Produce',        'Wangaratta Wound Care',     'Yarrawonga Fruit',
  'Zetland Clinical',           'Altona Packing Co',         'Bendigo BioPack',
  'Craigieburn Medical',        'Diamond Creek Farms',       'Essendon Sterile',
  'Frankston Fresh',            'Gisborne Labs',
];
// One product family per sub-stream, so a generated lot carries something the
// arrival form can sensibly ask about.
const BULK_ITEMS = {
  fresh_domestic: [{ name: 'Stone Fruit - Mixed Tray', code: 'PRD-2320' }, { name: 'Table Grapes - Thompson', code: 'PRD-2324' }],
  fresh_export:   [{ name: 'Citrus - Navel Export', code: 'PRD-2330' },   { name: 'Mangoes - Calypso', code: 'PRD-2334' }],
  medical:        [{ name: 'Procedure Gowns - L', code: 'PRD-1210' },      { name: 'Scalpel Blades - No 15', code: 'PRD-1214' }],
  biosecurity:    [{ name: 'Timber Packing Cases', code: 'PRD-1620' },     { name: 'Cane Furniture - Flat Pack', code: 'PRD-1624' }],
  packing:        [{ name: 'Sterile Barrier Pouches', code: 'PRD-1580' },  { name: 'Labelled Retail Cartons', code: 'PRD-1584' }],
};
const BULK_SUBMITTED = {
  fresh_domestic: { 'Number of Spaces': 2, 'Market & Dose': 'Domestic VIC / NSW, 0.4 - 1.0 kGy', 'Consignee': 'Melbourne Markets, Epping VIC', 'Storage Temperature': '2 C to 6 C', 'Consignor': 'Grower, VIC', 'Transport': 'Steritech to book' },
  fresh_export:   { 'Number of Spaces': 2, 'Market & Dose': 'Export USA, 0.4 - 1.0 kGy', 'Request for Permit (RFP)': 'RFP-2026-0190', 'Storage Temperature': '1 C to 4 C', 'Freight Forwarder': 'Kestrel Global Logistics' },
  medical:        { 'RPI': 'RPI-4600', 'Dose Range': '25 - 45 kGy' },
  biosecurity:    { 'Biosecurity Direction': 'AFF-DIR-2026-3400', 'Container Number': 'MSCU-8810440', 'RPI': 'RPI-5200', 'Dose Range': '25 - 50 kGy' },
};
// Seven states so the spread across the seven steps is even by construction.
const BULK_STATES = ['ARRIVED', 'RECEIVED', 'IN_STORAGE_UNPROCESSED', 'STAGED', 'IN_TREATMENT', 'PROCESS_OUT', 'QA_RELEASED'];
const BULK_SUBS   = ['fresh_domestic', 'medical', 'fresh_export', 'biosecurity'];

const bulkMerrifield = () => BULK_NAMES.map((customer, i) => {
  const state = BULK_STATES[i % BULK_STATES.length];
  // Packing is allowed at Merrifield, but never on a lot that is still at
  // Arrival, because packing has no arrival form on this sheet.
  const isPacking = state !== 'ARRIVED' && i % 5 === 4;
  // Only the two fresh-produce forms have arrival fields, so only those two
  // ever sit at Arrival.
  const sub  = isPacking ? null
    : state === 'ARRIVED' ? (i % 2 ? 'fresh_export' : 'fresh_domestic')
    : BULK_SUBS[i % BULK_SUBS.length];
  const num  = 100 + i;                      // ORD-2026-100 upwards
  const id   = `ORD-2026-${num}`;
  const n    = 1 + (i % 4);                  // one to four pallets
  const items = BULK_ITEMS[isPacking ? 'packing' : sub];
  // Dates walk backwards from 30 April so the ageing chips are not all equal.
  const day  = 30 - (i % 26);
  return {
    id, site: 'MER', customer,
    stream: isPacking ? 'packing' : 'irradiation',
    subStream: sub,
    po: `PO-2026-${4500 + i}`,
    priority: 30 + ((i * 7) % 45),
    date: `${day > 0 ? 'Apr' : 'Mar'} ${day > 0 ? day : 31 + day}`,
    assignee: i % 2 ? 'Pan Xiao' : 'Liam Carter',
    storageHandling: isPacking ? ['Ambient'] : ['Ambient, keep dry'],
    submitted: sub ? BULK_SUBMITTED[sub] : undefined,
    pallets: Array.from({ length: n }, (_, k) => {
      const nn = String(k + 1).padStart(2, '0');
      const it = items[k % items.length];
      return {
        id: `PLT-2026-${num}-${nn}`,
        state,
        weight: 34 + ((i + k) % 22),
        bin: binForState(state, 40 + i + k),
        items: [{ name: it.name, code: it.code, qty: 40 + ((i + k) % 8) * 30 }],
      };
    }),
  };
});

SAMPLE_ORDERS.push(...bulkMerrifield());

// ── Step progress mapping ─────────────────────
// Internal scan states, ordered. Finer grained than Steritech's six statuses on
// purpose: the app needs to tell STAGED from IN_TREATMENT to know which screen to
// open, and the lot gates count pallets at a specific one of these. Display folds
// them onto the six via STERITECH_STATUS.
const STATE_TO_STEP = {
  // ARRIVED is the gap the first build missed: a pallet on the dock that has not
  // been booked in yet. The 2026-08-25 call corrected WHEN it becomes Received.
  // The workbook reads as though printing the label at column F is what does it.
  // Ben said the opposite: "I think it's the opposite way. It prints a label once
  // we've received it." Booking the pallet in is the action and the print is a
  // consequence of it, so RECEIVED is set when the arrival form is submitted.
  // The lot number is not waiting on the label either - Business Central issues
  // it with the request. Only the bin arrives later, at column G.
  ARRIVED: 1, RECEIVED: 2, IN_STORAGE_UNPROCESSED: 3, STAGED: 4, IN_TREATMENT: 5,
  PROCESS_OUT: 6, IN_STORAGE_PROCESSED: 7, QA_HOLD: 7, QA_RELEASED: 8, SHIPPED: 9,
};

// ── Order/pallet helpers ──────────────────────────────────────────────────────
// An order has no state of its own. Everything shown at order level is DERIVED
// from the pallets underneath it, because the workflow instance lives on the
// pallet - not on the order and not on the commodity.
const STEP_OF         = p => STATE_TO_STEP[p.state] || 1;
const orderPallets    = o => (o && o.pallets) || [];
const orderWeight     = o => orderPallets(o).reduce((s, p) => s + p.weight, 0);
const orderItemCount  = o => orderPallets(o).reduce((s, p) => s + p.items.length, 0);
// "Number of Cartons" and "Total Pallet Quantity" from the workbook. Both are
// sums of what is actually on the pallets, so neither is stored.
const orderCartons    = o => orderPallets(o).reduce((s, p) => s + p.items.reduce((t, i) => t + i.qty, 0), 0);
const palletCartons   = p => ((p && p.items) || []).reduce((t, i) => t + i.qty, 0);
// The order sits at its SLOWEST pallet - it isn't finished until every pallet is.
const orderStep       = o => orderPallets(o).reduce((m, p) => Math.min(m, STEP_OF(p)), 99) || 1;
const orderState      = o => {
  const ps = orderPallets(o);
  if (!ps.length) return 'RECEIVED';
  // A hold anywhere in the order is the headline - it blocks the whole request.
  const held = ps.find(p => p.state === 'QA_HOLD');
  if (held) return 'QA_HOLD';
  return ps.reduce((lo, p) => (STEP_OF(p) < STEP_OF(lo) ? p : lo), ps[0]).state;
};
const palletsPastQA   = o => orderPallets(o).filter(p => STEP_OF(p) >= 8).length;
// ── Order workflow: intentionally NOT shown in this mockup ───────────────────
// Exsited already runs an "Orders" workflow on the Steritech Order Number
// component (Created, Accepted, On Hold, Late Arrival, Cancelled, Scheduled for
// Processing, In Process, Ready For Invoicing, Completed). It is a separate axis
// from the pallet states this app drives.
//
// We had derived an order badge from pallet progress, but how pallet scanning
// should move an order through those states is NOT agreed with Steritech yet -
// it is open questions 12 and 13 on the client question list. Rather than show a
// guess, the order badge is left out until they confirm the mapping.
//
// To restore: derive from the pallets (all Received -> Scheduled for Processing,
// any moving -> In Process, all Dispatched -> Ready For Invoicing), letting any
// explicit order-level state win. Full background: docs/STERISCAN-DATA-PLACEMENT.md
// Group an order's pallets by state, earliest workflow step first. Per-pallet
// chips stop working past ~6 pallets; a grouped count scales to 20 or 200.
// Grouped by STATUS, so the headings read in Steritech's own words. Grouping by
// internal state would print Received twice, once for IN_STORAGE_UNPROCESSED and
// once for STAGED, which tells the operator nothing.
const groupByState = pallets => {
  const groups = new Map();
  pallets.forEach(p => {
    const key = p.state === 'QA_HOLD' ? 'QA_HOLD' : steritechStatus(p.state);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  return [...groups.entries()]
    .map(([key, pallets]) => ({ state: pallets[0].state, label: key === 'QA_HOLD' ? 'QA Review - Hold' : key, pallets }))
    .sort((a, b) => statusIndex(a.state) - statusIndex(b.state));
};
// Order Detail groups the whole order; Pallet Detail groups the rest of the lot.
// Same grouping, same rows, same wording - one of them reading differently from
// the other is the bug, so there is only one implementation.
const palletsByState = o => groupByState(orderPallets(o));
const stateLabel = state =>
  (BADGE_MAP[state] && BADGE_MAP[state].label) || state.replace(/_/g, ' ');

// An order has no product of its own - what it contains is whatever its pallets
// carry. Deriving the label keeps it honest: a stored order-level product name
// silently lies as soon as the order carries more than one thing.
const uniqueNames = items => [...new Set(items.map(i => i.name))];
const summarise = names =>
  !names.length ? '' : names.length === 1 ? names[0] : `${names[0]} + ${names.length - 1} more`;
const palletProductLabel = p => summarise(uniqueNames((p && p.items) || []));
// A dispatched pallet has no bin. Say where it is, not what happened to it.
const binLabel = p => (p && p.bin) || (p && p.state === 'SHIPPED' ? 'Off site' : 'Not yet binned');
// Demo timestamps are anchored to the order's own arrival date. Hardcoding a
// date meant a pallet could show a treatment that started before it arrived.
const stamp = (order, time) => `${(order && order.date) || 'Apr 28'}, 2026 - ${time}`;
// Flat list of every physical pallet in the yard, each carrying its parent order.
const ALL_PALLETS     = SAMPLE_ORDERS.flatMap(o => o.pallets.map(p => ({ ...p, order: o })));
const DEFAULT_PALLET_ORDER = SAMPLE_ORDERS[0];
const DEFAULT_PALLET  = SAMPLE_ORDERS[0].pallets[0];
const DEFAULT_PALLET_ID = DEFAULT_PALLET.id;
// ── Site scoping ─────────────────────────────────────────────────────────────
// An operator signs in, picks their site, and from that point every list in the
// app is that site's yard only. Nothing filters by site further down: the four
// screens that LIST things do it here, and the detail screens never need to
// because you can only reach them through one of those lists.
const siteOf      = o => (o && o.site) || SITES[0].code;
const siteByCode  = code => SITES.find(x => x.code === code) || null;
const siteLabel   = code => { const x = siteByCode(code); return x ? `${x.name}, ${x.state}` : 'All sites'; };
// A null site means no site chosen yet, which only happens on a deep link from
// the Tweaks menu. Showing everything is the honest fallback.
const ordersAtSite  = code => code ? SAMPLE_ORDERS.filter(o => siteOf(o) === code) : SAMPLE_ORDERS;
const palletsAtSite = code => code ? ALL_PALLETS.filter(p => siteOf(p.order) === code) : ALL_PALLETS;

// ── Work stream (rev3, FDB-308) ──────────────────────────────────────────────
// "Isolation is at the highest level, IRR, PACK, ETO." Each of these runs in its
// own "black box", so each has its own schedule: an IRR order with a higher
// priority must not stop PACKING from scanning its next order. The operator says
// which one they are working right after sign-in, so a scanner can be shared by
// streams as well as by sites.
//
// The site's services are the same three in the portal's words (Gamma, ETO, GMP),
// mapped here onto the three stream keys an order carries.
// Business Central has not yet said how it will segregate streams between sites
// and processes (the rev3 notes say so), so this is a view filter only.
const SERVICE_STREAM = { Gamma: 'irradiation', ETO: 'eto', GMP: 'packing' };
const STREAM_LABEL   = { irradiation: 'Irradiation', eto: 'EtO', packing: 'Packing' };
const STREAM_SHORT   = { irradiation: 'IRR', eto: 'ETO', packing: 'PACK' };
const STREAM_ORDER   = ['irradiation', 'eto', 'packing'];
// The streams offered to an operator. Always all three. The workbook has one tab
// per stream (IRR, EtO, Packing), and a site's service list on the customer portal
// says what customers can BOOK there, not what the floor is allowed to scan, so
// narrowing the picker to it hid streams the business has. A stream a site has no
// work for simply shows zero.
const streamsAtSite = code => STREAM_ORDER.slice();
// null / 'all' means no stream chosen, which only happens on a Tweaks deep link.
const streamMatches = (order, stream) =>
  !stream || stream === 'all' || (order && order.stream) === stream;
const palletsInScope = (site, stream) => palletsAtSite(site).filter(p => streamMatches(p.order, stream));
const ordersInScope  = (site, stream) => ordersAtSite(site).filter(o => streamMatches(o, stream));

// ── Operator holds and damage (rev3, FDB-307) ────────────────────────────────
// A flag on the pallet, NOT a new workflow state. QA_HOLD belongs to Business
// Central (a PDR raised by QA); this is the floor saying "something is wrong with
// this pallet, do not move it". Keeping it off the state machine means every
// count and gate that reads pallet.state is unchanged, and clearing the flag puts
// the pallet exactly where it was.
// Like advancePallet, it has to be written on every copy of the pallet.
const setPalletHold = (pallet, hold) => {
  if (!pallet) return;
  const parent = orderOfPallet(pallet.id);
  [...orderPallets(parent), ...ALL_PALLETS, pallet]
    .filter(p => p && p.id === pallet.id)
    .forEach(p => { p.hold = hold || null; });
};
const isHeld     = p => !!(p && p.hold);
const holdLabel  = p => !p || !p.hold ? '' : (p.hold.kind === 'damage' ? 'DAMAGED' : 'ON HOLD');
// Up until final dispatch, per the rev3 note. A shipped pallet is off site.
const canRaiseIncident = p => !!p && p.state !== 'SHIPPED';

// Resolve a pallet id back to the order that owns it.
const orderOfPallet = palletId => {
  const hit = ALL_PALLETS.find(p => p.id === palletId);
  return hit ? hit.order : null;
};
// There is no backend here, so a scan has to move the pallet itself. Every id
// appears twice - once inside its order and once as a flattened copy in
// ALL_PALLETS - so both are updated or the dashboard counts drift away from the
// pallet's own screen.
const advancePallet = (pallet, state, bin) => {
  if (!pallet) return;
  const parent = orderOfPallet(pallet.id);
  [...orderPallets(parent), ...ALL_PALLETS, pallet]
    .filter(p => p && p.id === pallet.id)
    .forEach(p => { p.state = state; if (bin !== undefined) p.bin = bin; });
};

// ── Arrival memory (rev3, FDB-303 / FDB-304 / FDB-305) ───────────────────────
// There is no backend in this mockup, so what the operator has captured has to be
// kept somewhere that outlives the arrival screen. Three small stores, all keyed
// so a pallet or a lot finds its own data again.
//
//   ARRIVAL_DRAFTS   one pallet's capture, saved when receiving is blocked on a
//                    product line QA still has to create. "Ideally, if I was to
//                    enter the truck temperature ... this should remain until the
//                    product is created by QA and the process flow can continue."
//   ORDER_ARRIVAL    order-level fields, entered once and carried into every
//                    pallet of the lot. Truck temperature is the example Ben
//                    gave: it is the truck's, not the pallet's.
//   LABELS_WAITING   pallets whose label has printed but has not been attached
//                    yet, because the operator carried on to the next receival
//                    instead of walking to the printer.
const ARRIVAL_DRAFTS = {};
const ORDER_ARRIVAL  = {};
const LABELS_WAITING = new Set();
const draftFor       = p => (p && ARRIVAL_DRAFTS[p.id]) || null;
const labelsWaiting  = order => orderPallets(order).filter(p => LABELS_WAITING.has(p.id)).length;
const draftsFor      = order => orderPallets(order).filter(p => ARRIVAL_DRAFTS[p.id]).length;
// The printer a label goes to. One per site, named by site code.
const printerFor     = order => `PRN-${siteOf(order)}-01`;

// Resolve the pallet a screen is acting on, falling back safely for deep-links
// from the Tweaks "Jump to Screen" menu.
// ALL_PALLETS holds flattened *copies*, so a pallet arriving from the Pallets
// list is not the same object as the one inside its order. Always resolve back
// to the canonical instance, otherwise indexOf/identity checks silently fail.
const palletOf = (appData, order) => {
  const sel = appData.selectedPallet;
  if (sel) {
    const parent = orderOfPallet(sel.id) || order || appData.selectedOrder;
    return orderPallets(parent).find(p => p.id === sel.id) || sel;
  }
  return orderPallets(order || appData.selectedOrder)[0] || DEFAULT_PALLET;
};
// Each stream is specified differently. Packing has neither a dose nor a cycle,
// so labelling its pack type "Target Dose / Cycle" was simply wrong.
const treatmentSpec = stream =>
  stream === 'eto'     ? { label: 'Cycle',       value: 'Standard 12hr' } :
  stream === 'packing' ? { label: 'Pack Type',   value: 'Blister Pack'  } :
                         { label: 'Target Dose', value: '25 - 45 kGy'   };

// "Product - Dose Range" from the scan-label view. The dose belongs to the
// product reference, so it is read off the Business Central catalogue rather
// than stored a second time on every pallet.
const lineDose = (item, order) => {
  const hit = bcProductsFor((order && order.customer) || '').find(p => p.code === item.code);
  return (hit && hit.dose) || treatmentSpec(order && order.stream).value;
};

// ── Lot number, priority and the dual status ────────────────────────────────
// Lot number and order number are the SAME value - client, 2026-08-25: "lot
// numbers, order numbers, identical" - so there is one field here and not two.
// It is the order id, issued by Business Central when the portal request lands.
// LOT_LABEL carries the wording because which of the two names Steritech
// standardises on is still open and follows Business Central.
const LOT_LABEL = 'Lot / Order Number';
// Business Central does not always hand the number back straight away: the live
// portal shows a dash against orders that are not linked yet. That is a real
// state, so it is named rather than left reading as "this lot has no number".
const LOT_PENDING = 'Waiting on Business Central';
const lotOf   = order => (order && order.id) || '';
const lotText = order => lotOf(order) || LOT_PENDING;
const subStreamLabel = order =>
  (order && order.subStream && SUB_STREAMS[order.subStream]) || null;

// Priority is a position in Steritech's schedule, set by them at the scheduling
// step. Not three bands - a number, released at a default of 50 so it can be
// moved either way, and re-ordered by hand when urgent work lands. Ties are
// normal because everything starts on 50, so this is an ordering key and not a
// unique rank.
const PRIORITY_DEFAULT = 50;
// Ben, 2026-08-25: "currently ours is lowest number is highest priority ... you
// could invert it, whatever it is". Left as he described it, so if Steritech
// inverts it there is exactly one line to change.
const PRIORITY_LOWEST_IS_HIGHEST = true;
const priorityOf    = order => (order && order.priority) || PRIORITY_DEFAULT;
const priorityLabel = order => `Priority ${priorityOf(order)}`;
// One comparator, so the direction is decided in one place and nowhere else.
const byPriority = (a, b) =>
  (PRIORITY_LOWEST_IS_HIGHEST ? 1 : -1) * (priorityOf(a) - priorityOf(b));

// Steritech status is the internal one and is what this app shows. Customer
// status is shown alongside it so an operator can see what the customer sees -
// the two genuinely differ for most of the run.
const orderSteritechStatus = order => steritechStatus(orderState(order));
const orderCustomerStatus  = order => customerStatus(orderState(order));

// "Cannot change status until all pallets have been picked out of the process
// bin for the Lot number." Both process-in and process-out are gated on this,
// so the count lives in one place.
const palletsAtOrPast = (order, step) =>
  orderPallets(order).filter(p => STEP_OF(p) >= step).length;
const lotGate = (order, step) => {
  const total = orderPallets(order).length;
  const done  = palletsAtOrPast(order, step);
  return { done, total, complete: total > 0 && done >= total };
};

// The workbook gates the STATUS on all pallets being out of the process bin
// (cell K3) and says nothing about gating the process-out SCAN. The 2026-08-25
// call settled that. Asked whether one pallet can be processed out while the
// rest of the lot is still not in, Ben said "for simplicity, keep it full order.
// We have to receive it all for it to be collectively ready ... So all or
// nothing for the moment." So the scan is held until the whole lot is in.
//
// He was explicit that this is interim - he and Simon had not worked through the
// risks - and he named the case that will force a rethink: "we're receiving one
// pallet 2 hours before the next one. How do we run it?" It is one helper so
// that lifting the rule later is a one-line change.
const lotAllProcessedIn = order => lotGate(order, 5).complete;
// The other end of the same idea, and the one QA waits on. Not a block: QA review
// is not an action in this app, so there is nothing to refuse. It decides what the
// pallet's button promises and what the QA screen reports.
const lotAllProcessedOut = order => lotGate(order, 6).complete;
// Where the rest of the lot sits. The counter alone reads as if the missing
// pallets had gone somewhere unexplained.
const processBinSplit = order => {
  const total = orderPallets(order).length;
  const out   = palletsAtOrPast(order, 6);
  const inBin = palletsAtOrPast(order, 5) - out;
  return { total, out, inBin, notIn: total - out - inBin };
};
const processBinNote = order => {
  const s = processBinSplit(order);
  const parts = [];
  if (s.inBin) parts.push(`${s.inBin} still in the process bin`);
  if (s.notIn) parts.push(`${s.notIn} not processed in yet`);
  return parts.join(', ');
};

// Priority is worked from, not just displayed - process-in and process-out both
// order their lists by it, so it gets a chip of its own. One neutral style: a
// schedule number has no band to colour, and the only distinction Ben asked for
// was between the job in action and what is next, which the queue lists carry.
const PriorityChip = ({ order, current = false }) => (
  <span style={{
    background: current ? '#FEE2E2' : '#E2E8F0',
    color:      current ? '#991B1B' : '#475569',
    borderRadius: 6, padding: '3px 8px',
    fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700,
    letterSpacing: '0.5px', display: 'inline-block', whiteSpace: 'nowrap',
  }}>{priorityLabel(order)}</span>
);

// Steps the scanner does not own. Saying so on the pallet is better than leaving
// a gap the operator has to explain to themselves.
const BCStepsNote = () => (
  <div style={{
    background: '#F8FAFC', border: `1px dashed ${C.border}`, borderRadius: 12,
    padding: '12px 14px', marginBottom: 14,
  }}>
    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 8 }}>
      Handled in Business Central
    </div>
    {BC_STEPS.map(b => (
      <div key={b.label} style={{ display: 'flex', gap: 8, alignItems: 'baseline', marginBottom: 4 }}>
        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 13, fontWeight: 700, color: C.text }}>{b.label}</span>
        <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>{b.when}</span>
      </div>
    ))}
    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted, marginTop: 6, lineHeight: 1.45 }}>
      Neither step is a scan. The app waits for Business Central to move the lot on.
    </div>
  </div>
);

const KPI = ({ label, value, color }) => (
  <div style={{ flex: 1, background: '#fff', borderRadius: 12, padding: '10px 12px', border: `1px solid ${C.border}` }}>
    <div style={{ fontFamily: 'Outfit,sans-serif', fontSize: 22, fontWeight: 700, color }}>{value}</div>
    <div style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 600, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.4 }}>{label}</div>
  </div>
);

// ═════════════════════════════════════════════════════════════════════════════
// WORK STEPS - what the home screen is now made of
// ═════════════════════════════════════════════════════════════════════════════
// Ben Heard, 2026-09-10, reviewing the rev-1 home screen:
//   "Showing all orders at all stages is too overwhelming and won't scale well."
//   "The problem with having every order visible on the screen is that employees
//    will struggle to focus on a specific task. Thinking of the process in a
//    linear flow, one person may be assigned to a specific step in the workflow
//    for a period of, or their whole shift."
//   "Can the screen be segmented by steps and put in order of process?"
//
// So the home screen stopped being a list of orders. It is the list of STEPS, in
// process order, and each step holds only the pallets actually waiting on it. An
// operator finds their step once and works that one queue for the shift.
//
// He also set the constraint this array exists to satisfy:
//   "The app is designed to receive tasks from the server. This means that tasks
//    can change or adapt in future updates and isn't based on a fixed processor
//    workflow."
// Nothing below hardcodes a step name. The home flow, every count, the queue
// screen and the shift pin all read this array, so adding, removing or reordering
// a step is an edit here and nowhere else. In production this array IS the task
// payload the server hands the device at sign-in.
//
// `states` is what makes a step a QUEUE rather than a label: a pallet waits on
// exactly one step, the one whose state list holds its state. The lists are
// disjoint and together cover every state except SHIPPED - a dispatched pallet is
// off site and waiting on nobody, so it appears in All Orders only.
//
// `owner` is honest about who does the work. 'scan' means the app moves the
// pallet. 'bc' means Business Central does and this is a view - the same two
// steps BC_STEPS already names, Scheduling and QA Review.
const WORK_STEPS = [
  {
    key: 'arrival', label: 'Arrival', hint: 'Book pallets in off the dock',
    states: ['ARRIVED'], owner: 'scan', showPriority: false, colour: '#14488F',
    opens: 'receiving_form',
    icon: <><path d="M10.5 2.2h3v6.9l2.3-2.3 2.1 2.1L12 15 6.1 8.9l2.1-2.1 2.3 2.3V2.2z"/><path d="M2.2 16.4h19.6v3H2.2z" opacity=".35"/><path d="M3.8 19.4h3.4v2.4H3.8zM10.3 19.4h3.4v2.4h-3.4zM16.8 19.4h3.4v2.4h-3.4z" opacity=".35"/></>,
  },

// Filled, not stroked. Every place that draws a step icon goes through here, so
// there is one answer to "what does a step look like" instead of three.
const StepIcon = ({ step, size = 24, colour }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={colour || step.colour} stroke="none" aria-hidden="true">
    {step.icon}
  </svg>
);

const stepByKey  = key => WORK_STEPS.find(s => s.key === key) || WORK_STEPS[0];
// Site is passed in rather than read from a global, so the same helper serves
// the home counts, the queue screen and anything later that needs a count.
// Stream is optional and narrows the same list: with a stream chosen at sign-in,
// the home counts and every queue are that stream's work only.
const stepQueue  = (step, site, stream) => palletsInScope(site, stream).filter(p => step.states.indexOf(p.state) >= 0);
// Which step a pallet is waiting on. Used by search results, so a hit says what
// to do with the thing that was found instead of only naming it.
const stepOfPallet = p => WORK_STEPS.find(s => s.states.indexOf(p.state) >= 0) || null;

// Where a row in a step queue goes. Straight to that step's work, except where
// the pallet cannot be worked yet, and except for QA Review, which is per pallet
// because a held pallet and a pallet waiting on QA are two different screens.
const stepOpens = (step, pallet, order) => {
  // Process out is held until every pallet on the lot is in. Dropping the
  // operator on a screen they cannot act on is worse than showing them why, and
  // Pallet Detail is where the reason is written.
  if (step.key === 'process_out' && !lotAllProcessedIn(order)) return { screen: 'pallet_detail' };
  if (step.opens) return { screen: step.opens };
  const a = palletAction(pallet, order);
  return a || { screen: 'pallet_detail' };
};

// Ben, 2026-09-10: "Priority only required/given at the scheduling stage" and
// "the priority will only be shown during the scheduling step". This is the one
// place that decides it. The 19 Aug workbook does put a same-priority lot listing
// on process in (column J) and process out (column L), so those screens still
// show the queue - they just no longer print the number. Adding 'process_out'
// here puts it back there.
//
// Rev3 moved it. The Scheduling card is gone (FDB-306), and FDB-301/302 ask for
// the schedule to be visible "in this step": the next order to pick, and the full
// schedule with "all orders and their priorities". That step is Process In, so the
// number now lives there and nowhere else.
const PRIORITY_VISIBLE_AT = ['process_in'];
const priorityVisibleAt = stepKey => PRIORITY_VISIBLE_AT.indexOf(stepKey) >= 0;

// ── Ageing ───────────────────────────────────────────────────────────────────
// Ben's covering email, 2026-09-10: "With the scale of orders as well as timing,
// some orders are received and booked in but not processed for a few weeks. The
// current views won't work well."
// A queue that quietly buries its oldest pallet is exactly that failure, so every
// queue is oldest-first by default and the wait is on the row.
const DEMO_TODAY = new Date(2026, 4, 1);      // 1 May 2026 - the demo's "now"
const AGE_WATCH  = 7;                          // a week
const AGE_WARN   = 14;                         // "a few weeks"
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const orderDate = order => {
  const parts = String((order && order.date) || '').split(' ');
  const mi = MONTH_NAMES.indexOf(parts[0]);
  return mi < 0 ? DEMO_TODAY : new Date(2026, mi, Number(parts[1]) || 1);
};
// Days the LOT has been on site. The real figure is the timestamp the PALLET
// entered its current state, which nothing in the app holds yet - so this is
// derived from the order date and flagged rather than faked per pallet.
const ageDays  = order => Math.max(0, Math.round((DEMO_TODAY - orderDate(order)) / 86400000));
const ageTone  = d => d >= AGE_WARN ? { bg: '#FEF2F2', fg: '#B91C1C' }
                    : d >= AGE_WATCH ? { bg: '#FFFBEB', fg: '#B45309' }
                    : { bg: '#F1F5F9', fg: '#64748B' };
const AgeChip = ({ order }) => {
  const d = ageDays(order);
  const t = ageTone(d);
  return (
    <span style={{
      background: t.bg, color: t.fg, borderRadius: 6, padding: '3px 8px',
      fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 700, whiteSpace: 'nowrap',
    }}>{d === 0 ? 'Today' : `${d}d waiting`}</span>
  );
};
// How many pallets in a queue have been sitting past the "few weeks" mark. This
// is the number the home screen puts in red - the backlog Ben says the old view
// hid.
const stepOverdue = (step, site, stream) => stepQueue(step, site, stream).filter(p => ageDays(p.order) >= AGE_WARN).length;
// A held pallet is the thing an operator goes looking for, and the new home
// screen would otherwise bury it one tap down inside QA Review. A hold or damage
// flag raised on the floor (FDB-307) counts the same way as a QA hold.
const stepHolds = (step, site, stream) => stepQueue(step, site, stream).filter(p => p.state === 'QA_HOLD' || isHeld(p)).length;

// ── Single-pick steps (rev3, FDB-301 / FDB-302) ──────────────────────────────
// "Some steps require a single action for the user to perform (based on schedule
// or priorities). Other steps have multiple selections, picking any option." For
// the single-pick kind the screen shows ONE order, the one the schedule says is
// next, as a full card: how many pallets, what each is doing, where each one is.
//
// Orders still to be worked at this step, in the order the schedule says. The
// first one is "in action" and the rest wait their turn. Ties on priority are
// normal (everything is released at 50), so the longest waiting breaks them.
const pickOrders = (step, site, stream) => {
  const cfg = step.pick;
  if (!cfg) return [];
  const seen = new Map();
  palletsInScope(site, stream).forEach(p => {
    if (cfg.pickStates.indexOf(p.state) >= 0 && !seen.has(p.order.id)) seen.set(p.order.id, p.order);
  });
  // An order Business Central has scheduled comes before one it has not, then the
  // usual order. Only scheduled orders carry a priority.
  const isSched = o => orderPallets(o).some(p => cfg.pickStates.indexOf(p.state) >= 0);
  return [...seen.values()].sort((a, b) =>
    (isSched(b) - isSched(a)) ||
    (cfg.orderBy === 'priority'
      ? (byPriority(a, b) || ageDays(b) - ageDays(a) || a.id.localeCompare(b.id))
      : (ageDays(b) - ageDays(a) || a.id.localeCompare(b.id))));
};
// Every order still on its way through the step, scheduled or not, in schedule
// order. This is the read-only list behind the second tab.
const scheduleOrders = (step, site, stream) => {
  const cfg = step.pick;
  if (!cfg) return [];
  const seen = new Map();
  palletsInScope(site, stream).forEach(p => {
    if (cfg.scheduleStates.indexOf(p.state) >= 0 && !seen.has(p.order.id)) seen.set(p.order.id, p.order);
  });
  // An order Business Central has scheduled comes before one it has not, then the
  // usual order. Only scheduled orders carry a priority.
  const isSched = o => orderPallets(o).some(p => cfg.pickStates.indexOf(p.state) >= 0);
  return [...seen.values()].sort((a, b) =>
    (isSched(b) - isSched(a)) ||
    (cfg.orderBy === 'priority'
      ? (byPriority(a, b) || ageDays(b) - ageDays(a) || a.id.localeCompare(b.id))
      : (ageDays(b) - ageDays(a) || a.id.localeCompare(b.id))));
};
// "Go to rack B or room B and grab the pallets." The zone is the part of the bin
// name before the dash, so a pallet in "Zone B - Bay 21" sends the operator to
// Zone B. A pallet with no bin yet has nowhere to point at.
const zoneOf = bin => { const z = String(bin || '').split(' - ')[0].trim(); return z; };
const zonesFor = pallets => {
  const out = [];
  pallets.forEach(p => { const z = zoneOf(p.bin); if (z && out.indexOf(z) < 0) out.push(z); });
  return out;
};
// What one pallet is doing, in the words of the step it sits on. Used by the full
// card, where "what status each pallet is" is the point.
const pickStatus = (p, step) => {
  const cfg = step.pick;
  if (isHeld(p)) return { text: holdLabel(p), tone: 'red', work: false };
  if (cfg.pickStates.indexOf(p.state) >= 0) {
    return { text: step.key === 'dispatch' ? 'Ready to load' : 'Ready to pick', tone: 'green', work: true };
  }
  if (step.key === 'process_in') {
    if (p.state === 'IN_STORAGE_UNPROCESSED') return { text: 'In storage', tone: 'muted', work: false };
    if (STEP_OF(p) === 5) return { text: 'In the process bin', tone: 'done', work: false };
    if (STEP_OF(p) > 5)   return { text: 'Processed out', tone: 'done', work: false };
  }
  if (step.key === 'dispatch') {
    if (p.state === 'SHIPPED')  return { text: 'Dispatched', tone: 'done', work: false };
    if (p.state === 'QA_HOLD')  return { text: 'QA hold', tone: 'red', work: false };
    return { text: 'Waiting on QA', tone: 'muted', work: false };
  }
  return { text: stateLabel(p.state), tone: 'muted', work: false };
};

// One matcher for both surfaces, so a search on home and the same search in All
// Orders can never disagree about what counts as a hit.
const palletMatches = (p, q) =>
  p.id.toLowerCase().indexOf(q) >= 0
  || p.order.id.toLowerCase().indexOf(q) >= 0
  || p.order.customer.toLowerCase().indexOf(q) >= 0
  || (p.order.po || '').toLowerCase().indexOf(q) >= 0
  || p.items.some(it => it.name.toLowerCase().indexOf(q) >= 0 || it.code.toLowerCase().indexOf(q) >= 0);
const orderMatches = (o, q) =>
  o.id.toLowerCase().indexOf(q) >= 0
  || o.customer.toLowerCase().indexOf(q) >= 0
  || (o.po || '').toLowerCase().indexOf(q) >= 0
  || orderPallets(o).some(p => p.id.toLowerCase().indexOf(q) >= 0
      || p.items.some(it => it.name.toLowerCase().indexOf(q) >= 0 || it.code.toLowerCase().indexOf(q) >= 0));

// ── Site picker ──────────────────────────────────────────────────────────────
// Sits between the badge scan and the yard. An employee can belong to any of
// the four sites, so the badge says who they are and this says where they are.
// Laid out the way the customer portal lays out the same four sites, down to the
// service dots, because an operator who has seen one should recognise the other.
//
// It carries the pallet count per site as well, which the portal has no reason
// to: the portal is choosing where to send goods, this is choosing which yard to
// work, and "which of these has work waiting" is the question being asked.
const SiteRow = ({ site, onPick, current = false }) => {
  const pallets = palletsAtSite(site.code);
  // Deliberately no warning line here. Overdue and held counts were shown on
  // this row and taken back off: an operator does not choose a site, they are
  // at one, so a red flag on a site they cannot walk to is noise. Those numbers
  // belong on the step tiles inside the site, where they are actionable.
  return (
    <button onClick={() => onPick(site.code)} style={{
      width: '100%', textAlign: 'left', cursor: 'pointer',
      background: '#fff', borderRadius: 16,
      border: current ? `1.5px solid ${C.brand}` : `1px solid ${C.border}`,
      padding: '15px 16px', display: 'flex', alignItems: 'flex-start', gap: 13,
    }}>
      <div style={{
        width: 44, height: 44, borderRadius: 13, flexShrink: 0, background: '#EEF2F7',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'Outfit,sans-serif', fontSize: 14.5, fontWeight: 700,
        color: C.navBg, letterSpacing: 0.3,
      }}>{site.code}</div>

      <div style={{ flex: 1, minWidth: 0 }}>
        {/* Name and count share the top line. Sitting the count in its own
            column centred against a three-line block put it beside the service
            list, which read as one crowded sentence. */}
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
          <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 17, fontWeight: 700, color: C.text, whiteSpace: 'nowrap' }}>
            {site.name}
          </span>
          <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, fontWeight: 600, color: C.muted }}>
            {site.state}
          </span>
          <span style={{ flex: 1 }}/>
          <span style={{ fontFamily: 'Outfit,sans-serif', fontSize: 22, fontWeight: 700, color: pallets.length ? C.text : C.muted, lineHeight: 1 }}>
            {pallets.length}
          </span>
          <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 11, fontWeight: 600, color: C.muted }}>
            pallets
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, alignSelf: 'center' }}>
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>

        {/* Where you already are, when this screen is reached from Change. */}
        {current && (
          <div style={{ marginTop: 5 }}>
            <span style={{
              background: '#EEF2FF', color: C.brand, borderRadius: 5, padding: '2px 7px',
              fontFamily: 'DM Sans,sans-serif', fontSize: 9.5, fontWeight: 700, letterSpacing: 0.4,
            }}>CURRENT SITE</span>
          </div>
        )}

        {/* What the site can actually treat. These three keep their colours
            because they are a legend the customer portal already uses, and they
            are now the only colour on the row besides a warning. */}
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '3px 12px', marginTop: 7 }}>
          {site.services.map(sv => (
            <span key={sv} style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
              <span style={{ width: 6, height: 6, borderRadius: 3, background: SERVICE_COLOUR[sv] }}/>
              <span style={{ fontFamily: 'DM Sans,sans-serif', fontSize: 12, color: C.muted }}>
                {SERVICE_SHORT[sv]}
              </span>
            </span>
          ))}
        </div>

      </div>
    </button>
  );
};
