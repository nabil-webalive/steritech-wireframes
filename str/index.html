<!doctype html>
<!--
   ============================================================================
  Steritech Gen 2 Customer Portal — single-file wireframe
  ============================================================================

  HOW TO HOST
  -----------
  This is a self-contained HTML file. No build step, no server required.
    • Open locally   : double-click index.html
    • Host anywhere  : drop this file on S3 / Netlify / nginx / Apache / GitHub
                        Pages. Internal routing uses hash-URLs (#/dashboard)
                        so it works on plain static hosting — no rewrite rules
                        needed. All deps load from CDN (Vue 3, Tailwind, Lucide).

  SCREEN MAP (6 customer screens)
  -------------------------------
    1. Auth              #/login, #/signup
    2. Dashboard         #/dashboard            — stat tiles · quick-submit · recent
    3. Form Picker       #/forms                — grouped by treatment type
    4. Dynamic Form      #/forms/:fac/:formKey  — schema-driven, 5 live schemas
    5. Orders            #/orders               — list + filters
                         #/orders/:id           — detail + timeline
                         #/submitted/:id        — confirmation after submit
    6. Settings          #/settings             — Profile · Password ·
                                                  Commodities · Consignors ·
                                                  Consignees
  Dev-only: #/_dev/fields (field-library reference)

  ARCHITECTURE
  ------------
    • Vue 3 + Vue Router 4 (hash history)
    • Tailwind (CDN runtime) + Lucide icons (CDN)
    • One reactive `state` store; no Vuex/Pinia needed for a wireframe
    • 5 live form schemas wired into a schemaRegistry (DAN/bee-equipment,
      DAN/irradiation, NAR/treatment, NAR/bee-equipment, WPK/treatment)
    • Submit always routes to #/submitted/MOCK-12345 (no backend)
  ============================================================================
-->

/* ---------- Generated mock thread per order (so every order has demo
   messages without hand-curating 60 dictionary entries). Curated
   seedMessages above override generated when both are present. ---- */
function generateMockThread(order, customerName){
  const facName = (FACILITIES.find(f => f.code === order.facility) || {}).name || 'Facility';
  const admin = 'Steritech ' + facName;
  const customer = customerName || 'Alex Nguyen';
  const sub = order.submitted;
  const col = order.collection || sub;
  const ts = (date, h, m) => `${date}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const tpl = ({
    'Created':[
      { from:'customer', author:customer, ts:ts(sub,9,15), body:`Submitted this morning. Anything you need from us before you start?` },
      { from:'admin',    author:admin,    ts:ts(sub,10,2), body:`All received, thanks. We'll process within standard turnaround and reach out if anything looks off.` },
    ],
    'Accepted':[
      { from:'customer', author:customer, ts:ts(sub,11,30), body:`Truck on the way with the consignment. Driver name is Tim Patel, rego XJ-92-LR.` },
      { from:'admin',    author:admin,    ts:ts(sub,12,5),  body:`Got it — dock is clear, send him through to bay 3 on arrival.` },
    ],
    'On Hold':[
      { from:'admin',    author:admin,    ts:ts(sub,13,20), body:`We've placed this order on hold pending paperwork clarification. Could you confirm the lot number on the inner label matches the COA?` },
      { from:'customer', author:customer, ts:ts(sub,14,8),  body:`Checking with our QA team now. Will revert by COB.` },
    ],
    'Late Arrival':[
      { from:'admin',    author:admin,    ts:ts(sub,14,0),  body:`Truck flagged as late arrival. ETA pushed to 17:30. We'll keep the chamber pre-heated.` },
      { from:'customer', author:customer, ts:ts(sub,14,22), body:`Apologies — driver hit roadworks. Will keep you posted on progress.` },
    ],
    'Scheduled for Processing':[
      { from:'admin',    author:admin,    ts:ts(sub,15,10), body:`Scheduled for processing on ${col}. Target dose locked in per your standing agreement.` },
      { from:'customer', author:customer, ts:ts(sub,15,45), body:`Thanks. Could you confirm pickup window on the day?` },
      { from:'admin',    author:admin,    ts:ts(sub,16,8),  body:`Pickup window is 14:00-16:00 from bay 2.` },
    ],
    'In Process':[
      { from:'admin',    author:admin,    ts:ts(col,7,0),   body:`Treatment started this morning. First dose-map readings are within spec. Will update mid-cycle.` },
      { from:'admin',    author:admin,    ts:ts(col,11,30), body:`Mid-cycle check complete — all dosimeters reading within target band.` },
    ],
    'Ready for Invoicing':[
      { from:'admin',    author:admin,    ts:ts(col,15,30), body:`Treatment complete. COA and dose-mapping report uploaded to this order. Invoice will follow within 24 hours.` },
      { from:'customer', author:customer, ts:ts(col,16,12), body:`Brilliant, thanks team.` },
    ],
    'Completed':[
      { from:'admin',    author:admin,    ts:ts(col,16,0),  body:`Order completed and released to consignee. All paperwork attached.` },
      { from:'customer', author:customer, ts:ts(col,17,5),  body:`Received and signed off our end. Thanks team.` },
    ],
    'Cancelled':[
      { from:'customer', author:customer, ts:ts(sub,10,30), body:`Need to cancel this one — consignor changed shipping schedule. Apologies for the late notice.` },
      { from:'admin',    author:admin,    ts:ts(sub,11,0),  body:`No problem, cancellation logged. No charges. Let us know when you're ready to re-submit.` },
    ],
  })[order.status] || [
    { from:'customer', author:customer, ts:ts(sub,9,15), body:`Submitted via portal — let me know if anything is missing on our end.` },
    { from:'admin',    author:admin,    ts:ts(sub,10,2), body:`Received, thanks. We'll be in touch with next steps.` },
  ];
  return tpl.map((m, i) => ({ ...m, id: `m-${order.id}-${i+1}` }));
}

function buildInitialMessages(orders, customerName){
  const msgs = {};
  for (const o of orders) {
    msgs[o.id] = generateMockThread(o, customerName);
  }
  // Curated threads override generated where defined.
  for (const k of Object.keys(seedMessages)) {
    msgs[k] = JSON.parse(JSON.stringify(seedMessages[k]));
  }
  return msgs;
}

/* ---------- Wireframe demo state behaviour -----------------------------
   Companies + contacts are mutable during a session (self-signup creates drafts,
   admin approves / adds / rejects). Each refresh resets to the seed so the demo
   always starts from a known clean state. We clear any legacy localStorage on
   load and disable writes — no cross-session persistence. */
const STATE_KEY = 'steritech-wireframe-state-v1';
function persistState(){ /* no-op: demo data is session-only */ }
function rehydrateState(){
  try { localStorage.removeItem(STATE_KEY); } catch (_) {}
}
function resetDemoState(){
  state.companies = [...seedCompanies];
  state.companyContacts = [...seedCompanyContacts];
}
rehydrateState();

<h4>Additional User Requirements and Supply Conditions</h4>
<p><strong>1.56.</strong> It shall be noted that Steritech does not claim sterility of the Product. This responsibility lies with the User.</p>
<p><strong>1.57.</strong> It shall be noted that Steritech will not be held liable for any claims made in relation to physical effects from ionising radiation provided that Steritech is not in breach to neither of this Agreement nor the Terms and Conditions displayed on the Steritech website at Terms and Conditions – Steritech.</p>
<p><strong>1.58.</strong> It shall be noted that Steritech does not temperature map its facilities. In the event a customer nominates a specialised storage condition (i.e., chilled or frozen), Steritech will, where the service is available, store the Product in a location with the temperature set to within the Request Forms stipulated range.</p>
<p><strong>1.59.</strong> It shall be noted that where treatment is requested in accordance to ISO11137 or PIC/S Annex 12, Steritech mandates the requirement for Users to initially validate their Product and process, and as such Steritech will not process a Product where no initial validation has been executed in accordance to that regulations requirements. Re-validation activities, unless a requirement under the stated regulation, will not be mandated by Steritech. This decision lies with the User. Should no re-validation be requested by the User, Steritech cannot provide confirmation that the entire product load has received a distribution of radiation dose within the treatment specification limits.</p>
<p><strong>1.60.</strong> It shall be noted that Steritech may consolidate the Product with similar products (from other customers) in terms of density, exposure requirements or product nature, unless otherwise directed in writing on the Request Form (e.g., requesting that a line clearance is needed). Steritech reserves the right to adjust the price should the user request the product be non-consolidated.</p>
<p><strong>1.61.</strong> It shall be noted that Steritech’s certificate of processing is the User’s evidence that the Product has been processed as per this Agreement. Steritech personnel physically verify each delivery for the identity of the client, the quantity treated, the carton density, and a client supplied reference number such as a purchase order number. Other details, such as batch code, may be transcribed from the client documentation for convenience but is not verified by Steritech.</p>
<p><strong>1.62.</strong> It shall be noted that Technical Arrangements are stored in Steritech’s Customer Requirements database and the User must specify in this agreement (see below for designated field) any special requirements relating to the Services and/or Products that are not specifically mentioned above. Steritech reserves the right to accept or reject the requested additional technical arrangements at its discretion.</p>
<p><strong>1.63.</strong> It shall be noted that in relation to the treatment of Products for human consumption, it is the Users responsibility to ensure that: A. each Product requiring irradiation is not prohibited from irradiation and has permission to be irradiated and then consumed by the relevant national food safety authority in the country where the Product will be consumed, and B. produce to be irradiated is sourced from growers and packers that maintain all required approvals, certifications and/or registrations for the intended export/ treatment pathway and, in cases where the treatment facility is required to maintain copies of these, ensure a copy is forwarded to Steritech prior to the delivery of the produce for treatment. The User warrants that the User will fulfill all required responsibilities stated within this agreement and that the Products comply with the restrictions in the Food Standards Code and foods for human consumption are accepted for irradiation in reliance on this warranty. The User must also ensure that the irradiation dose requested complies with the relevant requirements, taking into consideration the Product, market and all other required information.</p>
<p><strong>1.64.</strong> It shall be noted that Steritech reserves the right to examine the contents of any Product(s) in the event such Product has resided on hold at any Steritech facility for a time period exceeding six months. Steritech will then coordinate with an authorised and licenced third party to undertake appropriate disposal of said Product.</p>
<p><strong>1.65.</strong> It shall be noted that each Steritech site carries sizing and weight limitations for their irradiator and conveyer systems (Steritech site can provide these limitations upon enquiry from the customer), for which the customer must adhere to when preparing their consignments for delivery to Steritech. Consignments that exceed these limitations may require manual intervention in which case may incur additional costs, or could be rejected at receipt and returned to the customer for re-work. It shall also be noted that for Occupational Health and Safety purposes, an individual carton must not exceed 25kg in weight, and where possible be marked as heavy.</p>

<h4>Additional User Requirements and Supply Conditions</h4>
<p><strong>1.56.</strong> It shall be noted that Steritech does not claim sterility of the Product. This responsibility lies with the User.</p>
<p><strong>1.57.</strong> It shall be noted that Steritech will not be held liable for any claims made in relation to physical effects from EO exposure provided that Steritech is not in breach to neither of this Agreement nor the Terms and Conditions displayed on the Steritech website at Terms and Conditions – Steritech.</p>
<p><strong>1.58.</strong> It shall be noted that Steritech does not temperature map its facilities. In the event a customer nominates a specialised storage condition (i.e., chilled), Steritech will, where the service is available, store the Product in a location with the temperature set to within the Request Forms stipulated range.</p>
<p><strong>1.59.</strong> It shall be noted that where treatment is requested in accordance to ISO11135, Steritech mandates the requirement for Users to initially validate their Product and process, and as such Steritech will not process a Product where no initial validation has been executed in accordance to that regulations requirements. Re-validation activities, unless a requirement under the stated regulation, will not be mandated by Steritech. This decision lies with the User. Should no re-validation be requested by the User, Steritech cannot provide confirmation that the entire product load has received a distribution of gas exposure within the treatment specification limits.</p>
<p><strong>1.60.</strong> It shall be noted that where regulation allows, Steritech may consolidate the Product with similar products (from other customers) in terms of exposure requirements, EO cycle parameters or product nature, unless otherwise directed in writing on the Request Form.</p>
<p><strong>1.61.</strong> It shall be noted that Steritech’s certificate of processing is the User’s evidence that the Product has been processed as per this Agreement. Steritech personnel physically verify each delivery for the identity of the client, the quantity treated and a client supplied reference number such as a purchase order number. Other details, such as batch code, may be transcribed from the client documentation for convenience but is not verified by Steritech.</p>
<p><strong>1.62.</strong> It shall be noted that there are APVMA restrictions on EO processing for quarantine purposes. Steritech can provide information about this to the User.</p>
<p><strong>1.63.</strong> It shall be noted that Technical Arrangements are stored in Steritech’s Customer Requirements database and the User must specify in this agreement (see below for designated field) any special requirements relating to the Services and/or Products that are not specifically mentioned above. Steritech reserves the right to accept or reject the requested additional technical arrangements at its discretion.</p>
<p><strong>1.64.</strong> The User acknowledges and agrees that: A. Ethylene Oxide (EO) gas is extremely flammable and requires absolute protection against energy discharges in the EO chamber; B. EO processing is not intended for batteries or other stored energy devices.</p>
<p><strong>1.65.</strong> It shall be noted that Steritech reserves the right to examine the contents of any Product(s) in the event such Product has resided on hold at any Steritech facility for a time period exceeding six months. Steritech will then coordinate with an authorised and licenced third party to undertake appropriate disposal of said Product.</p>
<p><strong>1.66.</strong> It shall be noted that each Steritech site carries sizing and weight limitations for their chambers and conveyer systems (Steritech site can provide these limitations upon enquiry from the customer), for which the customer must adhere to when preparing their consignments for delivery to Steritech. Consignments that exceed these limitations may require manual intervention in which case may incur additional costs, or could be rejected at receipt and returned to the customer for re-work. It shall also be noted that for Occupational Health and Safety purposes, an individual carton must not exceed 25kg in weight, and where possible be marked as heavy.</p>

  const parts = String(state.eula.version).split('.');
  const next = parts[0] + '.' + ((parseInt(parts[1]||'0',10)) + 1);
  const today = new Date().toISOString().slice(0,10);
  state.eula.version = next;
  state.eula.date = today;
  state.eulaVersionHistory.unshift({ version: next, date: today, note: 'New version published (demo) — forces immediate re-acceptance for all users.' });
}

let _toastTimer = null;
function showToast(message, kind='success'){
  state.toast = { message, kind };
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { state.toast = null; }, 4500);
}

function fmtDate(iso) { if (!iso) return '-'; const d = new Date(iso); return d.toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' }); }
function fmtMoney(n) { return new Intl.NumberFormat('en-AU', { style:'currency', currency:'AUD' }).format(n||0); }
function nextOrderId() {
  const last = state.orders[0]?.id || 'STR-25-018342';
  const n = parseInt(last.split('-')[2],10) + 1;
  return `STR-25-${String(n).padStart(6,'0')}`;
}

      fields:[

  return schemas;
}

/* ---------- MessagesPanel: per-order text thread (customer ↔ admin) -------- */
/* Used on customer Order Detail and admin Customer Detail (per-order tab).    */
/* Props:                                                                       */
/*   orderId  — required, key into state.messages                               */
/*   asAdmin  — boolean, true when posting from admin side                      */

const MessagesPanel = {
  props: {
    orderId: { type:String, required:true },
    asAdmin: { type:Boolean, default:false },
    compact: { type:Boolean, default:false },   // tighter padding for embedded admin view
  },
  components:{ Icon },
  data(){ return { draft: '' }; },
  methods:{
    fmtTs(ts){
      if (!ts) return '';
      // Expect "YYYY-MM-DDTHH:mm"
      const [d, t] = ts.split('T');
      const dt = new Date(ts);
      const today = new Date();
      const sameDay = dt.toDateString() === today.toDateString();
      const opts = sameDay
        ? { hour:'2-digit', minute:'2-digit' }
        : { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' };
      return dt.toLocaleString('en-AU', opts);
    },
    nowTs(){
      const d = new Date();
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    },
    send(){
      const body = this.draft.trim();
      if (!body) return;
      if (!state.messages[this.orderId]) state.messages[this.orderId] = [];
      const order = state.orders.find(o => o.id === this.orderId);
      const facName = order ? (FACILITIES.find(f => f.code === order.facility)?.name || order.facility) : '';
      const author = this.asAdmin ? `Steritech ${facName}` : (state.profile.contact || 'Customer');
      state.messages[this.orderId].push({
        id: 'm-' + Date.now(),
        from: this.asAdmin ? 'admin' : 'customer',
        author,
        ts: this.nowTs(),
        body,
      });
      this.draft = '';
      this.$nextTick(() => {
        const el = this.$refs.scroll;
        if (el) el.scrollTop = el.scrollHeight;
      });
      showToast(this.asAdmin ? 'Reply sent to customer.' : 'Message sent. Steritech will reply on this thread.', 'success');
    },
    onKey(e){
      // Cmd/Ctrl + Enter to send; plain Enter inserts a newline
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        this.send();
      }
    },
    showDateDivider(m, i){
      if (i === 0) return true;
      return new Date(m.ts).toDateString() !== new Date(this.thread[i-1].ts).toDateString();
    },
    formatDateDivider(ts){
      return new Date(ts).toLocaleDateString('en-AU', { day:'numeric', month:'long', year:'numeric' });
    },
  },
  mounted(){
    this.$nextTick(() => {
      const el = this.$refs.scroll;
      if (el) el.scrollTop = el.scrollHeight;
    });
  },
  computed:{
    state(){ return state; },
    thread(){ return state.messages[this.orderId] || []; },
    canSend(){ return this.draft.trim().length > 0; },
    composerId(){ return 'msg-composer-' + this.orderId; }
  },
  template:`
  <div class="flex flex-col">
    <!-- Thread header strip — message count + last reply timestamp; hides on empty thread -->
    <div v-if="thread.length" class="px-5 py-2.5 border-b border-slate-200 bg-white flex items-center justify-between gap-3 text-xs text-slate-500">
      <span>{{ thread.length }} {{ thread.length === 1 ? 'message' : 'messages' }}</span>
      <span>Last reply {{ fmtTs(thread[thread.length - 1].ts) }}</span>
    </div>

    <div ref="scroll" :class="['overflow-y-auto', compact ? 'max-h-72' : 'max-h-[520px]']">
      <div v-if="thread.length === 0" class="text-center py-12 px-5">
        <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
          <Icon name="message-square" :size="22" aria-hidden="true"/>
        </div>
        <p class="text-base text-slate-700 font-medium">No messages yet</p>
        <p class="text-sm text-slate-500 mt-1 max-w-sm mx-auto">{{ asAdmin ? 'Reply below to start the thread with the customer.' : 'Use the box below to ask Steritech anything about this order — pickup timing, dose questions, paperwork, anything.' }}</p>
      </div>
      <ul v-else class="px-5 py-3 space-y-3">
        <template v-for="(m, i) in thread" :key="m.id">
          <li v-if="showDateDivider(m, i)" class="text-center text-xs uppercase tracking-wide text-slate-500 font-medium pt-2">
            {{ formatDateDivider(m.ts) }}
          </li>
          <li :class="['flex', m.from === 'admin' ? 'justify-start' : 'justify-end']">
            <div class="max-w-[80%] min-w-0">
              <div :class="['flex items-baseline gap-2 text-xs text-slate-500 mb-1', m.from === 'admin' ? '' : 'justify-end']">
                <span class="text-sm font-medium text-navy-900">{{ m.author }}</span>
                <span :class="['text-[11px] font-medium uppercase tracking-wide px-1.5 py-0.5 rounded-sm', m.from === 'admin' ? 'bg-amber-100 text-amber-800' : 'bg-teal-100 text-teal-800']">{{ m.from === 'admin' ? 'Steritech' : 'You' }}</span>
                <span>{{ fmtTs(m.ts) }}</span>
              </div>
              <div :class="['rounded-md border px-4 py-3 text-base text-slate-800 whitespace-pre-wrap leading-relaxed',
                            m.from === 'admin' ? 'bg-slate-50 border-slate-200' : 'bg-teal-50 border-teal-200']">{{ m.body }}</div>
            </div>
          </li>
        </template>
      </ul>
    </div>

    <div class="px-5 py-4 border-t border-slate-200 bg-white">
      <label :for="composerId" class="block text-sm font-medium text-slate-800 mb-1.5">
        {{ asAdmin ? 'Reply to customer' : 'Send a message to Steritech' }}
      </label>
      <div class="flex flex-col sm:flex-row sm:items-end gap-2">
        <textarea v-model="draft" rows="2" @keydown="onKey" :id="composerId"
                  :placeholder="asAdmin ? 'Type your reply&hellip;' : 'Type your message&hellip;'"
                  class="flex-1 resize-none rounded-md border border-slate-300 p-3 text-base text-slate-900 placeholder:text-slate-400 focus-ring"></textarea>
        <button type="button" @click="send" :disabled="!canSend"
                class="inline-flex items-center justify-center gap-2 h-11 px-5 rounded-md bg-teal-600 text-white text-sm font-medium hover:bg-teal-700 disabled:opacity-40 disabled:cursor-not-allowed focus-ring">
          <Icon name="send" :size="16" aria-hidden="true"/> Send
        </button>
      </div>
      <p class="text-xs text-slate-500 mt-1.5">
        Plain text only. Cmd/Ctrl + Enter to send.
        <span v-if="!asAdmin">Replies come back on this thread, usually within 1 business day.</span>
      </p>
    </div>
  </div>`
};

const Btn = {
  props:{ kind:{default:'primary'}, icon:String, iconRight:String, size:{default:'md'}, disabled:Boolean, as:{default:'button'}, to:Object, block:Boolean, action:String, title:String },
  computed:{
    effectiveDisabled(){ return this.disabled; },
    effectiveTitle(){ return this.title || null; },
    cls(){
      const base = 'inline-flex items-center justify-center gap-2 font-medium rounded-lg transition-colors focus-ring disabled:opacity-50 disabled:cursor-not-allowed';
      const sizes = { sm:'text-xs px-3 py-1.5', md:'text-sm px-4 py-2', lg:'text-base px-5 py-2.5' };
      const kinds = {
        primary:  'bg-teal-500 text-white hover:bg-teal-600 border border-transparent',
        secondary:'bg-white text-navy-900 border border-slate-300 hover:bg-slate-50',
        navy:     'bg-navy-900 text-white hover:bg-navy-800 border border-transparent',
        outline:  'bg-white text-navy-900 border border-navy-900 hover:bg-navy-50',
        ghost:    'bg-transparent text-slate-700 hover:bg-slate-100 border border-transparent',
        danger:   'bg-red-600 text-white hover:bg-red-700 border border-transparent',
      };
      return [base, sizes[this.size], kinds[this.kind], this.block && 'w-full'].join(' ');
    }
  },
  template:`
    <component :is="as==='router-link' ? 'router-link' : 'button'"
               v-bind="as==='router-link' ? { to } : { type:'button', disabled:effectiveDisabled }"
               :title="effectiveTitle"
               :class="cls">
      <Icon v-if="icon" :name="icon" :size="size==='sm'?14:16" />
      <slot></slot>
      <Icon v-if="iconRight" :name="iconRight" :size="size==='sm'?14:16" />
    </component>`,
  components:{ Icon }
};

/* DemoPanel — floating bottom-right card exposing role + facility-loadout
   toggles for stakeholder demos. Wireframe-only chrome (amber accent so
   it never reads as a production feature). Mounted by Shell so it's
   visible across every authed route. */
const DemoPanel = {
  components:{ Icon },
  data(){ return { open: false }; },
  mounted(){
    this._closeOnDoc = (e) => { if (this.open && this.$el && !this.$el.contains(e.target)) this.open = false; };
    this._onKey = (e) => { if (e.key === 'Escape') this.open = false; };
    document.addEventListener('click', this._closeOnDoc);
    document.addEventListener('keydown', this._onKey);
  },
  beforeUnmount(){
    document.removeEventListener('click', this._closeOnDoc);
    document.removeEventListener('keydown', this._onKey);
  },
  computed:{
    state(){ return state; },
    mode(){
      const ids = state.profile.facilities || [];
      if (ids.length === 0) return 'zero';
      if (ids.length === 1) return 'single';
      return 'multi';
    },
    bannerSeverity:{
      get(){ return state.maintenanceBanner.enabled ? state.maintenanceBanner.severity : 'off'; },
      set(v){
        if (v === 'off') state.maintenanceBanner.enabled = false;
        else { state.maintenanceBanner.enabled = true; state.maintenanceBanner.severity = v; }
      }
    },
    landingPath(){ return state.role === 'admin' ? '/admin' : '/dashboard'; }
  },
  methods:{
    toggle(e){ if (e) e.stopPropagation(); this.open = !this.open; },
    setRole(r){
      state.role = r;
      if (r === 'admin' && !this.$route.path.startsWith('/admin') && this.$route.path !== '/settings') {
        this.$router.push('/admin');
      } else if (r === 'customer' && this.$route.path.startsWith('/admin')) {
        this.$router.push('/dashboard');
      }
    },
    setMode(m){
      if (m === 'single') {
        state.profile.facilities.splice(0, state.profile.facilities.length, 'DAN');
        state.profile.currentFacility = 'DAN';
      } else if (m === 'multi') {
        state.profile.facilities.splice(0, state.profile.facilities.length, 'DAN', 'MER');
        if (!['DAN','MER'].includes(state.profile.currentFacility)) state.profile.currentFacility = 'DAN';
      } else {
        state.profile.facilities.splice(0, state.profile.facilities.length);
      }
      if (m === 'zero') this.$router.push('/onboarding/incomplete');
      else if (this.$route.path === '/onboarding/incomplete') this.$router.push('/dashboard');
    },
    goLanding(){
      this.$router.push(this.landingPath);
      this.open = false;
    },
    resetData(){
      const newOrders = [...seedOrders, ...generateMockOrders(50)];
      state.orders.splice(0, state.orders.length, ...newOrders);
      state.messages = buildInitialMessages(newOrders, seedProfile.contact);
      state.maintenanceBanner = { enabled:false, message:'Scheduled maintenance is in progress. Some features may be temporarily unavailable.', severity:'info' };
      // Also clear any persisted companies/contacts from localStorage and re-seed them.
      resetDemoState();
      showToast('Demo data reset to defaults.', 'success');
    },
    signOut(){
      state.authed = false;
      this.open = false;
      this.$router.push('/login');
    },
    /* EULA demo triggers (wireframe). Each sets customer role then navigates so
       the global guard shows the blocking EULA gate for the relevant case. */
    eulaTriggerFirst(){
      state.role = 'customer'; eulaDemoReset(); this.open = false; this.$router.push('/dashboard');
    },
    eulaTrigger90(){
      state.role = 'customer'; eulaDemoSimulate90(); this.open = false; this.$router.push('/dashboard');
    },
    eulaTriggerVersion(){
      state.role = 'customer'; eulaDemoPublishNewVersion(); this.open = false;
      showToast('Published EULA v'+state.eula.version+'.', 'success'); this.$router.push('/dashboard');
    },
  },
  template:`
  <div v-if="state.authed" class="fixed bottom-4 right-4 z-[60]">
    <button v-if="!open" type="button" @click="toggle"
            aria-label="Open demo controls" :aria-expanded="open"
            class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-amber-500 text-white text-xs font-semibold shadow-lg hover:bg-amber-600 focus-ring">
      <Icon name="settings-2" :size="14" aria-hidden="true"/> Demo
    </button>
    <div v-else role="dialog" aria-label="Demo controls"
         class="w-80 max-h-[85vh] flex flex-col bg-white border border-amber-300 rounded-md shadow-xl overflow-hidden">
      <div class="px-4 py-2.5 bg-amber-500 text-white flex items-center justify-between shrink-0">
        <div class="inline-flex items-center gap-2 text-sm font-semibold">
          <Icon name="settings-2" :size="14" aria-hidden="true"/> Demo controls
        </div>
        <button type="button" @click="toggle" aria-label="Close demo controls"
                class="p-1 rounded hover:bg-amber-600 focus-ring">
          <Icon name="x" :size="14"/>
        </button>
      </div>
      <div class="p-4 space-y-5 overflow-y-auto">
        <p class="text-xs text-slate-500">Wireframe-only. Switch state to demo other scenarios.</p>

        <div>
          <div class="text-xs font-medium text-slate-700 mb-1.5">Role</div>
          <div class="inline-flex w-full bg-slate-100 rounded-full p-0.5 text-xs">
            <button @click="setRole('customer')" :class="['flex-1 px-3 py-1.5 rounded-full transition', state.role==='customer' ? 'bg-teal-600 text-white' : 'text-slate-700 hover:text-navy-900']">Customer</button>
            <button @click="setRole('admin')" :class="['flex-1 px-3 py-1.5 rounded-full transition', state.role==='admin' ? 'bg-amber-600 text-white' : 'text-slate-700 hover:text-navy-900']">Admin</button>
          </div>
        </div>

        <div>
          <div class="text-xs font-medium text-slate-700 mb-1.5">Facility load-out</div>
          <div class="inline-flex w-full bg-slate-100 rounded-full p-0.5 text-xs">
            <button @click="setMode('single')" :class="['flex-1 px-3 py-1.5 rounded-full transition', mode==='single' ? 'bg-teal-600 text-white' : 'text-slate-700 hover:text-navy-900']">Single</button>
            <button @click="setMode('multi')" :class="['flex-1 px-3 py-1.5 rounded-full transition', mode==='multi' ? 'bg-teal-600 text-white' : 'text-slate-700 hover:text-navy-900']">Multi</button>
            <button @click="setMode('zero')" :class="['flex-1 px-3 py-1.5 rounded-full transition', mode==='zero' ? 'bg-teal-600 text-white' : 'text-slate-700 hover:text-navy-900']">Zero</button>
          </div>
        </div>

        <div>
          <label for="demo-banner" class="block text-xs font-medium text-slate-700 mb-1.5">Maintenance banner</label>
          <select id="demo-banner" v-model="bannerSeverity"
                  class="h-10 w-full pl-3 rounded-md border border-slate-300 text-sm focus-ring bg-white">
            <option value="off">Off</option>
            <option value="info">Info (blue)</option>
            <option value="warning">Warning (amber)</option>
            <option value="critical">Critical (red)</option>
          </select>
        </div>

        <div class="border-t border-slate-200 pt-4">
          <div class="text-xs font-medium text-slate-700 mb-1.5">Agreement triggers <span class="text-slate-400 font-normal">(switches to customer)</span></div>
          <div class="space-y-2">
            <button type="button" @click="eulaTriggerFirst"
                    class="w-full inline-flex items-center justify-center gap-2 h-9 rounded-md border border-slate-300 text-xs text-navy-900 hover:bg-slate-50 focus-ring">
              <Icon name="log-in" :size="13" aria-hidden="true"/> First login (not yet accepted)
            </button>
            <button type="button" @click="eulaTrigger90"
                    class="w-full inline-flex items-center justify-center gap-2 h-9 rounded-md border border-slate-300 text-xs text-navy-900 hover:bg-slate-50 focus-ring">
              <Icon name="calendar-clock" :size="13" aria-hidden="true"/> 90 days elapsed
            </button>
            <button type="button" @click="eulaTriggerVersion"
                    class="w-full inline-flex items-center justify-center gap-2 h-9 rounded-md border border-slate-300 text-xs text-navy-900 hover:bg-slate-50 focus-ring">
              <Icon name="upload" :size="13" aria-hidden="true"/> New version published
            </button>
          </div>
        </div>

        <div class="border-t border-slate-200 pt-4 space-y-2">
          <button type="button" @click="goLanding"
                  class="w-full inline-flex items-center justify-center gap-2 h-10 rounded-md border border-slate-300 text-sm text-navy-900 hover:bg-slate-50 focus-ring">
            <Icon name="layout-dashboard" :size="14" aria-hidden="true"/> Go to {{ state.role === 'admin' ? 'Admin Console' : 'Dashboard' }}
          </button>
          <button type="button" @click="resetData"
                  class="w-full inline-flex items-center justify-center gap-2 h-10 rounded-md border border-slate-300 text-sm text-navy-900 hover:bg-slate-50 focus-ring">
            <Icon name="refresh-ccw" :size="14" aria-hidden="true"/> Reset demo data

          <button type="button" @click="signOut"

      </div>
    </div>
  </div>`
};

/* Full-screen, no shell/nav so it cannot be skipped. Reached via the global
   router guard whenever a signed-in customer needs to accept the current EULA. */
const EulaGatePage = {
  components:{ Icon, Btn },
  data(){ return { agreed:false, declined:false }; },
  computed:{
    state(){ return state; },
    status(){ return eulaStatus(); },
    eula(){ return state.eula; },
    reasonText(){
      return ({
        first:    'Please review and accept our Quality Service Agreement to continue.',
        version:  'Our Quality Service Agreement has been updated. Please review and accept the new version to continue.',
        periodic: 'It has been over ' + state.eulaConfig.reacceptDays + ' days since you last accepted. Please re-confirm our Quality Service Agreement to continue.',
      })[this.status.reason] || 'Please review and accept our Quality Service Agreement to continue.';
    },
  },
  methods:{
    accept(){
      if (!this.agreed) return;
      eulaRecordAcceptance(this.status.reason);
      const dest = state.eulaReturnTo || '/dashboard';
      state.eulaReturnTo = null;
      this.$router.push(dest);
    },
    decline(){ this.declined = true; },
    review(){ this.declined = false; },
    downloadCopy(){ openAgreementForPrint(); },

EulaGatePage.methods.fmt = function(d){ if(!d) return '-'; const dt=new Date(d); return dt.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}); };

/* ---------- Page: Signup ---------------------------------------------------- */

/* Facility services map (single source of truth for the location step) */
const FACILITY_SERVICES = {
  MER: ['Gamma','GMP'],
  DAN: ['Gamma','ETO'],
  WPK: ['Gamma','ETO'],
  NAR: ['Gamma','GMP'],
};
const FACILITY_DISTANCE_KM = { MER: 12, DAN: 27, WPK: 845, NAR: 1685 };

/* Mock invite-token payload. In production this would come from a GET /invites/:token
   call — the server resolves the token to the customer record the admin pre-created. */
const MOCK_INVITE = {
  token: 'demo-token',
  company: 'Royal Melbourne Hospital',
  contact: 'Dr. Sarah Chen',
  email: 'sarah.chen@rmh.org.au',
  phone: '+61 3 9342 7000',
  address: '300 Grattan St, Parkville VIC 3050',
  abn: '63 530 423 277',
  assignedFacility: 'DAN',
  invitedBy: 'Steritech Admin (Jordan Lee)',
};

const SignupPage = {
  components:{ Icon, Btn, TreatmentChip },
  data(){
    return {
      /* Wireframe step machine:
         - 'choose'  — pick "new company" vs "join existing company" (self-signup only)
         - 'form'    — fill the form for the chosen mode
         - 'review'  — acknowledge before submitting (self-signup only)
         - 'done'    — confirmation screen (draft created, awaiting admin verification)
         Invited customers (?invite=<token>) skip 'choose' and 'review' — they were pre-created
         by an admin, so submitting their form activates the account immediately like before. */
      step: 'choose',
      mode: null,                           // 'new' | 'existing'
      acknowledged: false,
      f: {
        company:'', abn:'', contact:'', phone:'', email:'', password:'', address:'',
        existingCompanyId:'', existingCompanyQuery:'',
      },
      manualPick: false,
      selectedCodes: [],
      autoSelectedNote: false,
      submitted: null,                      // populated on 'done' — drives the confirmation screen
    };
  },
  computed:{
    /* Invited mode is determined by the URL: ?invite=<token>. The toggle is gone
       because in production the user can't choose — they either followed an invite
       link or they didn't. */
    inviteToken(){ return this.$route.query.invite || ''; },
    invited(){ return !!this.inviteToken; },
    invite(){ return this.invited ? MOCK_INVITE : null; },
    facilities(){ return FACILITIES; },
    /* Reactive auto-selection from typed address. VIC→MER (default), NSW→WPK, QLD→NAR. */
    autoFromAddress(){
      const a = (this.f.address || '').toUpperCase();
      if (a.includes('NSW')) return 'WPK';
      if (a.includes('QLD')) return 'NAR';
      if (a.includes('VIC')) return 'MER';
      return null;
    },
    /* selectedCodes is the single source of truth — bound directly to the checkboxes
       via v-model so the DOM and state can never drift apart. Self-signup customers
       can pick one OR several facilities (or all). Invited customers stay locked to
       the single admin-assigned facility from their token. */
    effectiveSelectedCodes(){
      if (this.invited) return [this.invite.assignedFacility];
      return this.selectedCodes;
    },
    effectiveSelected(){ return this.effectiveSelectedCodes[0]; },
    selectedFacilities(){
      return this.facilities.filter(f => this.effectiveSelectedCodes.includes(f.code));
    },
    allSelected(){ return !this.invited && this.selectedCodes.length === this.facilities.length; },
    services(){ return FACILITY_SERVICES; },
    distance(){ return FACILITY_DISTANCE_KM; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    treatmentLabels(){ return TREATMENT_LABELS; },
    /* True once the typed address contains enough signal to estimate distance.
       In production this would be "once geocoding succeeds". For the prototype
       we treat an Australian state code in the address as the signal. */
    addressHasSignal(){
      const a = (this.f.address || '').toUpperCase();
      return /\b(VIC|NSW|QLD|WA|SA|TAS|NT|ACT)\b/.test(a) || /\b\d{4}\b/.test(a);
    },
    assignedFacility(){ return FACILITIES.find(f => f.code === this.effectiveSelected) || FACILITIES[0]; },
    /* Companies the user can request to join — only Active records show up so customers
       can't pile drafts onto a company that itself hasn't been approved yet. */
    joinableCompanies(){
      return state.companies
        .filter(c => c.status === 'Active')
        .sort((a,b) => a.name.localeCompare(b.name));
    },
    filteredJoinable(){
      const q = (this.f.existingCompanyQuery || '').trim().toLowerCase();
      if (!q) return this.joinableCompanies;
      const qDigits = q.replace(/\s+/g,'');
      return this.joinableCompanies.filter(c =>
        c.name.toLowerCase().includes(q) || c.abn.replace(/\s+/g,'').includes(qDigits)
      );
    },
    selectedExistingCompany(){
      return state.companies.find(c => c.id === this.f.existingCompanyId) || null;
    },
    nextCompanyId(){
      const nums = state.companies.map(c => parseInt(String(c.id).split('-')[1] || '0', 10)).filter(n => !isNaN(n));
      const max = nums.length ? Math.max(...nums) : 1000;
      return 'COMP-' + (max + 1);
    },
    nextContactId(){
      const nums = state.companyContacts.map(c => parseInt(String(c.id).split('-')[1] || '0', 10)).filter(n => !isNaN(n));
      const max = nums.length ? Math.max(...nums) : 2000;
      return 'CONT-' + (max + 1);
    },
    /* Soft duplicate-email check. Returns the matching record if the email the customer
       entered is already in the system (as a company primary contact / login OR an
       existing contact). Used to show a non-blocking warning on the review screen. */
    duplicateEmailMatch(){
      const email = (this.f.email || '').trim().toLowerCase();
      if (!email) return null;
      const company = state.companies.find(c =>
        (c.primaryContact?.email || '').toLowerCase() === email ||
        (c.email || '').toLowerCase() === email
      );
      if (company) return { kind:'company', name: company.name, status: company.status };
      const contact = state.companyContacts.find(ct => (ct.email || '').toLowerCase() === email);
      if (contact) return { kind:'contact', name: contact.name, companyName: contact.companyName, status: contact.status };
      return null;
    },
  },
  watch:{
    /* When the route flips into invited mode, prefill from the token. Invited customers
       always land on the new-company form because the admin pre-created their record. */
    invited:{
      immediate: true,
      handler(v){
        if (v){
          this.mode = 'new';
          this.step = 'form';
          this.f.company = this.invite.company;
          this.f.contact = this.invite.contact;
          this.f.email   = this.invite.email;
          this.f.phone   = this.invite.phone;
          this.f.address = this.invite.address;
          this.f.abn     = this.invite.abn;
          this.manualPick = false;
          this.autoSelectedNote = false;
        } else {
          this.f.company = ''; this.f.contact = ''; this.f.email = '';
          this.f.phone = ''; this.f.address = ''; this.f.abn = '';
          this.step = 'choose';
          this.mode = null;
          this.selectedCodes = [];
          this.manualPick = false;
        }
      },
    },
    /* Pre-select the facility the typed address points to — but only until the
       customer manually edits the selection (then we stop overriding their choice). */
    autoFromAddress(code){
      if (this.invited || this.manualPick) return;
      this.selectedCodes = code ? [code] : [];
    },
  },
  methods:{
    todayIso(){
      const d = new Date();
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    },
    pickMode(m){
      this.mode = m;
      this.step = 'form';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    // Fired on every checkbox change — once the customer touches the list we stop
    // letting the address auto-suggestion override their choice. (v-model handles
    // the actual add/remove on selectedCodes, so the DOM and state stay in sync.)
    markManualPick(){
      this.manualPick = true;
      this.autoSelectedNote = false;
    },
    toggleAll(){
      if (this.invited) return;
      this.manualPick = true;
      this.selectedCodes = this.allSelected ? [] : this.facilities.map(f => f.code);
      this.autoSelectedNote = false;
    },
    pickExistingCompany(c){
      this.f.existingCompanyId = c.id;
      this.f.existingCompanyQuery = c.name;
    },
    clearExistingCompany(){
      this.f.existingCompanyId = '';
      this.f.existingCompanyQuery = '';
    },
    toggleDemoInvite(){
      const q = this.invited ? {} : { invite: MOCK_INVITE.token };
      this.$router.replace({ path: '/signup', query: q });
    },
    submitForm(){
      if (!this.invited && this.mode === 'new' && this.selectedCodes.length === 0){
        showToast('Please select at least one facility.', 'error');
        return;
      }
      // Invited customers skip review — admin already pre-approved them.
      if (this.invited){
        this.finalizeAccount();
        return;
      }
      this.step = 'review';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    editFromReview(){
      this.step = 'form';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    backToChoose(){
      this.step = 'choose';
      this.mode = null;
      this.f.existingCompanyId = '';
      this.f.existingCompanyQuery = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    goToAdminDemo(){
      // Wireframe-only shortcut: the user who just self-signed up isn't an admin,
      // but for the demo we want them to jump straight into the Pending Approvals
      // queue to see what an admin sees. Flip role + authed, then route to /admin.
      state.authed = true;
      state.role = 'admin';
      this.$router.push('/admin');
    },
    finalizeAccount(){
      // Invited customers retain the legacy behaviour: account becomes active immediately
      // because admin already pre-created the record. Activate + sign in to /dashboard.
      if (this.invited){
        const chosen = this.effectiveSelected;
        state.profile = { ...seedProfile, ...this.f, bcCustomerNumber: 'BC-CUST-pending', currentFacility: chosen };
        state.facilities = [chosen];
        state.authed = true;
        this.$router.push('/dashboard');
        return;
      }
      // Self-signup: write a Draft/self-signup record into state. Do NOT log the user in.
      // They wait for an admin to verify the record from /admin → Pending Approvals.
      const today = this.todayIso();
      if (this.mode === 'new'){
        const chosenCodes = this.effectiveSelectedCodes.slice();
        const aggregatedServices = [...new Set(chosenCodes.flatMap(c => FACILITY_SERVICES[c] || []))];
        const newCompany = {
          id: this.nextCompanyId,
          name: this.f.company.trim(),
          abn: this.f.abn.trim(),
          phone: this.f.phone.trim(),
          email: this.f.email.trim(),
          primaryContact: {
            name: this.f.contact.trim(),
            phone: this.f.phone.trim(),
            email: this.f.email.trim(),
            address: this.f.address.trim(),
          },
          facilities: chosenCodes,
          services: aggregatedServices,
          status: 'Pending',
          created: today,
          origin: 'self-signup',
        };
        state.companies.unshift(newCompany);
        this.submitted = { kind:'new-company', companyName:newCompany.name, contactName:newCompany.primaryContact.name, email:newCompany.primaryContact.email };
      } else {
        const company = this.selectedExistingCompany;
        if (!company){
          showToast('Please select your company first.', 'error');
          return;
        }
        const newContact = {
          id: this.nextContactId,
          companyId: company.id,
          companyName: company.name,
          name: this.f.contact.trim(),
          phone: this.f.phone.trim(),
          email: this.f.email.trim(),
          facilities: company.facilities.slice(0, 1),
          services: company.services.slice(0, 1),
          status: 'Pending',
          created: today,
          origin: 'self-signup',
        };
        state.companyContacts.unshift(newContact);
        this.submitted = { kind:'existing-company', companyName:company.name, contactName:newContact.name, email:newContact.email };
      }
      this.step = 'done';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
  },
  template:`

/* ---------- Page: Start a Request (guided wizard) --------------------------- */
/*  CEO-mandated entry point: ONE "Start a Request" button. From there:
    Step 1 — pick facility   (auto-skipped if user is bound to a single facility)
    Step 2 — pick treatment  (auto-skipped if the facility offers a single service)
    Step 3 — pick form       (auto-skipped if exactly one form matches)
    Then routes to /forms/:facility/:formKey (existing renderer, untouched).
*/

const StartRequestPage = {
  components:{ Icon, Btn },
  data(){
    return {
      step: 1,
      facility: null,
      treatment: null,
    };
  },
  computed:{
    state(){ return state; },
    myFacilities(){ return FACILITIES.filter(f => state.profile.facilities.includes(f.code)); },
    activeFacility(){ return FACILITIES.find(f => f.code === this.facility) || null; },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    formIcons(){ return FORM_ICONS; },
    treatmentOptions(){
      if (!this.activeFacility) return [];
      const set = new Set(this.activeFacility.services);
      const order = ['Gamma','ETO','GMP'];
      return order.filter(t => set.has(t));
    },
    matchingForms(){
      if (!this.facility || !this.treatment) return [];
      const fac = this.facility;
      const treat = this.treatment;
      const seen = new Set();
      const rows = [];
      for (const f of FORM_CATALOG) {
        if (f.treatment !== treat) continue;
        const sharedWith = (f.shared_with && f.shared_with.length) ? f.shared_with : null;
        if (sharedWith) {
          if (!sharedWith.includes(fac)) continue;
          const dedupe = `${f.code}|${f.key}`;
          if (seen.has(dedupe)) continue;
          seen.add(dedupe);
          rows.push({ ...f, facility: fac, isShared: true });
        } else {
          if (f.facility !== fac) continue;
          rows.push({ ...f, isShared: false });
        }
      }
      rows.sort((a,b) => a.name.localeCompare(b.name));
      return rows;
    },
  },
  watch:{
    facility(code){
      if (!code) return;
      this.step = 2;
    },
  },
  mounted(){
    if (this.myFacilities.length === 1) {
      this.facility = this.myFacilities[0].code;
    }
  },
  methods:{
    pickFacility(code){ this.facility = code; },
    pickTreatment(t){
      this.treatment = t;
      this.advanceFromTreatment();
    },
    advanceFromTreatment(){
      const forms = this.matchingForms;
      if (forms.length === 1) {
        this.go(forms[0]);
      } else {
        this.step = 3;
      }
    },
    go(row){
      this.$router.push({ path: `/forms/${row.facility}/${row.key}` });
    },
    editFacility(){
      // Reset everything back to the site question.
      this.treatment = null;
      this.facility = null;
      this.step = 1;
    },
    editTreatment(){
      // Keep the picked facility, drop the treatment, return to the treatment question.
      this.treatment = null;
      this.step = 2;
    },
    treatmentBlurb(t){
      switch(t){
        case 'Gamma':      return 'For fresh produce, bee equipment, and general goods.';
        case 'ETO':        return 'For sterilising medical and industrial product.';
        case 'GMP':        return 'GMP-compliant packing and labelling for herbal medicine and TGA-listed goods.';
        case 'Gamma+ETO':  return 'Combined gamma and ethylene oxide treatment, picked inside the form itself.';
        default:           return '';
      }
    },
    treatmentIcon(t){
      switch(t){
        case 'Gamma':      return 'radiation';
        case 'ETO':        return 'flask-conical';
        case 'GMP':        return 'box';
        case 'Gamma+ETO':  return 'shuffle';
        default:           return 'circle';
      }
    },
    schemaStats(r){
      const s = SCHEMAS[`${r.facility}/${r.key}`];
      if (!s) return { sections:0, fields:0 };
      let fields = 0;
      for (const sec of s.sections) fields += (sec.fields?.length || 0) + (sec.repeater?.columns.length || 0);
      return { sections: s.sections.length, fields };
    },
    initial(name){ return (name || '?').charAt(0).toUpperCase(); },
    avatarColor(code){
      return ({
        'MER': 'bg-navy-800',
        'DAN': 'bg-teal-600',
        'WPK': 'bg-slate-600',
        'NAR': 'bg-emerald-700',
      })[code] || 'bg-slate-600';
    }
  },
  template:`
  <div class="max-w-2xl mx-auto px-6 py-10 space-y-6 text-base text-slate-800">

    <router-link to="/dashboard" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-navy-900 focus-ring rounded">

    <h1 class="text-xl font-semibold text-navy-900 leading-tight">Start a request</h1>

    <!-- Summary row: site (shown when site has been picked) -->

              class="text-sm text-teal-600 hover:underline focus-ring py-1 -my-1">Edit</button>

    <!-- Summary row: treatment (shown when treatment has been picked) -->
    <div v-if="step >= 3 && treatment"

      <div class="min-w-0 inline-flex items-center gap-2">
        <span class="text-slate-500">Treatment</span>
        <span :class="['inline-block h-2 w-2 rounded-full ml-2', treatmentStyles[treatment].dot]" aria-hidden="true"></span>
        <span class="text-slate-900 font-medium">{{ treatmentLabels[treatment] || treatment }}</span>
      </div>
      <button type="button" @click="editTreatment"
              class="text-sm text-teal-600 hover:underline focus-ring py-1 -my-1">Edit</button>
    </div>

    <!-- Active question: site -->
    <section v-if="step === 1" class="rounded-md border border-slate-200 bg-white p-6 space-y-4">
      <div>
        <h2 class="text-lg font-semibold text-navy-900">Which site is this request for?</h2>
        <p class="text-sm text-slate-500 mt-0.5">You have access to {{ myFacilities.length }} {{ myFacilities.length === 1 ? 'site' : 'sites' }}.</p>
      </div>
      <ul class="space-y-2.5">
        <li v-for="f in myFacilities" :key="f.code">
          <button @click="pickFacility(f.code)"
                  type="button"
                  class="w-full bg-white border border-slate-200 rounded-md p-4 text-left hover:border-slate-400 hover:bg-slate-50/40 transition-colors flex items-center gap-4 focus-ring">
            <span :class="['shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-white text-base font-semibold', avatarColor(f.code)]"
                  aria-hidden="true">{{ initial(f.name) }}</span>
            <span class="flex-1 min-w-0">
              <span class="block text-base font-semibold text-navy-900">{{ f.name }}, {{ f.state }}</span>
              <span class="block text-sm text-slate-500 truncate">{{ f.address }}</span>
              <span class="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-600">
                <span v-for="s in f.services" :key="s" class="inline-flex items-center gap-1.5">
                  <span :class="['inline-block h-2 w-2 rounded-full', treatmentStyles[s].dot]" aria-hidden="true"></span>
                  {{ treatmentLabels[s] || s }}
                </span>
              </span>
            </span>
            <Icon name="arrow-right" :size="18" cls="text-slate-300 shrink-0"/>
          </button>
        </li>
      </ul>
    </section>

    <!-- Active question: treatment -->
    <section v-if="step === 2" class="rounded-md border border-slate-200 bg-white p-6 space-y-4">
      <div>
        <h2 class="text-lg font-semibold text-navy-900">What kind of treatment do you need?</h2>
        <p class="text-sm text-slate-500 mt-0.5">Available services at {{ activeFacility && activeFacility.name }}.</p>
      </div>
      <ul class="space-y-2.5">
        <li v-for="t in treatmentOptions" :key="t">
          <button @click="pickTreatment(t)"
                  type="button"
                  class="w-full bg-white border border-slate-200 rounded-md p-4 text-left hover:border-slate-400 hover:bg-slate-50/40 transition-colors flex items-center gap-4 focus-ring">
            <span class="shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-md bg-slate-100 text-slate-700">

const FormPickerPage = {
  components:{ Icon },
  data(){ return { filter: state.profile.currentFacility || 'ALL', q:'' }; },
  computed:{
    state(){ return state; },
    myFacilities(){ return FACILITIES.filter(f => state.profile.facilities.includes(f.code)); },
    isSingle(){ return this.myFacilities.length <= 1; },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    formIcons(){ return FORM_ICONS; },
    activeFacilityCode(){
      if (this.isSingle && this.myFacilities[0]) return this.myFacilities[0].code;
      return this.filter === 'ALL' ? null : this.filter;
    },
    filterLabel(){
      const f = FACILITIES.find(x => x.code === this.filter);
      return f ? `${f.name}, ${f.state}` : '';
    },
    /* Site-grouped, search-filtered list. Shared forms are repeated per applicable site
       (architect: repetition beats clever badges for an older audience). */
    sitesGroup(){
      const facCode = this.activeFacilityCode;
      const visibleFacs = facCode
        ? this.myFacilities.filter(f => f.code === facCode)
        : this.myFacilities;
      const q = this.q.trim().toLowerCase();
      const matches = (text) => !q || text.toLowerCase().includes(q);

      const result = [];
      for (const fac of visibleFacs) {
        const forms = [];
        for (const f of FORM_CATALOG) {
          const sharedWith = (f.shared_with && f.shared_with.length) ? f.shared_with : null;
          if (sharedWith) {
            if (sharedWith.includes(fac.code)) {
              forms.push({ ...f, facility: fac.code, isShared: true });
            }
          } else {
            if (f.facility === fac.code) {
              forms.push({ ...f, isShared: false });
            }
          }
        }
        // Search across form name + code + site name + state
        const filtered = forms.filter(r => matches(r.name + ' ' + r.code + ' ' + fac.name + ' ' + fac.state));
        filtered.sort((a,b) => a.name.localeCompare(b.name));
        result.push({ ...fac, forms: filtered });
      }
      return result;
    },
    totalMatches(){
      return this.sitesGroup.reduce((sum, g) => sum + g.forms.length, 0);
    }
  },
  methods:{
    schemaStats(r){
      const s = SCHEMAS[`${r.facility}/${r.key}`];
      if (!s) return { sections:0, fields:0 };
      let fields = 0;
      for (const sec of s.sections) fields += (sec.fields?.length || 0) + (sec.repeater?.columns.length || 0);
      return { sections: s.sections.length, fields };
    }
  },
  template:`
  <div class="max-w-3xl mx-auto px-6 py-10 text-base text-slate-800">
    <router-link to="/start" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-navy-900 focus-ring rounded mb-6">
      <Icon name="arrow-left" :size="14"/> Back to start a request
    </router-link>
    <div class="mb-6">
      <h1 class="text-xl font-medium text-slate-900 leading-tight">All forms</h1>
      <p class="text-sm text-slate-600 mt-1 leading-relaxed">These are all the forms you can send us. Pick the one that matches your job. Not sure which one? <router-link to="/start" class="text-teal-600 hover:underline font-medium">Use Start a Request</router-link> and we will guide you through it.</p>
    </div>

    <div class="flex items-center justify-between gap-3 mb-2 flex-wrap">
      <div class="relative w-full sm:w-80">
        <Icon name="search" :size="16" cls="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/>
        <input v-model="q"
               placeholder="Search by form or site"
               aria-label="Search forms"
               class="pl-9 pr-3 h-11 w-full rounded-md border border-slate-300 text-base focus-ring"/>
      </div>
      <select v-if="!isSingle" v-model="filter"
              aria-label="Filter by site"
              class="h-11 px-3 rounded-md border border-slate-300 text-base focus-ring bg-white">
        <option value="ALL">All sites</option>
        <option v-for="f in myFacilities" :key="f.code" :value="f.code">{{ f.name }}, {{ f.state }}</option>
      </select>
    </div>
    <p v-if="!isSingle" class="text-sm text-slate-500 mb-6">
      <template v-if="filter === 'ALL'">Showing forms for all sites you have access to.</template>
      <template v-else>Showing forms for <span class="text-slate-700 font-medium">{{ filterLabel }}</span>. Switch sites or view all using the dropdown above.</template>
    </p>

    <div v-if="totalMatches === 0" class="py-10 text-center text-sm text-slate-600">
      No forms match your search.
    </div>

    <div v-for="g in sitesGroup" :key="g.code" v-show="g.forms.length" class="mb-8">
      <h2 v-if="!isSingle"
          class="text-base font-semibold text-slate-700 pb-2 mb-3 border-b border-slate-200">
        Forms at {{ g.name }}, {{ g.state }}
      </h2>
      <ul class="space-y-3">
        <li v-for="r in g.forms" :key="r.code+'-'+g.code">
          <router-link :to="'/forms/'+g.code+'/'+r.key"
                       class="block bg-white border border-slate-200 rounded-md px-5 py-4 hover:border-slate-300 hover:bg-slate-50 focus-ring">
            <div class="flex items-start justify-between gap-4 flex-wrap">
              <div class="min-w-0 flex-1 flex items-start gap-4">
                <span class="shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-md bg-slate-100 text-slate-700 mt-0.5" aria-hidden="true">
                  <Icon :name="formIcons[r.key] || 'file-text'" :size="20"/>
                </span>
                <div class="min-w-0 flex-1">
                <p class="text-base font-medium text-slate-900 leading-snug">{{ r.name }}</p>
                <p v-if="r.description" class="mt-1 text-sm text-slate-600 leading-snug">{{ r.description }}</p>
                <div class="mt-2 inline-flex items-center gap-2 text-xs text-slate-500 flex-wrap">
                  <span class="inline-flex items-center gap-1.5">
                    <span :class="['inline-block h-1.5 w-1.5 rounded-full', treatmentStyles[r.treatment] && treatmentStyles[r.treatment].dot]" aria-hidden="true"></span>
                    <span>{{ treatmentLabels[r.treatment] || r.treatment }}</span>
                  </span>
                  <span aria-hidden="true">&middot;</span>
                  <span>{{ schemaStats({ ...r, facility: g.code }).sections }} sections</span>
                  <template v-if="r.isShared">
                    <span aria-hidden="true">&middot;</span>
                    <span>Shared form</span>
                  </template>
                </div>
                </div>

};

/* ---------- Page: Dynamic Form Renderer ------------------------------------- */

const SignaturePad = {
  props:['modelValue'],
  emits:['update:modelValue'],
  data(){ return { drawing:false, last:null, has:false }; },
  mounted(){
    const c = this.$refs.canvas;
    const ctx = c.getContext('2d');
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0F2A44';
    if (this.modelValue) { const img = new Image(); img.onload = ()=> ctx.drawImage(img, 0, 0); img.src = this.modelValue; this.has = true; }
  },
  methods:{
    pos(e){ const r = this.$refs.canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return [t.clientX-r.left, t.clientY-r.top]; },
    start(e){ e.preventDefault(); this.drawing=true; this.last=this.pos(e); },
    move(e){
      if (!this.drawing) return; e.preventDefault();
      const [x,y] = this.pos(e); const ctx = this.$refs.canvas.getContext('2d');
      ctx.beginPath(); ctx.moveTo(this.last[0], this.last[1]); ctx.lineTo(x,y); ctx.stroke();
      this.last = [x,y]; this.has = true;
    },
    end(){ this.drawing=false; if (this.has) this.$emit('update:modelValue', this.$refs.canvas.toDataURL('image/png')); },
    clear(){ const c=this.$refs.canvas; c.getContext('2d').clearRect(0,0,c.width,c.height); this.has=false; this.$emit('update:modelValue',''); }
  },
  template:`
    <div>
      <div class="border border-slate-300 rounded-lg overflow-hidden bg-white sig-pad">
        <canvas ref="canvas" width="560" height="120" class="block w-full touch-none cursor-crosshair"
                @mousedown="start" @mousemove="move" @mouseup="end" @mouseleave="end"
                @touchstart="start" @touchmove="move" @touchend="end"></canvas>
      </div>
      <div class="flex items-center justify-between mt-1">
        <div class="text-[11px] text-slate-500">Sign with mouse or finger</div>
        <button @click="clear" type="button" class="text-[11px] text-slate-600 hover:text-red-600 inline-flex items-center gap-1"><Icon name="eraser" :size="12"/>Clear</button>
      </div>
    </div>`,
  components:{ Icon }
};

const FileUploadField = {
  props:['modelValue','accept','label'],
  emits:['update:modelValue'],
  methods:{
    onFile(e){
      const f = e.target.files[0]; if (!f) return;
      this.$emit('update:modelValue', { name:f.name, size:f.size, type:f.type });
    },
    clear(){ this.$emit('update:modelValue', null); }
  },
  template:`
    <div>
      <div v-if="!modelValue" class="border-2 border-dashed border-slate-300 rounded-lg p-4 text-center hover:border-teal-500 hover:bg-teal-50/40 transition-colors">
        <input type="file" :accept="accept" @change="onFile" class="hidden" :id="$.uid+'-file'"/>
        <label :for="$.uid+'-file'" class="cursor-pointer">
          <Icon name="upload-cloud" :size="22" cls="text-slate-400 mx-auto mb-1"/>
          <div class="text-sm text-navy-900 font-medium">Click to upload</div>
          <div class="text-[11px] text-slate-500 mt-0.5">{{ accept || 'Any file type' }}</div>

      <div v-else class="flex items-center gap-3 border border-slate-200 rounded-lg p-3 bg-slate-50">
        <div class="w-9 h-9 rounded bg-white flex items-center justify-center border border-slate-200"><Icon name="file-text" :size="18" cls="text-teal-600"/></div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium text-navy-900 truncate">{{ modelValue.name }}</div>
          <div class="text-[11px] text-slate-500">{{ (modelValue.size/1024).toFixed(1) }} KB · {{ modelValue.type || 'file' }}</div>
        </div>
        <button type="button" @click="clear" class="p-1 rounded hover:bg-red-50 text-slate-500 hover:text-red-600"><Icon name="x" :size="14"/></button>
