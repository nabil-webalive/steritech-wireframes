const CompanyListPage = {
  components:{ Icon, Btn },
  data(){ return {
    facilityFilter:'All', statusFilter:'All', q:'',
    menuFor:null,
    sort:{ by:'created', dir:'desc' },
    page: 1,
    pageSize: 10,
  }; },
  created(){
    // Honour ?status=Pending deep-links from the admin console pending-approvals feed.
    const s = this.$route.query.status;
    if (s) this.statusFilter = s;
  },
  mounted(){ document.addEventListener('click', this.closeMenu); },
  beforeUnmount(){ document.removeEventListener('click', this.closeMenu); },
  computed:{
    state(){ return state; },
    facilities(){ return FACILITIES; },
    rows(){
      const q = this.q.trim().toLowerCase();
      return state.companies.filter(c => {
        if (this.facilityFilter !== 'All' && !c.facilities.includes(this.facilityFilter)) return false;
        if (this.statusFilter !== 'All' && c.status !== this.statusFilter) return false;
        if (q) {
          const blob = (c.name + ' ' + (c.primaryContact?.name || '') + ' ' + c.email + ' ' + c.abn).toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    },
    activeCount(){ return state.companies.filter(c => c.status === 'Active').length; },
    pendingCount(){ return state.companies.filter(c => c.status === 'Pending').length; },
    disabledCount(){ return state.companies.filter(c => c.status === 'Disabled').length; },
    totalCount(){ return state.companies.length; },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    sortedRows(){
      const list = this.rows.slice();
      const k = this.sort.by;
      const m = this.sort.dir === 'asc' ? 1 : -1;
      list.sort((a,b) => (a[k] > b[k] ? m : a[k] < b[k] ? -m : 0));
      return list;
    },
    totalPages(){ return Math.max(1, Math.ceil(this.sortedRows.length / this.pageSize)); },
    effectivePage(){ return Math.min(this.page, this.totalPages); },
    pagedRows(){
      if (this.sortedRows.length <= this.pageSize) return this.sortedRows;
      const start = (this.effectivePage - 1) * this.pageSize;
      return this.sortedRows.slice(start, start + this.pageSize);
    },
    rangeStart(){ return this.sortedRows.length === 0 ? 0 : (this.effectivePage - 1) * this.pageSize + 1; },
    rangeEnd(){ return Math.min(this.effectivePage * this.pageSize, this.sortedRows.length); },
  },
  watch:{
    q(){ this.page = 1; },
    facilityFilter(){ this.page = 1; },
    statusFilter(){ this.page = 1; },
    pageSize(){ this.page = 1; },
  },
  methods:{
    fmtDate,
    statusDot(s){
      return ({ 'Active':'bg-emerald-500', 'Pending':'bg-amber-500', 'Disabled':'bg-slate-400' })[s] || 'bg-slate-400';
    },
    statusPill(s){
      return ({
        'Active':   'bg-emerald-50 text-emerald-700 ring-emerald-200',
        'Pending':    'bg-amber-50 text-amber-700 ring-amber-200',
        'Disabled': 'bg-slate-100 text-slate-600 ring-slate-200',
      })[s] || 'bg-slate-100 text-slate-600 ring-slate-200';
    },
    companyInitials(name){
      return (name || '?').trim().split(/\s+/).map(p => p[0] || '').join('').slice(0, 2).toUpperCase();
    },
    companyGradient(name){
      // Same palette as contact avatars, applied to a rounded-square monogram
      // tile — signals "organisation" rather than "person" while staying inside
      // the design system.
      const palette = [
        // Eye-soothing enterprise palette: only cool / neutral tones — navy,
        // slate, blue, teal, sky, emerald, indigo, stone. No reds, no warm
        // pinks, no bright candy. Inspired by the site-selector avatars,
        // which read as "calm industrial dashboard" rather than personality
        // colors. Single-hue 600→800 gradients keep each tile feeling solid.
        // 12 vibrant-but-mature solid tones — matching the manager's earlier
        // reference (emerald, violet, clear blue, teal, navy). Mid-saturated
        // 500-level hues feel alive without looking AI-generated. No reds,
        // no candy pinks/oranges, no gradient stacks.
        'bg-[#10B981]',   // 0  Emerald          — vibrant green
        'bg-[#8B5CF6]',   // 1  Violet           — soft purple
        'bg-[#3B82F6]',   // 2  Blue             — clear blue
        'bg-[#14B8A6]',   // 3  Teal             — vibrant teal
        'bg-[#1E293B]',   // 4  Navy             — dark charcoal-navy
        'bg-[#0EA5E9]',   // 5  Sky              — bright sky
        'bg-[#059669]',   // 6  Forest           — deeper green
        'bg-[#6366F1]',   // 7  Indigo           — clear indigo
        'bg-[#0891B2]',   // 8  Cyan             — deep cyan
        'bg-[#64748B]',   // 9  Slate            — medium grey
        'bg-[#7C3AED]',   // 10 Royal Purple     — vibrant purple
        'bg-[#475569]',   // 11 Steel            — deep grey
      ];
      const s = (name || '?').toLowerCase();
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
      for (let i = s.length - 1; i >= 0; i--) h = (((h << 5) + h) ^ (s.charCodeAt(i) * 7)) >>> 0;
      return palette[h % palette.length];
    },
    setSort(by){
      if (this.sort.by === by) this.sort.dir = this.sort.dir === 'asc' ? 'desc' : 'asc';
      else { this.sort.by = by; this.sort.dir = by === 'created' ? 'desc' : 'asc'; }
    },
    sortIcon(by){
      return this.sort.by === by ? (this.sort.dir === 'asc' ? 'chevron-up' : 'chevron-down') : 'chevrons-up-down';
    },
    prevPage(){ if (this.effectivePage > 1) this.page = this.effectivePage - 1; },
    nextPage(){ if (this.effectivePage < this.totalPages) this.page = this.effectivePage + 1; },
    closeMenu(){ this.menuFor = null; },
    toggleMenu(c, ev){
      ev.stopPropagation();
      this.menuFor = (this.menuFor === c.id) ? null : c.id;
    },
    closeRowMenu(){ this.menuFor = null; },
    deleteCompany(c){
      this.menuFor = null;
      if (!confirm('Delete ' + c.name + '? This removes the company record and all of its contacts. This cannot be undone.')) return;
      const i = state.companies.findIndex(x => x.id === c.id);
      if (i >= 0) state.companies.splice(i, 1);
      // Drop every contact tied to this company so the Contacts list stays consistent.
      for (let j = state.companyContacts.length - 1; j >= 0; j--) {
        if (state.companyContacts[j].companyId === c.id) state.companyContacts.splice(j, 1);
      }
      showToast(c.name + ' was removed.', 'success');
    },
  },

            <div class="relative">

              <input id="co-search" v-model="q" type="text" placeholder="Type a company, ABN, contact, or email&hellip;"
                     class="w-full h-11 pl-9 pr-3 rounded-md border border-slate-300 text-base focus-ring"/>
            </div>
          </div>
          <div class="md:col-span-4">
            <label for="co-facility" class="block text-sm font-medium text-slate-700 mb-1.5">Facility</label>
            <select id="co-facility" v-model="facilityFilter" class="h-11 px-3 w-full rounded-md border border-slate-300 text-base focus-ring bg-white">
              <option value="All">All facilities</option>

      <section class="bg-white border border-slate-200 rounded-md">
        <header class="px-5 py-4 border-b border-slate-200 flex items-center gap-3">
          <span class="shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-xl bg-teal-50 text-teal-600 ring-1 ring-teal-100">
            <Icon name="building-2" :size="18"/>
          </span>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h3 class="text-base font-semibold text-navy-900 leading-tight">All companies</h3>

          </div>
        </header>

        <!-- Status filter tabs — segmented control on top of the table so counts

/* ---------- Page: Admin · Contacts List ------------------------------------ */
/* All login-capable people across every company. Mirrors the design system of
   the Companies list + Add Company flow: premium card containers, gradient
   avatars per name, status pill badges, modern teal CTA. Search filters by
   name / email / company. The "Add New Contact" CTA routes to the existing
   Add Company Contact form. */

const ContactsListPage = {
  components:{ Icon, Btn },
  data(){ return { q:'', statusFilter:'All', facilityFilter:'All', menuFor:null, page:1, pageSize:10 }; },
  created(){
    // Honour ?status=Pending deep-links from the admin console pending-contacts card.
    const s = this.$route.query.status;
    if (s) this.statusFilter = s;
  },
  mounted(){ document.addEventListener('click', this.closeMenu); },
  beforeUnmount(){ document.removeEventListener('click', this.closeMenu); },
  watch:{
    q(){ this.page = 1; },
    statusFilter(){ this.page = 1; },
    facilityFilter(){ this.page = 1; },
    pageSize(){ this.page = 1; },
  },
  computed:{
    state(){ return state; },
    facilities(){ return FACILITIES; },
    rows(){
      const q = this.q.trim().toLowerCase();
      return state.companyContacts.filter(ct => {
        if (this.statusFilter !== 'All' && ct.status !== this.statusFilter) return false;
        if (this.facilityFilter !== 'All' && !(ct.facilities || []).includes(this.facilityFilter)) return false;
        if (q) {
          const blob = (ct.name + ' ' + ct.email + ' ' + ct.companyName).toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    },
    activeCount(){ return state.companyContacts.filter(c => c.status === 'Active').length; },
    pendingCount(){ return state.companyContacts.filter(c => c.status === 'Pending').length; },
    companyCount(){ return new Set(state.companyContacts.map(c => c.companyId)).size; },
    totalPages(){ return Math.max(1, Math.ceil(this.rows.length / this.pageSize)); },
    effectivePage(){ return Math.min(this.page, this.totalPages); },
    pagedRows(){
      if (this.rows.length <= this.pageSize) return this.rows;
      const start = (this.effectivePage - 1) * this.pageSize;
      return this.rows.slice(start, start + this.pageSize);
    },
    rangeStart(){ return this.rows.length === 0 ? 0 : (this.effectivePage - 1) * this.pageSize + 1; },
    rangeEnd(){ return Math.min(this.effectivePage * this.pageSize, this.rows.length); },
  },
  methods:{
    statusDot(s){
      return ({ 'Active':'bg-emerald-500', 'Pending':'bg-amber-500', 'Disabled':'bg-slate-400' })[s] || 'bg-slate-400';
    },
    statusPill(s){
      return ({
        'Active':   'bg-emerald-50 text-emerald-700 ring-emerald-200',
        'Pending':    'bg-amber-50 text-amber-700 ring-amber-200',
        'Disabled': 'bg-slate-100 text-slate-600 ring-slate-200',
      })[s] || 'bg-slate-100 text-slate-600 ring-slate-200';
    },
    initials(name){
      return (name || '?').trim().split(/\s+/).map(p => p[0] || '').join('').slice(0, 2).toUpperCase();

    contactGradient(name){
      const palette = [
        // Eye-soothing enterprise palette: only cool / neutral tones — navy,
        // slate, blue, teal, sky, emerald, indigo, stone. No reds, no warm
        // pinks, no bright candy. Inspired by the site-selector avatars,
        // which read as "calm industrial dashboard" rather than personality
        // colors. Single-hue 600→800 gradients keep each tile feeling solid.
        // 12 vibrant-but-mature solid tones — matching the manager's earlier
        // reference (emerald, violet, clear blue, teal, navy). Mid-saturated
        // 500-level hues feel alive without looking AI-generated. No reds,
        // no candy pinks/oranges, no gradient stacks.
        'bg-[#10B981]',   // 0  Emerald          — vibrant green
        'bg-[#8B5CF6]',   // 1  Violet           — soft purple
        'bg-[#3B82F6]',   // 2  Blue             — clear blue

        'bg-[#64748B]',   // 9  Slate            — medium grey
        'bg-[#7C3AED]',   // 10 Royal Purple     — vibrant purple
        'bg-[#475569]',   // 11 Steel            — deep grey
      ];
      const s = (name || '?').toLowerCase();
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
      for (let i = s.length - 1; i >= 0; i--) h = (((h << 5) + h) ^ (s.charCodeAt(i) * 7)) >>> 0;
      return palette[h % palette.length];
    },

        // 500-level hues feel alive without looking AI-generated. No reds,

        'bg-[#10B981]',   // 0  Emerald          — vibrant green

        'bg-[#3B82F6]',   // 2  Blue             — clear blue
        'bg-[#14B8A6]',   // 3  Teal             — vibrant teal
        'bg-[#1E293B]',   // 4  Navy             — dark charcoal-navy
        'bg-[#0EA5E9]',   // 5  Sky              — bright sky
        'bg-[#059669]',   // 6  Forest           — deeper green
        'bg-[#6366F1]',   // 7  Indigo           — clear indigo
        'bg-[#0891B2]',   // 8  Cyan             — deep cyan
        'bg-[#64748B]',   // 9  Slate            — medium grey
        'bg-[#7C3AED]',   // 10 Royal Purple     — vibrant purple
        'bg-[#475569]',   // 11 Steel            — deep grey
      ];
      const s = (name || '?').toLowerCase();
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
      for (let i = s.length - 1; i >= 0; i--) h = (((h << 5) + h) ^ (s.charCodeAt(i) * 7)) >>> 0;
      return palette[h % palette.length];
    },
    startEdit(){
      const c = this.contact;
      if (!c) return;
      this.draft = { name: c.name, phone: c.phone || '', email: c.email || '' };
      this.editingDetails = true;

      const i = state.companyContacts.findIndex(x => x.id === c.id);

/* ---------- Page: Admin · Customer List (Track 6 · Prompt 9) --------------- */

const CustomerListPage = {
  components:{ Icon, Btn },
  data(){ return {
    facilityFilter:'All', statusFilter:'All', q:'',
    menuFor:null,            // customer.id whose actions menu is open
    editing:null,            // working draft for the Edit modal
    confirmDeactivate:null,
    sort:{ by:'created', dir:'desc' },
    page: 1,
    pageSize: 25,
  }; },
  mounted(){ document.addEventListener('click', this.closeMenu); },
  beforeUnmount(){ document.removeEventListener('click', this.closeMenu); },
  computed:{
    state(){ return state; },
    facilities(){ return FACILITIES; },
    rows(){
      const q = this.q.trim().toLowerCase();
      return state.customers.filter(c => {
        if (this.facilityFilter !== 'All' && !c.facilities.includes(this.facilityFilter)) return false;
        if (this.statusFilter !== 'All' && c.status !== this.statusFilter) return false;
        if (q) {
          const blob = (c.contact + ' ' + c.company + ' ' + c.email).toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    },
    activeCount(){ return state.customers.filter(c => c.status === 'Active').length; },
    disabledCount(){ return state.customers.filter(c => c.status === 'Disabled').length; },
    totalCount(){ return state.customers.length; },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    sortedRows(){
      const list = this.rows.slice();
      const k = this.sort.by;
      const m = this.sort.dir === 'asc' ? 1 : -1;
      list.sort((a,b) => (a[k] > b[k] ? m : a[k] < b[k] ? -m : 0));
      return list;
    },
    totalPages(){ return Math.max(1, Math.ceil(this.sortedRows.length / this.pageSize)); },
    effectivePage(){ return Math.min(this.page, this.totalPages); },
    pagedRows(){
      if (this.sortedRows.length <= this.pageSize) return this.sortedRows;
      const start = (this.effectivePage - 1) * this.pageSize;
      return this.sortedRows.slice(start, start + this.pageSize);
    },
    rangeStart(){ return this.sortedRows.length === 0 ? 0 : (this.effectivePage - 1) * this.pageSize + 1; },
    rangeEnd(){ return Math.min(this.effectivePage * this.pageSize, this.sortedRows.length); },
  },
  watch:{
    q(){ this.page = 1; },
    facilityFilter(){ this.page = 1; },
    statusFilter(){ this.page = 1; },
    pageSize(){ this.page = 1; },
  },
  methods:{
    fmtDate,
    statusDot(s){
      return ({ 'Active':'bg-emerald-500', 'Pending':'bg-amber-500', 'Disabled':'bg-slate-400' })[s] || 'bg-slate-400';
    },
    setSort(by){
      if (this.sort.by === by) this.sort.dir = this.sort.dir === 'asc' ? 'desc' : 'asc';
      else { this.sort.by = by; this.sort.dir = by === 'created' ? 'desc' : 'asc'; }
    },
    sortIcon(by){
      return this.sort.by === by ? (this.sort.dir === 'asc' ? 'chevron-up' : 'chevron-down') : 'chevrons-up-down';
    },
    prevPage(){ if (this.effectivePage > 1) this.page = this.effectivePage - 1; },
    nextPage(){ if (this.effectivePage < this.totalPages) this.page = this.effectivePage + 1; },
    closeMenu(){ this.menuFor = null; },
    toggleMenu(c, ev){
      ev.stopPropagation();
      this.menuFor = (this.menuFor === c.id) ? null : c.id;
    },

    /* ---- Edit details ---- */
    openEdit(c, ev){
      if (ev) ev.stopPropagation();
      this.menuFor = null;
      // Build access matrix from customer's current facility+service combo.
      // Customer model only stores flat lists (facilities[], services[]); we expand to a matrix
      // intersected with each facility's offered services so the matrix reflects what's actually possible.
      const access = {};
      FACILITIES.forEach(f => {
        const row = {};
        TREATMENT_SERVICES.forEach(s => {
          row[s] = c.facilities.includes(f.code) && c.services.includes(s) && f.services.includes(s);
        });
        access[f.code] = row;
      });
      this.editing = {
        id: c.id,
        company: c.company,
        contact: c.contact,
        email: c.email,
        phone: c.phone || '',
        access,
      };
    },
    closeEdit(){ this.editing = null; },
    canCheckAt(facCode, service){
      const f = FACILITIES.find(x => x.code === facCode);
      return !!(f && f.services.includes(service));
    },
    saveEdit(){
      const e = this.editing;
      if (!e.company.trim() || !e.contact.trim() || !e.email.trim()) {
        showToast('Company, contact and email are required.', 'error');
        return;
      }
      const c = state.customers.find(x => x.id === e.id);
      if (!c) { this.editing = null; return; }
      // Collapse access matrix back into flat facility/service lists
      const facilities = [];
      const servicesSet = new Set();
      FACILITIES.forEach(f => {
        const row = e.access[f.code];
        const any = TREATMENT_SERVICES.some(s => row[s]);
        if (any) {
          facilities.push(f.code);
          TREATMENT_SERVICES.forEach(s => { if (row[s]) servicesSet.add(s); });
        }
      });
      c.company = e.company.trim();
      c.contact = e.contact.trim();
      c.email   = e.email.trim();
      c.phone   = e.phone.trim();
      c.facilities = facilities;
      c.services   = Array.from(servicesSet);
      this.editing = null;
      showToast('Customer details updated.', 'success');

  computed:{
    state(){ return state; },
    customer(){ return state.customers.find(c => c.id === this.$route.params.id); },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    facObjs(){ return (this.customer?.facilities || []).map(code => FACILITIES.find(f => f.code === code)).filter(Boolean); },
    recentOrders(){
      // Reuse seed orders, take first 5 as a mock
      return state.orders.slice(0, 5);
    },
    // For Messages tab: every order belonging to this (mocked) customer that has any messages.
    // We use the same first-5 mock window as recentOrders so the demo stays consistent.
    messageThreads(){
      return state.orders.slice(0, 5).map(o => ({
        order: o,
        msgs: state.messages[o.id] || [],
      })).sort((a,b) => {
        // Threads with messages first, then by latest message ts desc
        const aHas = a.msgs.length > 0, bHas = b.msgs.length > 0;
        if (aHas !== bHas) return bHas - aHas;
        const aLast = a.msgs.length ? a.msgs[a.msgs.length-1].ts : a.order.submitted;
        const bLast = b.msgs.length ? b.msgs[b.msgs.length-1].ts : b.order.submitted;
        return bLast.localeCompare(aLast);
      });
    },
    totalMessageCount(){
      return this.messageThreads.reduce((n,t) => n + t.msgs.length, 0);
    },
    activeThreadCount(){
      return this.messageThreads.filter(t => t.msgs.length > 0).length;
    },
  },

      return ({ 'Active':'bg-emerald-500', 'Pending':'bg-amber-500', 'Disabled':'bg-slate-400' })[s] || 'bg-slate-400';

const SchemaEditorPage = {
  components:{ Icon, Btn, TreatmentChip },
  data(){
    // Build per-row schema state: collapse shared rows to a single canonical entry.
    // Key = sharedKey (groups MER+NAR FRM-0359 into one) | facility+key for exclusives.
    const rows = [];
    const seenShared = new Set();
    for (const fm of FORM_CATALOG) {
      const isShared = (fm.shared_with || []).length >= 2;
      const sharedKey = isShared ? `SHARED:${fm.code}` : `${fm.facility}:${fm.key}`;
      if (isShared && seenShared.has(fm.code)) continue;
      if (isShared) seenShared.add(fm.code);
      rows.push({
        id: sharedKey,
        code: fm.code,
        name: fm.name,
        treatment: fm.treatment,
        // Facilities for badge: shared rows show all sharing facilities; exclusive shows just one.
        facilities: isShared ? [...fm.shared_with] : [fm.facility],
        // The "current facility" context for fork copy purposes — first facility
        currentFacility: fm.facility,
        shared: isShared,
        version: 3,
        forkedFrom: null,           // { facility, version } once forked
        // Mock JSON body for the editor
        json: this._buildMockJson(fm),
      });
    }
    return {
      rows,
      selectedId: null,
      forkPrompt: null,             // { schemaId } — pops the modal
    };
  },
  computed:{
    state(){ return state; },
    grouped(){
      const groups = { 'Gamma':[], 'ETO':[], 'GMP':[], 'Gamma+ETO':[] };
      for (const r of this.rows) {
        if (groups[r.treatment]) groups[r.treatment].push(r);
        else groups[r.treatment] = [r];
      }
      return groups;
    },
    selected(){ return this.rows.find(r => r.id === this.selectedId) || null; },
    sharingFacilityNames(){
      if (!this.selected || !this.selected.shared) return '';
      return this.selected.facilities
        .map(code => FACILITIES.find(f => f.code === code))
        .filter(Boolean)
        .map(f => f.name)
        .join(', ');
    },
    otherFacilityNames(){
      if (!this.selected || !this.selected.shared) return '';
      return this.selected.facilities
        .filter(code => code !== this.selected.currentFacility)
        .map(code => FACILITIES.find(f => f.code === code)?.name)
        .filter(Boolean)
        .join(', ');
    },
    lineNumbers(){
      if (!this.selected) return [];
      const n = (this.selected.json.match(/\n/g) || []).length + 1;
      return Array.from({length:n}, (_,i)=> i+1);
    },
  },
  methods:{
    _buildMockJson(fm){
      const obj = {
        code: fm.code,
        name: fm.name,
        treatment: fm.treatment,
        facility: fm.facility,
        shared_with: fm.shared_with || [],
        sections: [
          { id:'about-you',     title:'About You' },
          { id:'consignment',   title:'Consignment Details' },
          { id:'params',        title:`${fm.treatment} Parameters` },
          { id:'declaration',   title:'Declaration & Sign-off' },
        ],
      };
      return JSON.stringify(obj, null, 2);
    },
    facName(code){ return FACILITIES.find(f => f.code === code)?.name || code; },
    pick(id){ this.selectedId = id; },
    saveClicked(){
      const s = this.selected;
      if (!s) return;
      if (s.shared) {
        this.forkPrompt = { schemaId: s.id };
      } else {
        s.version += 1;
        showToast('Schema updated.','success');
      }
    },
    applyToAll(){
      const s = this.selected;
      s.version += 1;
      const n = s.facilities.length;
      showToast(`Schema updated for ${n} ${n === 1 ? 'facility' : 'facilities'}.`,'success');
      this.forkPrompt = null;
    },
    forkOnly(){
      const s = this.selected;
      const facName  = this.facName(s.currentFacility);
      const others   = this.otherFacilityNames;
      s.forkedFrom = { facility:s.currentFacility, version:s.version };
      // Bump version on the forked copy
      s.version += 1;
      // Mark schema no longer shared (this fork is now its own)
      s.shared = false;
      s.facilities = [s.currentFacility];
      showToast(`Forked schema for ${facName}. ${others} continue on the previous version.`,'success');
      this.forkPrompt = null;
    },
    cancelFork(){ this.forkPrompt = null; },
  },
  template:`
    <div class="px-6 sm:px-10 py-8 max-w-[1600px] mx-auto">
      <!-- Vertical-stack header -->
      <div class="mb-6">
        <div class="flex items-center gap-2 mb-2">
          <span class="inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wider px-2 py-1 rounded bg-amber-50 text-amber-700 border border-amber-200">
            <Icon name="file-cog" :size="11"/> Admin · Schema editor
          </span>
        </div>
        <h1 class="text-2xl font-semibold text-navy-900 leading-tight tracking-tight">Form Schemas</h1>
        <p class="text-sm text-slate-500 mt-1">Manage form definitions across all facilities</p>
      </div>

      <!-- Two-pane: list (4 cols) + editor (8 cols) -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6">
        <!-- Left: schema list -->
        <aside class="lg:col-span-4 bg-white border border-slate-200 rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100">
            <div class="text-sm font-semibold text-navy-900">Schemas</div>
            <div class="text-[11px] text-slate-500 mt-0.5">{{ rows.length }} definitions across {{ Object.keys(grouped).length }} treatments</div>
          </div>
          <div class="max-h-[640px] overflow-y-auto scroll-thin divide-y divide-slate-100">
            <template v-for="treatment in ['Gamma','ETO','GMP','Gamma+ETO']" :key="treatment">
              <div v-if="grouped[treatment] && grouped[treatment].length" class="px-4 pt-3 pb-1 sticky top-0 bg-slate-50/95 backdrop-blur-sm z-10">
                <div class="flex items-center gap-2">
                  <TreatmentChip :treatment="treatment"/>
                  <span class="text-[11px] text-slate-500">{{ grouped[treatment].length }}</span>
                </div>
              </div>
              <button v-for="r in grouped[treatment]" :key="r.id"
                      type="button" @click="pick(r.id)"
                      :class="['w-full text-left px-4 py-3 transition-colors focus-ring',
                                selectedId === r.id ? 'bg-teal-50 hover:bg-teal-50' : 'hover:bg-slate-50']">
                <div class="flex items-start gap-2 mb-1">
                  <span class="text-[11px] font-mono text-slate-500 shrink-0 mt-0.5">{{ r.code }}</span>
                  <span :class="['text-sm leading-snug', selectedId === r.id ? 'text-teal-900 font-medium' : 'text-navy-900']">{{ r.name }}</span>
                </div>
                <div class="flex items-center gap-1 flex-wrap pl-[3.25rem]">
                  <span v-for="fc in r.facilities" :key="fc"
                        class="inline-flex items-center text-[10px] font-semibold px-1.5 py-0.5 rounded border border-slate-200 bg-slate-50 text-slate-700">{{ fc }}</span>
                  <span v-if="r.shared" class="inline-flex items-center gap-1 text-[10px] font-medium px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-200">
                    <Icon name="link" :size="10"/> shared
                  </span>
                </div>
              </button>
            </template>
          </div>
        </aside>

        <!-- Right: editor pane -->
        <section class="lg:col-span-8 bg-white border border-slate-200 rounded-xl overflow-hidden flex flex-col min-h-[480px]">
          <!-- Empty state -->
          <div v-if="!selected" class="flex-1 flex items-center justify-center p-12 text-center">
            <div>
              <div class="w-14 h-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mb-4 mx-auto">
                <Icon name="file-cog" :size="26"/>
              </div>
              <div class="text-sm font-semibold text-navy-900">Select a schema to edit</div>
              <div class="text-xs text-slate-500 mt-1 max-w-xs mx-auto">Pick a form from the list on the left to view and edit its JSON definition.</div>
            </div>
          </div>

          <template v-else>
            <!-- Editor header -->
            <div class="px-5 py-4 border-b border-slate-100 flex items-start gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap mb-1">
                  <span class="text-[11px] font-mono text-slate-500">{{ selected.code }}</span>
                  <TreatmentChip :treatment="selected.treatment"/>
                  <span class="inline-flex items-center text-[11px] font-semibold px-2 py-0.5 rounded-full bg-navy-50 text-navy-900 border border-navy-100">v{{ selected.version }}</span>
                  <span v-if="selected.shared" class="inline-flex items-center gap-1 text-[10px] font-medium px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-200">
                    <Icon name="link" :size="10"/> shared · {{ selected.facilities.join(' + ') }}
                  </span>
                </div>
                <div class="text-sm font-semibold text-navy-900 leading-tight truncate">{{ selected.name }}</div>
                <div v-if="selected.forkedFrom" class="mt-1 inline-flex items-center gap-1 text-[11px] text-amber-800 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded">
                  <Icon name="git-branch" :size="11"/>
                  Forked from v{{ selected.forkedFrom.version }} of {{ facName(selected.forkedFrom.facility) }} / {{ selected.name }}
                </div>
              </div>
              <Btn kind="primary" icon="save" action="save" @click="saveClicked">Save</Btn>
            </div>

            <!-- JSON editor: line numbers + textarea -->
            <div class="flex-1 flex font-mono text-[12.5px] leading-[1.5] bg-slate-900 text-slate-100">
              <pre class="px-3 py-3 text-right text-slate-500 select-none border-r border-slate-700/60 bg-slate-900/80 shrink-0" style="line-height:1.5;">{{ lineNumbers.join('\\n') }}</pre>
              <textarea v-model="selected.json" spellcheck="false"
                        class="flex-1 px-3 py-3 bg-transparent outline-none resize-none text-slate-100"
                        style="line-height:1.5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;"
                        rows="22"></textarea>
            </div>

            <div class="px-5 py-3 border-t border-slate-100 bg-slate-50 flex items-center text-[11px] text-slate-500">
              <Icon name="info" :size="12" cls="mr-1.5"/>
              Schema changes deploy to all selected facilities on Save.
            </div>
          </template>
        </section>
      </div>

      <!-- Fork prompt modal -->
      <div v-if="forkPrompt && selected" class="fixed inset-0 z-[60] bg-slate-900/50 flex items-center justify-center px-4" @click.self="cancelFork">
          <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden" role="dialog" aria-modal="true">
            <div class="px-6 pt-6 pb-2 flex items-start gap-3">
              <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center shrink-0">
                <Icon name="git-branch" :size="18"/>
              </div>
              <div class="flex-1">
                <h2 class="text-base font-semibold text-navy-900">Apply changes to all sharing facilities?</h2>
                <p class="text-xs text-slate-500 mt-0.5">{{ selected.code }} · {{ selected.name }}</p>
              </div>
            </div>
            <div class="px-6 py-4 text-sm text-slate-700 leading-relaxed">
              This form is shared by <strong class="text-navy-900">{{ sharingFacilityNames }}</strong>.
              Choose to update all or fork only this facility.
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex flex-wrap items-center justify-end gap-2">
              <Btn kind="ghost" @click="cancelFork">Cancel</Btn>
              <Btn kind="outline" icon="git-branch" @click="forkOnly">Fork {{ facName(selected.currentFacility) }}</Btn>
              <Btn kind="primary" icon="check" @click="applyToAll">Apply to all</Btn>
            </div>
          </div>
        </div>
      </div>
    </div>
  `
};

/* ---------- Router ---------------------------------------------------------- */
const requireAuth = (to, from, next) => { if (state.authed) next(); else next('/login'); };
const requireFacilities = (to, from, next) => {
  if ((state.profile.facilities || []).length === 0) next('/onboarding/incomplete');
  else next();
};
const requireAdmin = (to, from, next) => {
  if (state.role === 'admin') next();
  else next('/dashboard');
};

const router = createRouter({
  history: createWebHashHistory(),
  routes: [
    { path:'/login',    component: LoginPage },
    { path:'/signup',   component: SignupPage },
    { path:'/eula',     component: EulaGatePage },
    { path:'/onboarding/incomplete', component: OnboardingIncompletePage },
    { path:'/',          component: Shell, beforeEnter: requireAuth,
      children: [
        { path:'',                                  redirect:'/dashboard' },
        { path:'/dashboard',                        component: DashboardPage, beforeEnter: requireFacilities },
        { path:'/start',                            component: StartRequestPage, beforeEnter: requireFacilities },
        { path:'/forms',                            component: FormPickerPage, beforeEnter: requireFacilities },
        { path:'/forms/:facility/:formKey',         component: FormRenderer },
        { path:'/orders',                           component: OrdersPage },
        { path:'/orders/:id',                       component: OrderDetailPage },
        { path:'/submitted/:id',                    component: SubmittedPage },
        { path:'/settings',                         component: SettingsPage },
        { path:'/admin',                            component: AdminConsolePage,    beforeEnter: requireAdmin },
        { path:'/admin/companies',                  component: CompanyListPage,             beforeEnter: requireAdmin },
        { path:'/admin/companies/new',              component: OnboardCompanyPage,          beforeEnter: requireAdmin },
        { path:'/admin/companies/:id',              component: CompanyDetailPage,           beforeEnter: requireAdmin },
        { path:'/admin/contacts',                   component: ContactsListPage,            beforeEnter: requireAdmin },
        { path:'/admin/contacts/new',               component: OnboardCompanyContactPage,   beforeEnter: requireAdmin },
        { path:'/admin/contacts/:id',               component: ContactDetailPage,           beforeEnter: requireAdmin },
        { path:'/admin/eula',                       component: AdminEulaPage,               beforeEnter: requireAdmin },
        { path:'/admin/eula/logs',                  component: AdminEulaLogsPage,           beforeEnter: requireAdmin },
        // Legacy customer routes — kept for any links still referencing them, but not in nav.
        { path:'/admin/customers',                  component: CustomerListPage,    beforeEnter: requireAdmin },
        { path:'/admin/customers/:id',              component: CustomerDetailPage,  beforeEnter: requireAdmin },
        { path:'/admin/onboard-customer',           redirect:'/admin/companies/new' },
        { path:'/admin/site-settings',              redirect: { path:'/settings', query:{ tab:'site' } } },
        { path:'/_dev/fields',                      component: DevFieldsPage },
      ]
    },
    { path: '/:pathMatch(.*)*', redirect:'/dashboard' }
  ]
});

/* EULA enforcement (Case 1 & 2) — additive global guard. Customers must have a
   current acceptance before reaching any protected view; admins are exempt.
   Public routes (login/signup/onboarding) and the gate itself are never blocked. */
const EULA_PUBLIC_PATHS = ['/login', '/signup', '/onboarding/incomplete', '/eula'];
router.beforeEach((to, from, next) => {
  if (!state.authed) return next();
  if (EULA_PUBLIC_PATHS.includes(to.path)) return next();
  if (eulaStatus().required) {
    state.eulaReturnTo = to.fullPath;
    return next('/eula');
  }
  next();
});

/* ---------- Boot ------------------------------------------------------------ */

// start authed for the wireframe so the user lands on the app
state.authed = true;

const app = createApp({});
// Click-outside directive (used by mid-form facility menu, etc.)
app.directive('click-outside', {
  beforeMount(el, binding) {
    el.__clickOutsideHandler__ = (event) => {
      if (!(el === event.target || el.contains(event.target))) {
        binding.value(event);
      }
    };
    setTimeout(() => document.addEventListener('click', el.__clickOutsideHandler__), 0);
  },
  unmounted(el) {
    document.removeEventListener('click', el.__clickOutsideHandler__);
    delete el.__clickOutsideHandler__;
  }
});
app.component('Icon', Icon);
app.component('Btn', Btn);
app.component('TreatmentChip', TreatmentChip);
app.component('BcSyncChip', BcSyncChip);
app.component('StatusBadge', StatusBadge);
app.component('TopNav', TopNav);
app.component('Sidebar', Sidebar);
app.component('FacilityChip', FacilityChip);
app.component('UserChip', UserChip);
app.component('DemoPanel', DemoPanel);
app.component('FacilitySwitcher', FacilitySwitcher);
app.component('Shell', Shell);
app.component('EmptyState', EmptyState);
app.component('Skel', Skel);
app.component('FileUploadField', FileUploadField);
app.component('SignaturePad', SignaturePad);
// Phase 4a field component library
app.component('FieldText',       FieldText);
app.component('FieldTextarea',   FieldTextarea);
app.component('FieldEmail',      FieldEmail);
app.component('FieldPhone',      FieldPhone);
app.component('FieldNumber',     FieldNumber);
app.component('FieldDate',       FieldDate);
app.component('FieldRadio',      FieldRadio);
app.component('FieldCheckbox',   FieldCheckbox);
app.component('FieldSelect',     FieldSelect);
app.component('FieldFileUpload', FieldFileUpload);
app.component('FieldSignature',  FieldSignature);
app.component('FieldCalculated', FieldCalculated);
app.use(router);
app.mount('#app');
window.__state = state;

/* Re-render Lucide icons whenever a route changes */
router.afterEach(() => {
  nextTick(() => window.lucide?.createIcons());
});
</script>
