/* ---------- Admin: EULA acceptance & declaration logs (/admin/eula/logs) ----- */
const AdminEulaLogsPage = {
  components:{ Icon, Btn, RouterLink },
  data(){ return { logTab:'acceptances', search:'' }; },
  computed:{
    state(){ return state; },
    acceptances(){
      const q = this.search.trim().toLowerCase();
      const rows = state.eulaAcceptances.slice().reverse();
      if (!q) return rows;
      return rows.filter(a => [a.userName,a.companyName,a.version,a.ip].some(v => String(v||'').toLowerCase().includes(q)));
    },
    declarations(){
      const q = this.search.trim().toLowerCase();
      const rows = state.formDeclarations.slice().reverse();
      if (!q) return rows;
      return rows.filter(d => [d.userName,d.companyName,d.formCode,d.formName,d.orderId].some(v => String(v||'').toLowerCase().includes(q)));
    },
  },
  methods:{
    fmtDT(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); },
    csvCell(v){ const s = String(v==null?'':v).replace(/"/g,'""'); return /[",\n]/.test(s) ? '"'+s+'"' : s; },
    downloadCsv(filename, headers, rows){
      const lines = [headers.join(',')].concat(rows.map(r => r.map(this.csvCell).join(',')));
      const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      showToast('Exported '+rows.length+' row(s) to CSV.', 'success');
    },
    exportAcceptances(){
      this.downloadCsv('eula-acceptances.csv',
        ['User','Company','Version','Reason','Accepted at','IP','User agent'],
        this.acceptances.map(a => [a.userName, a.companyName, a.version, a.reason, a.acceptedAt, a.ip, a.userAgent]));
    },
    exportDeclarations(){
      this.downloadCsv('form-declarations.csv',
        ['Order ID','Form code','Form name','Facility','Treatment','User','Company','Statement','Method','Signature','Accepted at','IP'],
        this.declarations.map(d => [d.orderId,d.formCode,d.formName,d.facility,d.treatment,d.userName,d.companyName,d.statement,d.method,d.signatureValue,d.acceptedAt,d.ip]));
    },
    exportPdf(){
      const isAcc = this.logTab === 'acceptances';
      const title = isAcc ? 'Agreement Acceptance Log' : 'Form Declaration Log';
      const cols = isAcc
        ? ['User','Company','Version','Reason','Accepted at','IP']
        : ['Order','Form','User','Company','Method','Accepted at','IP'];
      const rows = isAcc
        ? this.acceptances.map(a => [a.userName, a.companyName, 'v'+a.version, a.reason, this.fmtDT(a.acceptedAt), a.ip])
        : this.declarations.map(d => [d.orderId, d.formCode+' · '+d.formName, d.userName, d.companyName, d.method, this.fmtDT(d.acceptedAt), d.ip]);
      const esc = s => String(s==null?'':s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      const head = cols.map(c => '<th>'+esc(c)+'</th>').join('');
      const body = rows.length
        ? rows.map(r => '<tr>'+r.map(c => '<td>'+esc(c)+'</td>').join('')+'</tr>').join('')
        : '<tr><td colspan="'+cols.length+'" style="text-align:center;color:#64748b;padding:24px">No records.</td></tr>';
      const now = new Date().toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const meta = 'Agreement: '+esc(state.eula.title)+' (v'+esc(state.eula.version)+') · Exported '+esc(now)+' · '+rows.length+' record(s)'+(this.search ? ' · filtered by "'+esc(this.search)+'"' : '');
      const win = window.open('', '_blank');
      if (!win) { showToast('Pop-up blocked. Allow pop-ups for this site to export PDF.', 'error'); return; }
      win.document.write(
        '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>'+esc(title)+'</title>'+
        '<style>@page{size:A4 landscape;margin:14mm;}*{box-sizing:border-box;}'+
        'body{font-family:Arial,Helvetica,sans-serif;color:#1f2733;margin:0;}'+
        '.hdr{border-bottom:2px solid #0f2a4a;padding-bottom:10px;margin-bottom:12px;}'+
        '.hdr h1{font-size:18px;color:#0f2a4a;margin:0 0 2px;}.hdr .sub{font-size:11px;color:#475569;}'+
        '.meta{font-size:11px;color:#475569;margin-bottom:10px;}'+
        'table{border-collapse:collapse;width:100%;font-size:11px;}'+
        'th,td{border:1px solid #cbd5e1;padding:5px 7px;text-align:left;vertical-align:top;}'+
        'th{background:#eef2f6;color:#0f2a4a;}tr{page-break-inside:avoid;}thead{display:table-header-group;}'+
        '</style></head><body>'+
        '<div class="hdr"><h1>Steritech '+esc(title)+'</h1>'+
        '<div class="sub">Permanent audit trail for compliance and government audits</div></div>'+
        '<div class="meta">'+meta+'</div>'+
        '<table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table>'+
        '</body></html>');
      win.document.close();
      win.focus();
      setTimeout(() => { win.print(); }, 300);
    },
  },
  template:`
  <div class="p-6 sm:p-8 max-w-full space-y-6 text-base text-slate-800">
    <div class="flex items-center gap-2 text-sm text-slate-500">
      <router-link to="/admin" class="hover:text-navy-900 focus-ring rounded">Admin console</router-link>
      <Icon name="chevron-right" :size="14"/>
      <router-link to="/admin/eula" class="hover:text-navy-900 focus-ring rounded">Service Agreement</router-link>
      <Icon name="chevron-right" :size="14"/><span class="text-navy-900 font-medium">Acceptance logs</span>
    </div>
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-xl font-semibold text-navy-900 leading-tight">Acceptance &amp; declaration logs</h1>
        <p class="text-sm text-slate-500 mt-1">Permanent, exportable audit trail for compliance and government audits.</p>
      </div>
      <div class="flex items-center gap-2">
        <Btn kind="outline" icon="download" @click="logTab==='acceptances' ? exportAcceptances() : exportDeclarations()">Export CSV</Btn>
        <Btn kind="ghost" icon="printer" @click="exportPdf">Export PDF</Btn>
      </div>
    </div>

    <div class="flex items-center gap-1 border-b border-slate-200">
      <button type="button" @click="logTab='acceptances'" :class="['px-4 py-2 text-sm font-medium border-b-2 -mb-px', logTab==='acceptances' ? 'border-teal-600 text-navy-900' : 'border-transparent text-slate-500 hover:text-navy-900']">Agreement acceptances ({{ state.eulaAcceptances.length }})</button>
      <button type="button" @click="logTab='declarations'" :class="['px-4 py-2 text-sm font-medium border-b-2 -mb-px', logTab==='declarations' ? 'border-teal-600 text-navy-900' : 'border-transparent text-slate-500 hover:text-navy-900']">Form declarations ({{ state.formDeclarations.length }})</button>
      <div class="ml-auto py-1.5">

          <Icon name="search" :size="15" cls="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"/>

    <section v-if="logTab==='acceptances'" class="bg-white border border-slate-200 rounded-md overflow-hidden">

    <section v-else class="bg-white border border-slate-200 rounded-md overflow-hidden">

        // 500-level hues feel alive without looking AI-generated. No reds,

        'bg-[#10B981]',   // 0  Emerald          — vibrant green
        'bg-[#8B5CF6]',   // 1  Violet           — soft purple
        'bg-[#3B82F6]',   // 2  Blue             — clear blue
        'bg-[#14B8A6]',   // 3  Teal             — vibrant teal
        'bg-[#1E293B]',   // 4  Navy             — dark charcoal-navy

const OnboardCustomerPage = {
  components:{ Icon, Btn },
  data(){
    // Build empty access matrix: { MER: { Gamma:false, ETO:false, GMP:false }, ... }
    const access = {};
    FACILITIES.forEach(f => {
      const row = {};
      TREATMENT_SERVICES.forEach(s => { row[s] = false; });
      access[f.code] = row;
    });
    // Per-form access, keyed by [facility code][form key]. Stays in sync with
    // the matrix above: ticking a treatment defaults its forms ON, unticking
    // defaults them OFF. Forms with shared_with appear under each facility
    // they're shared with, and each (facility,form) selection is independent.
    const formAccess = {};
    FACILITIES.forEach(fac => {
      const row = {};
      FORM_CATALOG.forEach(form => {
        const sharedWith = (form.shared_with && form.shared_with.length) ? form.shared_with : null;
        const offeredHere = sharedWith ? sharedWith.includes(fac.code) : (form.facility === fac.code);
        if (offeredHere) row[form.key] = false;
      });
      formAccess[fac.code] = row;
    });
    return {
      f: {
        company:'',
        contact:'',
        abn:'',
        phone:'',
        email:'',
        addrStreet:'',
        addrSuburb:'',
        addrState:'VIC',
        addrPostcode:'',
      },
      access,
      formAccess,
      submitAttempted: false,
    };
  },
  computed:{
    state(){ return state; },
    facilities(){ return FACILITIES; },
    services(){ return TREATMENT_SERVICES; },
    /* For each facility row, which services CAN be ticked (offered there) */
    canCheck(){
      const m = {};
      FACILITIES.forEach(f => {
        const row = {};
        TREATMENT_SERVICES.forEach(s => { row[s] = f.services.includes(s); });
        m[f.code] = row;
      });
      return m;
    },
    /* List of facilities the customer will have access to (any service ticked in their row) */
    grantedFacilities(){
      return FACILITIES.filter(f => TREATMENT_SERVICES.some(s => this.access[f.code][s]));
    },
    /* Form-by-treatment groupings for every granted (facility, treatment) combo.
       Each entry: { fac, treatments: [{ service, forms: [FORM_CATALOG row...] }] }.
       Drives the "Form access" card. */
    formGroups(){
      const groups = [];
      for (const fac of this.grantedFacilities) {
        const treatments = [];
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          const forms = this.formsAt(fac.code, s);
          if (forms.length) treatments.push({ service: s, forms });
        }
        if (treatments.length) groups.push({ fac, treatments });
      }
      return groups;
    },
    totalFormsGranted(){
      let n = 0;
      for (const fac of this.grantedFacilities) {
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          for (const form of this.formsAt(fac.code, s)) {
            if (this.formAccess[fac.code][form.key]) n++;
          }
        }
      }
      return n;
    },
    /* For each granted (fac, service), did the admin leave it without any form ticked? */
    treatmentsMissingForms(){
      const missing = [];
      for (const fac of this.grantedFacilities) {
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          const forms = this.formsAt(fac.code, s);
          if (!forms.length) continue; // no forms configured at all → not the admin's problem
          const anyTicked = forms.some(f => this.formAccess[fac.code][f.key]);
          if (!anyTicked) missing.push({ fac: fac.code, service: s });
        }
      }
      return missing;
    },
    detailsValid(){
      const f = this.f;
      return f.company.trim() && f.contact.trim() && f.abn.trim() && f.phone.trim() && f.email.trim();
    },
    addressValid(){
      const f = this.f;
      return f.addrStreet.trim() && f.addrSuburb.trim() && f.addrState && f.addrPostcode.trim();

      return this.grantedFacilities.length > 0;

/* ---------- Helpers: empty access matrix builders (reused by Company pages) - */
/* Build empty { facCode: { service: false } } matrix and an empty per-form
   access map keyed by [facCode][formKey]. Both are kept in sync with the
   facility/treatment matrix in the page-level toggle handler. */
function buildEmptyAccess() {
  const access = {};
  FACILITIES.forEach(f => {
    const row = {};
    TREATMENT_SERVICES.forEach(s => { row[s] = false; });
    access[f.code] = row;
  });
  return access;
}
function buildEmptyFormAccess() {
  const formAccess = {};
  FACILITIES.forEach(fac => {
    const row = {};
    FORM_CATALOG.forEach(form => {
      const sharedWith = (form.shared_with && form.shared_with.length) ? form.shared_with : null;
      const offeredHere = sharedWith ? sharedWith.includes(fac.code) : (form.facility === fac.code);
      if (offeredHere) row[form.key] = false;
    });
    formAccess[fac.code] = row;
  });
  return formAccess;
}
function formsAtForCatalog(facCode, service) {
  const out = [];
  for (const form of FORM_CATALOG) {
    if (form.treatment !== service) continue;
    const sharedWith = (form.shared_with && form.shared_with.length) ? form.shared_with : null;
    const offeredHere = sharedWith ? sharedWith.includes(facCode) : (form.facility === facCode);
    if (offeredHere) out.push(form);
  }
  return out;
}

/* ---------- Page: Admin · Onboard a New Company ---------------------------- */
/* Three sections, in order:
     A. Company Details — name, ABN, business phone, login email
     B. Company Primary Contact — name, phone, optional secondary email
     C. Facility & Service Access — same matrix + form-access pattern as the
        legacy Onboard Customer page (architect-locked chrome). */

/* Page-local form metadata for the Onboard Company form-access cards.
   Kept here (not on FORM_CATALOG) so customer-facing screens that read the
   shared catalog are unaffected. Keyed by FORM_CATALOG.key. */
const ONBOARD_COMPANY_FORM_META = {
  'fresh-produce-dom': { shortDesc:'ICA-55 gamma irradiation for fresh produce shipped within Australia.', sections:5, fields:28 },
  'fresh-produce-exp': { shortDesc:'Gamma irradiation for fresh produce destined for export.',            sections:6, fields:34 },
  'fresh-produce':     { shortDesc:'Gamma irradiation for fresh produce.',                                sections:5, fields:26 },
  'bee-equipment':     { shortDesc:'Sterilise hive boxes, frames, and beekeeping gear.',                  sections:4, fields:18 },
  'rfi-general':       { shortDesc:'General gamma request when no specific form fits.',                   sections:3, fields:14 },
  'herbal-medicine':   { shortDesc:'GMP packing and labelling for TGA-listed herbal medicine.',           sections:5, fields:32 },
  'irradiation':       { shortDesc:'General gamma irradiation for goods at this facility.',              sections:5, fields:24 },
  'eto-treatment':     { shortDesc:'ETO sterilisation for medical and industrial product.',               sections:6, fields:30 },
  'treatment':         { shortDesc:'General gamma irradiation requests at this facility.',                sections:5, fields:22 },
  'blood-serum':       { shortDesc:'Gamma sterilisation for bovine or other animal serum.',               sections:4, fields:20 },
};
function onboardCompanyFormMeta(key) {
  return ONBOARD_COMPANY_FORM_META[key] || { shortDesc:'Standard treatment request form.', sections:4, fields:18 };
}

const OnboardCompanyPage = {
  components:{ Icon, Btn },
  data(){
    return {
      f: {
        // A. Company details
        name:'',
        abn:'',
        phone:'',
        email:'',
        // B. Primary contact
        contactName:'',
        contactPhone:'',
        contactEmail:'',
      },
      access: buildEmptyAccess(),
      formAccess: buildEmptyFormAccess(),
      submitAttempted: false,
      // Inline "additional contacts" — extra people who'll be created alongside
      // the primary contact when the admin clicks Send invitation. Each row
      // collects name (required), phone, and email (required). Blank rows are
      // ignored on submit; partially-filled rows surface a validation error.
      additionalContacts: [],
      // Auto-detect existing company on the Company name input.
      // matchPrompt holds the matched company while we wait for the admin to
      // confirm via the "load existing details" popup. loadedCompanyId is set
      // after the admin says Yes — it switches the page into "edit existing
      // company" mode and reveals the contacts list. dismissedMatchIds remembers
      // companies the admin already said No to, so the popup doesn't re-fire on
      // every keystroke.
      matchPrompt: null,
      loadedCompanyId: null,
      dismissedMatchIds: [],
    };
  },
  computed:{
    state(){ return state; },
    facilities(){ return FACILITIES; },
    services(){ return TREATMENT_SERVICES; },
    canCheck(){
      const m = {};
      FACILITIES.forEach(f => {
        const row = {};
        TREATMENT_SERVICES.forEach(s => { row[s] = f.services.includes(s); });
        m[f.code] = row;
      });
      return m;
    },
    grantedFacilities(){
      return FACILITIES.filter(f => TREATMENT_SERVICES.some(s => this.access[f.code][s]));
    },
    formGroups(){
      const groups = [];
      for (const fac of this.grantedFacilities) {
        const treatments = [];
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          const forms = formsAtForCatalog(fac.code, s);
          if (forms.length) treatments.push({ service: s, forms });
        }
        if (treatments.length) groups.push({ fac, treatments });
      }
      return groups;
    },
    totalFormsGranted(){
      let n = 0;
      for (const fac of this.grantedFacilities) {
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          for (const form of formsAtForCatalog(fac.code, s)) {
            if (this.formAccess[fac.code][form.key]) n++;
          }
        }
      }
      return n;
    },
    treatmentsMissingForms(){
      const missing = [];
      for (const fac of this.grantedFacilities) {
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          const forms = formsAtForCatalog(fac.code, s);
          if (!forms.length) continue;
          const anyTicked = forms.some(f => this.formAccess[fac.code][f.key]);
          if (!anyTicked) missing.push({ fac: fac.code, service: s });
        }
      }
      return missing;
    },
    companyDetailsValid(){
      const f = this.f;
      return f.name.trim() && f.abn.trim() && f.phone.trim() && f.email.trim();
    },
    contactDetailsValid(){
      // Contact name is required; phone is required; email is optional.
      const f = this.f;
      return f.contactName.trim() && f.contactPhone.trim();
    },
    accessValid(){ return this.grantedFacilities.length > 0; },
    formAccessValid(){ return this.treatmentsMissingForms.length === 0; },
    additionalContactsValid(){
      // Each row must be either fully blank (will be discarded) or have both
      // name and email filled. Half-filled rows are an error.
      return this.additionalContacts.every(c => {
        const blank = !c.name.trim() && !c.phone.trim() && !c.email.trim();
        const complete = c.name.trim() && c.email.trim();
        return blank || complete;
      });
    },
    formValid(){
      return this.companyDetailsValid
        && this.contactDetailsValid
        && this.accessValid
        && this.formAccessValid
        && this.additionalContactsValid;
    },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    formIcons(){ return FORM_ICONS; },
    issueCount(){
      let n = 0;
      if (!this.companyDetailsValid) n++;
      if (!this.contactDetailsValid) n++;
      if (!this.accessValid) n++;
      if (this.accessValid && !this.formAccessValid) n++;
      if (!this.additionalContactsValid) n++;
      return n;
    },
    loadedCompany(){
      return this.loadedCompanyId ? state.companies.find(c => c.id === this.loadedCompanyId) : null;
    },
    loadedContacts(){
      if (!this.loadedCompany) return [];
      return state.companyContacts.filter(ct => ct.companyId === this.loadedCompany.id);
    },
  },
  watch:{
    'f.name'(value){
      // Auto-detect an existing company by name (case-insensitive, trimmed).
      // Surfaces a popup so the admin can choose whether to load the record.
      const q = (value || '').trim().toLowerCase();
      if (!q) { this.matchPrompt = null; return; }
      // If we already loaded a company and the admin is still typing its name,
      // do nothing — the form is already populated with that record.
      if (this.loadedCompany && this.loadedCompany.name.toLowerCase() === q) return;
      // Find a case-insensitive exact name match, or a prefix match of >= 3 chars.
      const exact = state.companies.find(c => c.name.toLowerCase() === q);
      const prefix = exact ? null : (q.length >= 3
        ? state.companies.find(c => c.name.toLowerCase().startsWith(q))
        : null);
      const match = exact || prefix;
      if (!match) { this.matchPrompt = null; return; }
      // Respect a previous "No" for this match so we don't badger the admin.
      if (this.dismissedMatchIds.includes(match.id)) return;
      this.matchPrompt = match;
    },
  },
  methods:{
    formsAt(facCode, service){ return formsAtForCatalog(facCode, service); },
    formMeta(key){ return onboardCompanyFormMeta(key); },
    statusDot(s){
      return ({ 'Active':'bg-emerald-500', 'Pending':'bg-amber-500', 'Disabled':'bg-slate-400' })[s] || 'bg-slate-400';
    },
    statusPill(s){
      return ({
        'Active':   'bg-emerald-50 text-emerald-700 ring-emerald-200',
        'Pending':    'bg-amber-50 text-amber-700 ring-amber-200',
        'Disabled': 'bg-slate-100 text-slate-600 ring-slate-200',
      })[s] || 'bg-slate-100 text-slate-600 ring-slate-200';
    },
    contactInitials(name){
      return (name || '?').trim().split(/\s+/).map(p => p[0] || '').join('').slice(0, 2).toUpperCase();
    },
    contactGradient(name){
      // Eye-soothing enterprise palette: only cool / neutral tones — navy,
      // slate, blue, teal, sky, emerald, indigo, stone. No reds, no warm
      // pinks, no bright candy. Single-hue 600→800 gradients feel solid and
      // mature, fitting for a sterilization industry dashboard.
      const palette = [
        // 12 vibrant-but-mature solid tones — matching the manager's earlier
        // reference (emerald, violet, clear blue, teal, navy). Mid-saturated
        // 500-level hues feel alive without looking AI-generated. No reds,
        // no candy pinks/oranges, no gradient stacks.
        'bg-[#10B981]',   // 0  Emerald          — vibrant green
        'bg-[#8B5CF6]',   // 1  Violet           — soft purple
        'bg-[#3B82F6]',   // 2  Blue             — clear blue
        'bg-[#14B8A6]',   // 3  Teal             — vibrant teal
        'bg-[#1E293B]',   // 4  Navy             — dark charcoal-navy
        'bg-[#0EA5E9]',   // 5  Sky              — bright sky
        'bg-[#059669]',   // 6  Forest           — deeper green
        'bg-[#6366F1]',   // 7  Indigo           — clear indigo
        'bg-[#0891B2]',   // 8  Cyan             — deep cyan
        'bg-[#64748B]',   // 9  Slate            — medium grey
        'bg-[#7C3AED]',   // 10 Royal Purple     — vibrant purple
        'bg-[#475569]',   // 11 Steel            — deep grey
      ];
      // Mix a second pass (case-flipped) into the djb2 hash so short, similar
      // names like Greg/Yuki/Olivia don't cluster on adjacent buckets.
      const s = (name || '?').toLowerCase();
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
      for (let i = s.length - 1; i >= 0; i--) h = (((h << 5) + h) ^ (s.charCodeAt(i) * 7)) >>> 0;
      return palette[h % palette.length];
    },
    onTreatmentToggle(facCode, service){
      const isOn = !!this.access[facCode][service];
      const forms = this.formsAt(facCode, service);
      for (const form of forms) {
        this.formAccess[facCode][form.key] = isOn;
      }
      // A contact can never have access to a treatment or form the company
      // doesn't grant. When the company unticks a treatment, cascade-untick
      // the treatment AND its forms on every additional contact, otherwise
      // their stale ticks would keep rendering the per-contact Form access
      // section after the source treatment is revoked.
      if (!isOn) {
        for (const c of this.additionalContacts) {
          if (c.customAccess && c.customAccess[facCode]) {
            c.customAccess[facCode][service] = false;
          }
          if (c.customFormAccess && c.customFormAccess[facCode]) {
            for (const form of forms) {
              c.customFormAccess[facCode][form.key] = false;
            }
          }
        }
      }
    },
    toggleAllForms(facCode, service, value){
      const forms = this.formsAt(facCode, service);
      for (const form of forms) {
        this.formAccess[facCode][form.key] = value;
      }
      if (!value) {
        for (const c of this.additionalContacts) {
          if (!c.customFormAccess || !c.customFormAccess[facCode]) continue;
          for (const form of forms) {
            c.customFormAccess[facCode][form.key] = false;
          }
        }
      }
    },
    onCompanyFormToggle(facCode, formKey){
      // Called when the admin ticks/unticks an individual form card at the
      // company level. If the company just revoked the form, revoke it on
      // every additional contact too — a contact can't have a form the
      // company doesn't.
      if (this.formAccess[facCode][formKey]) return;
      for (const c of this.additionalContacts) {
        if (c.customFormAccess && c.customFormAccess[facCode]) {
          c.customFormAccess[facCode][formKey] = false;
        }
      }
    },
    confirmLoadMatch(){
      const c = this.matchPrompt;
      if (!c) return;
      this.f.name = c.name;
      this.f.abn = c.abn;
      this.f.phone = c.phone || '';
      this.f.email = c.email;
      this.f.contactName = c.primaryContact?.name || '';
      this.f.contactPhone = c.primaryContact?.phone || '';
      this.f.contactEmail = c.primaryContact?.email && c.primaryContact.email !== c.email ? c.primaryContact.email : '';
      // Rebuild the matrix from the company's existing facility/service grants.
      const a = buildEmptyAccess();
      const fa = buildEmptyFormAccess();
      FACILITIES.forEach(fac => {
        if (!c.facilities.includes(fac.code)) return;
        TREATMENT_SERVICES.forEach(s => {
          if (!c.services.includes(s) || !fac.services.includes(s)) return;
          a[fac.code][s] = true;
          formsAtForCatalog(fac.code, s).forEach(form => { fa[fac.code][form.key] = true; });
        });
      });
      this.access = a;
      this.formAccess = fa;
      this.loadedCompanyId = c.id;
      this.matchPrompt = null;
      showToast(`Loaded ${c.name}. You can edit details or add a new contact below.`, 'success');
    },
    dismissMatch(){
      if (this.matchPrompt) this.dismissedMatchIds.push(this.matchPrompt.id);
      this.matchPrompt = null;
    },
    clearLoadedCompany(){
      // Reset to a blank form so the admin can register a different company.
      this.f = { name:'', abn:'', phone:'', email:'', contactName:'', contactPhone:'', contactEmail:'' };
      this.access = buildEmptyAccess();
      this.formAccess = buildEmptyFormAccess();
      this.additionalContacts = [];
      this.loadedCompanyId = null;
      this.dismissedMatchIds = [];
      this.matchPrompt = null;
      this.submitAttempted = false;
    },
    addAdditionalContact(){
      // Each new contact owns an explicit per-contact access matrix from the
      // start (customize=true), so the admin picks what THIS contact gets
      // rather than implicitly inheriting the company's grants.
      this.additionalContacts.push({
        name:'', phone:'', email:'',
        customize:true, customAccess:buildEmptyAccess(),
        customizeForms:true, customFormAccess:buildEmptyFormAccess(),
      });
    },
    removeAdditionalContact(i){
      this.additionalContacts.splice(i, 1);
    },
    onContactTreatmentToggle(i, facCode, service){
      // Mirror the company-level pattern: when a treatment is ticked for this
      // contact, auto-tick every form under it; when untoggled, untick them.
      const c = this.additionalContacts[i];
      const isOn = !!c.customAccess[facCode][service];
      for (const form of this.formsAt(facCode, service)) {
        c.customFormAccess[facCode][form.key] = isOn;
      }
    },
    enableContactCustomAccess(i){
      const contact = this.additionalContacts[i];
      // Seed the contact's custom matrix from the company's current grants
      // — admins narrow from there rather than starting blank.
      const ca = {};
      FACILITIES.forEach(f => {
        const row = {};
        TREATMENT_SERVICES.forEach(s => { row[s] = !!this.access[f.code][s]; });
        ca[f.code] = row;
      });
      contact.customAccess = ca;
      contact.customize = true;
    },
    disableContactCustomAccess(i){
      const contact = this.additionalContacts[i];
      contact.customize = false;
      contact.customAccess = null;
      // If forms were customized off a now-removed facility/service, those
      // ticks will be silently ignored on save (the persist step filters by
      // the contact's effective access). Keep customizeForms intact so the
      // admin doesn't lose unrelated picks.
    },
    enableContactCustomForms(i){
      const contact = this.additionalContacts[i];
      // Seed from the company's current form grants.
      contact.customFormAccess = JSON.parse(JSON.stringify(this.formAccess));
      contact.customizeForms = true;
    },
    disableContactCustomForms(i){
      const contact = this.additionalContacts[i];
      contact.customizeForms = false;
      contact.customFormAccess = null;
    },
    contactGrantedFacilities(i){
      // Facilities ticked on the company-level matrix (the cap on contact access).
      return this.grantedFacilities.map(f => f.code);
    },
    contactCustomFacilities(i){
      // Facilities the contact will have access to under their custom matrix.
      const ca = this.additionalContacts[i].customAccess;
      if (!ca) return [];
      return FACILITIES.filter(f => TREATMENT_SERVICES.some(s => ca[f.code][s])).map(f => f.code);
    },
    /* Build the per-contact list of {fac, treatments:[{service, forms:[]}]} —
       same shape as the page-level formGroups but driven by the contact's
       effective access (custom matrix if set, else the company-level matrix). */
    contactFormGroups(i){
      const contact = this.additionalContacts[i];
      const useCustom = contact.customize && contact.customAccess;
      const groups = [];
      for (const fac of FACILITIES) {
        const facHasAny = TREATMENT_SERVICES.some(s =>
          useCustom ? contact.customAccess[fac.code][s] : this.access[fac.code][s]
        );
        if (!facHasAny) continue;
        const treatments = [];
        for (const s of TREATMENT_SERVICES) {
          const granted = useCustom ? contact.customAccess[fac.code][s] : this.access[fac.code][s];
          if (!granted) continue;
          const forms = formsAtForCatalog(fac.code, s);
          if (forms.length) treatments.push({ service: s, forms });
        }
        if (treatments.length) groups.push({ fac, treatments });
      }
      return groups;
    },
    contactGrantedFormCount(i){
      const contact = this.additionalContacts[i];
      if (!contact.customizeForms || !contact.customFormAccess) {
        // Inherited: count company's granted forms within the contact's effective access.
        let n = 0;
        for (const g of this.contactFormGroups(i)) {
          for (const t of g.treatments) {
            for (const form of t.forms) {
              if (this.formAccess[g.fac.code][form.key]) n++;
            }
          }
        }
        return n;
      }
      let n = 0;
      for (const g of this.contactFormGroups(i)) {
        for (const t of g.treatments) {
          for (const form of t.forms) {
            if (contact.customFormAccess[g.fac.code][form.key]) n++;
          }
        }
      }
      return n;
    },
    cancel(){ this.$router.push('/admin/companies'); },
    persistAdditionalContacts(companyId, companyName, facs, svcArr, status, today){
      // Drop blank rows; validation already guaranteed remaining rows have name + email.
      const rows = this.additionalContacts.filter(c => c.name.trim() && c.email.trim());
      if (!rows.length) return 0;
      let nextNum = state.companyContacts.reduce((m,c) => {
        const n = parseInt((c.id || '').replace(/[^0-9]/g,''), 10);
        return isNaN(n) ? m : Math.max(m, n);
      }, 2000);
      for (const r of rows) {
        nextNum++;
        // Resolve effective access: custom (when the admin toggled "Customize"
        // and ticked at least one cell) falls back to the company's grants.
        let cFacs = facs.slice(), cSvcs = svcArr.slice();
        if (r.customize && r.customAccess) {
          const fset = [], sset = new Set();
          FACILITIES.forEach(f => {
            const any = TREATMENT_SERVICES.some(s => r.customAccess[f.code][s]);
            if (any) {
              fset.push(f.code);
              TREATMENT_SERVICES.forEach(s => { if (r.customAccess[f.code][s]) sset.add(s); });
            }
          });
          if (fset.length) { cFacs = fset; cSvcs = Array.from(sset); }
        }
        // Resolve effective form access: custom per-contact forms when toggled,
        // else inherit the company's formAccess (filtered to the contact's facilities).
        const formAccessOut = {};
        const sourceFA = (r.customizeForms && r.customFormAccess) ? r.customFormAccess : this.formAccess;
        for (const fc of cFacs) {
          formAccessOut[fc] = {};
          for (const form of FORM_CATALOG.filter(fm => fm.facility === fc)) {
            formAccessOut[fc][form.key] = !!(sourceFA[fc] && sourceFA[fc][form.key]);
          }
        }
        state.companyContacts.unshift({
          id: 'CONT-' + nextNum,
          companyId,
          companyName,
          name: r.name.trim(),
          phone: r.phone.trim(),
          email: r.email.trim(),
          facilities: cFacs,
          services: cSvcs,
          formAccess: formAccessOut,
          status,
          created: today,
        });
      }
      return rows.length;
    },
    sendInvite(){
      this.submitAttempted = true;
      if (!this.formValid) {
        showToast('Fix the issues highlighted before sending the invitation.', 'error');
        return;
      }
      const facs = this.grantedFacilities.map(f => f.code);
      const svcSet = new Set();
      facs.forEach(fc => TREATMENT_SERVICES.forEach(s => { if (this.access[fc][s]) svcSet.add(s); }));
      const svcArr = Array.from(svcSet);
      const today = new Date().toISOString().slice(0,10);
      // If a company is loaded, treat this as an update rather than a new record.
      if (this.loadedCompany) {
        const c = this.loadedCompany;
        c.name = this.f.name.trim();
        c.abn = this.f.abn.trim();
        c.phone = this.f.phone.trim();
        c.email = this.f.email.trim();
        c.primaryContact = {
          name: this.f.contactName.trim(),
          phone: this.f.contactPhone.trim(),
          email: (this.f.contactEmail || '').trim() || this.f.email.trim(),
        };
        c.facilities = facs;
        c.services = svcArr;
        const added = this.persistAdditionalContacts(c.id, c.name, facs, svcArr, 'Active', today);
        showToast(added
          ? `Updated ${c.name}. Added ${added} ${added === 1 ? 'contact' : 'contacts'}.`
          : `Updated ${c.name}.`,
          'success');
        this.$router.push('/admin/companies');
        return;
      }
      // Otherwise persist into state.companies so the new entry shows up in the list.
      const nextNum = state.companies.reduce((m,c) => {
        const n = parseInt((c.id || '').replace(/[^0-9]/g,''), 10);
        return isNaN(n) ? m : Math.max(m, n);
      }, 1000) + 1;
      const newId = 'COMP-' + nextNum;
      const newName = this.f.name.trim();
      state.companies.unshift({
        id: newId,
        name: newName,
        abn: this.f.abn.trim(),
        phone: this.f.phone.trim(),
        email: this.f.email.trim(),
        primaryContact: {
          name: this.f.contactName.trim(),
          phone: this.f.contactPhone.trim(),
          email: (this.f.contactEmail || '').trim() || this.f.email.trim(),
        },
        facilities: facs,
        services: svcArr,
        status: 'Active',
        created: today,
      });
      const added = this.persistAdditionalContacts(newId, newName, facs, svcArr, 'Active', today);
      showToast(added
        ? `Invitation sent to ${this.f.email}. Company + ${added} ${added === 1 ? 'contact' : 'contacts'} created.`
        : `Invitation sent to ${this.f.email}. Company record created.`,
        'success');
      this.$router.push('/admin/companies');
    },
  },

        </header>

          <div class="md:col-span-2">

            <div class="relative">
              <input id="co-contact" v-model="f.contactName" type="text" placeholder="Full name" autocomplete="name"
                     class="w-full h-11 px-3 rounded-md border border-slate-300 text-base focus-ring"/>

                  <span v-else class="inline-block w-4 h-4 rounded border border-dashed border-slate-300 align-middle" title="Not offered at this facility"></span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      <!-- Form access — hidden until at least one (facility, treatment) is selected above. -->
      <section v-if="formGroups.length" class="bg-white border border-slate-200 rounded-md">

          <span class="shrink-0 inline-flex items-center justify-center h-8 w-8 rounded-lg bg-teal-50 text-teal-600 ring-1 ring-teal-100"><Icon name="file-check-2" :size="15"/></span>Form access
          <span class="ml-auto text-sm text-slate-500 font-normal">
            {{ totalFormsGranted }} {{ totalFormsGranted === 1 ? 'form' : 'forms' }} granted
          </span>
        </header>

        <div class="px-5 pt-5 pb-5 space-y-5">
          <div v-for="g in formGroups" :key="g.fac.code" class="rounded-md border border-slate-200 overflow-hidden">

              <span class="text-sm font-medium text-navy-900">{{ g.fac.name }}, {{ g.fac.state }}</span>
              <span class="text-xs text-slate-500">{{ g.fac.code }}</span>
            </div>
            <div class="divide-y divide-slate-200">
              <div v-for="t in g.treatments" :key="t.service" class="px-4 py-4">

                  <span :class="['inline-block h-2.5 w-2.5 rounded-full', treatmentStyles[t.service] && treatmentStyles[t.service].dot]" aria-hidden="true"></span>
                  <span class="text-sm font-semibold text-navy-900">{{ treatmentLabels[t.service] || t.service }}</span>
                  <span class="text-xs text-slate-500">{{ t.forms.length }} {{ t.forms.length === 1 ? 'form' : 'forms' }}</span>

                    <label :for="'cfa-' + g.fac.code + '-' + form.key"

                      <div class="flex items-start gap-3 pr-7">
                        <span :class="['shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-md',

            </div>
          </div>
        </div>

      <!-- E. Additional contacts (premium design per request). -->
      <section class="bg-white border border-slate-200 rounded-md">
        <header class="px-5 pt-5 pb-4 flex items-start gap-3">
          <span class="shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full bg-teal-50 text-teal-600 ring-1 ring-teal-100">
            <Icon name="users" :size="18"/>

              <span class="text-[10px] uppercase tracking-wider font-semibold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">Optional</span>
              <span v-if="additionalContacts.length" class="text-xs text-slate-500">&middot; {{ additionalContacts.length }} {{ additionalContacts.length === 1 ? 'new contact' : 'new contacts' }}</span>
            </div>
            <p class="text-sm text-slate-500 mt-0.5">Other people from this company who need their own login.</p>
          </div>
        </header>
        <div class="px-5 pb-5 space-y-5">
          <!-- Already-onboarded panel -->
          <div v-if="loadedCompany && loadedContacts.length" class="rounded-2xl bg-gradient-to-b from-slate-50 to-white ring-1 ring-slate-200/80 p-3.5">
            <div class="px-2 py-1.5 mb-1.5 flex items-center justify-between">
              <span class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold inline-flex items-center gap-1.5">
                <Icon name="check-circle-2" :size="12" cls="text-emerald-500"/> Already onboarded
              </span>
              <span class="text-[11px] text-slate-400 font-medium">{{ loadedContacts.length }} {{ loadedContacts.length === 1 ? 'contact' : 'contacts' }}</span>
            </div>
            <ul class="space-y-2">
              <li v-for="ct in loadedContacts" :key="ct.id"

                <div class="min-w-0 flex items-center gap-3">
                  <span :class="['shrink-0 inline-flex items-center justify-center h-11 w-11 rounded-full text-white text-sm font-extrabold tracking-wide shadow-md ring-2 ring-white', contactGradient(ct.name)]">{{ contactInitials(ct.name) }}</span>

                    <div class="text-sm font-semibold text-navy-900 truncate leading-tight">{{ ct.name }}</div>
                    <div class="text-xs text-slate-500 mt-0.5 inline-flex items-center gap-1"><Icon name="mail" :size="11" cls="text-slate-400"/> Has login access</div>
                  </div>
                </div>
                <span :class="['inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full ring-1', statusPill(ct.status)]">
                  <span :class="['inline-block h-1.5 w-1.5 rounded-full', statusDot(ct.status)]" aria-hidden="true"></span>
                  {{ ct.status }}
                </span>
              </li>
            </ul>
          </div>

          <!-- New contact cards -->
          <div v-for="(c, i) in additionalContacts" :key="'ac-' + i"
               class="bg-white border border-slate-200 rounded-md p-5 space-y-5">

              <div class="flex items-center gap-3 min-w-0">
                <span v-if="c.name"
                      :class="['shrink-0 inline-flex items-center justify-center h-11 w-11 rounded-full text-white text-sm font-extrabold tracking-wide shadow-md ring-2 ring-white', contactGradient(c.name)]">{{ contactInitials(c.name) }}</span>
                <span v-else
                      class="shrink-0 inline-flex items-center justify-center h-11 w-11 rounded-full bg-gradient-to-br from-teal-50 to-cyan-100 text-teal-500 ring-2 ring-white shadow-sm">
                  <Icon name="user-round" :size="20"/>
                </span>
                <div class="min-w-0">
                  <div class="text-base font-semibold text-navy-900 leading-tight truncate">{{ c.name || 'New contact' }}</div>
                  <div class="text-xs text-slate-500 mt-1 inline-flex items-center gap-1.5">
                    <span class="inline-flex items-center justify-center h-4 px-1.5 rounded bg-slate-100 text-[10px] font-semibold text-slate-600 tracking-wide">#{{ i + 1 }}</span>
                    <span v-if="!c.name">Awaiting details</span>
                    <span v-else-if="!c.email" class="text-amber-600">Email required</span>
                    <span v-else class="text-emerald-600 inline-flex items-center gap-1"><Icon name="check-circle-2" :size="11"/> Ready</span>

            </div>

              <div class="flex items-center gap-2.5 mb-3">
                <span class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-teal-50 text-teal-600 ring-1 ring-teal-100 shrink-0"><Icon name="id-card" :size="15"/></span>
                <div class="min-w-0">
                  <div class="text-sm font-semibold text-navy-900 leading-tight">Contact details</div>
                  <div class="text-xs text-slate-500">Name and login email.</div>
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
              <div class="md:col-span-2">
                <label :for="'ac-name-' + i" class="block text-sm font-medium text-slate-700 mb-1.5">Contact name <span class="text-red-500" aria-hidden="true">*</span></label>
                <input :id="'ac-name-' + i" v-model="c.name" type="text" placeholder="Full name" autocomplete="name"
                       class="w-full h-11 px-3 rounded-md border border-slate-300 text-base focus-ring"/>
              </div>
              <div>
                <label :for="'ac-phone-' + i" class="block text-sm font-medium text-slate-700 mb-1.5">Phone number</label>
                <input :id="'ac-phone-' + i" v-model="c.phone" type="tel" placeholder="+61 ..." autocomplete="tel"
                       class="w-full h-11 px-3 rounded-md border border-slate-300 text-base focus-ring"/>
              </div>
              <div>
                <label :for="'ac-email-' + i" class="block text-sm font-medium text-slate-700 mb-1.5">Email <span class="text-red-500" aria-hidden="true">*</span></label>

                       class="w-full h-11 px-3 rounded-md border border-slate-300 text-base focus-ring"/>

              </div>

                <div class="min-w-0">
                  <div class="text-sm font-semibold text-navy-900 leading-tight">Facility and service access</div>
                  <div class="text-xs text-slate-500">Pick what this contact can submit.</div>

                      <th scope="col" class="px-3 py-2 font-medium">Facility</th>

                        <span class="inline-flex items-center gap-1.5">
                          <span :class="['inline-block h-1.5 w-1.5 rounded-full', treatmentStyles[s] && treatmentStyles[s].dot]" aria-hidden="true"></span>
                          <span>{{ treatmentLabels[s] || s }}</span>
                        </span>
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="fac in grantedFacilities" :key="fac.code" class="even:bg-slate-50/60">
                      <td class="px-3 py-2.5">
                        <div class="text-sm text-navy-900">{{ fac.name }}</div>
                        <div class="text-[11px] text-slate-500">{{ fac.code }}</div>
                      </td>
                      <td v-for="s in services" :key="s" class="px-3 py-2.5 text-center">
                        <input v-if="access[fac.code][s] && fac.services.includes(s)" type="checkbox"
                               v-model="c.customAccess[fac.code][s]"
                               @change="onContactTreatmentToggle(i, fac.code, s)"
                               :aria-label="s + ' at ' + fac.name + ' for new contact ' + (i + 1)"
                               class="w-4 h-4 rounded accent-teal-600 cursor-pointer"/>
                        <span v-else class="inline-block w-4 h-4 rounded border border-dashed border-slate-300 align-middle" title="Not granted at company level"></span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Per-contact Form access — only shown once the contact has at
                 least one treatment ticked. -->
            <div v-if="contactFormGroups(i).length">
              <div class="flex items-center gap-2.5 mb-3">
                <span class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-teal-50 text-teal-600 ring-1 ring-teal-100 shrink-0"><Icon name="file-check-2" :size="15"/></span>
                <div class="min-w-0 flex-1">
                  <div class="text-sm font-semibold text-navy-900 leading-tight">Form access</div>
                  <div class="text-xs text-slate-500">Forms this contact can submit.</div>
                </div>
                <span class="text-xs text-slate-500 font-medium shrink-0">{{ contactGrantedFormCount(i) }} {{ contactGrantedFormCount(i) === 1 ? 'form' : 'forms' }}</span>
              </div>
              <div class="space-y-5">
                <div v-for="g in contactFormGroups(i)" :key="'cfg-' + i + '-' + g.fac.code" class="rounded-md border border-slate-200 overflow-hidden">
                  <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
                    <span class="text-sm font-medium text-navy-900">{{ g.fac.name }}, {{ g.fac.state }}</span>
                    <span class="text-xs text-slate-500">{{ g.fac.code }}</span>
                  </div>
                  <div class="divide-y divide-slate-200">
                    <div v-for="t in g.treatments" :key="'cft-' + i + '-' + g.fac.code + '-' + t.service" class="px-4 py-4">
                      <div class="flex items-center gap-2 mb-3">
                        <span :class="['inline-block h-2.5 w-2.5 rounded-full', treatmentStyles[t.service] && treatmentStyles[t.service].dot]" aria-hidden="true"></span>
                        <span class="text-sm font-semibold text-navy-900">{{ treatmentLabels[t.service] || t.service }}</span>
                        <span class="text-xs text-slate-500">{{ t.forms.length }} {{ t.forms.length === 1 ? 'form' : 'forms' }}</span>
                      </div>
                      <ul class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <li v-for="form in t.forms" :key="form.key">
                          <label :for="'cfa-' + i + '-' + g.fac.code + '-' + form.key"
                                 :class="['relative block rounded-md border p-4 transition-colors cursor-pointer',
                                          c.customFormAccess[g.fac.code][form.key]
                                            ? 'border-teal-600 bg-teal-50/40 ring-1 ring-teal-600'
                                            : 'border-slate-200 bg-white hover:border-slate-400 hover:bg-slate-50/40']">
                            <input type="checkbox"
                                   :id="'cfa-' + i + '-' + g.fac.code + '-' + form.key"
                                   v-model="c.customFormAccess[g.fac.code][form.key]"
                                   :aria-label="form.name + ' at ' + g.fac.name + ' for new contact ' + (i + 1)"
                                   class="absolute top-3 right-3 w-4 h-4 rounded accent-teal-600 cursor-pointer"/>
                            <div class="flex items-start gap-3 pr-7">
                              <span :class="['shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-md',
                                             c.customFormAccess[g.fac.code][form.key] ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700']"
                                    aria-hidden="true">
                                <Icon :name="formIcons[form.key] || 'file-text'" :size="20"/>
                              </span>
                              <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                  <span class="text-base font-semibold text-navy-900 leading-snug">{{ form.name }}</span>
                                  <span v-if="form.shared_with && form.shared_with.length"
                                        class="text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">Shared</span>
                                </div>
                                <p class="text-sm text-slate-600 mt-0.5 leading-snug">{{ formMeta(form.key).shortDesc }}</p>
                                <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-0.5 text-xs text-slate-500">
                                  <span class="font-mono">{{ form.code }}</span>
                                  <span aria-hidden="true" class="text-slate-300">&middot;</span>
                                  <span class="inline-flex items-center gap-1"><Icon name="list-checks" :size="12"/>{{ formMeta(form.key).sections }} sections</span>
                                  <span aria-hidden="true" class="text-slate-300">&middot;</span>
                                  <span class="inline-flex items-center gap-1"><Icon name="layout-list" :size="12"/>{{ formMeta(form.key).fields }} fields</span>
                                </div>
                              </div>
                            </div>
                          </label>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </p>

          <div class="flex items-center">
            <button type="button" @click="addAdditionalContact"
                    class="inline-flex items-center gap-2 rounded-lg bg-teal-600 text-white hover:bg-teal-700 active:bg-teal-800 px-4 py-2.5 text-sm font-semibold shadow-sm hover:shadow-md hover:shadow-teal-600/20 transition-all focus-ring">
              <Icon name="plus" :size="16" aria-hidden="true"/>
              Add New Contact
            </button>
          </div>
        </div>
      </section>

      <div class="border-t border-slate-200 pt-4 flex items-center gap-4 flex-wrap">
        <p v-if="submitAttempted && !formValid" role="alert" class="text-sm text-red-600 inline-flex items-center gap-2">
          <Icon name="alert-circle" :size="16" aria-hidden="true"/>
          Fix {{ issueCount }} {{ issueCount === 1 ? 'issue' : 'issues' }} above before {{ loadedCompany ? 'saving' : 'sending the invitation' }}.
        </p>
        <div class="flex-1"></div>
        <button type="button" @click="cancel" class="text-sm text-slate-700 hover:text-navy-900 focus-ring rounded px-3 py-2">Cancel</button>
        <Btn :icon="loadedCompany ? 'save' : 'send'" @click="sendInvite">{{ loadedCompany ? 'Save changes' : 'Send invitation' }}</Btn>
      </div>

      <!-- Auto-detect popup: triggered by the watcher on f.name when an existing company is matched. -->
      <transition name="fade">
        <div v-if="matchPrompt" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" @click.self="dismissMatch">
          <div class="bg-white rounded-md w-full max-w-sm overflow-hidden shadow-2xl ring-1 ring-slate-200/70" role="dialog" aria-modal="true" aria-label="Existing company match">
            <div class="px-7 pt-7 pb-5">
              <div class="flex items-start gap-3.5">
                <span class="shrink-0 inline-flex items-center justify-center h-11 w-11 rounded-full bg-teal-50 text-teal-600 ring-1 ring-teal-100" aria-hidden="true">
                  <Icon name="building" :size="20"/>
                </span>
                <div class="min-w-0 pt-0.5">
                  <h2 class="text-lg font-semibold text-navy-900 leading-tight tracking-tight">This company already exists</h2>
                  <p class="text-sm text-slate-500 mt-1 leading-snug">We found an existing record. Would you like to load its details?</p>
                </div>
              </div>

              <div class="mt-5 rounded-xl bg-slate-50/70 ring-1 ring-slate-200/70 divide-y divide-slate-200/70">

                <div class="px-4 py-3">

                      class="text-sm font-medium text-slate-500 hover:text-navy-900 focus-ring rounded-lg px-3 py-2 transition-colors">Keep typing</button>
              <Btn size="lg" @click="confirmLoadMatch">Load company details</Btn>
            </div>
          </div>
        </div>
      </transition>
    </div>
  `
};

/* ---------- Page: Admin · Onboard a Company Contact ------------------------ */
/* Per-person login under a company. Admin picks the company first; the form
   then collects contact details and an independent facility/service access
   grant. We restrict the matrix to the company's own granted facilities so
   admins can't accidentally grant a contact more than the company itself has. */

const OnboardCompanyContactPage = {
  components:{ Icon, Btn },
  data(){
    return {
      companyId: '',
      f: { name:'', phone:'', email:'' },
      access: buildEmptyAccess(),
      formAccess: buildEmptyFormAccess(),
      submitAttempted: false,
    };
  },
  created(){
    // Pre-select company when navigated from a company-details popup
    // (router-link target: /admin/contacts/new?companyId=COMP-XXXX).
    const q = this.$route.query.companyId;
    if (q && state.companies.some(c => c.id === q)) this.companyId = q;
  },
  computed:{
    state(){ return state; },
    companies(){ return state.companies; },
    selectedCompany(){ return state.companies.find(c => c.id === this.companyId) || null; },
    facilities(){
      // Only facilities the chosen company already has access to (so a contact
      // cannot exceed company-level grants). Falls back to all facilities when
      // no company is selected yet (purely visual — checkboxes are disabled).
      if (!this.selectedCompany) return FACILITIES;
      return FACILITIES.filter(f => this.selectedCompany.facilities.includes(f.code));
    },
    services(){ return TREATMENT_SERVICES; },
    canCheck(){
      const m = {};
      const company = this.selectedCompany;
      FACILITIES.forEach(f => {
        const row = {};
        TREATMENT_SERVICES.forEach(s => {
          const offered = f.services.includes(s);
          const companyHas = company ? (company.services.includes(s) && company.facilities.includes(f.code)) : false;
          row[s] = offered && companyHas;
        });
        m[f.code] = row;
      });
      return m;
    },
    grantedFacilities(){
      return this.facilities.filter(f => TREATMENT_SERVICES.some(s => this.access[f.code][s]));
    },
    formGroups(){
      const groups = [];
      for (const fac of this.grantedFacilities) {
        const treatments = [];
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          const forms = formsAtForCatalog(fac.code, s);
          if (forms.length) treatments.push({ service: s, forms });
        }
        if (treatments.length) groups.push({ fac, treatments });
      }
      return groups;
    },
    totalFormsGranted(){
      let n = 0;
      for (const fac of this.grantedFacilities) {
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          for (const form of formsAtForCatalog(fac.code, s)) {
            if (this.formAccess[fac.code][form.key]) n++;
          }
        }
      }
      return n;
    },
    treatmentsMissingForms(){
      const missing = [];
      for (const fac of this.grantedFacilities) {
        for (const s of TREATMENT_SERVICES) {
          if (!this.access[fac.code][s]) continue;
          const forms = formsAtForCatalog(fac.code, s);
          if (!forms.length) continue;
          const anyTicked = forms.some(f => this.formAccess[fac.code][f.key]);
          if (!anyTicked) missing.push({ fac: fac.code, service: s });
        }
      }
      return missing;
    },
    existingContacts(){
      // Contacts already onboarded under the selected company — surfaced to the
      // admin so they can see who's already there before adding a new one.
      if (!this.companyId) return [];
      return state.companyContacts.filter(ct => ct.companyId === this.companyId);
    },
    companyValid(){ return !!this.selectedCompany; },
    contactDetailsValid(){
      const f = this.f;
      return f.name.trim() && f.phone.trim() && f.email.trim();
    },
    accessValid(){ return this.grantedFacilities.length > 0; },
    formAccessValid(){ return this.treatmentsMissingForms.length === 0; },
    formValid(){ return this.companyValid && this.contactDetailsValid && this.accessValid && this.formAccessValid; },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    formIcons(){ return FORM_ICONS; },
    issueCount(){
      let n = 0;
      if (!this.companyValid) n++;
      if (!this.contactDetailsValid) n++;
      if (!this.accessValid) n++;
      if (this.accessValid && !this.formAccessValid) n++;
      return n;
    },
  },
  watch:{
    companyId(){
      // Reset the matrix whenever the company changes so stale ticks from the
      // previous company can't be carried over (their facilities may differ).
      this.access = buildEmptyAccess();
      this.formAccess = buildEmptyFormAccess();
    },
  },
  methods:{
    formsAt(facCode, service){ return formsAtForCatalog(facCode, service); },
    formMeta(key){ return onboardCompanyFormMeta(key); },
    statusDot(s){
      return ({ 'Active':'bg-emerald-500', 'Pending':'bg-amber-500', 'Disabled':'bg-slate-400' })[s] || 'bg-slate-400';
    },
    statusPill(s){
      return ({
        'Active':   'bg-emerald-50 text-emerald-700 ring-emerald-200',
        'Pending':    'bg-amber-50 text-amber-700 ring-amber-200',
        'Disabled': 'bg-slate-100 text-slate-600 ring-slate-200',
      })[s] || 'bg-slate-100 text-slate-600 ring-slate-200';
    },
    contactInitials(name){
      return (name || '?').trim().split(/\s+/).map(p => p[0] || '').join('').slice(0, 2).toUpperCase();
    },
    contactGradient(name){
      // 12 mature-industry tones — synced with every other contactGradient
      // across the app so a contact's colour is consistent everywhere.
      const palette = [
        'bg-[#10B981]',   // 0  Emerald
        'bg-[#8B5CF6]',   // 1  Violet
        'bg-[#3B82F6]',   // 2  Blue
        'bg-[#14B8A6]',   // 3  Teal
        'bg-[#1E293B]',   // 4  Navy
        'bg-[#0EA5E9]',   // 5  Sky
        'bg-[#059669]',   // 6  Forest
        'bg-[#6366F1]',   // 7  Indigo
        'bg-[#0891B2]',   // 8  Cyan
        'bg-[#64748B]',   // 9  Slate
        'bg-[#7C3AED]',   // 10 Royal Purple
        'bg-[#475569]',   // 11 Steel
      ];
      const s = (name || '?').toLowerCase();
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
      for (let i = s.length - 1; i >= 0; i--) h = (((h << 5) + h) ^ (s.charCodeAt(i) * 7)) >>> 0;
      return palette[h % palette.length];
    },
    onTreatmentToggle(facCode, service){
      const isOn = !!this.access[facCode][service];
      for (const form of this.formsAt(facCode, service)) {
        this.formAccess[facCode][form.key] = isOn;
      }
    },
    toggleAllForms(facCode, service, value){
      for (const form of this.formsAt(facCode, service)) {
        this.formAccess[facCode][form.key] = value;
      }
    },
    cancel(){ this.$router.push('/admin/companies'); },
    sendInvite(){
      this.submitAttempted = true;
      if (!this.formValid) {
        showToast('Fix the issues highlighted before sending the invitation.', 'error');
        return;
      }
      const company = this.selectedCompany;
      const facs = this.grantedFacilities.map(f => f.code);
      const svcSet = new Set();
      facs.forEach(fc => TREATMENT_SERVICES.forEach(s => { if (this.access[fc][s]) svcSet.add(s); }));
      const nextNum = state.companyContacts.reduce((m,c) => {
        const n = parseInt((c.id || '').replace(/[^0-9]/g,''), 10);
        return isNaN(n) ? m : Math.max(m, n);
      }, 2000) + 1;
      const today = new Date().toISOString().slice(0,10);
      state.companyContacts.unshift({
        id: 'CONT-' + nextNum,
        companyId: company.id,
        companyName: company.name,
        name: this.f.name.trim(),
        phone: this.f.phone.trim(),
        email: this.f.email.trim(),
        facilities: facs,
        services: Array.from(svcSet),
        status: 'Active',
        created: today,
      });
      showToast(`Invitation sent to ${this.f.email}. Contact added to ${company.name}.`, 'success');
      this.$router.push('/admin/companies');
    },
  },
  template:`

      <div>

        </header>
        <div class="p-5">

                </ul>
                <p v-if="submitAttempted && !t.forms.some(f => formAccess[g.fac.code][f.key])"
                   role="alert" class="mt-3 text-xs text-red-600 inline-flex items-center gap-1.5">
                  <Icon name="alert-circle" :size="12" aria-hidden="true"/>
                  Pick at least one {{ treatmentLabels[t.service] || t.service }} form, or untick this treatment in the matrix above.
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="border-t border-slate-200 pt-4 flex items-center gap-4 flex-wrap">
        <p v-if="submitAttempted && !formValid" role="alert" class="text-sm text-red-600 inline-flex items-center gap-2">
          <Icon name="alert-circle" :size="16" aria-hidden="true"/>
          Fix {{ issueCount }} {{ issueCount === 1 ? 'issue' : 'issues' }} above before sending the invitation.
        </p>
        <div class="flex-1"></div>
        <button type="button" @click="cancel" class="text-sm text-slate-700 hover:text-navy-900 focus-ring rounded px-3 py-2">Cancel</button>
        <Btn icon="send" @click="sendInvite">Send invitation</Btn>
      </div>
    </div>
  `
};

/* ---------- Page: Admin · Companies List ----------------------------------- */
/* Mirrors the Customers list visual chrome (zebra rows, dot+text status,
   sentence-case headers, action menu). Columns: Company / ABN / Primary
   contact / Status / Created. Row actions: View · Edit · Manage Access. */

/* ---------- Page: Admin · Company Detail (view + edit) --------------------- */
/* Dedicated detail page for a single company. Replaces the View / Edit /
   Manage-access modals that previously lived on CompanyListPage. Two edit
   modes are toggled in place: "details" (company + primary contact) and
   "access" (facility/service matrix). Triggered automatically when the
   admin arrives with ?edit=details or ?edit=access in the URL. */

const CompanyDetailPage = {
  components:{ Icon, Btn, StatusBadge },
  data(){
    return {
      tab: 'profile',
      editingDetails: false,
      editingAccess: false,
      draft: null,
      draftAccess: null,
      reassignOpen: false,
      reassignTarget: '',
    };
  },
  computed:{
    state(){ return state; },
    company(){ return state.companies.find(c => c.id === this.$route.params.id) || null; },
    /* A draft is a self-signup company that hasn't been verified by an admin yet.
       Admin-created records are always Active from the moment they're created. */
    isPending(){
      return !!(this.company && this.company.status === 'Pending');
    },
    reassignTargets(){
      if (!this.company) return [];
      return state.companies
        .filter(c => c.id !== this.company.id && c.status === 'Active')
        .sort((a,b) => a.name.localeCompare(b.name));
    },
    contacts(){
      if (!this.company) return [];
      return state.companyContacts.filter(ct => ct.companyId === this.company.id);
    },
    facilities(){ return FACILITIES; },
    services(){ return TREATMENT_SERVICES; },
    facObjs(){ return (this.company?.facilities || []).map(code => FACILITIES.find(f => f.code === code)).filter(Boolean); },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    /* Orders associated with this company — matched by consignor or consignee
       name. Demo-only: real data would link via a foreign key. */
    companyOrders(){
      if (!this.company) return [];
      const name = this.company.name.toLowerCase();
      return state.orders.filter(o =>
        (o.consignor || '').toLowerCase() === name ||
        (o.consignee || '').toLowerCase() === name
      );
    },
    messageThreads(){
      return this.companyOrders.map(o => ({
        order: o,
        msgs: state.messages[o.id] || [],
      })).sort((a,b) => {
        const aHas = a.msgs.length > 0, bHas = b.msgs.length > 0;
        if (aHas !== bHas) return bHas - aHas;
        const aLast = a.msgs.length ? a.msgs[a.msgs.length-1].ts : a.order.submitted;
        const bLast = b.msgs.length ? b.msgs[b.msgs.length-1].ts : b.order.submitted;
        return bLast.localeCompare(aLast);
      });
    },
    totalMessageCount(){
      return this.messageThreads.reduce((n,t) => n + t.msgs.length, 0);
    },
    activeThreadCount(){
      return this.messageThreads.filter(t => t.msgs.length > 0).length;
    },
  },
  created(){
    const m = this.$route.query.edit;
    if (m === 'details') this.startEdit();
    else if (m === 'access') this.startEditAccess();
  },
  methods:{
    fmtDate,
    fmtTs(ts){
      if (!ts) return '';
      const dt = new Date(ts);
      return dt.toLocaleString('en-AU', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    },
    statusDot(s){
      return ({ 'Active':'bg-emerald-500', 'Pending':'bg-amber-500', 'Disabled':'bg-slate-400' })[s] || 'bg-slate-400';
    },
    statusPill(s){
      return ({
        'Active':   'bg-emerald-50 text-emerald-700 ring-emerald-200',
        'Pending':    'bg-amber-50 text-amber-700 ring-amber-200',
        'Disabled': 'bg-slate-100 text-slate-600 ring-slate-200',
      })[s] || 'bg-slate-100 text-slate-600 ring-slate-200';
    },
    canCheckAt(facCode, service){
      const f = FACILITIES.find(x => x.code === facCode);
      return !!(f && f.services.includes(service));
    },
    initials(name){
      return (name || '?').trim().split(/\s+/).map(p => p[0] || '').join('').slice(0, 2).toUpperCase();
    },
    contactGradient(name){
      // Same curated palette as the Add Company page — 10 jewel-tone gradients
      // ordered to alternate warm↔cool, so adjacent hashes land on visually
      // distinct hues. djb2 + reverse-pass keeps short similar names apart.
      const palette = [
        // Eye-soothing enterprise palette: only cool / neutral tones — navy,
        // slate, blue, teal, sky, emerald, indigo, stone. No reds, no warm
        // pinks, no bright candy. Inspired by the site-selector avatars,
        // which read as "calm industrial dashboard" rather than personality
        // colors. Single-hue 600→800 gradients keep each tile feeling solid.
        // 12 vibrant-but-mature solid tones — matching the manager's earlier
        // reference (emerald, violet, clear blue, teal, navy). Mid-saturated
        // 500-level hues feel alive without looking AI-generated. No reds,
        // no candy pinks/oranges, no gradient stacks.
        'bg-[#10B981]',   // 0  Emerald          — vibrant green
        'bg-[#8B5CF6]',   // 1  Violet           — soft purple
        'bg-[#3B82F6]',   // 2  Blue             — clear blue
        'bg-[#14B8A6]',   // 3  Teal             — vibrant teal
        'bg-[#1E293B]',   // 4  Navy             — dark charcoal-navy
        'bg-[#0EA5E9]',   // 5  Sky              — bright sky
        'bg-[#059669]',   // 6  Forest           — deeper green
        'bg-[#6366F1]',   // 7  Indigo           — clear indigo
        'bg-[#0891B2]',   // 8  Cyan             — deep cyan
        'bg-[#64748B]',   // 9  Slate            — medium grey
        'bg-[#7C3AED]',   // 10 Royal Purple     — vibrant purple
        'bg-[#475569]',   // 11 Steel            — deep grey
      ];
      const s = (name || '?').toLowerCase();
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
      for (let i = s.length - 1; i >= 0; i--) h = (((h << 5) + h) ^ (s.charCodeAt(i) * 7)) >>> 0;
      return palette[h % palette.length];
    },
    startEdit(){
      const c = this.company;
      if (!c) return;
      this.draft = {
        name: c.name,
        abn: c.abn,
        phone: c.phone || '',
        email: c.email,
        contactName: c.primaryContact?.name || '',
        contactPhone: c.primaryContact?.phone || '',
        contactEmail: c.primaryContact?.email || '',
      };
      this.editingDetails = true;
    },
    cancelEdit(){
      this.editingDetails = false;
      this.draft = null;
    },
    saveEdit(){
      const d = this.draft;
      if (!d.name.trim() || !d.abn.trim() || !d.phone.trim() || !d.email.trim() || !d.contactName.trim()) {
        showToast('Company name, ABN, phone, email and contact name are required.', 'error');
        return;
      }
      const c = this.company;
      c.name = d.name.trim();
      c.abn = d.abn.trim();
      c.phone = d.phone.trim();
      c.email = d.email.trim();
      c.primaryContact = {
        name: d.contactName.trim(),
        phone: d.contactPhone.trim(),
        email: (d.contactEmail || '').trim() || c.email,
      };
      this.editingDetails = false;
      this.draft = null;
      showToast('Company details updated.', 'success');
    },
    startEditAccess(){
      const c = this.company;
      if (!c) return;
      const access = {};
      FACILITIES.forEach(f => {
        const row = {};
        TREATMENT_SERVICES.forEach(s => {
          row[s] = c.facilities.includes(f.code) && c.services.includes(s) && f.services.includes(s);
        });
        access[f.code] = row;
      });
      this.draftAccess = access;
      this.editingAccess = true;
    },
    cancelEditAccess(){
      this.editingAccess = false;
      this.draftAccess = null;
    },
    saveAccess(){
      const c = this.company;
      const facilities = [];
      const servicesSet = new Set();
      FACILITIES.forEach(f => {
        const row = this.draftAccess[f.code];
        const any = TREATMENT_SERVICES.some(s => row[s]);
        if (any) {
          facilities.push(f.code);
          TREATMENT_SERVICES.forEach(s => { if (row[s]) servicesSet.add(s); });
        }
      });
      c.facilities = facilities;
      c.services = Array.from(servicesSet);
      this.editingAccess = false;
      this.draftAccess = null;
      showToast(`Access updated for ${c.name}.`, 'success');
    },
    /* ---- Draft verification verbs ---- */
    approveCompany(){
      const c = this.company;
      if (!c) return;
      c.status = 'Active';
      // After approval the company behaves like an admin-created record, but we keep
      // `origin` for audit/history so the list pages can still show a "Self-signup" badge.
      showToast(`${c.name} approved and activated.`, 'success');
    },
    rejectCompany(){
      const c = this.company;
      if (!c) return;
      if (!confirm('Reject ' + c.name + '? The draft company and any contacts under it will be removed. This cannot be undone.')) return;
      // Remove every contact tied to this draft company too — they'd be orphaned otherwise.
      for (let j = state.companyContacts.length - 1; j >= 0; j--) {
        if (state.companyContacts[j].companyId === c.id) state.companyContacts.splice(j, 1);
      }
      const i = state.companies.findIndex(x => x.id === c.id);
      if (i >= 0) state.companies.splice(i, 1);
      showToast(`${c.name} rejected and removed.`, 'success');
      this.$router.push('/admin/companies');
    },
    reassignToCompany(){
      const c = this.company;
      const target = state.companies.find(x => x.id === this.reassignTarget);
      if (!c || !target) return;
      // Move the draft's primary contact across to the target company as a Draft contact.
      // The draft company itself is then removed — it was a duplicate of `target`.
      // The contact remains self-signup, so the admin still gets the verification flow on the new record.
      const newContact = {
        id: ('CONT-' + (Math.max(2000, ...state.companyContacts.map(x => parseInt(String(x.id).split('-')[1] || '0', 10)).filter(n => !isNaN(n))) + 1)),
        companyId: target.id,
        companyName: target.name,
        name: c.primaryContact?.name || c.name,
        phone: c.primaryContact?.phone || c.phone || '',
        email: c.primaryContact?.email || c.email || '',
        facilities: target.facilities.slice(0, 1),
        services: target.services.slice(0, 1),
        status: 'Pending',
        created: c.created,
        origin: 'self-signup',
      };
      state.companyContacts.unshift(newContact);
      const i = state.companies.findIndex(x => x.id === c.id);
      if (i >= 0) state.companies.splice(i, 1);
      showToast(`Contact moved to ${target.name}. Draft company removed.`, 'success');
      this.$router.push('/admin/contacts/' + newContact.id);
    },
  },
