const FormRenderer = {
  components:{ Icon, Btn, TreatmentChip, SignaturePad, FileUploadField, StatusBadge },
  data(){
    return {
      data: {},
      activeSection: null,
      errors: {},
      rowErrors: {},
      submitAttempted: false,
      submitting: false,
      saved: false,
      showValidationBanner: false,
      // Mid-form facility switch (Tier 2 / Prompt 6)
      facilityMenuOpen: false,
      switchModal: null,        // { kind:'unavailable'|'confirm', target, targetName, delta, removed }
      pendingMigration: null,   // { from, sourceData, delta:[keys], removed:[keys] }
      forcedRequired: {},       // map of fieldKey -> true (delta after switch, marked required for next submit)
    };
  },
  computed:{
    state(){ return state; },
    route(){ return this.$route; },
    schemaKey(){ return `${this.route.params.facility}/${this.route.params.formKey}`; },
    schema(){ return SCHEMAS[this.schemaKey]; },
    formMeta(){
      const direct = formByRoute(this.route.params.facility, this.route.params.formKey);
      if (direct) return direct;
      // Alias fallback — a few route keys differ from FORM_CATALOG keys
      const ALIASES = { 'irradiation-treatment':'irradiation' };
      const aliased = formByRoute(this.route.params.facility, ALIASES[this.route.params.formKey]);
      if (aliased) return aliased;
      if (this.schema) {
        return {
          facility:  this.route.params.facility,
          key:       this.route.params.formKey,
          code:      'FRM-—',
          name:      this.schema.title,
          treatment: this.schema.treatment,
        };
      }
      return null;
    },
    fac(){ return FACILITIES.find(f => f.code === this.route.params.facility); },
    isMultiFacility(){ return (state.profile.facilities || []).length > 1; },
    boundFacilities(){ return FACILITIES.filter(f => state.profile.facilities.includes(f.code)); },
    sourceLists(){ return { consignors: state.consignors, consignees: state.consignees, commodities: state.commodities }; },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    layoutOpts(){
      const l = this.schema?.layout || {};
      // Defaults: stepper off, single-scroll on, full wide for every form (consistent across facilities).
      return {
        stepper:       l.stepper === true,            // opt-in (default off)
        single_scroll: l.single_scroll !== false,     // opt-out (default on)
        wide:          l.wide !== false,              // opt-out (default on)
      };
    },
    errorOpts(){
      const e = this.schema?.errors || {};
      return { banner_mode: e.banner_mode === 'inline_only' ? 'inline_only' : 'banner' };
    },
    declarationOpts(){
      // Default to checkbox-style declaration ("I agree to the declaration above")
      // for every form. A schema can opt back into the wet-signature pad by
      // setting `declaration: { type: 'signature' }`.
      const d = this.schema?.declaration || {};
      return { type: d.type === 'signature' ? 'signature' : 'checkbox' };
    },
    filledCount(){
      let filled = 0, total = 0;
      for (const sec of this.schema.sections) {
        for (const f of (sec.fields||[])) {
          total++;
          const v = this.data[f.key];
          if (v !== undefined && v !== '' && v !== null && !(Array.isArray(v)&&v.length===0)) filled++;
        }
      }
      return { filled, total, pct: total ? Math.round(filled/total*100) : 0 };
    },
    sectionProgress(){
      const map = {};
      for (const sec of this.schema.sections) {
        const flds = (sec.fields||[]).filter(f => this.visibleField(f) && !this.hiddenInDeclaration(sec, f));
        const filled = flds.filter(f => {
          const v = this.data[f.key]; return v!==undefined && v!=='' && v!==null && !(Array.isArray(v)&&v.length===0);
        }).length;
        const required = flds.filter(f => f.required);
        const reqFilled = required.filter(f => {
          const v = this.data[f.key]; return v!==undefined && v!=='' && v!==null && !(Array.isArray(v)&&v.length===0);
        }).length;
        map[sec.id] = { filled, total: flds.length, complete: required.length>0 && reqFilled===required.length };
      }
      return map;
    }
  },
  created(){
    if (!this.schema) return;
    this.initData();
    this.activeSection = this.schema.sections[0]?.id;
  },
  watch:{
    schemaKey(){
      // Defer to nextTick so the previous form's DOM has finished tearing down
      // before we mutate state (avoids vue.global.prod insertBefore race).
      this.$nextTick(() => {
        if (!this.schema) return;
        // Honor a pending mid-form facility migration: keep matching keys, null `removed`, force-require `delta`.
        if (this.pendingMigration) {
          const pending = this.pendingMigration;
          this.pendingMigration = null;
          this.initData();
          const src = pending.sourceData || {};
          const allowed = new Set();
          for (const sec of this.schema.sections) for (const f of (sec.fields||[])) allowed.add(f.key);
          for (const k of Object.keys(src)) {
            if (allowed.has(k) && src[k] !== null && src[k] !== undefined && src[k] !== '') {
              this.data[k] = src[k];
            }
          }
          const fr = {};
          for (const k of (pending.delta || [])) fr[k] = true;
          this.forcedRequired = fr;
          this.submitAttempted = true;
          this.errors = {};
          for (const k of (pending.delta || [])) {
            this.errors[k] = 'This field is required at the new facility.';
          }
          this.activeSection = this.schema.sections[0]?.id;
          return;
        }
        this.initData();
        this.activeSection = this.schema.sections[0]?.id;
        this.errors = {};
        this.submitAttempted = false;
        this.forcedRequired = {};
      });
    }
  },
  methods:{
    initData(){
      const aliasMap = { name:'contact', contact:'contact', company:'company', business_name:'company', phone:'phone', email:'email' };
      const pf = (k) => state.profile[aliasMap[k] || k] || '';
      const d = {};
      for (const sec of this.schema.sections) {
        if (sec.prefill) for (const f of sec.fields) if (f.prefill) d[f.key] = pf(f.prefill);
        for (const f of (sec.fields||[])) {
          if (f.prefillToday) d[f.key] = new Date().toISOString().slice(0,10);
          if (f.type==='checkbox' && d[f.key]===undefined) d[f.key] = [];
          if (f.type==='file-multi' && d[f.key]===undefined) d[f.key] = [];
          if (f.prefill && d[f.key]===undefined) d[f.key] = pf(f.prefill);
          if (f.default !== undefined && d[f.key]===undefined) d[f.key] = f.default;
        }
        if (sec.repeater) d[sec.repeater.key] = JSON.parse(JSON.stringify(sec.repeater.seed));
        if (sec.market) d[sec.market.key] = '';
        if (sec.palletRepeater) {
          d[sec.palletRepeater.key] = JSON.parse(JSON.stringify(sec.palletRepeater.seed));
        }
      }
      this.data = d;
    },
    visibleField(f){
      if (!f.showIf) return true;
      const checkOne = (cond) => {
        const v = this.data[cond.key];
        const target = cond.equals;
        if (Array.isArray(v)) return v.some(x => target.includes(x));
        return target.includes(v);
      };
      if (f.showIf.allOf) return f.showIf.allOf.every(checkOne);
      return checkOne(f.showIf);
    },
    // In a Declaration section running in checkbox mode, only the signature
    // field is shown (rendered as the "I agree" checkbox). Other fields like
    // Name and Date are skipped — and the validator skips them too.
    hiddenInDeclaration(sec, f){
      if (sec.id !== 'declaration' && sec.id !== 'authorisation') return false;
      if (this.declarationOpts.type !== 'checkbox') return false;
      return f.type !== 'signature';
    },
    calc(col, row) {
      if (col.type !== 'calculated') return row[col.key];
      const f = col.formula;
      if (f === 'quantity*unitPrice') return (Number(row.quantity)||0) * (Number(row.unitPrice)||0);
      return 0;
    },
    repeaterTotals(sec, rows){
      const totals = {};
      const rsum = (key) => rows.reduce((s,r) => {
        const v = key==='lineTotal' ? this.calc({type:'calculated', formula:'quantity*unitPrice'}, r) : Number(r[key])||0;
        return s + v;
      }, 0);
      for (const t of sec.repeater.totals || []) {
        const f = t.formula;
        if (f.startsWith('sum:')) {
          totals[t.key] = rsum(f.slice(4));
        } else if (f.includes('*')) {
          const [a,b] = f.split('*');
          totals[t.key] = (totals[a.trim()] !== undefined ? totals[a.trim()] : 0) * Number(b);
        } else if (f.includes('+')) {
          const [a,b] = f.split('+');
          const av = totals[a.trim()] !== undefined ? totals[a.trim()] : Number(a)||0;
          const bv = totals[b.trim()] !== undefined ? totals[b.trim()] : Number(b)||0;
          totals[t.key] = av + bv;
        }
      }
      return totals;
    },
    addRow(sec){
      const rep = sec.repeater;
      if (rep.maxRows && this.data[rep.key].length >= rep.maxRows) return;
      this.data[rep.key].push(JSON.parse(JSON.stringify(rep.seed[0])));
    },
    removeRow(sec, i){ if (this.data[sec.repeater.key].length > (sec.repeater.minRows || 1)) this.data[sec.repeater.key].splice(i,1); },

    onProductChange(sec, row, col){
      // Auto-populate unit_price based on selected product
      const map = col.priceMap;
      if (!map) return;
      const pr = map[row[col.key]];
      if (pr !== undefined) row.unitPrice = pr;
    },
    validate(){
      const errs = {};
      const rowErrs = {};
      const isEmpty = (v) => v===undefined || v==='' || v===null || (Array.isArray(v) && v.length===0);
      const matches = (cond) => {
        if (!cond) return false;
        const v = this.data[cond.key];
        const target = cond.equals;
        if (Array.isArray(v)) return v.some(x => target.includes(x));
        return target.includes(v);
      };
      for (const sec of this.schema.sections) {
        // top-level fields
        for (const f of (sec.fields||[])) {
          if (!this.visibleField(f)) continue;
          if (this.hiddenInDeclaration(sec, f)) continue;
          const v = this.data[f.key];
          // Required rules: f.required, f.requiredWhenVisible, f.requiredUnless (skip required if matches)
          let isRequired = !!f.required;
          if (f.requiredWhenVisible) isRequired = true;
          if (f.requiredUnless && matches(f.requiredUnless)) isRequired = false;
          if (isRequired && f.type==='computed') {
            if (!(Number(this.computedValue(f)) > 0)) {
              errs[f.key] = f.label + ' is required';
            }
          } else if (isRequired && isEmpty(v)) {
            errs[f.key] = f.label + ' is required';
          } else if (f.type==='signature' && this.declarationOpts.type==='checkbox' && f.required && v !== 'YES') {
            errs[f.key] = 'You must agree to the declaration';
          }
        }
        // repeater rows
        if (sec.repeater) {
          const rep = sec.repeater;
          const rows = this.data[rep.key] || [];
          const uniqKey = rep.uniqueCaseInsensitiveKey;
          const seen = new Map(); // value -> first index
          rows.forEach((row, i) => {
            const re = {};
            for (const c of rep.columns) {
              const cv = row[c.key];
              if (c.required && isEmpty(cv)) {
                re[c.key] = c.label + ' is required';
                continue;
              }
              if (!isEmpty(cv) && c.maxLength && String(cv).length > c.maxLength) {
                re[c.key] = c.label + ' must be ≤ ' + c.maxLength + ' characters';
                continue;
              }
              if (c.type==='number' && !isEmpty(cv)) {
                const n = Number(cv);
                if (Number.isNaN(n)) { re[c.key] = c.label + ' must be a number'; continue; }
                if (c.integer && !Number.isInteger(n)) { re[c.key] = c.label + ' must be a whole number'; continue; }
                if (c.gt !== undefined && !(n > c.gt))   { re[c.key] = c.label + ' must be greater than ' + c.gt; continue; }
                if (c.lt !== undefined && !(n < c.lt))   { re[c.key] = c.label + ' must be less than '    + c.lt; continue; }
                if (c.min !== undefined && n < c.min)    { re[c.key] = c.label + ' must be ≥ ' + c.min; continue; }
                if (c.max !== undefined && n > c.max)    { re[c.key] = c.label + ' must be ≤ ' + c.max; continue; }
              }
            }
            // Uniqueness (case-insensitive) across rows
            if (uniqKey) {
              const raw = row[uniqKey];
              if (!isEmpty(raw)) {
                const norm = String(raw).trim().toLowerCase();
                if (seen.has(norm)) {
                  re[uniqKey] = (rep.columns.find(c=>c.key===uniqKey)?.label || uniqKey) + ' must be unique across rows';
                } else {
                  seen.set(norm, i);
                }
              }
            }
            if (Object.keys(re).length) rowErrs[rep.key + '.' + i] = re;
          });
          // Min rows
          if (rep.minRows && rows.length < rep.minRows) {
            errs[rep.key] = 'At least ' + rep.minRows + ' row' + (rep.minRows>1?'s':'') + ' required';
          }
        }
        // Market field (top of palletRepeater section)
        if (sec.market) {
          const m = sec.market;
          if (m.required && isEmpty(this.data[m.key])) {
            errs[m.key] = m.label + ' is required';
          }
        }
        // Pallet repeater
        if (sec.palletRepeater) {
          const rep = sec.palletRepeater;
          const palletSpaces = this.data[rep.key] || [];
          palletSpaces.forEach((ps, psIdx) => {
            // pallet-level fields
            for (const pf of (rep.palletFields || [])) {
              const v = ps[pf.key];
              if (pf.required && isEmpty(v)) {
                rowErrs['ps.'+psIdx+'.'+pf.key] = pf.label + ' is required';
              }
            }
            // commodities
            (ps.commodities || []).forEach((com, cIdx) => {
              for (const cf of (rep.commodityFields || [])) {
                if ((cf.excludeKinds || []).includes(ps.kind)) continue;
                const isOptionalHere = (cf.optionalKinds || []).includes(ps.kind);
                const v = com[cf.key];
                if (cf.required && !isOptionalHere && isEmpty(v)) {
                  rowErrs['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] = cf.label + ' is required';
                }
              }
            });
          });
          if (rep.minPalletSpaces && palletSpaces.length < rep.minPalletSpaces) {
            errs[rep.key] = 'At least ' + rep.minPalletSpaces + ' pallet space required';
          }
        }
      }
      this.errors = errs;
      this.rowErrors = rowErrs;
      return Object.keys(errs).length === 0 && Object.keys(rowErrs).length === 0;
    },
    scrollToField(key){
      const el = document.getElementById('fld-'+key);
      if (el) { el.scrollIntoView({block:'center', behavior:'smooth'}); el.focus?.(); }
    },
    saveDraft(){
      this.saved = true; setTimeout(()=> this.saved=false, 1800);
    },
    submit(){
      this.submitAttempted = true;
      if (!this.validate()) {
        if (this.errorOpts.banner_mode === 'banner') {
          this.showValidationBanner = true;
          window.scrollTo({top:0, behavior:'smooth'});
        } else {
          // inline_only: scroll to first errored field
          const firstKey = Object.keys(this.errors)[0];
          if (firstKey) this.scrollToField(firstKey);
          else {
            const rk = Object.keys(this.rowErrors)[0];
            if (rk) {
              const sec = this.schema.sections.find(s => s.repeater && rk.startsWith(s.repeater.key+'.'));
              if (sec) this.goToSection(sec.id);
            }
          }
        }
        return;
      }
      this.submitting = true;
      setTimeout(()=>{
        const id = 'MOCK-12345';
        const today = new Date().toISOString().slice(0,10);
        const newOrder = {
          id,
          facility: this.formMeta?.facility || this.route.params.facility,
          formCode: this.formMeta?.code || 'FRM-—',
          formName: this.formMeta?.name || this.schema.title,
          treatment: this.formMeta?.treatment || this.schema.treatment,
          submitted: today,
          po: this.data.po || '—',
          consignor: this.resolveSourceLabel('consignors', this.data.consignor),
          consignee: this.resolveSourceLabel('consignees', this.data.consignee),
          goods: this.data.description || '—',
          doseKGy: this.data.doseKGy || null,
          status: 'Created',
          bcSync: 'pending',
          exsitedId: 'EXS-' + Math.floor(400000 + Math.random()*10000),
          bcId: '—',
          collection: this.data.deliveryDate || today,
        };
        state.orders.unshift(newOrder);
        this.logFormDeclaration(id, newOrder);
        state.lastSubmissionId = id;
        this.submitting = false;
        this.$router.push('/submitted/'+id);
      }, 900);
    },
    /* Case 3 — capture the existing per-form declaration into the audit log.
       Additive only: reads the declaration section that already renders on the
       form; does not add or modify any field. */
    logFormDeclaration(orderId, order){
      const sec = (this.schema?.sections || []).find(s => s.id === 'declaration' || s.id === 'authorisation');
      if (!sec) return;
      const sigField = (sec.fields || []).find(f => f.type === 'signature');
      const method = this.declarationOpts.type;   // 'checkbox' | 'signature'
      const sigVal = sigField ? this.data[sigField.key] : null;
      state.formDeclarations.push({
        id: 'DECL-' + Date.now(),
        orderId,
        formCode: order.formCode || '—',
        formName: order.formName || this.schema?.title || '—',
        facility: order.facility || '—',
        treatment: order.treatment || '—',
        userId: eulaUserId(),
        userName: state.profile.contact || '—',
        companyName: state.profile.company || '—',
        statement: sec.legal || sec.agreeText || 'I agree to the declaration above.',
        method,
        signatureValue: method === 'checkbox' ? (sigVal === 'YES' ? 'Agreed (checkbox)' : String(sigVal||'—')) : 'Signature captured',
        acceptedAt: new Date().toISOString(),
        ip: eulaMockIp(),
      });
    },
    resolveSourceLabel(source, id){
      const item = (this.sourceLists[source]||[]).find(x => x.id === id);
      return item ? item.name : (id || '—');
    },
    goToSection(id){
      this.activeSection = id;
      const el = document.getElementById('sec-'+id);
      if (el) el.scrollIntoView({ block:'start', behavior:'smooth' });
    },
    onScroll(){
      if (this.layoutOpts.single_scroll) return;
      // Update active section based on scroll
      for (const sec of this.schema.sections) {
        const el = document.getElementById('sec-'+sec.id);
        if (!el) continue;
        const r = el.getBoundingClientRect();
        if (r.top < 160 && r.bottom > 160) { this.activeSection = sec.id; break; }
      }
    },
    inputCls(f){
      const err = this.submitAttempted && this.errors[f.key];
      const base = 'w-full h-11 rounded-md border px-3 text-base focus-ring';
      const color = err ? 'border-red-400 bg-red-50/40' :
                    (f.readonly || f.prefill) ? 'border-slate-200 bg-slate-50 text-slate-700' :
                    'border-slate-300';
      return `${base} ${color}`;
    },
    rowInputCls(sec, i, c){
      const err = this.submitAttempted && this.rowErrors[sec.repeater.key+'.'+i]?.[c.key];
      const base = 'w-full rounded-md border px-2 py-2 text-sm focus-ring';
      const color = err ? 'border-red-400 bg-red-50/40' : 'border-slate-300';
      return `${base} ${color}`;
    },
    isFieldRequired(f){
      if (this.forcedRequired && this.forcedRequired[f.key]) return true;
      if (f.required) return true;
      if (f.requiredWhenVisible) return true; // visibility gate handled by v-if upstream
      if (f.requiredUnless) {
        const rv = this.data[f.requiredUnless.key];
        const eq = f.requiredUnless.equals || [];
        return !eq.includes(rv); // required UNLESS rv is in equals
      }
      return false;
    },
    /* ---------- palletRepeater helpers ---------- */
    palletSection(){
      return this.schema.sections.find(s => s.palletRepeater);
    },
    palletSpaces(){
      const sec = this.palletSection();
      if (!sec) return [];
      return this.data[sec.palletRepeater.key] || [];
    },
    palletRollup(ps, key){
      // sum across commodities of the given key
      return (ps.commodities || []).reduce((s, c) => s + (Number(c[key]) || 0), 0);
    },
    computedValue(f){
      // formulas: 'sumPallet:no_spaces', 'sumCommodities:<key>'
      const formula = f.formula || '';
      const palletSpaces = this.palletSpaces();
      if (formula.startsWith('sumPallet:')) {
        const key = formula.slice('sumPallet:'.length);
        return palletSpaces.reduce((s, ps) => s + (Number(ps[key]) || 0), 0);
      }
      if (formula.startsWith('sumCommodities:')) {
        const key = formula.slice('sumCommodities:'.length);
        return palletSpaces.reduce((s, ps) => s + this.palletRollup(ps, key), 0);
      }
      return 0;
    },
    /* mutate pallet spaces */
    addPalletSpace(kind){
      const sec = this.palletSection();
      if (!sec) return;
      const arr = this.data[sec.palletRepeater.key];
      const newId = 'ps-' + Date.now();
      arr.push({
        id: newId,
        kind: kind, // 'irradiated' or 'non_irradiated'
        no_spaces: null,
        storage_temp: '',
        commodities: [
          { commodity:'', grower:'', no_of_cartons:null, no_cheps:null, pulp_temp_min:null, pulp_temp_max:null, address:'' }
        ]
      });
    },
    removePalletSpace(idx){
      const sec = this.palletSection();
      if (!sec) return;
      const arr = this.data[sec.palletRepeater.key];
      if (arr.length <= (sec.palletRepeater.minPalletSpaces || 1)) return;
      arr.splice(idx, 1);
    },
    addCommodity(psIdx){
      const sec = this.palletSection();
      if (!sec) return;
      const ps = this.data[sec.palletRepeater.key][psIdx];
      ps.commodities.push({ commodity:'', grower:'', no_of_cartons:null, no_cheps:null, pulp_temp_min:null, pulp_temp_max:null, address:'' });
    },
    removeCommodity(psIdx, cIdx){
      const sec = this.palletSection();
      if (!sec) return;
      const ps = this.data[sec.palletRepeater.key][psIdx];
      if (ps.commodities.length <= 1) return;
      ps.commodities.splice(cIdx, 1);
    },
    /* file-multi helpers */
    onFileSelect(f, ev){
      const files = Array.from(ev.target.files || []);
      const arr = this.data[f.key] || [];
      for (const file of files) {
        arr.push({ name: file.name, size: file.size, type: file.type });
      }
      this.data[f.key] = arr;
      ev.target.value = '';
    },
    removeFile(f, idx){
      const arr = this.data[f.key] || [];
      arr.splice(idx, 1);
      this.data[f.key] = arr;
    },
    fmtFileSize(b){
      if (b < 1024) return b + ' B';
      if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
      return (b/(1024*1024)).toFixed(1) + ' MB';
    },
    fmtMoney, fmtDate,
    /* ---- Mid-form facility switch (Tier 2 / Prompt 6) -------------------- */
    toggleFacilityMenu(){
      if (!this.isMultiFacility) return;
      this.facilityMenuOpen = !this.facilityMenuOpen;
    },
    closeFacilityMenu(){ this.facilityMenuOpen = false; },
    attemptFacilitySwitch(targetCode){
      this.facilityMenuOpen = false;
      const currentCode = this.route.params.facility;
      if (targetCode === currentCode) return;
      const formKey = this.route.params.formKey;
      const targetFac = FACILITIES.find(f => f.code === targetCode);
      const targetName = targetFac ? `${targetFac.name}, ${targetFac.state}` : targetCode;
      const targetSchema = SCHEMAS[`${targetCode}/${formKey}`];
      if (!targetSchema) {
        this.switchModal = { kind:'unavailable', target:targetCode, targetName };
        return;
      }
      const collectKeys = (sch) => {
        const set = new Set();
        for (const sec of (sch.sections || [])) {
          for (const f of (sec.fields || [])) set.add(f.key);
        }
        return set;
      };
      const currentKeys = collectKeys(this.schema);
      const targetKeys  = collectKeys(targetSchema);
      const delta = [...targetKeys].filter(k => !currentKeys.has(k));
      const removed = [...currentKeys].filter(k => !targetKeys.has(k));
      if (delta.length === 0 && removed.length === 0) {
        this.performMigration(targetCode, [], []);
        return;
      }
      this.switchModal = { kind:'confirm', target:targetCode, targetName, delta, removed };
    },
    cancelSwitch(){ this.switchModal = null; },
    confirmSwitch(){
      if (!this.switchModal || this.switchModal.kind !== 'confirm') return;
      const { target, delta, removed } = this.switchModal;
      this.switchModal = null;
      this.performMigration(target, delta, removed);
    },
    performMigration(targetCode, delta, removed){
      // Snapshot current data; null `removed` keys; mark `delta` as forced-required for next submit.
      const snapshot = JSON.parse(JSON.stringify(this.data || {}));
      for (const k of removed) snapshot[k] = null;
      this.pendingMigration = {
        sourceData: snapshot,
        delta: [...delta],
      };
      const formKey = this.route.params.formKey;
      this.$router.push(`/forms/${targetCode}/${formKey}`);
    },
  },

    if (!this.layoutOpts.single_scroll) {
      this.$refs.scrollArea?.addEventListener('scroll', this.onScroll);
    }
  },

    this.$refs.scrollArea?.removeEventListener('scroll', this.onScroll);

          <div v-if="!layoutOpts.stepper">
            <div class="inline-flex items-center gap-2 text-sm text-slate-600">
              <span :class="['inline-block h-2 w-2 rounded-full', treatmentStyles[schema.treatment].dot]" aria-hidden="true"></span>
              <span>{{ treatmentLabels[schema.treatment] || schema.treatment }}</span>

            <div class="mt-1 relative">
              <button v-if="isMultiFacility" type="button" @click="toggleFacilityMenu"

              <!-- Regular fields -->

              <div v-if="visibleField(f) && !hiddenInDeclaration(sec, f)"

                        <span class="text-xs text-slate-500 tabular-nums">{{ fmtFileSize(file.size) }}</span>
                        <button type="button" @click="removeFile(f, i)" aria-label="Remove file"
                                class="p-1 rounded hover:bg-red-50 text-slate-500 hover:text-red-600">
                          <Icon name="x" :size="14"/>
                        </button>
                      </div>
                    </div>
                  </div>

                  <!-- Radio -->
                  <div v-else-if="f.type==='radio'" :class="f.inline ? 'flex flex-wrap items-center gap-x-6 gap-y-2' : 'space-y-2'" :id="'fld-'+f.key" role="radiogroup">
                    <label v-for="opt in f.options" :key="opt"
                           class="flex items-center gap-3 py-1 cursor-pointer text-base text-slate-800">
                      <input type="radio" :value="opt" v-model="data[f.key]" class="h-4 w-4 accent-teal-600"/>
                      <span>{{ opt }}</span>
                    </label>
                  </div>

                  <!-- Checkbox -->
                  <div v-else-if="f.type==='checkbox'" class="space-y-2" :id="'fld-'+f.key">
                    <label v-for="opt in f.options" :key="opt" class="flex items-center gap-3 py-1 text-base text-slate-800">
                      <input type="checkbox" :value="opt" v-model="data[f.key]" class="h-4 w-4 rounded accent-teal-600"/>
                      <span>{{ opt }}</span>
                    </label>
                  </div>

                  <!-- Select -->
                  <select v-else-if="f.type==='select'"
                          :id="'fld-'+f.key" v-model="data[f.key]" :class="inputCls(f)">
                    <option value="">Select…</option>
                    <template v-if="f.source">
                      <option v-for="o in sourceLists[f.source]" :key="o.id" :value="o.id">{{ o.name }}</option>
                    </template>
                    <template v-else>
                      <option v-for="o in f.options" :key="o" :value="o">{{ o }}</option>
                    </template>
                  </select>

                  <!-- Searchable dropdown (combobox with datalist) -->
                  <div v-else-if="f.type==='searchable-dropdown'" class="relative">
                    <Icon name="search" :size="14" cls="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                    <input :id="'fld-'+f.key" v-model="data[f.key]"
                           :list="'dl-'+f.key"
                           :placeholder="f.placeholder || 'Search…'"
                           :class="[inputCls(f),'pl-8']"/>
                    <datalist :id="'dl-'+f.key">
                      <template v-if="f.source">
                        <option v-for="o in sourceLists[f.source]" :key="o.id" :value="o.name"></option>
                      </template>
                      <template v-else>
                        <option v-for="o in f.options" :key="o" :value="o"></option>
                      </template>
                    </datalist>
                  </div>

                  <!-- Google-style address (text + map-pin affordance) -->
                  <div v-else-if="f.type==='google-address'" class="relative">
                    <Icon name="map-pin" :size="14" cls="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                    <input :id="'fld-'+f.key" v-model="data[f.key]" type="text"
                           :placeholder="f.placeholder || 'Start typing an address…'"
                           :class="[inputCls(f),'pl-8']"/>
                  </div>

                  <!-- Heading / group label (no input) -->
                  <template v-else-if="f.type==='heading'"></template>

                  <!-- File -->
                  <FileUploadField v-else-if="f.type==='file-upload'"
                                   v-model="data[f.key]" :accept="f.accept" :id="'fld-'+f.key"/>

                  <!-- Signature -->
                  <SignaturePad v-else-if="f.type==='signature' && declarationOpts.type==='signature'"
                                v-model="data[f.key]" :id="'fld-'+f.key"/>

                  <!-- Declaration checkbox alternative -->
                  <label v-else-if="f.type==='signature' && declarationOpts.type==='checkbox'"
                         :for="'fld-'+f.key"
                         class="flex items-start gap-3 px-4 py-3 rounded-md border border-slate-300 bg-slate-50 cursor-pointer hover:bg-slate-100/60">
                    <input :id="'fld-'+f.key" type="checkbox"
                           :checked="data[f.key]==='YES'"
                           @change="data[f.key] = $event.target.checked ? 'YES' : 'NO'"
                           class="mt-0.5 h-4 w-4 rounded accent-teal-600"/>
                    <span class="text-base text-slate-800">{{ sec.agreeText || 'I agree to the declaration above.' }}</span>
                  </label>

                  <p v-if="f.help" class="mt-1 text-xs text-slate-500">{{ f.help }}</p>
                  <div v-if="submitAttempted && errors[f.key]" role="alert" class="mt-1 text-sm text-red-600 flex items-center gap-1">
                    <Icon name="alert-circle" :size="14"/>{{ errors[f.key] }}
                  </div>
                </div>
              </div>
              </template>

              <!-- Repeater -->
              <div v-if="sec.repeater" :class="['-mx-6', sec.grid===3 ? 'sm:col-span-3' : sec.grid===2 ? 'sm:col-span-2' : '']">
                <div class="overflow-x-auto scroll-thin">
                  <table class="w-full text-sm">
                    <thead class="bg-slate-50 border-y border-slate-200 text-[13px] text-slate-600">
                      <tr>
                        <th class="px-6 py-2.5 text-left font-medium" v-for="c in sec.repeater.columns" :key="c.key" :class="c.w">{{ c.label }}<span v-if="c.required" class="text-red-600"> *</span></th>
                        <th class="w-10 sticky right-0 bg-slate-50"></th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      <template v-for="(row,i) in data[sec.repeater.key]" :key="i">
                        <tr>
                          <td v-for="c in sec.repeater.columns" :key="c.key" class="px-6 py-2 align-top" :class="c.w">
                            <input v-if="c.type==='text'" v-model="row[c.key]" :maxlength="c.maxLength" :class="rowInputCls(sec, i, c)"/>
                            <input v-else-if="c.type==='number'" v-model.number="row[c.key]" type="number" :min="c.min" :max="c.max" :step="c.step||1" :class="rowInputCls(sec, i, c)"/>
                            <select v-else-if="c.type==='select'" v-model="row[c.key]" @change="onProductChange(sec, row, c)" :class="rowInputCls(sec, i, c)">
                              <option value="">Select…</option>
                              <option v-for="o in c.options" :key="o" :value="o">{{ o }}</option>
                            </select>
                            <input v-else-if="c.type==='searchable-dropdown'" v-model="row[c.key]"
                                   :list="'rdl-'+sec.id+'-'+c.key" :maxlength="c.maxLength" :placeholder="c.placeholder || 'Search…'"
                                   :class="rowInputCls(sec, i, c)"/>
                            <datalist v-if="c.type==='searchable-dropdown'" :id="'rdl-'+sec.id+'-'+c.key">
                              <template v-if="c.source">
                                <option v-for="o in sourceLists[c.source]" :key="o.id" :value="o.name"></option>
                              </template>
                              <template v-else>
                                <option v-for="o in c.options" :key="o" :value="o"></option>
                              </template>
                            </datalist>
                            <input v-else-if="c.type==='google-address'" v-model="row[c.key]" type="text"
                                   :maxlength="c.maxLength" :placeholder="c.placeholder || 'Start typing an address…'"
                                   :class="rowInputCls(sec, i, c)"/>
                            <template v-else-if="c.type==='readonly-number'">
                              <div v-if="c.suffix" class="py-1.5 text-sm text-slate-500 tabular-nums whitespace-nowrap">{{ row[c.key] ? fmtMoney(row[c.key]) + ' ' + c.suffix : '' }}</div>
                              <input v-else :value="row[c.key]" readonly class="w-full rounded border border-slate-200 bg-slate-50 px-2 py-1.5 text-sm text-slate-500 tabular-nums"/>
                            </template>
                            <div v-else-if="c.type==='calculated'" class="px-2 py-1.5 text-sm text-navy-900 font-medium tabular-nums">{{ fmtMoney(calc(c, row)) }}</div>
                            <div v-if="submitAttempted && rowErrors[sec.repeater.key+'.'+i]?.[c.key]"
                                 class="mt-1 text-[11px] text-red-600 flex items-start gap-1 leading-snug">
                              <Icon name="alert-circle" :size="11" cls="mt-0.5"/>
                              <span>{{ rowErrors[sec.repeater.key+'.'+i][c.key] }}</span>
                            </div>
                          </td>
                          <td class="px-4 py-2 align-top sticky right-0 bg-white">
                            <button type="button" @click="removeRow(sec, i)" :disabled="data[sec.repeater.key].length<=(sec.repeater.minRows||1)"
                                    class="p-1 rounded hover:bg-red-50 text-slate-400 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed">
                              <Icon name="trash-2" :size="14"/>
                            </button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div class="px-6 py-3 border-t border-slate-100 flex items-center gap-3">
                  <button type="button" @click="addRow(sec)"
                          :disabled="sec.repeater.maxRows && data[sec.repeater.key].length >= sec.repeater.maxRows"
                          class="text-sm text-teal-600 hover:text-teal-700 font-medium inline-flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
                    <Icon name="plus" :size="14"/> {{ sec.repeater.addLabel || 'Add line' }}
                  </button>
                  <span v-if="sec.repeater.maxRows" class="text-[11px] text-slate-400">{{ data[sec.repeater.key].length }} / {{ sec.repeater.maxRows }} rows</span>
                  <span v-if="submitAttempted && errors[sec.repeater.key]" class="text-[11px] text-red-600 inline-flex items-center gap-1">
                    <Icon name="alert-circle" :size="11"/>{{ errors[sec.repeater.key] }}
                  </span>
                </div>
                <div v-if="sec.repeater.note" class="px-6 py-3 border-t border-slate-100 bg-amber-50/50 text-[11px] text-amber-900 leading-relaxed">
                  <Icon name="info" :size="12" cls="inline mr-1"/>{{ sec.repeater.note }}
                </div>
                <!-- Totals -->
                <div v-if="sec.repeater.totals" class="px-6 py-4 border-t border-slate-100 bg-slate-50">
                  <div class="ml-auto max-w-xs space-y-1 text-sm">
                    <div v-for="t in sec.repeater.totals" :key="t.key" class="flex justify-between"
                         :class="t.key==='grandTotal' ? 'pt-2 border-t border-slate-200 font-semibold text-navy-900' : 'text-slate-600'">
                      <span>{{ t.label }}</span>
                      <span class="tabular-nums">{{ fmtMoney(repeaterTotals(sec, data[sec.repeater.key])[t.key]) }}</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Pallet Repeater (Treatment Details, with Market + nested commodities) -->
              <template v-if="sec.palletRepeater">
                <!-- Market field -->
                <div v-if="sec.market">
                  <label :for="'fld-'+sec.market.key" class="block text-xs font-medium text-slate-700 mb-1.5">
                    {{ sec.market.label }}
                    <span v-if="sec.market.required" class="text-red-500">*</span>
                  </label>
                  <select :id="'fld-'+sec.market.key" v-model="data[sec.market.key]"
                          :class="['w-full rounded-lg border px-3 py-2 text-sm focus-ring',
                                   submitAttempted && errors[sec.market.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']">
                    <option value="">{{ sec.market.placeholder || 'Select…' }}</option>
                    <option v-for="o in sec.market.options" :key="o" :value="o">{{ o }}</option>
                  </select>
                  <div v-if="submitAttempted && errors[sec.market.key]" class="mt-1 text-[11px] text-red-600 flex items-start gap-1">
                    <Icon name="alert-circle" :size="11" cls="mt-0.5"/><span>{{ errors[sec.market.key] }}</span>
                  </div>
                </div>

                <!-- Pallet space cards, grouped by kind -->
                <div class="space-y-6">
                  <!-- Group: Irradiated -->
                  <div v-for="(group, gIdx) in [{kind:'irradiated', label:'Irradiated Pallets'}, {kind:'non_irradiated', label:'Non-Irradiated Pallets'}]" :key="group.kind">
                    <template v-if="data[sec.palletRepeater.key].some(ps => ps.kind === group.kind)">
                      <h3 class="text-sm font-semibold text-navy-900 mb-3">{{ group.label }}</h3>
                      <div class="space-y-4">
                        <div v-for="(ps, psIdx) in data[sec.palletRepeater.key]" :key="ps.id">
                          <div v-if="ps.kind === group.kind"
                               class="rounded-md border border-slate-200 overflow-hidden">
                            <!-- Pallet space header strip -->
                            <div class="px-4 py-3 border-b border-slate-100 bg-slate-50 flex items-center gap-4">
                              <div class="flex items-center gap-2">
                                <span :class="['inline-block h-2 w-2 rounded-full', group.kind === 'irradiated' ? 'bg-teal-500' : 'bg-amber-500']" aria-hidden="true"></span>
                                <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center text-xs font-semibold">
                                  {{ data[sec.palletRepeater.key].filter((p,j) => p.kind === group.kind && j <= psIdx).length }}
                                </span>
                                <span class="text-sm font-semibold text-navy-900">
                                  {{ group.kind === 'irradiated' ? 'Pallet Space' : 'Non-Irradiated Pallet Space' }}
                                </span>
                              </div>
                              <!-- Pallet-level fields inline -->
                              <div class="flex items-end gap-3 flex-1">
                                <div v-for="pf in sec.palletRepeater.palletFields" :key="pf.key" :class="pf.w">
                                  <label class="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">
                                    {{ pf.label }}<span v-if="pf.required" class="text-red-500">*</span>
                                  </label>
                                  <input v-if="pf.type==='number'" type="number" v-model.number="ps[pf.key]"
                                         :min="pf.min" :max="pf.max"
                                         :class="['w-full rounded border px-2 py-1.5 text-sm focus-ring bg-white',
                                                  submitAttempted && rowErrors['ps.'+psIdx+'.'+pf.key] ? 'border-red-400' : 'border-slate-300']"/>
                                  <select v-else-if="pf.type==='select'" v-model="ps[pf.key]"
                                          :class="['w-full rounded border px-2 py-1.5 text-sm focus-ring bg-white',
                                                   submitAttempted && rowErrors['ps.'+psIdx+'.'+pf.key] ? 'border-red-400' : 'border-slate-300']">
                                    <option value="">Select…</option>
                                    <option v-for="o in pf.options" :key="o" :value="o">{{ o }}</option>
                                  </select>
                                </div>
                                <!-- Rollups -->
                                <div v-for="r in sec.palletRepeater.rollups.filter(r => !(r.excludeKinds || []).includes(ps.kind))" :key="r.key" class="w-32">
                                  <div class="text-[12px] text-slate-500 mb-1">{{ r.label }}</div>
                                  <div class="w-full rounded border border-slate-300 bg-white px-2 py-1.5 text-sm font-semibold text-navy-900 tabular-nums">{{ palletRollup(ps, r.formula.split(':')[1]) }}</div>
                                </div>
                              </div>
                              <!-- Remove pallet space -->
                              <button type="button" @click="removePalletSpace(psIdx)"
                                      :disabled="data[sec.palletRepeater.key].length <= (sec.palletRepeater.minPalletSpaces || 1)"
                                      aria-label="Remove pallet space"
                                      class="p-1.5 rounded hover:bg-slate-200 text-slate-500 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed">
                                <Icon name="x" :size="16"/>
                              </button>
                            </div>

                            <!-- Commodities table -->
                            <div class="overflow-x-auto scroll-thin bg-white">
                              <table class="w-full text-sm">
                                <thead class="bg-slate-50 border-b border-slate-200 text-[13px] text-slate-600">
                                  <tr>
                                    <th class="pl-4 pr-2 py-2 text-left font-medium w-8">#</th>
                                    <th class="px-3 py-2 text-left font-medium" v-for="cf in sec.palletRepeater.commodityFields.filter(c => !(c.excludeKinds || []).includes(ps.kind))" :key="cf.key" :class="cf.w">
                                      {{ cf.label }}<span v-if="cf.required && !(cf.optionalKinds || []).includes(ps.kind)" class="text-red-600" aria-hidden="true">*</span>
                                    </th>
                                    <th class="w-10 sticky right-0 bg-slate-50"></th>
                                  </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                  <tr v-for="(com, cIdx) in ps.commodities" :key="cIdx">
                                    <td class="pl-4 pr-2 py-2 align-top text-xs text-slate-400 tabular-nums pt-3">{{ cIdx + 1 }}</td>
                                    <td v-for="cf in sec.palletRepeater.commodityFields.filter(c => !(c.excludeKinds || []).includes(ps.kind))" :key="cf.key" class="px-3 py-2 align-top" :class="cf.w">
                                      <input v-if="cf.type==='text'" v-model="com[cf.key]" :maxlength="cf.maxLength" :placeholder="cf.placeholder"
                                             :class="['w-full rounded border px-2 py-1.5 text-sm focus-ring',
                                                      submitAttempted && rowErrors['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']"/>
                                      <input v-else-if="cf.type==='number'" type="number" v-model.number="com[cf.key]"
                                             :min="cf.min" :step="cf.step || 1" :placeholder="cf.placeholder"
                                             :class="['w-full rounded border px-2 py-1.5 text-sm focus-ring',
                                                      submitAttempted && rowErrors['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']"/>
                                      <input v-else-if="cf.type==='searchable-dropdown'" v-model="com[cf.key]"
                                             :list="'cdl-'+ps.id+'-'+cf.key" :maxlength="cf.maxLength" :placeholder="cf.placeholder || 'Search…'"
                                             :class="['w-full rounded border px-2 py-1.5 text-sm focus-ring',
                                                      submitAttempted && rowErrors['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']"/>
                                      <datalist v-if="cf.type==='searchable-dropdown'" :id="'cdl-'+ps.id+'-'+cf.key">
                                        <option v-for="o in sourceLists[cf.source]" :key="o.id" :value="o.name"></option>
                                      </datalist>
                                      <input v-else-if="cf.type==='google-address'" v-model="com[cf.key]" type="text"
                                             :maxlength="cf.maxLength" :placeholder="cf.placeholder || 'Start typing an address…'"
                                             :class="['w-full rounded border px-2 py-1.5 text-sm focus-ring',
                                                      submitAttempted && rowErrors['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']"/>
                                    </td>
                                    <td class="px-2 py-2 align-top sticky right-0 bg-white">
                                      <button type="button" @click="removeCommodity(psIdx, cIdx)" :disabled="ps.commodities.length <= 1"
                                              class="p-1 rounded hover:bg-red-50 text-slate-400 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed mt-1">
                                        <Icon name="trash-2" :size="14"/>
                                      </button>
                                    </td>
                                  </tr>
                                </tbody>
                              </table>
                            </div>
                            <div class="px-4 py-2 bg-slate-50/50 border-t border-slate-100">
                              <button type="button" @click="addCommodity(psIdx)"
                                      class="text-xs text-teal-600 hover:text-teal-700 font-medium inline-flex items-center gap-1">
                                <Icon name="plus" :size="12"/> Add Commodity
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Add pallet space buttons -->
                <div class="flex flex-wrap gap-2 pt-2">
                  <button type="button" @click="addPalletSpace('irradiated')"
                          class="inline-flex items-center gap-2 px-3 py-2 rounded-md border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 text-sm font-medium">
                    <span class="inline-block h-2 w-2 rounded-full bg-teal-500" aria-hidden="true"></span>
                    <Icon name="plus" :size="14"/> {{ sec.palletRepeater.addIrradiatedLabel || 'Add pallet space' }}
                  </button>
                  <button type="button" @click="addPalletSpace('non_irradiated')"
                          class="inline-flex items-center gap-2 px-3 py-2 rounded-md border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 text-sm font-medium">
                    <span class="inline-block h-2 w-2 rounded-full bg-amber-500" aria-hidden="true"></span>
                    <Icon name="plus" :size="14"/> {{ data[sec.palletRepeater.key].some(p => p.kind === 'non_irradiated') ? (sec.palletRepeater.addNonIrradiatedAnotherLabel || 'Add Another Non Irradiated Pallet Space') : (sec.palletRepeater.addNonIrradiatedLabel || 'Add non-irradiated pallet space') }}
                  </button>
                </div>
              </template>
              <!-- /Pallet Repeater -->

            </div>

            <!-- Section footer note -->
            <div v-if="sec.note" class="px-6 py-3 border-t border-slate-100 text-xs text-slate-600 leading-relaxed">
              {{ sec.note }}
            </div>
          </section>

          <div class="pt-4 pb-16"></div>
        </div>
      </div>

      <!-- Sticky footer -->
      <div class="border-t border-slate-200 bg-white px-8 py-4 flex items-center gap-3 shrink-0">
        <Btn as="router-link" :to="{ path:'/forms' }" kind="ghost" icon="arrow-left">Back to all forms</Btn>
        <div class="flex-1"></div>
        <Btn kind="primary" :disabled="submitting" iconRight="arrow-right" action="submit" @click="submit">
          {{ submitting ? 'Submitting…' : 'Submit request' }}
        </Btn>
      </div>
    </div>

    <!-- Mid-form facility switch modal -->
    <transition name="fade">
      <div v-if="switchModal" role="dialog" aria-modal="true"
           class="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4" @click.self="cancelSwitch">
        <div class="bg-white rounded-md border border-slate-200 shadow-lg w-full max-w-md overflow-hidden">
          <!-- Unavailable -->
          <template v-if="switchModal.kind === 'unavailable'">
            <div class="px-6 py-5">
              <div class="flex items-start gap-3">
                <Icon name="alert-triangle" :size="20" cls="text-amber-600 shrink-0 mt-0.5"/>
                <div class="min-w-0">
                  <h3 class="text-base font-semibold text-navy-900">{{ switchModal.targetName.split(',')[0] }} does not offer this form</h3>
                  <p class="mt-1 text-sm text-slate-600 leading-relaxed">This form is not available at {{ switchModal.targetName }}. Stay on the current site, or pick a different form from the catalog.</p>
                </div>
              </div>
            </div>
            <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-end">
              <Btn kind="primary" @click="cancelSwitch">OK</Btn>
            </div>
          </template>
          <!-- Confirm switch -->
          <template v-else>
            <div class="px-6 py-5">
              <h3 class="text-base font-semibold text-navy-900">Switch to {{ switchModal.targetName }}?</h3>
              <p class="mt-2 text-sm text-slate-600 leading-relaxed">
                Switching will require <span class="font-medium text-navy-900">{{ switchModal.delta.length }}</span>
                new field<span v-if="switchModal.delta.length !== 1">s</span> and discard
                <span class="font-medium text-navy-900">{{ switchModal.removed.length }}</span>
                field<span v-if="switchModal.removed.length !== 1">s</span> that do not apply at {{ switchModal.targetName.split(',')[0] }}. Your other answers will be preserved.

            </div>
            <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2">

            </div>
          </template>
        </div>
      </div>
    </transition>
  </div>`
};

const OrdersPage = {
  components:{ Icon, Btn, StatusBadge, Skel, EmptyState },
  data(){ return { loading:true, q:'', treatment:'ALL', dateRange:'all', dateFrom:'', dateTo:'', sort:{ by:'submitted', dir:'desc' }, menuFor:null, page:1, pageSize:25 }; },
  mounted(){
    setTimeout(() => { this.loading = false; }, 300);
    document.addEventListener('click', this.closeMenu);
    // Reset to page 1 whenever the FacilityChip switches site.
    this._unwatchFacility = this.$watch(() => state.profile.currentFacility, () => { this.page = 1; });
  },
  beforeUnmount(){
    document.removeEventListener('click', this.closeMenu);
    if (this._unwatchFacility) this._unwatchFacility();
  },
  watch:{
    q(){ this.page = 1; },
    treatment(){ this.page = 1; },
    pageSize(){ this.page = 1; },
    dateRange(v){
      const iso = (d) => d.toISOString().slice(0,10);
      const today = new Date();
      const start = (offsetDays) => { const d = new Date(today); d.setDate(d.getDate() - offsetDays); return d; };
      if (v === 'all')          { this.dateFrom = ''; this.dateTo = ''; }
      else if (v === 'last7')   { this.dateFrom = iso(start(7));  this.dateTo = iso(today); }
      else if (v === 'last30')  { this.dateFrom = iso(start(30)); this.dateTo = iso(today); }
      else if (v === 'thisMonth'){
        const d = new Date(today.getFullYear(), today.getMonth(), 1);
        this.dateFrom = iso(d); this.dateTo = iso(today);
      }
      else if (v === 'thisQuarter'){
        const q = Math.floor(today.getMonth() / 3);
        const d = new Date(today.getFullYear(), q * 3, 1);
        this.dateFrom = iso(d); this.dateTo = iso(today);
      }
      this.page = 1;
      // 'custom' — keep current dateFrom/dateTo as-is, user edits inputs.
    }
  },
  computed:{
    state(){ return state; },
    treatmentLabels(){ return TREATMENT_LABELS; },

      if (this.dateFrom)          list = list.filter(o => o.submitted >= this.dateFrom);
      if (this.dateTo)            list = list.filter(o => o.submitted <= this.dateTo);
      if (this.q) {

const OrderDetailPage = {
  components:{ Icon, StatusBadge, MessagesPanel },
  data(){ return {
    tabs: ['overview','messages','timeline'],
    attSearch: '',
    attSort: { by:'uploaded', dir:'desc' },
    attPage: 1,
    attPageSize: 25,
  }; },
  watch:{
    attSearch(){ this.attPage = 1; },
    attPageSize(){ this.attPage = 1; },
  },
  computed:{
    state(){ return state; },
    order(){ return state.orders.find(o => o.id === this.$route.params.id); },
    orderFacility(){
      return this.order ? FACILITIES.find(f => f.code === this.order.facility) : null;
    },
    inScope(){
      if (!this.order) return false;
      // Admins are not scoped to a single facility — they can open any order
      // (e.g. via the Company detail Messages tab) without being asked to
      // "switch site" first.
      if (state.role === 'admin') return true;
      return this.order.facility === state.profile.currentFacility;
    },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    canEdit(){ return this.order && !['Completed','Cancelled'].includes(this.order.status); },
    currentTab(){
      let t = this.$route.query.tab;
      // Backward-compat: ?tab=conversation → messages; ?tab=activity → timeline; ?tab=attachments → overview.
      if (t === 'conversation') t = 'messages';
      if (t === 'activity') t = 'timeline';
      if (t === 'attachments') t = 'overview';
      return this.tabs.includes(t) ? t : 'overview';
    },
    messageCount(){ return this.order ? (state.messages[this.order.id] || []).length : 0; },
    attachments(){
      if (!this.order) return [];
      const facName = this.orderFacility ? `Steritech ${this.orderFacility.name}` : 'Steritech';
      const customer = state.profile.contact || 'Customer';
      const sub = this.order.submitted;
      const col = this.order.collection;
      return [
        { name: `msds-${this.order.formCode.toLowerCase()}.pdf`,         type:'PDF', size:'184 KB', uploaded: sub, uploadedBy: customer },
        { name: `coa-${this.order.id.toLowerCase()}.pdf`,                type:'PDF', size:'92 KB',  uploaded: sub, uploadedBy: customer },
        { name: `dose-map-${this.order.id.toLowerCase()}.pdf`,           type:'PDF', size:'412 KB', uploaded: col, uploadedBy: facName  },
        { name: `treatment-cert-${this.order.id.toLowerCase()}.pdf`,     type:'PDF', size:'128 KB', uploaded: col, uploadedBy: facName  },
        { name: `iso-11137-evidence-${this.order.id.toLowerCase()}.pdf`, type:'PDF', size:'276 KB', uploaded: col, uploadedBy: facName  },
        { name: `batch-log-${this.order.id.toLowerCase()}.csv`,          type:'CSV', size:'18 KB',  uploaded: col, uploadedBy: facName  },
      ];
    },
    attachmentCount(){ return this.attachments.length; },
    filteredAttachments(){
      if (!this.attSearch.trim()) return this.attachments;
      const q = this.attSearch.toLowerCase();
      return this.attachments.filter(f =>
        f.name.toLowerCase().includes(q) ||
        f.type.toLowerCase().includes(q) ||
        f.uploadedBy.toLowerCase().includes(q));
    },
    sortedAttachments(){
      const list = this.filteredAttachments.slice();
      const k = this.attSort.by;
      const m = this.attSort.dir === 'asc' ? 1 : -1;
      list.sort((a,b) => (a[k] > b[k] ? m : a[k] < b[k] ? -m : 0));
      return list;
    },
    attTotalPages(){ return Math.max(1, Math.ceil(this.sortedAttachments.length / this.attPageSize)); },
    attEffectivePage(){ return Math.min(this.attPage, this.attTotalPages); },
    pagedAttachments(){
      if (this.sortedAttachments.length <= this.attPageSize) return this.sortedAttachments;
      const start = (this.attEffectivePage - 1) * this.attPageSize;
      return this.sortedAttachments.slice(start, start + this.attPageSize);
    },
    attRangeStart(){ return this.sortedAttachments.length === 0 ? 0 : (this.attEffectivePage - 1) * this.attPageSize + 1; },
    attRangeEnd(){ return Math.min(this.attEffectivePage * this.attPageSize, this.sortedAttachments.length); },
    timeline(){
      if (!this.order) return [];
      const e = [
        { ts: this.order.submitted + 'T09:12', label:'Submitted via portal', icon:'upload', done:true },
        { ts: this.order.submitted + 'T09:12', label:'Exsited order created · ' + this.order.exsitedId, icon:'receipt', done:true },
      ];
      if (this.order.bcSync === 'pending')  e.push({ ts:this.order.submitted+'T09:14', label:'Business Central sync queued', icon:'clock', done:false });
      if (this.order.bcSync === 'syncing')  e.push({ ts:this.order.submitted+'T09:14', label:'Business Central sync in progress', icon:'refresh-cw', done:false, pulse:true });
      if (this.order.bcSync === 'failed')   e.push({ ts:this.order.submitted+'T09:18', label:'BC sync failed — will retry', icon:'x-circle', done:false, fail:true });
      if (this.order.bcSync === 'dead')     e.push({ ts:this.order.submitted+'T09:40', label:'BC sync moved to dead-letter queue', icon:'alert-octagon', done:false, fail:true });
      // Map new domain statuses to timeline milestones.
      // Cancelled is a terminal branch and produces no in-process events.
      if (['Accepted','Scheduled for Processing','In Process','Ready for Invoicing','Completed','Late Arrival','On Hold'].includes(this.order.status))
        e.push({ ts: this.order.collection+'T06:00', label:'Accepted by facility', icon:'check-circle', done:true });
      if (this.order.status === 'On Hold')
        e.push({ ts: this.order.collection+'T07:00', label:'Order placed on hold', icon:'pause-circle', done:false });
      if (this.order.status === 'Late Arrival')
        e.push({ ts: this.order.collection+'T07:30', label:'Arrival flagged late', icon:'alert-triangle', done:false });
      if (['Scheduled for Processing','In Process','Ready for Invoicing','Completed'].includes(this.order.status))
        e.push({ ts: this.order.collection+'T08:30', label:'Scheduled for processing', icon:'calendar', done:true });
      if (['In Process','Ready for Invoicing','Completed'].includes(this.order.status))
        e.push({ ts: this.order.collection+'T11:30', label:'Treatment in process', icon:'radiation', done:true, pulse: this.order.status === 'In Process' });
      if (['Ready for Invoicing','Completed'].includes(this.order.status))
        e.push({ ts: this.order.collection+'T15:00', label:'Ready for invoicing', icon:'receipt', done:true });
      if (this.order.status === 'Completed')
        e.push({ ts: this.order.collection+'T16:00', label:'Completed and released to consignee', icon:'badge-check', done:true });
      if (this.order.status === 'Cancelled')
        e.push({ ts: this.order.collection+'T08:00', label:'Order cancelled', icon:'x-circle', done:false, fail:true });
      return e;
    }
  },
  methods:{
    fmtDate, fmtMoney,
    dotClass(e){
      if (e.fail) return 'bg-red-500';
      if (e.pulse) return 'bg-amber-500 animate-syncpulse';
      if (e.done) return 'bg-emerald-500';
      return 'bg-slate-300';

    selectTab(t){
      const next = t === 'overview' ? null : t;

      return this.enabled !== m.enabled || this.message !== m.message || this.severity !== m.severity;

      if (this.severity === 'critical') return { bg:'bg-rose-50', border:'border-rose-300', text:'text-rose-900', accent:'text-rose-700', icon:'alert-octagon', label:'Critical' };

      return                                   { bg:'bg-sky-50',   border:'border-sky-300',   text:'text-sky-900',   accent:'text-sky-700',   icon:'info', label:'Info' };
    },

                    {v:'info',     label:'Info',     desc:'General notice', icon:'info',            ring:'ring-sky-500',   bg:'bg-sky-50',   text:'text-sky-700'},
                    {v:'warning',  label:'Warning',  desc:'Maintenance ongoing', icon:'alert-triangle',  ring:'ring-amber-500', bg:'bg-amber-50', text:'text-amber-700'},
                    {v:'critical', label:'Critical', desc:'Service disruption',  icon:'alert-octagon',   ring:'ring-rose-500',  bg:'bg-rose-50',  text:'text-rose-700'}
                  ]" :key="opt.v"
                 :class="['flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition-all',
                           severity === opt.v ? 'border-transparent ring-2 ' + opt.ring + ' ' + opt.bg : 'border-slate-200 hover:border-slate-300 bg-white']">
              <input type="radio" :value="opt.v" v-model="severity" class="sr-only">
              <Icon :name="opt.icon" :size="16" :cls="opt.text + ' mt-0.5 shrink-0'"/>
              <div class="min-w-0">
                <div class="text-sm font-medium text-navy-900">{{ opt.label }}</div>
                <div class="text-[11px] text-slate-500 mt-0.5">{{ opt.desc }}</div>
              </div>
            </label>
          </div>
        </div>

        <!-- Message -->
        <div>
          <div class="flex items-end justify-between mb-2">
            <label class="block text-xs font-semibold text-slate-700">Banner message</label>
            <span :class="['text-[11px] tabular-nums', charCount > charLimit ? 'text-rose-600' : 'text-slate-400']">{{ charCount }} / {{ charLimit }}</span>
          </div>
          <textarea v-model="message" rows="2" :maxlength="charLimit"
                    placeholder="Scheduled maintenance from 10:00–11:30 AEST. Order submission may be temporarily unavailable."
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus-ring resize-none"></textarea>
          <p class="text-[11px] text-slate-500 mt-1.5 flex items-center gap-1">
            <Icon name="info" :size="11" cls="text-slate-400"/>
            Keep messages short and actionable. Include time windows when possible.
          </p>
        </div>

        <!-- Live preview -->
        <div>
          <div class="text-xs font-semibold text-slate-700 mb-2 flex items-center gap-2">
            Preview
            <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">{{ previewPalette.label }}</span>
          </div>
          <div class="border border-dashed border-slate-300 rounded-lg p-3 bg-slate-50">
            <div :class="['border rounded-md px-4 py-2.5 flex items-center gap-3', previewPalette.bg, previewPalette.border, previewPalette.text]">
              <Icon :name="previewPalette.icon" :size="16" :cls="previewPalette.accent + ' shrink-0'"/>
              <div class="text-sm leading-snug flex-1 min-w-0">{{ message || 'Banner message preview…' }}</div>
            </div>
            <p class="text-[11px] text-slate-500 mt-2">This is exactly how the banner appears at the top of every page when enabled.</p>
          </div>
        </div>
      </div>

      <!-- Footer actions -->
      <div class="px-5 sm:px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between gap-3">
        <div class="text-[11px] text-slate-500">
          <span v-if="isDirty" class="inline-flex items-center gap-1.5 text-amber-700"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Unsaved changes</span>
          <span v-else>All changes saved.</span>
        </div>
        <div class="flex items-center gap-2">
          <Btn kind="ghost" size="sm" :disabled="!isDirty" @click="revert">Revert</Btn>
          <Btn kind="primary" size="sm" icon="check" :disabled="!isDirty" @click="save">Save changes</Btn>
        </div>
      </div>
    </div>
  </div>`
};

/* ---------- Page: Settings (tabs) ------------------------------------------- */

const SETTINGS_DRAWER_FIELDS = {
  commodity: [
    { key:'name',           label:'Name',                type:'text',     required:true },
    { key:'tariffCode',     label:'Tariff code',         type:'text',     help:'e.g. 0804.50.20' },
    { key:'treatment',      label:'Treatment',           type:'select',   options:['Gamma','ETO','GMP','Gamma+ETO'] },
    { key:'defaultDoseKGy', label:'Default dose (kGy)',  type:'number',   step:0.5 },
    { key:'notes',          label:'Notes',               type:'textarea' },
  ],
  consignor: [
    { key:'name',    label:'Company name', type:'text',     required:true },
    { key:'contact', label:'Contact name', type:'text' },
    { key:'phone',   label:'Phone',        type:'tel' },
    { key:'address', label:'Address',      type:'textarea' },
  ],
  consignee: [
    { key:'name',    label:'Company name', type:'text',     required:true },
    { key:'contact', label:'Contact name', type:'text' },
    { key:'phone',   label:'Phone',        type:'tel' },
    { key:'address', label:'Address',      type:'textarea' },
  ],
};

const SettingsPage = {
  components:{ Icon, Btn, SiteSettingsPage },
  data(){
    const isAdmin = state.role === 'admin';
    const defaultTab = isAdmin ? 'site' : 'profile';
    return {
      tab: this.$route.query.tab || defaultTab,
      pwd: { current:'', next:'', confirm:'' },
      commoditySearch: '',
      consignorSearch: '',
      consigneeSearch: '',
      drawer: { open:false, kind:'commodity', mode:'add', original:null, working:{} },
      del:    { open:false, kind:'commodity', row:null },
      showFullEula: false,
    };
  },
  computed:{
    state(){ return state; },
    isAdmin(){ return state.role === 'admin'; },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    drawerFields(){ return SETTINGS_DRAWER_FIELDS[this.drawer.kind] || []; },
    drawerTitle(){
      const noun = ({ commodity:'commodity', consignor:'consignor', consignee:'consignee' })[this.drawer.kind] || 'item';
      return (this.drawer.mode === 'add' ? 'Add ' : 'Edit ') + noun;
    },
    filteredCommodities(){
      if (!this.commoditySearch.trim()) return state.commodities;
      const q = this.commoditySearch.toLowerCase();
      return state.commodities.filter(c =>
        (c.name||'').toLowerCase().includes(q) ||
        (c.tariffCode||'').toLowerCase().includes(q) ||
        (c.treatment||'').toLowerCase().includes(q) ||
        (c.notes||'').toLowerCase().includes(q));
    },
    filteredConsignors(){
      if (!this.consignorSearch.trim()) return state.consignors;
      const q = this.consignorSearch.toLowerCase();
      return state.consignors.filter(r => [r.name,r.contact,r.phone,r.address].some(v => String(v||'').toLowerCase().includes(q)));
    },
    filteredConsignees(){
      if (!this.consigneeSearch.trim()) return state.consignees;
      const q = this.consigneeSearch.toLowerCase();
      return state.consignees.filter(r => [r.name,r.contact,r.phone,r.address].some(v => String(v||'').toLowerCase().includes(q)));
    },
    eula(){ return state.eula; },
    myAcceptances(){
      const uid = (state.profile.email||'').toLowerCase();
      return state.eulaAcceptances.filter(a => a.userId === uid).slice().reverse();
    },
    tabs(){
      const customerTabs = [
        { id:'profile',     label:'Profile',     icon:'user' },
        { id:'password',    label:'Password',    icon:'lock' },
        { id:'commodities', label:'Commodities', icon:'package' },
        { id:'consignors',  label:'Consignors',  icon:'warehouse' },
        { id:'consignees',  label:'Consignees',  icon:'truck' },
        { id:'terms',       label:'Service Agreement', icon:'file-text' },
      ];
      const adminTabs = [
        { id:'site',        label:'Site',        icon:'sliders-horizontal', adminOnly:true },
        { id:'password',    label:'Password',    icon:'lock' },
      ];
      return this.isAdmin ? adminTabs : customerTabs;
    }
  },
  watch:{
    tab(v){ this.$router.replace({ query:{ tab:v } }); },
    isAdmin(){
      // When the role flips (e.g., via the demo panel) the component instance
      // is reused, so the previous role's tab can leak through. Snap to the
      // first tab valid for the new role, otherwise the wrong panel renders.
      if (!this.tabs.some(t => t.id === this.tab)) {
        this.tab = this.tabs[0].id;
      }
    },
  },
  created(){
    const valid = this.tabs.some(t => t.id === this.tab);
    if (!valid) this.tab = this.tabs[0].id;
  },
  methods:{
    openAdd(kind){
      const blank = Object.fromEntries(SETTINGS_DRAWER_FIELDS[kind].map(f => [f.key, f.type === 'number' ? 0 : (f.type === 'select' ? f.options[0] : '')]));
      this.drawer = { open:true, kind, mode:'add', original:null, working: blank };
    },
    openEdit(kind, row){
      this.drawer = { open:true, kind, mode:'edit', original: row, working: JSON.parse(JSON.stringify(row)) };
    },
    cancelDrawer(){ this.drawer.open = false; },
    saveDrawer(){
      const kind = this.drawer.kind;
      const list = ({ commodity:state.commodities, consignor:state.consignors, consignee:state.consignees })[kind];
      if (this.drawer.mode === 'add') {
        const idPrefix = ({ commodity:'C', consignor:'SR', consignee:'SE' })[kind];
        list.unshift({ ...this.drawer.working, id: `${idPrefix}-${Date.now()}` });
        showToast(`${this.drawerTitle.replace('Add ','')} added.`, 'success');
      } else {
        Object.assign(this.drawer.original, this.drawer.working);
        showToast('Changes saved.', 'success');
      }
      this.drawer.open = false;
    },
    confirmDelete(kind, row){
      this.del = { open:true, kind, row };
    },
    cancelDelete(){ this.del.open = false; },
    executeDelete(){
      const list = ({ commodity:state.commodities, consignor:state.consignors, consignee:state.consignees })[this.del.kind];
      const idx = list.indexOf(this.del.row);
      if (idx >= 0) list.splice(idx, 1);
      this.del.open = false;
      showToast('Removed. Past orders are unchanged.', 'success');
    },
    fmtDT(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); },

const FieldWrap = {

      <div v-else-if="help" class="mt-1 text-[11px] text-slate-500">{{ help }}</div>

function fieldInputCls(err, readonly){
  const base = 'w-full rounded-lg border px-3 py-2 text-sm focus-ring';
  if (err) return base + ' border-red-400 bg-red-50/40';
  if (readonly) return base + ' border-slate-200 bg-slate-50 text-slate-500';
  return base + ' border-slate-300';
}

const FieldCheckbox = {
  props:['label','modelValue','required','error','readonly','help','options'],
  emits:['update:modelValue'],
  components:{ FieldWrap },
  template:`<FieldWrap :label="label" :required="required" :error="error" :help="help">
    <template v-if="options && options.length">
      <div class="space-y-1.5">
        <label v-for="opt in options" :key="opt.value" class="flex items-center gap-2 text-sm text-slate-700">
          <input type="checkbox" :value="opt.value" :checked="(modelValue||[]).includes(opt.value)" :disabled="readonly"
                 @change="toggle(opt.value, $event.target.checked)" class="rounded accent-teal-500"/>
          {{ opt.label }}
        </label>
      </div>
    </template>
    <template v-else>
      <label class="flex items-center gap-2 text-sm text-slate-700">
        <input type="checkbox" :checked="!!modelValue" :disabled="readonly"
               @change="$emit('update:modelValue', $event.target.checked)" class="rounded accent-teal-500"/>
        {{ label }}
      </label>
    </template>
  </FieldWrap>`,
  methods:{
    toggle(v, on){ const arr = Array.isArray(this.modelValue) ? this.modelValue.slice() : [];
      const i = arr.indexOf(v); if (on && i<0) arr.push(v); if (!on && i>=0) arr.splice(i,1);
      this.$emit('update:modelValue', arr); }
  }
};

const FieldFileUpload = {

  methods:{
    onFile(e){ const f = e.target.files[0]; if (!f) return;
      this.$emit('update:modelValue', { name:f.name, size:f.size, type:f.type }); }

const FieldSignature = {
  props:['label','modelValue','required','error','readonly','help'],
  emits:['update:modelValue'],
  data(){ return { drawing:false, last:null }; },
  components:{ FieldWrap },
  mounted(){
    const ctx = this.$refs.c.getContext('2d');
    ctx.lineWidth = 2; ctx.lineCap='round'; ctx.strokeStyle = '#0F2A44';
    if (this.modelValue){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0); img.src=this.modelValue; }
  },
  methods:{
    pos(e){ const r=this.$refs.c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-r.left, t.clientY-r.top]; },
    start(e){ if (this.readonly) return; e.preventDefault(); this.drawing=true; this.last=this.pos(e); },
    move(e){ if (!this.drawing) return; e.preventDefault();
      const [x,y]=this.pos(e); const ctx=this.$refs.c.getContext('2d');
      ctx.beginPath(); ctx.moveTo(this.last[0],this.last[1]); ctx.lineTo(x,y); ctx.stroke(); this.last=[x,y]; },
    end(){ if (!this.drawing) return; this.drawing=false; this.$emit('update:modelValue', this.$refs.c.toDataURL('image/png')); },
    clear(){ const c=this.$refs.c; c.getContext('2d').clearRect(0,0,c.width,c.height); this.$emit('update:modelValue',''); }
  },
  template:`<FieldWrap :label="label" :required="required" :error="error" :help="help">
    <div :class="['border rounded-lg overflow-hidden bg-white sig-pad',
                  error ? 'border-red-400' : 'border-slate-300',
                  readonly && 'opacity-60']">
      <canvas ref="c" width="560" height="120" class="block w-full touch-none cursor-crosshair"
              @mousedown="start" @mousemove="move" @mouseup="end" @mouseleave="end"
              @touchstart="start" @touchmove="move" @touchend="end"></canvas>
    </div>
    <div class="flex items-center justify-between mt-1">
      <div class="text-[11px] text-slate-500">Sign with mouse or finger</div>
      <button v-if="!readonly" type="button" @click="clear" class="text-[11px] text-slate-600 hover:text-red-600">Clear</button>
    </div>
  </FieldWrap>`
};
const FieldCalculated = {
  props:['label','modelValue','required','error','help','formula'],
  components:{ FieldWrap },
  template:`<FieldWrap :label="label" :required="required" :error="error" :help="help">
    <div class="relative group">
      <input type="text" readonly :value="displayValue"
             class="w-full rounded-lg border border-slate-200 bg-slate-50 text-slate-700 px-3 py-2 text-sm font-medium tabular-nums pr-16"/>
      <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] uppercase tracking-wider text-slate-400">calc</span>

        = {{ formula }}

  </FieldWrap>`,
  computed:{
    displayValue(){ const v = this.modelValue; if (typeof v === 'number') return v.toLocaleString('en-AU', { minimumFractionDigits:2, maximumFractionDigits:2 }); return v ?? '—'; }
  }
